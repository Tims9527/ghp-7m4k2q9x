e8\u518c\u7684\u5355\u72ec\u9875\u9762\uff0c\u4e0e\u6b64\u76f8\u5bf9\uff0c\u987e\u5ba2\u53ef\u4ee5\u5728\u4e3b\u6e38\u620f\u4e2d\u76f4\u63a5\u6ce8\u518c\u5e76\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\uff0c\u4e14\u4ecd\u7136\u53ef\u4ee5\u5c06\u4e3b\u6e38\u620f\u52a0\u5165\u613f\u671b\u5355\u6216\u5173\u6ce8\u4e3b\u6e38\u620f\u3002\n\n\u8bf7\u67e5\u770b [Steam \u6e38\u620f\u6d4b\u8bd5](https://partner.steamgames.com/doc/features/playtest)\u6587\u6863\uff0c\u4ee5\u83b7\u53d6\u5b8c\u6574\u8bbe\u7f6e\u8bf4\u660e\u3001\u914d\u7f6e\u60c5\u666f\u3001\u6700\u4f73\u5b9e\u8df5\u4ee5\u53ca\u5e38\u89c1\u95ee\u9898\u3002\n\n## \u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\n\n\u867d\u7136 Steam \u6e38\u620f\u6d4b\u8bd5\u662f\u5728 Steam \u4e0a\u8fdb\u884c\u5185\u6d4b\u7684\u9996\u9009\u65b9\u6cd5\uff0c\u4f46\u5982\u679c\u60a8\u60f3\u901a\u8fc7\u4e3b\u6e38\u620f\u7684 App ID \u7ba1\u7406\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u5e76\u4f7f\u7528\u4fdd\u5bc6\u534f\u8bae\u7b49\uff0c\u90a3\u4e48\u53ef\u4ee5\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u3002 \u6211\u4eec\u5efa\u8bae\u9075\u7167\u4ee5\u4e0b\u6b65\u9aa4\u6765\u8fdb\u884c\u6b64\u79cd\u5185\u6d4b\u3002\n\n- \u9996\u5148\uff0c\u4e0a\u4f20\u6e38\u620f\u7684\u751f\u6210\u7248\u672c\uff0c\u4f9b\u6d4b\u8bd5\u4eba\u5458\u6e38\u73a9\u3002 \u5982\u679c\u60a8\u5c1a\u672a\u6267\u884c\u6b64\u6b65\u9aa4\uff0c\u8bf7\u53c2\u89c1[\u6b64\u5904](https://partner.steamgames.com/doc/sdk/uploading)\u7684\u8bf4\u660e\uff0c\u7136\u540e\u518d\u8fd4\u56de\u672c\u9875\u3002\n\n- \u63a5\u4e0b\u6765\uff0c\u6211\u4eec\u5f3a\u70c8\u5efa\u8bae\u60a8\u8bbe\u7f6e\u81ea\u5df1\u7684[\u5373\u5c06\u63a8\u51fa](https://partner.steamgames.com/doc/store/coming_soon)\u9875\u9762\u3002 \u8fd9\u5c31\u63d0\u4f9b\u4e86\u53c2\u8003\u673a\u4f1a\uff0c\u53ef\u4ee5\u6839\u636e\u73a9\u5bb6\u5728\u6e38\u620f\u4e2d\u7684\u4f53\u9a8c\u6765\u6d4b\u8bd5\u60a8\u7684\u8425\u9500\u6548\u679c\u3002 \u8fd9\u4e5f\u8ba9 Steam \u793e\u533a\u4e2d\u5fc3\u6210\u4e3a\u4e86\u4e00\u4e2a\u4fbf\u5229\u7684\u573a\u6240\uff0c\u8ba9\u60a8\u7684\u793e\u533a\u5728\u6b64\u8ba8\u8bba\u6e38\u620f\u5e76\u63d0\u4f9b\u53cd\u9988\uff0c\u4e5f\u8ba9\u7528\u6237\u66f4\u4e3a\u4fbf\u6377\u5730\u5c06\u60a8\u7684\u6e38\u620f\u6dfb\u52a0\u81f3\u613f\u671b\u5355\u3002\n\n- \u7533\u8bf7\u60a8\u7684\u201c\u6d4b\u8bd5\u7248\u201d\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u7a0b\u5e8f\u5305\u7684\u5e8f\u5217\u53f7\u3002 \u6240\u6709\u6fc0\u6d3b\u4e86\u5176\u4e2d\u4e00\u4e2a\u5e8f\u5217\u53f7\u7684\u987e\u5ba2\u90fd\u53ef\u4ee5\u7acb\u5373\u4e0b\u8f7d\u6e38\u620f\u5e76\u5f00\u73a9\uff0c\u56e0\u6b64\u5728\u51c6\u5907\u59a5\u5f53\u4e4b\u524d\u4e0d\u8981\u53d1\u653e\u5e8f\u5217\u53f7\u3002 \u8bf7\u82b1\u4e00\u70b9\u65f6\u95f4\u6765\u67e5\u9605 [Steam \u5e8f\u5217\u53f7\u6587\u6863](https://partner.steamgames.com/doc/features/keys)\uff0c\u4e86\u89e3\u89c4\u5219\u53ca\u5e8f\u5217\u53f7\u7533\u8bf7\u6d41\u7a0b\u3002\n\n- \u8ffd\u8e2a\u60a8\u5df2\u53d1\u653e\u7684\u5e8f\u5217\u53f7\u3002 \u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0c\u6fc0\u6d3b\u4e86\u5e8f\u5217\u53f7\u7684\u7528\u6237\u53ef\u4ee5\u6c38\u4e45\u62e5\u6709\u8be5\u6e38\u620f\uff0c\u4f46\u5982\u679c\u60a8\u60f3\u7ec8\u6b62\u6d4b\u8bd5\uff0c\u6216\u662f\u4ece\u6d4b\u8bd5\u4eba\u5458\u624b\u4e2d\u64a4\u56de\u6e38\u620f\uff0c\u4e5f\u662f\u53ef\u4ee5\u7684\u3002 \u51c6\u5907\u597d\u7ed3\u675f\u6d4b\u8bd5\u540e\uff0c\u60a8\u53ef\u4ee5\u7528[\u5e8f\u5217\u53f7\u7981\u7528\u5de5\u5177](https://partner.steamgames.com/partnerbatchbancdkeys/)\u6765\u64a4\u56de\u5e8f\u5217\u53f7\u3002 \u60a8\u53ef\u4ee5\u8bf4\u660e\u662f\u56e0\u4e3a\u6d4b\u8bd5\u5df2\u7ed3\u675f\u800c\u7981\u7528\u4e86\u5e8f\u5217\u53f7\uff0c\u4ee5\u5584\u610f\u63d0\u9192\u7528\u6237\u4ed6\u4eec\u65e0\u6cd5\u518d\u8bbf\u95ee\u6d4b\u8bd5\u7248\u3002\n\n\u6ce8\u610f\uff1a\u5982\u679c\u60a8\u60f3\u7ed9\u4e0d\u540c\u7684\u53d7\u4f17\u63d0\u4f9b\u4e0d\u540c\u7248\u672c\u7684\u6e38\u620f\uff0c\u4e5f\u5f88\u7b80\u5355\u3002 \u4f8b\u5982\uff0c\u60a8\u53ef\u4ee5\u8ba9\u6d4b\u8bd5\u4eba\u5458\u73a9\u67d0\u4e2a\u5206\u652f\uff0c\u800c\u7ed9\u5a92\u4f53/\u7f51\u7ea2\u5927 V \u63d0\u4f9b\u53e6\u4e00\u4e2a\u5206\u652f\u3002 \u8bf7\u5728[\u6b64\u5904](https://partner.steamgames.com/doc/store/application/branches)\u4e86\u89e3\u66f4\u591a\u5173\u4e8e\u542f\u7528\u4e0d\u540c\u6d4b\u8bd5\u5206\u652f\u7684\u4fe1\u606f\u3002\n\n## \u6d4b\u8bd5\u66f4\u65b0 - \u751f\u6210\u7248\u672c\u5206\u652f\uff08\u6d4b\u8bd5\u7248\uff09\n\n\u5982\u679c\u60a8\u5e0c\u671b\u80fd\u591f\u5728\u6e38\u620f\u7684\u5df2\u4e0a\u7ebf\u7248\u672c\u4e4b\u5916\u6d4b\u8bd5\u6e38\u620f\u66f4\u65b0\uff0c\u53ef\u4ee5\u4f7f\u7528\u751f\u6210\u7248\u672c\u5206\u652f\u6765\u8fbe\u5230\u8fd9\u4e00\u76ee\u7684\u3002 \u60a8\u53ef\u4ee5\u5c06\u7279\u5b9a\u751f\u6210\u7248\u672c\u5206\u914d\u7ed9\u66ff\u7528\u5206\u652f\uff0c\u800c\u7528\u6237\u53ef\u4ee5\u901a\u8fc7 Steam \u5ba2\u6237\u7aef\u9009\u62e9\u52a0\u5165\u8be5\u66ff\u7528\u5206\u652f\u3002 \u5982\u679c\u60a8\u53ea\u5e0c\u671b\u7531\u7279\u5b9a\u4e2a\u4eba\u6216\u5728\u81ea\u5df1\u7684\u56e2\u961f\u5185\u4f7f\u7528\u8fd9\u4e9b\u5206\u652f\uff0c\u4e5f\u53ef\u4ee5\u4f7f\u7528\u5bc6\u7801\u4fdd\u62a4\u8fd9\u4e9b\u5206\u652f\u3002\n\n\u8bf7\u53c2\u89c1[\u5206\u652f\uff08\u6d4b\u8bd5\u7248\uff09\u6587\u6863](https://partner.steamgames.com/doc/store/application/demos)\uff0c\u4ee5\u83b7\u53d6\u66f4\u591a\u8be6\u60c5\u3002\n\n## \u6d4b\u8bd5 DLC\n\n\u6d4b\u8bd5 DLC \u4e0e\u6d4b\u8bd5\u6e38\u620f\u975e\u5e38\u76f8\u4f3c\u3002 DLC \u6709 AppID\uff0c\u8be5 AppID \u5fc5\u987b\u4f4d\u4e8e\u60a8\u62e5\u6709\uff08\u6216\u7528\u5e8f\u5217\u53f7\u83b7\u5f97\uff09\u7684 Dev Comp \u7a0b\u5e8f\u5305\u4e2d\uff0c\u624d\u80fd\u8fdb\u884c\u6d4b\u8bd5\u3002 \u6709\u4e9b DLC \u5305\u542b\u4e86\u5185\u5bb9\uff0c\u800c\u6709\u4e9b DLC \u53ea\u662f\u76f8\u5f53\u4e8e\u6e38\u620f\u7684\u8bb8\u53ef\u68c0\u67e5\uff0c\u4ee5\u51b3\u5b9a\u8981\u89e3\u9501\u7684\u529f\u80fd\u3002 \u6253\u5f00 Steam \u63a7\u5236\u53f0\uff08\u542f\u52a8 Steam.exe -console\uff09\uff0c\u7136\u540e\u4f7f\u7528 `enable_license` \u547d\u4ee4\uff0c\u60a8\u5c31\u53ef\u4ee5\u5207\u6362\u6240\u6709\u6743\uff08\u8bb8\u53ef\uff09\u5f00\u5173\u3002\n\n## \u6dfb\u52a0\u597d\u53cb\u8fdb\u884c\u6d4b\u8bd5\n\n\u5982\u679c\u60a8\u9700\u8981\u5c06\u5168\u65b0\u7684 Steam \u5e10\u6237\u6dfb\u52a0\u81f3\u597d\u53cb\u5217\u8868\uff0c \u4ee5\u6d4b\u8bd5\u6e38\u620f\u7684\u591a\u4eba\u529f\u80fd\uff0c\u60a8\u9700\u8981\u4e00\u4e9b\u989d\u5916\u7684\u6b65\u9aa4\u3002\n\n\u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0c\u65b0\u5e10\u6237\u5728\u53c2\u4e0e Steam \u793e\u533a\u6d3b\u52a8\u4e0a\u53d7\u5230\u9650\u5236\uff08\u66f4\u591a\u8be6\u60c5\u8bf7\u67e5\u770b[\u53d7\u9650\u7528\u6237\u5e10\u6237](https://support.steampowered.com/kb_article.php?ref=3330-IAGK-7663)\u4e00\u6587\uff09\u3002 \u8fd9\u4f1a\u8ba9\u60a8\u65e0\u6cd5\u4ece\u65b0\u7684 Steam \u5e10\u6237\u53d1\u9001\u597d\u53cb\u9080\u8bf7\u3002 \u6709\u4ee5\u4e0b\u4e24\u4e2a\u89e3\u51b3\u529e\u6cd5\uff1a\n\n- \u60a8\u53ef\u4ee5\u4ece\u975e\u53d7\u9650\u5e10\u6237\u53d1\u51fa\u597d\u53cb\u9080\u8bf7\u3002\n\n- \u60a8\u53ef\u4ee5\u4ece\u65b0\u5e10\u6237\u91cc\u6fc0\u6d3b\u6e38\u620f\u7684 Dev Comp \u7c7b\u578b\u5e8f\u5217\u53f7\uff0c\u4ece\u800c\u5c06\u6e38\u620f\u6388\u4e88\u8be5\u5e10\u6237\uff0c\u5e76\u53d6\u6d88\u8be5\u5e10\u6237\u53d7\u5230\u7684\u9650\u5236\uff0c\u5141\u8bb8\u60a8\u4ece\u5e10\u6237\u4e2d\u53d1\u9001\u597d\u53cb\u9080\u8bf7\u3002\n", "Steam \u6e38\u620f\u6d4b\u8bd5": "# Steam \u6e38\u620f\u6d4b\u8bd5\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/features/playtest\n\nSteam \u6e38\u620f\u6d4b\u8bd5\u8ba9\u5f00\u53d1\u8005\u4eec\u80fd\u4ee5\u514d\u8d39\u4e14\u4f4e\u98ce\u9669\u7684\u65b9\u5f0f\u83b7\u53d6\u6e38\u620f\u7684\u8bd5\u73a9\u6570\u636e\uff0c\u65e0\u9700\u4e3a Steam \u5e8f\u5217\u53f7\u3001\u7528\u6237\u8bc4\u6d4b\u6216\u613f\u671b\u5355\u7684\u4e8b\u60c5\u800c\u64cd\u5fc3\u3002 \u60a8\u53ef\u4ee5\u7528\u4e0e\u4e3b\u6e38\u620f\u76f8\u5173\u8054\u4f46\u53c8\u76f8\u4e92\u72ec\u7acb\u7684\u5355\u72ec\u201c\u5b50\u201dappID \u8fdb\u884c\u6240\u9700\u7684\u6e38\u620f\u6d4b\u8bd5\uff0c\u540c\u65f6\u4e0d\u4f1a\u5e72\u6270\u4e3b\u6e38\u620f\u3002\n\n\u4ee5\u4e0b\u662f\u5bf9\u6b64\u529f\u80fd\u7684\u6982\u89c8\uff1a\n ![](https://img.youtube.com/vi/0_HhCEJ_kZ0/0.jpg)  YouTube\u2122 \u89c6\u9891: Steamworks Quick Tips - Steam Playtest   \u89c2\u770b\uff1a46,862 \u6b21   In this video, we walk you through what Steam Playtest is, how to use it, and we also cover some common questions about the feature.\n\nSteam \u6e38\u620f\u6d4b\u8bd5\u8fd8\u53ef\u4ee5\u8ba9\u60a8\u8f7b\u677e\u7ba1\u63a7\u6e38\u620f\u6d4b\u8bd5\u7684\u8bbf\u95ee\u6743\u9650\u3002 \u60a8\u53ef\u4ee5\u6309\u9700\u5141\u8bb8\u4efb\u610f\u6570\u91cf\u7684\u73a9\u5bb6\uff0c\u5e76\u5728\u5e0c\u671b\u505c\u7528\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u65f6\u4e88\u4ee5\u505c\u7528\u3002\n\n## \u6e38\u620f\u6d4b\u8bd5\u662f\u5982\u4f55\u8fd0\u4f5c\u7684\uff1f\n\nSteam \u6e38\u620f\u6d4b\u8bd5 appID \u6240\u80fd\u8bbf\u95ee\u7684 Steamworks \u6280\u672f\u529f\u80fd\u4e0e\u60a8\u7684\u4e3b\u6e38\u620f\u76f8\u540c\uff0c\u4f46\u5728\u5546\u5e97\u548c\u793e\u533a\u914d\u7f6e\u65b9\u9762\u66f4\u4e3a\u7b80\u5316\u3002 \u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u5e76\u6ca1\u6709\u81ea\u5df1\u5355\u72ec\u7684\u5546\u5e97\u9875\u9762\uff0c\u5176\u6ce8\u518c\u662f\u5728\u4e3b\u6e38\u620f\u7684\u9875\u9762\u4e0a\u8fdb\u884c\uff0c\u8fd9\u6837\u987e\u5ba2\u5c31\u80fd\u5728\u6ce8\u518c\u5e76\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\u7684\u540c\u65f6\u5c06\u4e3b\u6e38\u620f\u52a0\u5165\u613f\u671b\u5355\u5e76\u4fdd\u6301\u5173\u6ce8\u3002\n\n\u4ee5\u4e0b\u662f\u987e\u5ba2\u770b\u5230\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u6ce8\u518c\u753b\u9762\uff1a\n\n![Join the Playtest](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/new_join_playtest.png)\n\n\u5982\u679c\u6f5c\u5728\u7684\u6d4b\u8bd5\u8005\u611f\u5174\u8da3\uff0c\u53ef\u4ee5\u8bf7\u6c42\u8bbf\u95ee\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u3002 \u60a8\u51c6\u5907\u597d\u8ba9\u6d4b\u8bd5\u8005\u8bd5\u7528\u65f6\uff0c\u53ef\u4ee5\u4ece\u611f\u5174\u8da3\u7684\u73a9\u5bb6\u7ec4\u4e2d\u6dfb\u52a0\u4efb\u610f\u4eba\u6570\u7684\u73a9\u5bb6\u3002 \u60a8\u53ef\u4ee5\u5728\u51c6\u5907\u597d\u65f6\u505c\u7528\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\uff1b\u5982\u679c\u60a8\u5e0c\u671b\u7ee7\u7eed\u5b9e\u9a8c\u5373\u5c06\u63a8\u51fa\u7684\u529f\u80fd\uff0c\u4e5f\u53ef\u4ee5\u5c06\u5176\u4fdd\u6301\u5728\u53ef\u7528\u72b6\u6001\u3002\n\n## \u5982\u4f55\u8fdb\u884c\u8bbe\u7f6e\uff1f\n\n- \u5728\u60a8\u6e38\u620f\u7684**\u5173\u8054\u7a0b\u5e8f\u5305\u4e0e DLC** \u9875\u9762\u521b\u5efa\u4e00\u4e2a\u65b0\u7684\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u3002\n\n![\u521b\u5efa\u65b0\u7684\u6e38\u620f\u6d4b\u8bd5](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/playtest_create_screenshot0.png)\n\n- \u5728 Steamworks \u4e2d\u914d\u7f6e\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u3002\n\n\u60a8\u81f3\u5c11\u9700\u8981\u63d0\u4f9b\u6240\u9700\u7684\u5e93\u5ba3\u4f20\u56fe\u8d44\u4ea7\u548c\u793e\u533a\u8d44\u4ea7\uff08\u53c2\u89c1[\u5e93\u8d44\u4ea7](https://partner.steamgames.com/doc/store/assets/libraryassets)\uff09\u3002 \u60a8\u4e5f\u53ef\u4ee5\u66f4\u6539\u81ea\u5df1\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u7684\u987e\u5ba2\u53ef\u89c1\u540d\u79f0\uff08[\u5305\u62ec\u672c\u5730\u5316\u540d\u79f0](https://partner.steamgames.com/doc/store/localization)\uff09\uff0c\u4f46\u53d1\u5e03\u540e\u5c06\u65e0\u6cd5\u66f4\u6539\u3002\n\n- \u60a8\u51c6\u5907\u5c31\u7eea\u540e\uff0c\u8bf7\u5b8c\u6210\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u7684\u53d1\u884c\u6d41\u7a0b\uff0c \u5176\u4e2d\u5305\u62ec\u7b80\u5316\u7684\u5546\u5e97\u9875\u9762\u548c\u751f\u6210\u7248\u672c\u5ba1\u6838\u3002 **\u8bf7\u6ce8\u610f**\uff1a\u6e38\u620f\u6d4b\u8bd5**\u4e0d\u4f1a**\u62e5\u6709\u81ea\u5df1\u7684\u4e13\u5c5e\u5546\u5e97\u9875\u9762\uff0c\u5b83\u5c06\u4ec5\u4ee5\u680f\u76ee\u7684\u5f62\u5f0f\u51fa\u73b0\u5728\u57fa\u7840\u6e38\u620f\u7684\u9875\u9762\u4e0a\u3002 \u6e38\u620f\u6d4b\u8bd5\u7684\u5546\u5e97\u5ba1\u6838\u6838\u5bf9\u6e05\u5355\u4ec5\u5305\u542b\u5ba3\u4f20\u56fe\u548c\u56fe\u6807\u3002\n\n- \u60a8\u53ef\u4ee5\u5728\u4e3b\u6e38\u620f\u7684\u5546\u5e97\u9875\u9762\u4e0a\u663e\u793a Steam \u6e38\u620f\u6d4b\u8bd5\u7684\u6ce8\u518c\u5165\u53e3\uff0c\u8fd9\u6837\u73a9\u5bb6\u5c31\u53ef\u4ee5\u7533\u8bf7\u52a0\u5165\u6e38\u620f\u6d4b\u8bd5\u4e86\u3002 \u8bf7\u524d\u5f80\u4e3b\u6e38\u620f\u201c\u7f16\u8f91\u5546\u5e97\u9875\u9762\u201d\u7ba1\u7406\u5458\u5de5\u5177\u7684\u201c\u7279\u522b\u8bbe\u7f6e\u201d\u9009\u9879\u5361\uff0c\u542f\u7528\u6ce8\u518c\u529f\u80fd\u3002 \u5728\u60a8\u53d1\u5e03\u4e86\u6b64\u9875\u9762\u4e0a\u7684\u66f4\u6539\u540e\uff0c\u987e\u5ba2\u5c06\u4f1a\u5728 Steam \u5546\u5e97\u4e0a\u770b\u5230\u6ce8\u518c\u9009\u9879\u3002\n\n![playtest_special_settings_screenshot0.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/playtest_special_settings_screenshot0.png)\n\n\u60a8\u968f\u65f6\u90fd\u80fd\u663e\u793a\u6216\u9690\u85cf\u6e38\u620f\u6d4b\u8bd5\u6ce8\u518c\u3002\n\n- \u81f3\u6b64\uff0c\u987e\u5ba2\u4eec\u5f00\u59cb\u6ce8\u518c\u52a0\u5165\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\uff0c\u60a8\u4e5f\u53ef\u4ee5\u4e3a\u5176\u51c6\u5907\u5185\u5bb9\u4e86\u3002 \u4e0a\u4f20 depot \u5e76\u8bbe\u7f6e\u6e38\u620f\u6d4b\u8bd5\u7684\u751f\u6210\u7248\u672c\uff0c\u5c31\u50cf\u5176\u4ed6\u6e38\u620f\u6216\u8bd5\u7528\u7248\u4e00\u6837\u3002 \u60a8\u53ef\u4ee5\u96c6\u6210 Steamworks \u6280\u672f\u529f\u80fd\u3001\u8bbe\u7f6e Steam \u8f93\u5165\u6a21\u677f\u3001\u914d\u7f6e\u4e91\u5b58\u6863\uff0c\u7b49\u7b49\u3002 \u5982\u679c\u60a8\u6b64\u524d\u4ece\u672a\u8fdb\u884c\u8fc7\u8fd9\u4e9b\u64cd\u4f5c\uff0c\u53ef\u4ee5\u4ece\u6211\u4eec\u7684[\u4e0a\u4f20\u81f3 Steam \u6587\u6863](https://partner.steamgames.com/doc/sdk/uploading)\u5165\u624b\uff0c\u83b7\u53d6\u5e2e\u52a9\u3002\n\n\u53e6\u4e00\u4e2a\u65b9\u6cd5\u662f\uff0c\u60a8\u53ef\u4ee5\u4e3a\u81ea\u5df1\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u7533\u8bf7 Steam \u5e8f\u5217\u53f7\uff0c\u5e76\u5c06\u5176\u76f4\u63a5\u5206\u53d1\u7ed9\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\u3002 \u8bf7\u53c2\u89c1\u4e0b\u6587\u4e86\u89e3\u66f4\u591a\u4fe1\u606f\u3002\n\n- \u5f53\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u51c6\u5907\u5c31\u7eea\u4e14\u60a8\u7684\u751f\u6210\u7248\u672c\u4e0a\u7ebf\u540e\uff0c\u60a8\u5c31\u53ef\u4ee5\u5f00\u59cb\u63a5\u53d7\u73a9\u5bb6\u4e86\u3002 \u5728\u60a8\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u7684 Steamworks \u8bbe\u7f6e\u4e2d\uff0c\u70b9\u51fb\u201c\u7ba1\u7406\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u201d\u94fe\u63a5\uff08\u6216\u5728\u201c\u5e94\u7528\u7a0b\u5e8f\u201d\u9009\u9879\u5361\u4e2d\u67e5\u627e\u201c\u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u201d\uff09\u3002 \u60a8\u53ef\u4ee5\u5728\u51c6\u5907\u5c31\u7eea\u540e\u6dfb\u52a0\u73a9\u5bb6\u7ec4\uff0c \u73a9\u5bb6\u4ece\u6ce8\u518c\u7684\u987e\u5ba2\u5f53\u4e2d\u968f\u673a\u9009\u62e9\u3002\n\n\u5982\u679c\u53ef\u7528\u7684\u670d\u52a1\u5668\u6709\u9650\uff0c\u4e14\u5e0c\u671b\u786e\u4fdd\u5728\u6d4b\u8bd5\u671f\u95f4\u4e0d\u4f1a\u9047\u5230\u5ef6\u8fdf\u95ee\u9898\uff0c\u60a8\u53ef\u4ee5\u9009\u62e9\u7279\u5b9a\u56fd\u5bb6/\u5730\u533a\u8fdb\u884c\u6d4b\u8bd5\u3002\n\n![granting.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/granting.png)\n\n- \u6536\u96c6\u5b8c\u6e38\u620f\u6d4b\u8bd5\u6570\u636e\u540e\uff0c\u60a8\u53ef\u4ee5\u5728 Steam \u6e38\u620f\u6d4b\u8bd5\u5408\u4f5c\u4f19\u4f34\u8bbe\u7f6e\u9875\u9762\u4e0a\u5c06\u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u4e3a\u201c\u4e0d\u53ef\u73a9\u201d\uff0c\u4ece\u800c\u5c06\u5176\u505c\u7528\u3002 \u5728\u901a\u8fc7 Steam \u5546\u5e97\u63a5\u53d7\u6ce8\u518c\u671f\u95f4\uff0c\u6b64\u9009\u9879\u4e0d\u4f1a\u663e\u793a\u3002 \u5728\u505c\u7528\u540e\uff0cSteam \u5c06\u4e0d\u4f1a\u542f\u52a8\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u3002\n\n\u8bf7\u614e\u91cd\u8003\u8651\u6b64\u64cd\u4f5c\uff01 \u5982\u679c\u60a8\u4e8b\u5148\u6ca1\u6709\u4e0e\u793e\u533a\u6c9f\u901a\u5c31\u53d6\u6d88\u8fd9\u4e2a\u4f53\u9a8c\uff0c\u53ef\u80fd\u4f1a\u4f7f\u793e\u533a\u4e0d\u6ee1\u6216\u5931\u671b\uff0c\u56e0\u6b64\u63d0\u524d\u8ba9\u793e\u533a\u6709\u6240\u9884\u671f\u8f83\u4e3a\u5408\u7406\u3002 \u60a8\u53ef\u4ee5\u4f7f\u7528 [Steam \u6d3b\u52a8\u548c\u516c\u544a](https://partner.steamgames.com/doc/marketing/event_tools)\u6765\u4f20\u8fbe\u60a8\u6e38\u620f\u6d4b\u8bd5\u7684\u8be6\u60c5\u3002\n\n- \u5982\u679c\u60a8\u60f3\u5728\u6e38\u620f\u6d4b\u8bd5\u7ed3\u675f\u4e4b\u540e\u5c06\u5176\u91cd\u542f\uff0c\u6bd4\u5982\u60a8\u5bf9\u6e38\u620f\u505a\u51fa\u6539\u52a8\u6216\u8005\u6269\u5c55\u4e86\u670d\u52a1\u5668\u7684\u5bb9\u91cf\uff0c\u53ef\u4ee5\u5c06\u6e38\u620f\u6d4b\u8bd5\u91cd\u65b0\u8bbe\u7f6e\u4e3a\u201c\u53ef\u89c1\u201d\u3002 \u5df2\u88ab\u6388\u4e88\u8bbf\u95ee\u6743\u9650\u7684\u73a9\u5bb6\u5c06\u4ecd\u62e5\u6709\u6b64\u6743\u9650\uff0c\u65e0\u9700\u6ce8\u518c\u6216\u518d\u6b21\u88ab\u6388\u4e88\u8bbf\u95ee\u6743\u9650\u3002\n\n## \u6ce8\u518c\u7c7b\u578b\n\n\u9ed8\u8ba4\u884c\u4e3a\u662f\u8fdb\u884c\u9650\u5236\u6027\u6ce8\u518c\u2014\u2014\u6f5c\u5728\u7684\u6e38\u620f\u6d4b\u8bd5\u8005\u7533\u8bf7\u8bbf\u95ee\u6743\u9650\uff0c\u60a8\u5219\u6839\u636e\u81ea\u8eab\u7684\u63a5\u6536\u80fd\u529b\u5206\u6279\u6388\u4e88\u6743\u9650\u3002\n\n\u5982\u679c\u60a8\u7684\u6e38\u620f\u53ef\u4ee5\u8ba9\u66f4\u591a\u4eba\u6e38\u73a9\uff0c\u60a8\u4e5f\u53ef\u4ee5\u5c06\u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u4e3a\u5f00\u653e\u6ce8\u518c\uff1a\u73a9\u5bb6\u5728\u57fa\u7840\u6e38\u620f\u5546\u5e97\u9875\u9762\u7533\u8bf7\u8bbf\u95ee\u6743\u9650\u65f6\uff0c\u5c06\u4f1a\u88ab\u81ea\u52a8\u6dfb\u52a0\u3002\n\n\u5c06\u6d4b\u8bd5\u4ece\u9650\u5236\u6027\u6ce8\u518c\uff08\u9ed8\u8ba4\uff09\u5207\u6362\u4e3a\u5176\u4ed6\u6a21\u5f0f\uff0c\u5c06\u4f1a\u542f\u52a8\u63a5\u7eb3\u6240\u6709\u5f85\u5904\u7406\u6e38\u620f\u6d4b\u8bd5\u73a9\u5bb6\u7684\u6d41\u7a0b\u3002 \u8fd9\u4e00\u822c\u4f1a\u5728\u51e0\u5206\u949f\u5185\u5f00\u59cb\u3002\n\n\u4e5f\u53ef\u4ee5\u4ece\u5408\u4f5c\u4f19\u4f34\u7ad9\u70b9\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u9875\u9762\u4e2d\u63a7\u5236\u6ce8\u518c\u7c7b\u578b\u9009\u9879\u3002 \u60a8\u53ef\u4ee5\u968f\u65f6\u6309\u9700\u66f4\u6539\u6ce8\u518c\u7c7b\u578b\u3002\n\n## \u4f7f\u7528 Steam \u5e8f\u5217\u53f7\u8fdb\u884c Steam \u6e38\u620f\u6d4b\u8bd5\n\n\u60a8\u53ef\u4ee5\u4e3a\u81ea\u5df1\u7684\u6e38\u620f\u6d4b\u8bd5\u5206\u53d1 Steam \u5e8f\u5217\u53f7\u3002 \u6e38\u620f\u6d4b\u8bd5\u4e0d\u9700\u8981\u5f00\u653e\u6ce8\u518c\uff0c\u5373\u4f7f\u60a8\u7684\u5546\u5e97\u9875\u9762\u5c1a\u672a\u4e0a\u7ebf\uff0c\u4e5f\u53ef\u4ee5\u4e3a\u6e38\u620f\u6d4b\u8bd5\u751f\u6210\u5e76\u5206\u53d1\u5e8f\u5217\u53f7\u3002 \u8fd9\u5e94\u8be5\u8ba9\u60a8\u53ef\u4ee5\u8fdb\u884c\u7cbe\u786e\u7684\u63a7\u5236\uff0c\u4ee5\u5b9e\u65bd\u60a8\u4e3a\u6e38\u620f\u8bbe\u8ba1\u7684\u6d4b\u8bd5\u63a8\u51fa\u8ba1\u5212\u3002\n\n\u5bf9\u5927\u591a\u6570\u5f00\u53d1\u8005\u6765\u8bf4\uff0c\u76f8\u6bd4\u57fa\u7840\u6e38\u620f\u7684\u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\uff0c\u6e38\u620f\u6d4b\u8bd5\u5e8f\u5217\u53f7\u4f7f\u7528\u8d77\u6765\u66f4\u5bb9\u6613\uff0c\u4e5f\u66f4\u5b89\u5168\u3002 \u6e38\u620f\u6d4b\u8bd5\u53ef\u4ee5\u66f4\u8f7b\u677e\u5730\u652f\u6301\u63a8\u51fa\u66f4\u5927\u6279\u91cf\u7684\u5e8f\u5217\u53f7\uff1a\u901a\u5e38\u57fa\u7840\u6e38\u620f\u7684\u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u9650\u5236\u5728 2500 \u4e2a\uff0c\u800c\u4e00\u822c\u6765\u8bf4\uff0c\u80fd\u7533\u8bf7\u7684\u6e38\u620f\u6d4b\u8bd5\u5e8f\u5217\u53f7\u6570\u91cf\u5219\u591a\u5f97\u591a\u3002 \u6b64\u5916\uff0c\u60a8\u8fd8\u53ef\u4ee5\u7528\u201c\u53ef\u73a9\u201d\u8bbe\u7f6e\u6765\u63a7\u5236\u5bf9\u6e38\u620f\u6d4b\u8bd5\u7684\u8bbf\u95ee\u6743\u9650\u3002 \u8bf7\u6ce8\u610f\uff1a\u5e8f\u5217\u53f7\u4e00\u7ecf\u6388\u4e88\uff0c\u4e0d\u53ef\u64a4\u9500\uff0c\u5373\u4f7f\u540e\u6765\u6e38\u620f\u6d4b\u8bd5\u88ab\u6807\u8bb0\u4e3a\u201c\u4e0d\u53ef\u73a9\u201d\u4e5f\u662f\u5982\u6b64\u3002\n\n\u8981\u4f7f\u7528 Steam \u5e8f\u5217\u53f7\u8fdb\u884c Steam \u6e38\u620f\u6d4b\u8bd5\uff0c\u8bf7\u9075\u5faa\u4ee5\u4e0b\u6b65\u9aa4\uff1a\n\n- \u4e3a Steam \u6e38\u620f\u6d4b\u8bd5\u7533\u8bf7 Steam \u5e8f\u5217\u53f7\u3002 \u60a8\u53ea\u80fd\u4e3a\u6e38\u620f\u6d4b\u8bd5\u7533\u8bf7 Steam \u6807\u51c6\u53d1\u884c\u5e8f\u5217\u53f7\uff0c\u4e5f\u5c31\u662f\u8bf4\uff0c\u5e8f\u5217\u53f7\u4e00\u65e6\u6fc0\u6d3b\uff0c\u6e38\u620f\u6d4b\u8bd5\u53ea\u6709\u5728\u201c\u5df2\u53d1\u884c\u201d\uff08\u5373\u201c\u6e38\u620f\u6d4b\u8bd5\u72b6\u6001\uff1a\u53ef\u73a9\u201d\uff09\u65f6\u624d\u53ef\u73a9\u3002 \u65e0\u6cd5\u4e3a Steam \u6e38\u620f\u6d4b\u8bd5\u7533\u8bf7 Steam \u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\uff08beta \u7248\uff09\u5e8f\u5217\u53f7\u3002\n\n- \u5c06 Steam \u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u4e3a\u201c\u53ef\u73a9\u201d\u3002 \u5373\u4fbf\u60a8\u7684 Steam \u5546\u5e97\u9875\u9762\u5c1a\u672a\u5728 Steam \u4e0a\u516c\u5f00\u53ef\u89c1\uff0c\u4e5f\u53ef\u4ee5\u7528 Steam \u5e8f\u5217\u53f7\u6765\u8fdb\u884c\u6e38\u620f\u6d4b\u8bd5\u3002\n\n- \u60a8\u5e0c\u671b\u505c\u6b62\u6e38\u620f\u6d4b\u8bd5\u65f6\uff0c\u53ef\u4ee5\u5c06 Steam \u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u8bbe\u7f6e\u4e3a\u201c\u4e0d\u53ef\u73a9\u201d\u3002 \u8bf7\u6ce8\u610f\uff1a\u5e8f\u5217\u53f7\u4e00\u7ecf\u6388\u4e88\uff0c\u4e0d\u4f1a\u81ea\u52a8\u64a4\u9500\uff0c\u5373\u4f7f\u540e\u6765\u6e38\u620f\u6d4b\u8bd5\u88ab\u6807\u8bb0\u4e3a\u201c\u4e0d\u53ef\u73a9\u201d\u4e5f\u662f\u5982\u6b64\u3002\n\n\u867d\u7136 Steam \u5e8f\u5217\u53f7\u662f Steam \u7ed9\u5f00\u53d1\u8005\u7528\u6765\u8fdb\u884c\u6e38\u620f\u6d4b\u8bd5\u7684\u514d\u8d39\u670d\u52a1\uff0c\u4f46\u4e5f\u4e0d\u662f\u65e0\u9650\u63d0\u4f9b\u3002 \u5982\u679c\u60a8\u60f3\u4e3a\u81ea\u5df1\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u7533\u8bf7\u8d85\u8fc7 5 \u4e07\u4e2a\u5e8f\u5217\u53f7\uff0c\u5219\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u5b9e\u9645\u4e0a\u5df2\u7ecf\u5c5e\u4e8e\u516c\u6d4b\uff0c\u60a8\u5e94\u8be5\u53ef\u4ee5\u653e\u5fc3\u5730\u5728\u81ea\u5df1\u7684 Steam \u5546\u5e97\u9875\u9762\u5f00\u653e\u6ce8\u518c\u3002 Valve \u4f1a\u9010\u4e00\u5ba1\u67e5\u6bcf\u9879\u7533\u8bf7\uff0c\u5e76\u4fdd\u7559\u62d2\u7edd Steam \u5e8f\u5217\u53f7\u7533\u8bf7\u7684\u6743\u5229\u3002Steam \u6e38\u620f\u6d4b\u8bd5\u662f\u4f9b\u987e\u5ba2\u548c Steam \u5f00\u53d1\u8005\u4f7f\u7528\u7684\u4e00\u9879\u5b8c\u5168\u514d\u8d39\u7684\u529f\u80fd\u3002 Steam \u5e8f\u5217\u53f7\u4e3a\u60a8\u5411 Steam \u6e38\u620f\u6d4b\u8bd5\u4e2d\u6dfb\u52a0\u73a9\u5bb6\u63d0\u4f9b\u4e86\u4e00\u79cd\u4fbf\u6377\u7684\u65b9\u5f0f\u3002 \u4f46\u662f\u8bf7\u8bb0\u4f4f\uff0c\u5411\u987e\u5ba2\u6536\u8d39\u53c2\u52a0\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u662f\u4e0d\u5141\u8bb8\u7684\uff0c\u60a8\u4e5f\u4e0d\u5f97\u51fa\u552e Steam \u6e38\u620f\u6d4b\u8bd5\u7684 Steam \u5e8f\u5217\u53f7\u6216\u5c06\u5176\u7eb3\u5165\u6536\u8d39\u7684 Steam \u5e8f\u5217\u53f7\u6346\u7ed1\u5305\u6216\u8ba2\u9605\u4e2d\u3002\n\u5982\u6709\u7591\u95ee\uff0c\u8bf7\u8054\u7cfb\u6211\u4eec\u5e76[\u63d0\u4ea4\u5ba2\u670d\u6848\u4ef6](https://help.steampowered.com/wizard/HelpWithPublishing)\u3002 \u60a8\u8fd8\u53ef\u4ee5\u5728[\u6b64\u5904](https://partner.steamgames.com/doc/features/keys)\u67e5\u770b\u6211\u4eec\u7684 Steam \u5e8f\u5217\u53f7\u89c4\u5219\u53ca\u6307\u5f15\u3002\n\n## \u672a\u516c\u5e03\u6e38\u620f\u7684\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\n\n\u4efb\u4f55\u65f6\u5019\u5bf9\u672a\u516c\u5e03\u7684\u6e38\u620f\u8fdb\u884c\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\u65f6\u52a1\u5fc5\u5c0f\u5fc3\u8c28\u614e\u3002 \u5373\u4f7f\u914d\u7f6e\u6b63\u786e\uff0c\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\u7684\u4fdd\u5bc6\u6027\u4e5f\u4ec5\u53d6\u51b3\u4e8e\u60a8\u201c\u6700\u4e0d\u4fdd\u5bc6\u201d\u7684\u6d4b\u8bd5\u4eba\u5458\u3002\u800c\u6d4b\u8bd5\u4eba\u5458\u6cc4\u9732\u51fa\u53bb\u7684\u4efb\u4f55\u7ec6\u8282\uff0c\u5305\u62ec\u622a\u56fe\u548c\u89c6\u9891\uff0c\u90fd\u53ef\u80fd\u5728\u77ac\u95f4\u4f20\u904d\u7f51\u7edc\u3002 \u56e0\u6b64\uff0c\u6700\u597d\u662f\u5148\u516c\u5e03\u6e38\u620f\uff0c\u7136\u540e\u518d\u5728\u60a8\u7684\u7ec4\u7ec7\u4e4b\u5916\u8fdb\u884c\u4efb\u4f55\u5916\u90e8\u6e38\u620f\u6d4b\u8bd5\u3002\n\n\u5982\u679c\u60a8\u771f\u7684\u5f88\u60f3\u4e3a\u672a\u516c\u5e03\u7684\u6e38\u620f\u8fdb\u884c\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\uff08\u6709\u65f6\u5019\u79f0\u4e4b\u4e3a\u201c\u4eb2\u53cb\u201d\u6d4b\u8bd5\uff09\uff0c\u90a3\u4e48\u6700\u5b89\u5168\u7684\u65b9\u6cd5\u662f\u901a\u8fc7**\u672a\u53d1\u884c**\u7684\u57fa\u7840\u5e94\u7528\uff08\u800c\u975e\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\uff09\u7684\u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3 Steam \u5e8f\u5217\u53f7\u8fdb\u884c\u3002 \u8bf7\u8bb0\u4f4f\uff1a\u4fdd\u6301\u673a\u5bc6\u6027\u9700\u8981\u4e00\u4e9b\u989d\u5916\u7684\u6b65\u9aa4\uff0c\u4e5f\u4f1a\u9762\u4e34\u989d\u5916\u98ce\u9669\u5e76\u987b\u6ce8\u610f\u66f4\u591a\u4e8b\u9879\uff1a\n\n- \u63a5\u53d7\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5 Steam \u5e8f\u5217\u53f7\u7684\u73a9\u5bb6\u5e76\u672a\u4e0e\u60a8\u8fbe\u6210\u4fdd\u5bc6\u534f\u8bae\uff08NDA\uff09\uff0c\u56e0\u6b64\u5982\u679c\u60a8\u60f3\u5bf9\u4ed6\u4eec\u8fdb\u884c\u767b\u8bb0\u5e76\u786e\u4fdd\u4ed6\u4eec\u5728\u6536\u5230\u5e8f\u5217\u53f7\u524d\u540c\u610f NDA\uff0c\u5c31\u9700\u8981\u6709\u81ea\u5df1\u7684\u89e3\u51b3\u65b9\u6848\u3002 \u4ed6\u4eec\u6210\u529f\u767b\u8bb0\u540e\uff0c\u60a8\u4e5f\u9700\u8981\u6709\u81ea\u5df1\u7684\u89e3\u51b3\u65b9\u6848\u6765\u5411\u4ed6\u4eec\u5b89\u5168\u5730\u5206\u53d1\u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u3002\n\n- \u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\u53ef\u80fd\u5df2\u7ecf\u5b89\u88c5\u4e86\u7b2c\u4e09\u65b9\u5e94\u7528\u6216\u7f51\u7edc\u6269\u5c55\u7a0b\u5e8f\uff0c\u4f1a\u81ea\u52a8\u663e\u793a\u4ed6\u4eec\u7684 Steam \u5ba2\u6237\u7aef\u8fd0\u884c\u5185\u5bb9\u7684\u6240\u6709\u4fe1\u606f\uff0c\u751a\u81f3\u662f\u672a\u53d1\u884c\u6216\u672a\u516c\u5e03\u7684\u6e38\u620f\u7684\u4fe1\u606f\u3002 \u90e8\u5206\u6b64\u7c7b\u7b2c\u4e09\u65b9\u7a0b\u5e8f\u751a\u81f3\u53ef\u80fd\u4f1a\u4fc3\u4f7f\u6d4b\u8bd5\u4eba\u5458\u63d0\u4f9b\u5173\u4e8e\u60a8\u672a\u516c\u5e03\u6e38\u620f\u7684\u66f4\u591a\u4fe1\u606f\uff0c\u4f8b\u5982\u201c\u6211\u4eec\u65e0\u6cd5\u8bc6\u522b\u6b64\u6e38\u620f\uff0c\u53ef\u4ee5\u544a\u8bc9\u6211\u4eec\u66f4\u591a\u76f8\u5173\u4fe1\u606f\u5417\uff1f\u201d\n\n- \u4e3a\u4e86\u52a0\u5f3a\u5b89\u5168\u6027\uff0c\u53ef\u4ee5\u8003\u8651\u4e3a\u5c1a\u672a\u516c\u5e03\u7684\u6e38\u620f\u4f7f\u7528\u4e00\u4e2a\u65e0\u5b9e\u9645\u610f\u4e49\u7684\u4ee3\u53f7\u3002 \u5f53\u7136\uff0c\u4e4b\u540e\u5728\u51c6\u5907\u53d1\u5e03\u6e38\u620f\u548c\u5176\u201c\u5373\u5c06\u63a8\u51fa\u201d\u5546\u5e97\u9875\u9762\u65f6\uff0c\u9700\u8981\u66f4\u65b0\u6e38\u620f\u540d\u79f0\u3002\n\n- \u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u9650\u6bcf\u4e2a\u5e94\u7528 2500 \u4e2a\u3002 \u5982\u679c\u60a8\u9700\u8981\u8d85\u8fc7 2500 \u4e2a\u5e8f\u5217\u53f7\u6765\u8fdb\u884c\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\uff0c\u90a3\u4e48\u53d1\u751f\u6cc4\u9732\u7684\u53ef\u80fd\u6027\u5c31\u4f1a\u5927\u5927\u63d0\u5347\uff0c\u76f8\u5f53\u4e8e\u60a8\u5b9e\u9645\u4e0a\u5c06\u201c\u516c\u5e03\u201d\u81ea\u5df1\u7684\u4ea7\u54c1\u3002 \u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0c\u60a8\u5e94\u8be5\u8003\u8651\u5148\u516c\u5e03\u57fa\u7840\u6e38\u620f\uff0c\u7136\u540e\u901a\u8fc7\u6b63\u5e38\u7684\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u6765\u8fdb\u884c\u5916\u90e8\u6e38\u620f\u6d4b\u8bd5\uff0c\u8fd9\u6837\u53ef\u4ee5\u8ba9\u60a8\u7533\u8bf7\u591a\u8fbe 5 \u4e07\u4e2a\u5e8f\u5217\u53f7\u3002\n\n- \u522b\u5fd8\u4e86\uff01 \u53d1\u884c\u72b6\u6001\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u4f1a\u6301\u7eed\u6388\u4e88\u57fa\u7840\u6e38\u620f\u7684\u8bbf\u95ee\u6743\u9650\uff0c\u76f4\u81f3\u88ab\u7981\u6b62\u4e3a\u6b62\uff0c\u56e0\u6b64\u8bf7\u4ed4\u7ec6\u9605\u8bfb[\u5e8f\u5217\u53f7\u7ba1\u7406](https://partner.steamgames.com/doc//features/keys#6)\uff0c\u5e76\u5236\u5b9a\u597d\u5728\u4fdd\u5bc6\u6e38\u620f\u6d4b\u8bd5\u7ed3\u675f\u540e\u5904\u7406\u8fd9\u4e9b\u5e8f\u5217\u53f7\u7684\u8ba1\u5212\u3002\n\n**\u5728 Steam \u4e0a\u663e\u793a\u5e94\u7528**\uff1a\u9664\u4e86\u5e8f\u5217\u53f7\u4e4b\u5916\uff0c\u4e00\u65e6\u5e94\u7528\u5904\u4e8e\u4ee5\u4e0b\u4e09\u79cd\u60c5\u5f62\u4e4b\u4e00\uff0c\u90a3\u4e48 Steam \u4e0a\u5e94\u7528\u7684\u8be6\u60c5\u4e5f\u4f1a\u5bf9\u8bb8\u591a\u73a9\u5bb6\u548c/\u6216\u7b2c\u4e09\u65b9\u7f51\u7edc\u722c\u866b\u53ef\u89c1\uff1a1) \u53d1\u5e03\u4e86\u5546\u5e97\u9875\u9762\uff1b2) \u53ef\u4ee5\u9884\u8f7d\uff1b3) \u53d1\u884c\uff08\u5373\u4f7f\u53d1\u884c\u65f6\u4f7f\u7528\u4e86\u201c\u5df2\u9690\u85cf\u201d\u7684\u5546\u5e97\u9875\u9762\uff09\u3002 \u8bf7\u52a1\u5fc5\u5b89\u6392\u597d\u60a8\u516c\u5e03\u6e38\u620f\u7684\u65f6\u95f4\uff0c\u786e\u4fdd\u5176**\u4e0d\u665a\u4e8e**\u5e94\u7528\u9996\u6b21\u8fdb\u5165\u4e0a\u8ff0\u4efb\u4e00\u72b6\u6001\u7684\u65f6\u95f4\u70b9\u3002\n\n## \u5e38\u89c1\u914d\u7f6e\n\n**\u6e38\u620f\u6d4b\u8bd5\u4e0d\u53ef\u73a9\uff0c\u4e14\u4e0d\u63a5\u53d7\u6ce8\u518c\u3002**\n\u8fd9\u662f\u5c06\u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u4e3a\u4e0a\u7ebf\u6216\u63a5\u53d7\u6ce8\u518c\u524d\uff0c\u5bf9\u6e38\u620f\u6d4b\u8bd5\u8fdb\u884c\u521d\u59cb\u8bbe\u7f6e\u65f6\u7684\u9ed8\u8ba4\u914d\u7f6e\uff0c \u4e5f\u5c06\u4f1a\u662f\u60a8\u5168\u90e8\u5b8c\u6210\u6e38\u620f\u6d4b\u8bd5\u540e\u7684\u6700\u7ec8\u914d\u7f6e\u3002\n\n ![notplayablehidden.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/notplayablehidden.png)\n\n**\u6e38\u620f\u6d4b\u8bd5\u4e0d\u53ef\u73a9\uff0c\u4f46\u63a5\u53d7\u65b0\u6ce8\u518c\u3002**\n\u5982\u679c\u5e0c\u671b\u8ba9\u73a9\u5bb6\u5728\u6e38\u620f\u6d4b\u8bd5\u53ef\u7528\u524d\u6ce8\u518c\uff0c\u60a8\u6216\u8bb8\u5e94\u8be5\u91c7\u53d6\u8fd9\u79cd\u914d\u7f6e\u3002 \u5982\u679c\u60a8\u5df2\u7ecf\u7ed3\u675f\u6e38\u620f\u6d4b\u8bd5\uff0c\u4f46\u51c6\u5907\u5c06\u6765\u8fdb\u884c\u53e6\u4e00\u4e2a\u6d4b\u8bd5\uff0c\u5e76\u5e0c\u671b\u4e3a\u5c06\u6765\u7684\u6e38\u620f\u6d4b\u8bd5\u6d3b\u52a8\u6dfb\u52a0\u66f4\u591a\u6d4b\u8bd5\u4eba\u5458\uff0c\u90a3\u60a8\u4e5f\u53ef\u80fd\u60f3\u4f7f\u7528\u6b64\u914d\u7f6e\u3002\n\n![notplayablevisible.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/notplayablevisible.png)\n\n**\u6e38\u620f\u6d4b\u8bd5\u53ef\u73a9\uff0c\u4e14\u63a5\u53d7\u65b0\u6ce8\u518c\u3002**\n\u5982\u679c\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u5df2\u4e0a\u7ebf\uff0c\u4e14\u5e0c\u671b\u5c06\u6765\u6dfb\u52a0\u66f4\u591a\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\uff0c\u5219\u8fd9\u53ef\u80fd\u662f\u6b63\u786e\u7684\u8bbe\u7f6e\u3002\u60a8\u53ef\u80fd\u9700\u8981\u6269\u5c55\u670d\u52a1\u5668\u5bb9\u91cf\u6216\u8005\u6dfb\u52a0\u65b0\u529f\u80fd\uff0c\u8fd8\u9700\u8981\u66f4\u591a\u7684\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\u6765\u5c1d\u8bd5\u672a\u6765\u7684\u751f\u6210\u7248\u672c\u3002\n\n![playablevisible.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/playablevisible.png)\n\n**\u6e38\u620f\u6d4b\u8bd5\u53ef\u73a9\uff0c\u4f46\u4e0d\u63a5\u53d7\u65b0\u6ce8\u518c\u3002**\n\u5982\u679c\u60a8\u4e0d\u6253\u7b97\u5728\u5c06\u6765\u63a5\u53d7\u66f4\u591a\u6d4b\u8bd5\u4eba\u5458\uff0c\u4f46\u4ecd\u65e7\u5e0c\u671b\u73b0\u6709\u6d4b\u8bd5\u4eba\u5458\u53ef\u4ee5\u8bbf\u95ee\u751f\u6210\u7248\u672c\uff0c\u53ef\u4ee5\u91c7\u7528\u6b64\u914d\u7f6e\u3002\n\n![playablehidden.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/playablehidden.png)\n\n## \u597d\u53cb\u9080\u8bf7\n\n\u597d\u53cb\u9080\u8bf7\u662f\u4e00\u79cd\u5b9e\u9a8c\u6027\u7684\u65b0\u65b9\u5f0f\uff0c\u53ef\u7528\u4e8e\u5c06\u73a9\u5bb6\u6dfb\u52a0\u5230\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u4e2d\uff0c\u4e13\u4e3a\u90a3\u4e9b\u66f4\u9002\u5408\u4e0e\u597d\u53cb\u4e00\u8d77\u73a9\u7684\u591a\u4eba\u6e38\u620f\u800c\u8bbe\u8ba1\u3002\n\n\u542f\u7528\u540e\uff0c\u80fd\u8bbf\u95ee\u6b64\u529f\u80fd\u7684\u7528\u6237\u53ef\u4ee5\u9080\u8bf7\u597d\u53cb\u52a0\u5165\u6e38\u620f\u6d4b\u8bd5\uff0c\u800c\u597d\u53cb\u4eec\u4e5f\u80fd\u9080\u8bf7\u597d\u53cb\uff0c\u5982\u6b64\u9012\u63a8\u3002\n\n\u73a9\u5bb6\u53ef\u4ee5\u9080\u8bf7 Steam \u4e0a\u7684\u597d\u53cb\u3002 \u73a9\u5bb6\u53d7\u5230\u9080\u8bf7\u540e\uff0c\u5c31\u4f1a\u6536\u5230\u901a\u77e5\uff0c\u544a\u77e5\u5176\u5df2\u88ab\u597d\u53cb\u9080\u8bf7\u52a0\u5165\u6e38\u620f\u6d4b\u8bd5\u3002\n\n![friendinvite3.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/friendinvite3.png)\n![friendinvite2.JPG](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/friendinvite2.JPG)\n\n\u5c31\u50cf\u5176\u4ed6 Steam \u6e38\u620f\u6d4b\u8bd5\u65b9\u5f0f\u4e00\u6837\uff0c\u8be5\u529f\u80fd\u4e5f\u53ef\u4ee5\u5728\u4e3b\u9762\u677f\u4e2d\u8fdb\u884c\u5168\u9762\u8bbe\u7f6e\u3002\n\n![invitefriends1.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/invitefriends1.png)\n\n\u60a8\u53ef\u4ee5\u5728\u4e3b\u9762\u677f\u4e2d\u6307\u5b9a\u6bcf\u4e2a\u73a9\u5bb6\u5f97\u5230\u7684\u9080\u8bf7\u6570\uff1a\n1\u30012 \u6216 3\u3002\n\n\u60a8\u8fd8\u53ef\u4ee5\u968f\u65f6\u542f\u7528\u6216\u6682\u505c\u597d\u53cb\u9080\u8bf7\u529f\u80fd\uff0c\u53ea\u9700\u70b9\u51fb\u51e0\u4e0b\u5373\u53ef\u3002\n\n\u542f\u7528\u597d\u53cb\u9080\u8bf7\u540e\uff0c\u6d4b\u8bd5\u4eba\u5458\u6570\u91cf\u7684\u589e\u957f\u4f1a\u8fc5\u901f\u52a0\u5feb\uff0c\u56e0\u6b64\u8be5\u529f\u80fd\u6700\u9002\u5408\u670d\u52a1\u5668\u5bb9\u91cf\u5145\u8db3\u7684\u6e38\u620f\u3002 \u5982\u679c\u60a8\u62c5\u5fc3\u6e38\u620f\u6d4b\u8bd5\u7684\u589e\u957f\u4f1a\u5feb\u5230\u60a8\u65e0\u6cd5\u652f\u6491\uff0c\u90a3\u4e48\u8be5\u529f\u80fd\u53ef\u80fd\u4e0d\u9002\u5408\u60a8\u3002\n\n\u5982\u679c\u60a8\u60f3\u8981\u9650\u5236\u597d\u53cb\u9080\u8bf7\u7684\u589e\u957f\uff0c\u60a8\u53ef\u4ee5\u91c7\u53d6\u4ee5\u4e0b\u505a\u6cd5\u4e4b\u4e00\uff1a\n\n- \u901a\u8fc7\u6e38\u620f\u6d4b\u8bd5\u4e3b\u9762\u677f\u89c2\u5bdf\u80fd\u591f\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\u7684\u73a9\u5bb6\u6570\uff0c\u5f53\u4eba\u6570\u8fbe\u5230\u60a8\u80fd\u591f\u81ea\u5982\u652f\u6301\u7a0b\u5ea6\u7684\u4e0a\u9650\u65f6\uff0c\u6682\u505c\u65b0\u7684\u9080\u8bf7\u3002\n\n- \u5c06\u597d\u53cb\u9080\u8bf7\u7684\u529f\u80fd\u9650\u5236\u4e3a\u5728\u7279\u5b9a\u65e5\u671f\u4e4b\u524d\u52a0\u5165\u7684\u73a9\u5bb6\u624d\u80fd\u4f7f\u7528\uff0c\u7531\u6b64\u9650\u5236\u6f5c\u5728\u7684\u9080\u8bf7\u603b\u6570\u3002 \u60a8\u53ef\u4ee5\u5728\u597d\u53cb\u9080\u8bf7\u4e2d\u4e88\u4ee5\u914d\u7f6e\u3002\n\n\u793a\u4f8b\uff1a\n\u60a8\u5df2\u5c06\u597d\u53cb\u9080\u8bf7\u914d\u7f6e\u4e3a\u6bcf\u4e2a\u73a9\u5bb6 3 \u6b21\u9080\u8bf7\uff0c\u800c\u76ee\u524d\u60a8\u6709 5000 \u540d\u73a9\u5bb6\u80fd\u591f\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\u3002 \u60a8\u5c06\u597d\u53cb\u9080\u8bf7\u914d\u7f6e\u4e3a\u4ec5\u9002\u7528\u4e8e\u622a\u81f3\u4eca\u65e5\u80fd\u591f\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\u7684\u7528\u6237\u3002 \u8fd9\u6837\uff0c\u6f5c\u5728\u7684\u9080\u8bf7\u6570\u5c31\u4f1a\u9650\u5236\u5728\u6700\u591a 15000 \u4e2a\uff0c\u56e0\u4e3a\u53ea\u6709\u622a\u81f3\u4eca\u65e5\u80fd\u591f\u8bbf\u95ee\u6e38\u620f\u6d4b\u8bd5\u7684\u7528\u6237\u624d\u80fd\u53d1\u9001\u9080\u8bf7\u3002\n\n## \u6709\u5173\u597d\u53cb\u9080\u8bf7\u7684\u91cd\u8981\u8bf4\u660e\n\n**\u524d\u63d0\u6761\u4ef6\uff1a**\u7528\u6237\u53ea\u80fd\u9080\u8bf7\u5df2\u6210\u4e3a\u5176\u597d\u53cb\u81f3\u5c11 30 \u5929\u7684\u7528\u6237\u3002**\u6709\u6548\u671f\uff1a**\u9080\u8bf7\u4e00\u7ecf\u53d1\u9001\u5c31\u4e00\u76f4\u6709\u6548\uff0c\u5373\u4fbf\u60a8\u6682\u505c\u4e86\u597d\u53cb\u9080\u8bf7\u4e5f\u4e0d\u4f8b\u5916\u3002 \u6682\u505c\u597d\u53cb\u9080\u8bf7\u4ec5\u4ec5\u662f\u7981\u6b62\u53d1\u9001\u65b0\u7684\u9080\u8bf7\u3002\n\n## \u6536\u96c6\u73a9\u5bb6\u53cd\u9988\n\n\u5982\u4f55\u6536\u96c6\u73a9\u5bb6\u7684\u53cd\u9988\u53d6\u51b3\u4e8e\u60a8\u3002 \u6211\u4eec\u5df2\u7ecf\u770b\u5230\u8bb8\u591a\u5f00\u53d1\u4eba\u5458\u5728\u4ed6\u4eec\u6e38\u620f\u7684\u4e3b\u83dc\u5355\u4e0a\u6dfb\u52a0\u4e86\u4e00\u4e2a\u5f88\u5927\u7684\u201c\u53cd\u9988\u201d\u6309\u94ae\uff0c\u53ef\u4ee5\u5c06\u73a9\u5bb6\u5e26\u5230\u5f00\u53d1\u4eba\u5458\u5e0c\u671b\u6536\u96c6\u548c\u7ba1\u7406\u53cd\u9988\u7684\u5730\u65b9\u3002 \u5b83\u53ef\u4ee5\u6307\u5411 Steam \u8bba\u575b\uff0c\u4e5f\u53ef\u4ee5\u662f\u60a8\u7684 Discord \u9891\u9053\u3001\u9519\u8bef\u8ddf\u8e2a\u8f6f\u4ef6\u3001\u60a8\u81ea\u5df1\u7684\u7f51\u7ad9\u8bba\u575b\u6216\u60a8\u5e0c\u671b\u7684\u4efb\u4f55\u5176\u4ed6\u5730\u65b9\u3002\n\n\u6211\u4eec\u5efa\u8bae\u60a8\u76f4\u63a5\u4e0e\u60a8\u7684\u53d7\u4f17\u4e92\u52a8\u2014\u2014\u8ba9\u4ed6\u4eec\u77e5\u9053\u60a8\u9700\u8981\u4ec0\u4e48\u6837\u7684\u53cd\u9988\uff0c\u4ee5\u53ca\u54ea\u91cc\u662f\u5206\u4eab\u53cd\u9988\u6700\u7406\u60f3\u7684\u5730\u65b9\u3002 \u60a8\u8fd8\u53ef\u4ee5\u76f4\u63a5\u5728\u793e\u533a\u516c\u544a\u4e2d\u63d0\u4f9b\u60a8\u504f\u597d\u7684\u53cd\u9988\u6216\u4ea4\u6d41\u7cfb\u7edf\u7684\u94fe\u63a5\u3002\n\n## \u91cd\u7f6e Steam \u6e38\u620f\u6d4b\u8bd5\n\n\u5728\u67d0\u4e9b\u60c5\u51b5\u4e0b\uff0c\u7528\u4e00\u7ec4\u5168\u65b0\u7684\u6d4b\u8bd5\u4eba\u5458\u8fdb\u884c\u6e38\u620f\u6d4b\u8bd5\u53ef\u80fd\u4f1a\u6709\u6240\u5e2e\u52a9\u3002 \u91cd\u7f6e\u6e38\u620f\u6d4b\u8bd5\u5c06\u79fb\u9664\u6240\u6709\u53c2\u4e0e\u8005\uff0c\u60a8\u53ef\u4ee5\u4ece Steam \u6e38\u620f\u6d4b\u8bd5\u4e3b\u9762\u677f\u5b8c\u6210\u6b64\u64cd\u4f5c\u3002**\u91cd\u8981\uff1a**\u91cd\u7f6e Steam \u6e38\u620f\u6d4b\u8bd5\u7684\u64cd\u4f5c\u4e0d\u53ef\u64a4\u9500\u3002 \u5728\u5f00\u59cb\u91cd\u7f6e\u4e4b\u524d\uff0c\u8bf7\u786e\u4fdd\u60a8\u5df2\u51c6\u5907\u597d\u79fb\u9664\u6240\u6709\u6e38\u620f\u6d4b\u8bd5\u53c2\u4e0e\u8005\u3002\n\u91cd\u7f6e\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u4e4b\u524d\uff0c\u5fc5\u987b\u6ee1\u8db3\u4ee5\u4e0b\u5148\u51b3\u6761\u4ef6\uff1a\n\n- \u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u5fc5\u987b\u505c\u7528\uff08\u4e3b\u9762\u677f\u4e0a\u5c06\u663e\u793a\u201c\u6e38\u620f\u6d4b\u8bd5\u72b6\u6001\uff1a\u4e0d\u53ef\u73a9\u201d\uff09\u3002\n\n- \u5546\u5e97\u53ef\u89c1\u6027\u5fc5\u987b\u8bbe\u4e3a\u201c\u5df2\u9690\u85cf\u201d\u3002\n\n- \u6ce8\u518c\u7c7b\u578b\u5fc5\u987b\u8bbe\u4e3a\u201c\u53d7\u9650\u201d\u3002\n\n- \u597d\u53cb\u9080\u8bf7\u5fc5\u987b\u6682\u505c\u6216\u7981\u7528\u3002\n\n- \u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u4e0d\u80fd\u5305\u542b\u5728\u67d0\u4e2a\u5305\u542b\u5176\u4ed6\u5e94\u7528\u7684\u7a0b\u5e8f\u5305\u4e2d\u3002\n\n- \u6240\u6709\u6e38\u620f\u6d4b\u8bd5\u5546\u5e97\u9875\u9762\u8bbe\u7f6e\u548c Steamworks \u8bbe\u7f6e\u5fc5\u987b\u53d1\u5e03\u3002\n\n\u5f53\u60a8\u91cd\u7f6e Steam \u6e38\u620f\u6d4b\u8bd5\u65f6\uff0c\u5c06\u6267\u884c\u4ee5\u4e0b\u64cd\u4f5c\uff1a\n\n- \u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u7684\u6240\u6709\u4ea7\u54c1\u5e8f\u5217\u53f7\u90fd\u5c06\u88ab\u7981\u7528\uff08\u5305\u62ec\u5c1a\u672a\u6fc0\u6d3b\u7684\u5e8f\u5217\u53f7\uff09\u3002\n\n- \u5f85\u5904\u7406\u7684\u597d\u53cb\u9080\u8bf7\u4f1a\u88ab\u5b58\u6863\u3002\n\n- \u6e38\u620f\u6d4b\u8bd5\u53c2\u4e0e\u8005\u548c\u7b49\u5f85\u8bbf\u95ee\u6743\u9650\u7684\u73a9\u5bb6\u5c06\u4ece\u6e38\u620f\u6d4b\u8bd5\u4e2d\u79fb\u9664\u3002 \u5982\u679c\u73a9\u5bb6\u8fd1\u671f\u8fdb\u884c\u4e86\u6e38\u620f\uff0c\u5219\u4f1a\u5411\u5176\u53d1\u9001\u4e00\u5c01\u7535\u5b50\u90ae\u4ef6\uff0c\u544a\u77e5 Steam \u6e38\u620f\u6d4b\u8bd5\u7684\u5f53\u524d\u9636\u6bb5\u5df2\u7ecf\u7ed3\u675f\u3002\n\n\u60a8\u5c06\u5728 Steam \u6e38\u620f\u6d4b\u8bd5\u4e3b\u9762\u677f\u4e0a\u770b\u5230\u6b63\u5728\u91cd\u7f6e\u7684\u6307\u793a\u3002 \u91cd\u7f6e\u5b8c\u6210\u540e\uff0cSteam \u6e38\u620f\u6d4b\u8bd5\u53ef\u4ee5\u5728\u60a8\u51c6\u5907\u597d\u8fdb\u884c\u4e0b\u4e00\u9636\u6bb5\u6d4b\u8bd5\u65f6\u91cd\u65b0\u542f\u7528\u3002\n\n## \u5e38\u89c1\u95ee\u9898\n\n**#### \u95ee\uff1aValve \u4e3a\u4f55\u51b3\u5b9a\u5f00\u53d1\u6b64\u5de5\u5177\uff1f**\n**\u7b54\uff1a**\u5927\u5927\u5c0f\u5c0f\u7684\u5f00\u53d1\u5de5\u4f5c\u5ba4\u4e00\u518d\u8bf7\u6c42\uff0c\u5e0c\u671b\u80fd\u6709\u529e\u6cd5\u8ba9\u771f\u5b9e\u987e\u5ba2\u8fdb\u884c\u6709\u9650\u4e14\u4f4e\u98ce\u9669\u7684\u6e38\u620f\u6d4b\u8bd5\uff0c\u4e8e\u662f\u5168\u65b0\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u529f\u80fd\u4fbf\u5e94\u8fd0\u800c\u751f\u3002 \u5f00\u53d1\u56e2\u961f\u5e0c\u671b\u80fd\u81ea\u7531\u5730\u8fdb\u884c\u6e38\u620f\u6d4b\u8bd5\uff0c\u540c\u65f6\u65e0\u9700\u56e0\u4e3a\u7528\u6237\u8bc4\u6d4b\u800c\u611f\u5230\u538b\u529b\uff0c\u4e5f\u65e0\u9700\u62c5\u5fc3\u6e38\u620f\u6d4b\u8bd5\u5e72\u6270\u6e38\u620f\u88ab\u52a0\u5165\u613f\u671b\u5355\u7684\u6570\u91cf\u2026\u2026\u4f46\u4ed6\u4eec\u4e5f\u5e0c\u671b\u80fd\u63a7\u5236\u6e38\u620f\u6d4b\u8bd5\u7684\u5f00\u59cb\u3001\u6682\u505c\u548c\u7ed3\u675f\u3002 \u6211\u4eec\u5e0c\u671b\u8fd9\u4e00\u5957\u5168\u65b0\u5de5\u5177\u53ef\u4ee5\u5e2e\u52a9\u5f00\u53d1\u8005\u66f4\u63a5\u8fd1\u81ea\u5df1\u7684\u73a9\u5bb6\uff0c\u5e76\u56e0\u6b64\u6253\u9020\u51fa\u66f4\u597d\u7684\u6e38\u620f\u3002\n\n\u6211\u4eec\u770b\u5230\u4e0d\u5c11\u5f00\u53d1\u8005\u4e3a\u4e86\u89e3\u51b3\u540c\u4e00\u7c7b\u95ee\u9898\uff0c\u91c7\u53d6\u4e86\u8bb8\u591a\u51fa\u4eba\u610f\u6599\u6216\u975e\u5b98\u65b9\u7684\u505a\u6cd5\uff0c\u6bd4\u5982\uff1a\u63d0\u4f9b\u4e00\u4e2a\u5b9e\u8d28\u4e0a\u662f\u201c\u5f00\u653e\u6d4b\u8bd5\u201d\u7684\u8bd5\u7528\u7248\uff0c\u6216\u662f\u53d1\u5e03\u4e00\u6b3e\u514d\u8d39\u7684\u201c\u5e8f\u7ae0\u201d\u6e38\u620f\u4ee5\u5236\u9020\u58f0\u52bf\u3002 \u5f00\u53d1\u8005\u5728\u5c3d\u529b\u5229\u7528\u5404\u79cd\u5de5\u5177\u6765\u521b\u5efa\u793e\u533a\u3001\u6536\u96c6\u6e38\u620f\u6d4b\u8bd5\u6570\u636e\u3002 \u8fd9\u4e9b\u90fd\u662f\u503c\u5f97\u89e3\u51b3\u7684\u597d\u95ee\u9898\uff0c\u56e0\u6b64\u6211\u4eec\u5e0c\u671b\u63d0\u4f9b\u4e00\u4e2a\u5f97\u5230\u5168\u65b9\u4f4d\u652f\u6301\u7684\u5b98\u65b9\u89e3\u51b3\u65b9\u6848\uff0c\u65e2\u80fd\u8ba9\u5f00\u53d1\u8005\u64cd\u4f5c\u66f4\u7b80\u5355\uff0c\u4e5f\u80fd\u4e3a\u73a9\u5bb6\u5e26\u6765\u66f4\u4e00\u81f4\u7684\u4f53\u9a8c\u3002\n\n**#### \u95ee\uff1a\u5982\u679c\u6211\u60f3\u8fdb\u884c\u6e38\u620f\u6d4b\u8bd5\uff0c\u4f46\u53c8\u5e0c\u671b\u901a\u8fc7 Steam \u5e8f\u5217\u53f7\u6765\u63a7\u5236\u8bbf\u95ee\u6743\u9650\uff0c\u8be5\u600e\u4e48\u529e\uff1f**\n**\u7b54\uff1a**\u60a8\u4e5f\u53ef\u4ee5\u4e3a\u81ea\u5df1\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u7533\u8bf7\u5e8f\u5217\u53f7\u3002 \u4e8b\u5b9e\u4e0a\uff0c\u5982\u679c\u4e00\u5c0f\u7ec4\u6d4b\u8bd5\u8005\u6ee1\u8db3\u4e0d\u4e86\u60a8\u7684\u9700\u6c42\uff0c\u76ee\u524d\u8fd9\u662f\u4e3a\u60a8\u7684\u6e38\u620f\u8fdb\u884c\u6d4b\u8bd5\u7684\u6700\u4f73\u65b9\u6cd5\u3002 \u8bb0\u4f4f\uff0c\u60a8\u4ecd\u7136\u53ef\u4ee5\u7528\u4e3b\u6e38\u620f\u7684 App ID \u6765\u8fdb\u884c\u6d4b\u8bd5\uff0c\u4f7f\u7528\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u5373\u53ef\u3002 \u8bf7\u67e5\u770b[\u5728 Steam \u4e0a\u8fdb\u884c\u6d4b\u8bd5](https://partner.steamgames.com/doc/store/testing)\u6587\u6863\uff0c\u4ee5\u83b7\u53d6\u66f4\u591a\u4fe1\u606f\u3002 \u60a8\u8fd8\u53ef\u4ee5\u5728[\u6b64\u5904](https://partner.steamgames.com/doc/features/keys)\u67e5\u770b\u6211\u4eec\u7684 Steam \u5e8f\u5217\u53f7\u89c4\u5219\u53ca\u6307\u5f15\u3002\n\n**#### \u95ee\uff1a\u6211\u6709\u7591\u95ee\u6216\u53cd\u9988\uff0c\u5982\u4f55\u8054\u7cfb\u4f60\u4eec\uff1f**\n**\u7b54\uff1a**\u5982\u679c\u60a8\u9047\u5230\u4e86\u95ee\u9898\uff0c\u6216\u8981\u9488\u5bf9\u8be5\u529f\u80fd\u8fdb\u884c\u53cd\u9988\uff0c\u8bf7\u4f7f\u7528\u6211\u4eec[\u6b64\u5904\u7684\u8054\u7cfb\u8868\u683c](https://help.steampowered.com/wizard/HelpWithPublishing)\u3002\n\n**#### \u95ee\uff1a\u6211\u4ec0\u4e48\u65f6\u5019\u53ef\u4ee5\u4f7f\u7528 Steam \u6e38\u620f\u6d4b\u8bd5\uff1f**\n**\u7b54\uff1a**\u6211\u4eec\u8ba4\u4e3a\u4f7f\u7528\u6b64\u529f\u80fd\u7684\u6700\u4f73\uff08\u53ef\u80fd\u4e5f\u662f\u6700\u5e38\u89c1\u7684\uff09\u65f6\u95f4\u662f\u5728\u60a8\u7684\u6e38\u620f\u53d1\u884c\u524d\u3002 \u60a8\u7684\u9996\u8981\u4efb\u52a1\u53ef\u80fd\u662f\u8bbe\u7f6e\u6e38\u620f\u7684\u5373\u5c06\u63a8\u51fa\u9875\u9762\u3001\u5f00\u59cb\u6536\u96c6\u613f\u671b\u5355\u5e76\u6253\u9020\u793e\u533a\u3002 \u5b8c\u6210\u4ee5\u4e0a\u64cd\u4f5c\u540e\uff0c\u60a8\u5c31\u53ef\u4ee5\u5728\u53d1\u884c\u6e38\u620f\u524d\u901a\u8fc7 Steam \u6e38\u620f\u6d4b\u8bd5\u4ece\u771f\u5b9e\u73a9\u5bb6\u5904\u83b7\u53d6\u53cd\u9988\u3002\n\n\u5982\u679c\u60a8\u613f\u610f\uff0c\u53ef\u4ee5\u7ee7\u7eed\u4f7f\u7528\u6e38\u620f\u6d4b\u8bd5\u7684 appID \u4f5c\u4e3a\u65b0\u5de5\u5177\u6216\u529f\u80fd\u7684\u8bd5\u9a8c\u573a\uff0c\u4f46\u8bf7\u8bb0\u4f4f\uff1aSteam \u6e38\u620f\u6d4b\u8bd5\u5bf9\u987e\u5ba2\u662f\u514d\u8d39\u7684\u3002 \u5728\u6e38\u620f\u6b63\u5f0f\u53d1\u552e\u540e\u7ee7\u7eed\u4fdd\u7559\u6e38\u620f\u6d4b\u8bd5\u7248\u672c\uff0c\u901a\u5e38\u53ea\u6709\u5728\u60a8\u7684\u6e38\u620f\u672c\u8eab\u5c31\u662f\u514d\u8d39\u5f00\u73a9\u65f6\u624d\u6709\u610f\u4e49\u3002\n\n**#### \u95ee\uff1aSteam \u5982\u4f55\u9009\u62e9\u8be5\u8ba9\u54ea\u4e9b\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\u53c2\u52a0\u53d7\u9650\u7684\u6e38\u620f\u6d4b\u8bd5\uff1f**\n**\u7b54\uff1a**Steam \u4f1a\u4ece\u7533\u8bf7\u8bbf\u95ee\u6743\u9650\u7684 Steam \u5e10\u6237\u4e2d\u968f\u673a\u6311\u9009\u6e38\u620f\u6d4b\u8bd5\u4eba\u5458\u3002 \u60a8\u53ef\u4ee5\u9009\u62e9\u63a5\u53d7\u6765\u81ea\u67d0\u4e9b\u56fd\u5bb6/\u5730\u533a\u7684\u73a9\u5bb6\uff0c\u4e0d\u8fc7\u8fd9\u57fa\u672c\u4e0a\u53ea\u6709\u5728\u670d\u52a1\u5668\u5bb9\u91cf\u6709\u9650\u6216\u9700\u8981\u89e3\u51b3\u5ef6\u8fdf\u95ee\u9898\u7684\u60c5\u51b5\u4e0b\u624d\u6709\u610f\u4e49\u3002\n\n**#### \u95ee\uff1a\u5982\u679c\u4e00\u540d\u73a9\u5bb6\u8bf7\u6c42\u52a0\u5165\u6211\u7684\u6e38\u620f\u6d4b\u8bd5\uff0c\u5f53\u6211\u901a\u8fc7\u6e38\u620f\u6d4b\u8bd5\u63a7\u5236\u754c\u9762\u6388\u4e88\u5176\u6743\u9650\u540e\uff0c\u8be5\u73a9\u5bb6\u4f1a\u5982\u4f55\u6536\u5230\u901a\u77e5\uff1f**\n**\u7b54\uff1a**\u5f53\u73a9\u5bb6\u88ab\u6dfb\u52a0\u81f3\u6e38\u620f\u6d4b\u8bd5\u65f6\uff0c\u4f1a\u6536\u5230\u6765\u81ea Steam \u7684\u7535\u5b50\u90ae\u4ef6\u3002 \u540c\u65f6\u4e5f\u5c06\u5728\u57fa\u7840\u6e38\u620f\u7684\u5546\u5e97\u9875\u9762\u770b\u5230\u81ea\u5df1\u7684\u72b6\u6001\u3002\n\n**#### \u95ee\uff1a\u5f53\u6e38\u620f\u6d4b\u8bd5\u88ab\u8bbe\u4e3a\u53ef\u73a9\u65f6\uff0c\u73a9\u5bb6\u4f1a\u6536\u5230\u901a\u77e5\u5417\uff1f**\n**\u7b54\uff1a**Steam \u4e0d\u4f1a\u5728\u6e38\u620f\u6d4b\u8bd5\u7684\u751f\u6210\u7248\u672c\u88ab\u8bbe\u7f6e\u4e3a\u53ef\u73a9/\u4e0d\u53ef\u73a9\u65f6\u53d1\u51fa\u7535\u5b50\u90ae\u4ef6\u901a\u77e5\u3002 \u6211\u4eec\u5efa\u8bae\u60a8\u4f7f\u7528 [Steam \u6d3b\u52a8\u548c\u516c\u544a](https://partner.steamgames.com/doc/marketing/event_tools)\u7cfb\u7edf\u4e2d\u7684\u516c\u544a\uff0c\u5728\u6e38\u620f\u6d4b\u8bd5\u53ef\u73a9\u65f6\u544a\u77e5\u73a9\u5bb6\u3002\n\n**#### \u95ee\uff1a\u5982\u679c\u6211\u5728\u6e38\u620f\u6d4b\u8bd5\u4e2d\u4f7f\u7528\u597d\u53cb\u9080\u8bf7\u7cfb\u7edf\uff0c\u73a9\u5bb6\u5c06\u5982\u4f55\u5f97\u77e5\u4ed6\u4eec\u6536\u5230\u4e86\u6765\u81ea\u597d\u53cb\u7684\u9080\u8bf7\uff1f**\n**\u7b54\uff1a** \u73a9\u5bb6\u5c06\u901a\u8fc7 Steam \u7684\u901a\u77e5\u7cfb\u7edf\u6536\u5230\u901a\u77e5\uff0c\u8be5\u901a\u77e5\u4f1a\u663e\u793a\u5728 Steam \u684c\u9762\u5ba2\u6237\u7aef\u53f3\u4e0a\u89d2\u7684\u94c3\u94db\u56fe\u6807\u4e2d\uff08\u6216\u624b\u673a\u5ba2\u6237\u7aef\u7684\u53f3\u4e0b\u89d2\uff09\u3002 \u4ed6\u4eec\u4e5f\u5c06\u5728\u57fa\u7840\u6e38\u620f\u7684\u5546\u5e97\u9875\u9762\u770b\u5230\u81ea\u5df1\u7684\u9080\u8bf7\u72b6\u6001\u3002 \u5b9e\u9645\u4f7f\u7528\u4e2d\uff0c\u6211\u4eec\u53d1\u73b0\u5927\u591a\u6570\u671f\u5f85\u4e00\u8d77\u6e38\u620f\u7684\u597d\u53cb\u4f1a\u901a\u8fc7\u5176\u4ed6\u65b9\u5f0f\u76f4\u63a5\u901a\u77e5\u5f7c\u6b64\uff08\u4f8b\u5982\u77ed\u4fe1\u6216\u793e\u4ea4\u5a92\u4f53\uff09\uff0c\u56e0\u6b64\u53d1\u9001\u9080\u8bf7\u7684\u4e00\u65b9\u901a\u5e38\u4f1a\u4e3b\u52a8\u63d0\u9192\u88ab\u9080\u8bf7\u8005\u524d\u5f80\u57fa\u7840\u6e38\u620f\u5546\u5e97\u9875\u9762\u63a5\u53d7\u9080\u8bf7\u3002\n\n**#### \u95ee\uff1a\u6211\u8be5\u5982\u4f55\u7ec8\u6b62 Steam \u6e38\u620f\u6d4b\u8bd5\uff1f**\n**\u7b54\uff1a**\u60a8\u53ef\u4ee5\u5728\u5408\u4f5c\u4f19\u4f34\u7ad9\u70b9\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u9875\u9762\u5c06\u6e38\u620f\u6d4b\u8bd5\u6807\u8bb0\u4e3a\u201c\u4e0d\u53ef\u73a9\u201d\u3002 \u8bf7\u786e\u4fdd\u8981\u5148\u7981\u7528\u5546\u5e97\u9875\u9762\u6ce8\u518c\u3002\n\n**#### \u95ee\uff1a\u6211\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u662f\u5426\u4fdd\u5bc6\uff1f**\n**\u7b54\uff1a**\u5426\u3002\u6ce8\u518c\u52a0\u5165\u6e38\u620f\u6d4b\u8bd5\u7684\u73a9\u5bb6\u5e76\u672a\u4e0e\u60a8\u8fbe\u6210\u4fdd\u5bc6\u534f\u8bae\uff0c\u56e0\u6b64\u4e0d\u5e94\u671f\u671b\u4fdd\u5bc6\u6027\u3002 \u5982\u679c\u60a8\u5e0c\u671b\u8fdb\u884c\u4fdd\u5bc6\u6d4b\u8bd5\u5e76\u8981\u6c42\u73a9\u5bb6\u540c\u610f\u4fdd\u5bc6\u534f\u8bae\uff0c\u6709\u51e0\u79cd\u4e0d\u540c\u7684\u65b9\u6cd5\uff1a\n\n- \u4f7f\u7528\u6e38\u620f\u6d4b\u8bd5 App ID\uff0c\u8bf7\u6c42\u5e8f\u5217\u53f7\uff0c\u5c06\u6e38\u620f\u6d4b\u8bd5\u8bbe\u7f6e\u4e3a\u53ef\u73a9\u5e76\u5c06\u5546\u5e97\u53ef\u89c1\u6027\u8bbe\u7f6e\u4e3a\u9690\u85cf\u3002\n\n- \u4f7f\u7528\u4e3b\u6e38\u620f\u7684 App ID \u5e76\u8bf7\u6c42\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u3002\n\n\u4ee5\u4e0a\u4e24\u79cd\u65b9\u6cd5\u90fd\u9700\u8981\u60a8\u62e5\u6709\u81ea\u5df1\u7684\u73a9\u5bb6\u767b\u8bb0\u6ce8\u518c\u65b9\u6848\u3002\n\n**#### \u95ee\uff1a\u6211\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u6709\u5546\u5e97\u9875\u9762\u5417\uff1f \u987e\u5ba2\u53ef\u4ee5\u5728 Steam \u5546\u5e97\u4e2d\u627e\u5230\u5417\uff1f**\n**\u7b54\uff1a**\u6e38\u620f\u6d4b\u8bd5\u4e0d\u4f1a\u6709\u81ea\u5df1\u7684\u5546\u5e97\u9875\u9762\uff0c\u800c\u662f\u5728\u4e3b\u6e38\u620f\u7684\u5546\u5e97\u9875\u9762\u4e0a\u4f5c\u4e3a\u4e00\u4e2a\u9009\u9879\u5217\u51fa\u3002 \u8fd9\u6837\uff0c\u4efb\u4f55\u641c\u7d22\u6d41\u91cf\u3001\u5546\u5e97\u63a8\u8350\u7b49\u7b49\u90fd\u4f1a\u5c06\u7528\u6237\u5f15\u5bfc\u81f3\u771f\u6b63\u7684\u4ea7\u54c1\uff0c\u4ee5\u4fbf\u52a0\u5165\u613f\u671b\u5355\u6216\u5173\u6ce8\u3002\n\n**#### \u95ee\uff1a\u6211\u662f\u5426\u53ef\u4ee5\u5bf9\u6e38\u620f\u6d4b\u8bd5\u8bbf\u95ee\u6743\u9650\u6536\u8d39\uff1f**\n\u7b54\uff1a\u4e0d\u53ef\u4ee5\u3002Steam \u6e38\u620f\u6d4b\u8bd5\u5c31\u662f\u4e3a\u4e86\u4f9b\u73a9\u5bb6\u514d\u8d39\u6ce8\u518c\u800c\u8bbe\u8ba1\u7684\u3002 \u6b64\u5916\uff0c\u65e2\u7136\u6e38\u620f\u6d4b\u8bd5\u968f\u65f6\u53ef\u4ee5\u505c\u7528\uff0c\u901a\u8fc7\u6e38\u620f\u5185\u4ea4\u6613\u6765\u76c8\u5229\u6216\u662f\u51fa\u552e\u8bbf\u95ee\u6743\u9650\u662f\u4e0d\u5141\u8bb8\u7684\u3002 \u5982\u679c\u60a8\u51c6\u5907\u5bf9\u81ea\u5df1\u6e38\u620f\u7684\u534a\u6210\u54c1\u7248\u672c\u6536\u8d39\uff0c\u5219\u5e94\u4f7f\u7528 Steam [\u62a2\u5148\u4f53\u9a8c](https://partner.steamgames.com/doc/store/earlyaccess)\u3002\n\n**#### \u95ee\uff1a\u5e94\u8be5\u5982\u4f55\u4e3a\u5728\u7ebf/\u591a\u4eba\u6e38\u620f\u6d4b\u8bd5\u534f\u8c03\u73a9\u5bb6\uff1f**\n**\u7b54\uff1a**\u90e8\u5206\u591a\u4eba\u6e38\u620f\u53ef\u80fd\u6700\u597d\u5728\u6709\u9650\u7684\u65f6\u95f4\u7a97\u53e3\u5185\u5f00\u653e\u670d\u52a1\u5668\uff0c\u8fd9\u5bf9\u4f7f\u7528 Steam \u6e38\u620f\u6d4b\u8bd5\u6765\u8bf4\u662f\u53ef\u884c\u7684\u3002 \u6211\u4eec\u5efa\u8bae\u4f7f\u7528 [Steam \u6d3b\u52a8\u548c\u516c\u544a](https://partner.steamgames.com/doc/marketing/event_tools)\u6765\u544a\u77e5\u73a9\u5bb6\u5b89\u6392\u597d\u7684\u66f4\u65b0\u6216\u7ecf\u8fc7\u534f\u8c03\u7684\u6e38\u620f\u6d4b\u8bd5\u3002\n\n**#### \u95ee\uff1a\u5982\u679c\u6211\u8fdb\u884c Steam \u6e38\u620f\u6d4b\u8bd5\uff0c\u5b83\u4f1a\u5f71\u54cd\u6211\u771f\u6b63\u7684\u6e38\u620f\u5417\uff1f**\n**\u7b54\uff1a**\u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5 appID \u548c\u60a8\u4e3b\u6e38\u620f\u7684 appID \u5e76\u4e0d\u4e00\u6837\u3002 \u56e0\u6b64\uff0c\u6e38\u620f\u65f6\u95f4\u3001\u613f\u671b\u5355\u3001\u8bc4\u6d4b\u3001\u9000\u6b3e\u7b49\u5185\u5bb9\u4e5f\u662f\u76f8\u4e92\u72ec\u7acb\u7684\u3002 \u4f8b\u5982\uff1a\n\n- \u987e\u5ba2\u52a0\u5165\u6216\u79bb\u5f00\u60a8\u7684\u6e38\u620f\u6d4b\u8bd5\u65f6\uff0c\u4e0e\u60a8\u6e38\u620f\u76f8\u5173\u7684\u613f\u671b\u5355\u4e0d\u4f1a\u53d7\u5230\u5f71\u54cd\u3002\n\n- \u53ea\u662f\u52a0\u5165\u6e38\u620f\u6d4b\u8bd5\u7684\u987e\u5ba2\u65e0\u6cd5\u5bf9\u60a8\u7684\u5b9e\u9645\u6e38\u620f\u8fdb\u884c\u8bc4\u6d4b\u3002\n\n- \u987e\u5ba2\u5728\u60a8\u6e38\u620f\u6d4b\u8bd5\u4e2d\u7684\u6e38\u620f\u65f6\u95f4\u4e0d\u4f1a\u5f71\u54cd Steam \u9000\u6b3e\u653f\u7b56\uff0c\u4e5f\u4e0d\u4f1a\u5f71\u54cd\u73a9\u5bb6\u8d2d\u4e70\u60a8\u7684\u4e3b\u6e38\u620f\u65f6\u83b7\u5f97\u9000\u6b3e\u7684\u6743\u9650\u3002\n\n- \u987e\u5ba2\u5728\u60a8\u6e38\u620f\u6d4b\u8bd5\u4e2d\u7684\u6e38\u620f\u65f6\u95f4\u4e0d\u4f1a\u5bf9\u83b7\u53d6\u96c6\u6362\u5f0f\u5361\u724c\u6216\u89e3\u9501\u6210\u5c31\u6709\u5f71\u54cd\u3002\n", "\u7ba1\u7406\u60a8\u7684 Steamworks \u5e10\u6237": "# \u7ba1\u7406\u60a8\u7684 Steamworks \u5e10\u6237\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/gettingstarted/managing_users\n\n## \u6982\u89c8\n\nSteamworks \u62e5\u6709\u529f\u80fd\u5f3a\u5927\u7684\u7528\u6237\u7ba1\u7406\u5de5\u5177\uff0c\u4fbf\u4e8e\u7ba1\u7406\u5458\u4e3a\u60a8\u5728 Steam \u4e0a\u7684\u5e94\u7528\u7a0b\u5e8f\u5b9a\u4e49\u8bbf\u95ee\u3001\u7f16\u8f91\u548c\u53d1\u5e03\u914d\u7f6e\u53ca\u4fe1\u606f\u7684\u6743\u9650\u3002\n\n\u5982\u679c\u60a8\u88ab\u6807\u8bb0\u4e3a\u60a8\u7684 Steamworks \u5e10\u6237\u7684\u7ba1\u7406\u5458\uff0c\u60a8\u53ef\u4ee5\u5728[\u7528\u6237\u4e0e\u6743\u9650](https://partner.steamgames.com/pub/home/)\u9875\u9762\u7ba1\u7406\u7528\u6237\u548c\u76f8\u5173\u6743\u9650\u3002 \u5982\u679c\u60a8\u4e0d\u662f\u7ba1\u7406\u5458\uff0c\u60a8\u4f1a\u5728 [Steamworks \u4e3b\u9875](https://partner.steamgames.com/home/)\u7684\u53f3\u4fa7\u770b\u5230\u60a8\u7684\u7ba1\u7406\u5458\u5217\u8868\uff0c\u60a8\u53ef\u4ee5\u8054\u7cfb\u4ed6\u4eec\uff0c\u7533\u8bf7\u76f8\u5e94\u7684\u989d\u5916\u6743\u9650\u3002\n\n## \u7ba1\u7406\u7528\u6237\n\n\u8981\u8ba9\u5176\u4ed6\u7528\u6237\u5e10\u6237\u8bbf\u95ee Steamworks \u4e2d\u60a8\u6e38\u620f\u7684\u4efb\u610f\u7ba1\u7406\u73af\u8282\uff0c\u60a8\u9700\u8981\u5148\u5728[\u6dfb\u52a0/\u7ba1\u7406\u7528\u6237](https://partner.steamgames.com/pub/users/)\u9875\u9762\u5411\u8be5\u7528\u6237\u53d1\u9001\u9080\u8bf7\uff0c\u4ee5\u6dfb\u52a0\u8be5\u7528\u6237\u3002 \u9080\u8bf7\u6d41\u7a0b\u5982\u4e0b\uff1a\n\n- \u8f93\u5165\u65b0\u7528\u6237\u7684\u7535\u5b50\u90ae\u4ef6\u5730\u5740\u3002 \u8be5\u7535\u5b50\u90ae\u4ef6\u5730\u5740\u65e0\u9700\u4e0e\u4efb\u4f55\u73b0\u6709 Steam \u5e10\u6237\u76f8\u5339\u914d\u3002\n\n- \u53d7\u9080\u4eba\u5c06\u6536\u5230\u4e00\u5c01\u7535\u5b50\u90ae\u4ef6\uff0c\u901a\u77e5\u5176\u6536\u5230\u9080\u8bf7\uff0c\u5e76\u63d0\u4f9b\u63a5\u53d7\u94fe\u63a5\u3002\n\n- \u53d7\u9080\u4eba\u63a5\u53d7\u9080\u8bf7\u540e\uff0c\u60a8\u5c06\u6536\u5230\u4e00\u5c01\u7535\u5b50\u90ae\u4ef6\uff0c\u544a\u77e5\u60a8\u5bf9\u65b9\u5df2\u63a5\u53d7\u9080\u8bf7\u3002 \u60a8\u6216\u60a8 Steamworks \u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u4e2d\u7684\u5176\u4ed6\u7ba1\u7406\u5458\u9700\u8981\u5728\u4e03\u5929\u5185\u6279\u51c6\u6216\u62d2\u7edd\u3002\n\n- \u5728\u786e\u8ba4\u540e\uff0c\u53d7\u9080\u4eba\u5c06\u6536\u5230\u6700\u540e\u4e00\u5c01\u7535\u5b50\u90ae\u4ef6\uff0c\u6b22\u8fce\u5176\u52a0\u5165 Steamworks\uff0c\u800c\u60a8\u5219\u53ef\u4ee5\u5c06\u8be5\u7528\u6237\u6dfb\u52a0\u5230\u4efb\u610f\u7ba1\u7406\u7ec4\u4e2d\uff0c\u5e76\u4e3a\u5176\u5206\u914d\u76f8\u5e94\u7684\u6e38\u620f\u7ec4\u6743\u9650\u3002\n\n\u6dfb\u52a0\u7528\u6237\u5e76\u4e3a\u5176\u5206\u914d\u7279\u5b9a\u6743\u9650\u540e\uff0c\u8be5\u7528\u6237\u5c31\u80fd\u5bf9\u5f53\u524d\u201c\u6240\u6709\u4eba\u201d\u7ec4\u4e2d\u7684\u5e94\u7528\u7a0b\u5e8f\u4f7f\u7528\u8fd9\u4e9b\u6743\u9650\u3002 \u201c\u6240\u6709\u4eba\u201d\u7ec4\u662f\u4e3a\u6bcf\u4e2a Steamworks \u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u81ea\u52a8\u521b\u5efa\u7684\u5206\u7ec4\u3002 \u82e5\u5e0c\u671b\u901a\u8fc7\u5206\u7ec4\u66f4\u7cbe\u7ec6\u5730\u7ba1\u7406\u67d0\u4e9b\u6e38\u620f\u7684\u8bbf\u95ee\u6743\u9650\uff0c\u5177\u6709\u7ba1\u7406\u5458\u6743\u9650\u7684\u7528\u6237\u53ef\u4ee5\u5c06\u7279\u5b9a\u5e94\u7528\u7a0b\u5e8f\u4ece\u201c\u6240\u6709\u4eba\u201d\u7ec4\u4e2d\u79fb\u9664\u3002\n\n## \u7528\u6237\u9080\u8bf7\u5386\u53f2\u8bb0\u5f55\n\n\u60a8\u53ef\u4ee5\u901a\u8fc7[\u201c\u7528\u6237\u9080\u8bf7\u5386\u53f2\u8bb0\u5f55\u201d\u9875\u9762](https://partner.steamgames.com/pub/userinvitehistory/)\u67e5\u770b\u81ea\u5df1 Steamworks \u5408\u4f5c\u4f19\u4f34\u4e2d\u5df2\u53d1\u9001\u3001\u5f85\u5904\u7406\u53ca\u5df2\u786e\u8ba4\u7684\u7528\u6237\u9080\u8bf7\u3002\n\n## \u7528\u6237\u5386\u53f2\u8bb0\u5f55\n\n\u60a8\u53ef\u4ee5\u901a\u8fc7[\u201c\u7528\u6237\u5386\u53f2\u8bb0\u5f55\u201d\u9875\u9762](https://partner.steamgames.com/pub/userhistory/)\u67e5\u770b Steamworks \u5408\u4f5c\u4f19\u4f34\u4e2d\u7684\u7528\u6237\u5386\u53f2\u8bb0\u5f55\u3002 \u8be5\u9875\u9762\u63d0\u4f9b\u8be6\u7ec6\u62a5\u544a\uff0c\u5305\u62ec\u7528\u6237\u6dfb\u52a0/\u79fb\u9664\u65f6\u95f4\u3001\u64cd\u4f5c\u4eba\u5458\u53ca\u5176\u6743\u9650\u7b49\u4fe1\u606f\u3002\n\n## \u7ba1\u7406\u7ec4\n\n\u5728 Steamworks \u4e2d\uff0c\u6267\u884c\u5404\u9879\u64cd\u4f5c\u7684\u6743\u9650\u662f\u901a\u8fc7\u201c\u7ec4\u201d\u6765\u7ba1\u7406\u7684\u3002 \u6bcf\u4e2a\u7ec4\u7531\u82e5\u5e72\u5e94\u7528\u7a0b\u5e8f\u548c\u7528\u6237\u6784\u6210\uff0c\u7ec4\u5185\u6bcf\u4e2a\u7528\u6237\u5bf9\u7ec4\u4e2d\u7684\u5e94\u7528\u7a0b\u5e8f\u90fd\u62e5\u6709\u7279\u5b9a\u7684\u7ba1\u7406\u6743\u9650\u3002\n\n\u6bcf\u4e2a\u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u90fd\u4f1a\u6709\u4e00\u4e2a\u201c\u6240\u6709\u4eba\u201d\u7ec4\uff0c\u5176\u4e2d\u5305\u542b\u4e0e\u8be5\u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u5173\u8054\u7684\u6240\u6709\u5e94\u7528\u7a0b\u5e8f\u3002 \u5982\u679c\u60a8\u5e0c\u671b\u67d0\u4e2a\u7528\u6237\u53ea\u80fd\u8bbf\u95ee\u90e8\u5206\u5e94\u7528\u800c\u975e\u5168\u90e8\uff0c\u53ef\u4ee5\u521b\u5efa\u4e00\u4e2a\u65b0\u7684\u7ec4\uff0c\u5e76\u5c06\u8be5\u7528\u6237\u6dfb\u52a0\u8fdb\u53bb\u3002 \u60a8\u4e3a\u8be5\u7528\u6237\u6307\u5b9a\u7684\u6743\u9650\u53ea\u9002\u7528\u4e8e\u8be5\u7ec4\u4e2d\u7684\u5e94\u7528\u7a0b\u5e8f\u3002 \u8981\u7ba1\u7406\u60a8\u7684\u7ec4\uff0c\u8bf7\u8bbf\u95ee[\u6dfb\u52a0/\u7ba1\u7406\u7ec4](https://partner.steamgames.com/pub/groups/)\u9875\u9762\u3002\n\n## \u6388\u4e88\u6743\u9650\n\n\u7ba1\u7406\u5458\u53ea\u80fd\u6388\u4e88\u81ea\u5df1\u62e5\u6709\u7684\u6743\u9650\u3002 \u4f8b\u5982\uff0c\u5982\u679c\u67d0\u4f4d\u7ba1\u7406\u5458\u5728\u201c\u6240\u6709\u4eba\u201d\u5206\u7ec4\u4e2d\u6ca1\u6709\u201c\u7ba1\u7406\u5b9a\u4ef7\u4e0e\u6298\u6263\u201d\u7684\u6743\u9650\uff0c\u90a3\u4e48\u8fd9\u4f4d\u7ba1\u7406\u5458\u4e5f\u65e0\u6cd5\u5c06\u8be5\u6743\u9650\u6388\u4e88\u4ed6\u4eba\u3002\n\n## \u5b9e\u9645\u6388\u6743\n\n\u5b9e\u9645\u6388\u6743\u662f\u4e00\u79cd\u7279\u6b8a\u7684\u7ba1\u7406\u6743\u9650\uff0c\u4e0e\u5176\u4ed6\u7c7b\u578b\u7684\u6743\u9650\u4e0d\u540c\u3002 \u62e5\u6709\u5b9e\u9645\u6388\u6743\u7684\u7528\u6237\u53ef\u4ee5\uff1a\n\n- \u67e5\u770b\u5e76\u4fee\u6539\u94f6\u884c\u8d26\u6237\u4fe1\u606f\n\n- \u67e5\u770b\u5e76\u4fee\u6539\u7a0e\u52a1\u4fe1\u606f\n\n- \u67e5\u770b\u5e76\u4fee\u6539\u8d77\u4ed8\u91d1\u989d\n\n- \u7b7e\u7f72\u6cd5\u5f8b\u534f\u8bae\n\n- \u53d1\u8d77\u5e76\u63a5\u6536\u5e94\u7528\u7a0b\u5e8f\u8f6c\u79fb\n\n\u76f8\u5e94\u5730\uff0c\u201c\u5b9e\u9645\u6388\u6743\u201d\u6743\u9650\u4e5f\u4f1a\u53d7\u5230\u9650\u5236\u3002 \u82e5\u8981\u4e3a\u4e00\u540d\u7528\u6237\u7533\u8bf7\u5b9e\u9645\u6388\u6743\uff0c\u8bf7[\u8054\u7cfb Steam \u53d1\u884c\u56e2\u961f](https://help.steampowered.com/wizard/HelpWithPublishing?issueid=918)\u3002 \u6211\u4eec\u5efa\u8bae\u60a8\u5b9a\u671f\u5ba1\u6838\u54ea\u4e9b\u7528\u6237\u62e5\u6709\u6b64\u6743\u9650\u3002\n\n## \u7528\u6237\u6743\u9650\n\nSteamworks \u4e0a\u6709\u4e24\u79cd\u7c7b\u578b\u7684\u7528\u6237\u6743\u9650\uff1a\u5408\u4f5c\u4f19\u4f34\u7ea7\u6743\u9650\u548c\u7ec4\u7ea7\u6743\u9650\u3002\n\n## \u5408\u4f5c\u4f19\u4f34\u7ea7\u6743\u9650\n\n\u5408\u4f5c\u4f19\u4f34\u7ea7\u6743\u9650\u9002\u7528\u4e8e\u6574\u4e2a Steamworks \u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u3002 \u5f53\u524d\u6240\u5305\u542b\u7684\u6743\u9650\u6709\uff1a\n\n**![icon_star.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/icon_star.png)\u7ba1\u7406\u5458** |  \u5141\u8bb8\u7528\u6237\u7ba1\u7406\u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u4e2d\u7684\u7528\u6237\u4e0e\u5176\u6743\u9650\u3002 \u53ea\u6709\u62e5\u6709\u7ba1\u7406\u5458\u6743\u9650\u7684\u7528\u6237\u624d\u80fd\u652f\u4ed8 Steam \u5e94\u7528\u8d39\u5e76\u6fc0\u6d3b\u5e94\u7528\u989d\u5ea6\u3002 \u8bf7\u53c2\u9605 [Steam \u5e94\u7528\u8d39](https://partner.steamgames.com/doc/gettingstarted/appfee)\u6587\u6863\uff0c\u4e86\u89e3\u76f8\u5173\u4fe1\u606f\u3002 |\n\n**![icon_actual_authority.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/icon_actual_authority.png)\u5b9e\u9645\u6388\u6743** |  \u6b64\u6743\u9650\u4ec5\u6388\u4e88\u8d1f\u8d23\u4ee3\u8868\u60a8\u7684\u673a\u6784\u7b7e\u7f72\u6cd5\u5f8b\u6587\u4ef6\u7684\u5e10\u6237\uff0c\u4e14\u9664 Valve \u5916\u4efb\u4f55\u4eba\u90fd\u65e0\u6cd5\u5c06\u5176\u6388\u4e88\u67d0\u4e2a\u7528\u6237\u3002 \u5177\u6709\u201c\u5b9e\u9645\u6388\u6743\u201d\u6743\u9650\u7684\u7528\u6237\u53ef\u4ee5\u586b\u5199\u5e76\u4fee\u6539\u94f6\u884c\u548c\u7a0e\u52a1\u4fe1\u606f\u3001\u4ee3\u8868\u60a8\u7684\u673a\u6784\u7b7e\u7f72\u6cd5\u5f8b\u534f\u8bae\uff0c\u5176\u4e2d\u5305\u62ec\u53d1\u8d77\u548c\u63a5\u53d7\u8f6c\u8ba9\u7684\u6743\u5229\u3002 \u5982\u679c\u60a8\u7684 Steamworks \u5e10\u6237\u4e2d\u6ca1\u6709\u4eba\u5177\u6709\u201c\u5b9e\u9645\u6388\u6743\u201d\u6743\u9650\uff0c\u6216\u60a8\u9700\u8981\u6307\u5b9a\u65b0\u7528\u6237\u5177\u6709\u201c\u5b9e\u9645\u6388\u6743\u201d\u6743\u9650\uff0c\u8bf7[\u8054\u7cfb Steam \u53d1\u884c\u56e2\u961f](https://help.steampowered.com/zh-cn/wizard/HelpWithPublishing?issueid=918)\uff0c\u8ba9\u6211\u4eec\u77e5\u6653\u3002 |\n\n**\u7ba1\u7406\u7528\u6237** | \u7528\u6237\u53ef\u4ee5\u6dfb\u52a0\u548c\u7ba1\u7406\u5176\u4ed6\u7528\u6237\u7684\u6743\u9650\u3002 \u60a8\u5fc5\u987b\u5df2\u7ecf\u5177\u6709\u6b64\u6743\u9650\uff0c\u624d\u53ef\u4ee5\u5c06\u5176\u6388\u4e88\u5176\u4ed6\u7528\u6237\u3002 |\n\n**\u67e5\u770b\u8d22\u52a1\u4fe1\u606f** | \u7528\u6237\u53ef\u4ee5\u5728\u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u4e2d\u67e5\u770b\u6240\u6709\u5e94\u7528\u7a0b\u5e8f\u7684\u8be6\u7ec6\u8d22\u52a1\u4fe1\u606f\u3002 \u6b64\u6743\u9650\u4f18\u5148\u4e8e\u201c\u67e5\u770b\u8d22\u52a1\u4fe1\u606f\u201d\u7684\u7ec4\u6743\u9650\u3002 |\n\n**\u63a5\u6536 Steamworks \u901a\u4fe1** | \u7528\u6237\u5c06\u6536\u5230\u6765\u81ea Valve \u7684\u7535\u5b50\u90ae\u4ef6\uff0c\u5185\u5bb9\u6d89\u53ca Steam \u4e0a\u5373\u5c06\u8fdb\u884c\u7684\u4fc3\u9500\u3001\u76ee\u6807\u6d3b\u52a8\u4ee5\u53ca\u65b0\u529f\u80fd\u516c\u544a\u3002 \u5373\u4f7f\u6ca1\u6709\u6b64\u6743\u9650\uff0c\u60a8\u53ef\u80fd\u4ecd\u4f1a\u6536\u5230\u5176\u4ed6\u901a\u77e5\uff0c\u4f8b\u5982\u5e8f\u5217\u53f7\u7533\u8bf7\u3001\u5546\u5e97\u9875\u9762\u548c\u751f\u6210\u7248\u672c\u5ba1\u6838\u3001\u6cd5\u5f8b\u901a\u77e5\u4ee5\u53ca Steamworks \u7ec4\u516c\u544a\u3002 \u542f\u7528\u540e\uff0c\u7528\u6237\u5c06\u9700\u8981\u786e\u8ba4\u5176\u7535\u5b50\u90ae\u4ef6\u5730\u5740\u624d\u80fd\u5f00\u59cb\u63a5\u6536\u7535\u5b50\u90ae\u4ef6\u3002 [\u70b9\u51fb\u6b64\u5904\u4ee5\u67e5\u770b\u8be6\u60c5](https://partner.steamgames.com/doc/gettingstarted/managing_users/communication) |\n\n## \u7ec4\u7ea7\u6743\u9650\n\n\u7ec4\u7ea7\u6743\u9650\u88ab\u5206\u914d\u7ed9\u6743\u9650\u7ec4\u5185\u7684\u5355\u4e2a\u7528\u6237\u3002 \u8be5\u7528\u6237\u53ef\u4ee5\u5bf9\u5176\u6240\u5728\u5206\u7ec4\u5185\u7684\u6240\u6709\u5e94\u7528\u7a0b\u5e8f\u4f7f\u7528\u8fd9\u4e9b\u6743\u9650\u3002 \u8981\u6dfb\u52a0\u5e76\u7ba1\u7406\u7528\u6237\uff0c\u8bf7\u8bbf\u95ee[\u6dfb\u52a0/\u7ba1\u7406\u7528\u6237](https://partner.steamgames.com/pub/users/)\u9875\u9762\u3002\n\n\u4e0b\u9762\u662f\u5f53\u524d\u6743\u9650\u53ca\u5176\u529f\u80fd\u5217\u8868\uff1a\n\n**\u4ec5\u53ef\u67e5\u770b** | \u6ca1\u6709\u7ba1\u7406\u5e94\u7528\u7a0b\u5e8f\u7684\u6743\u9650\uff0c\u4f46\u4f5c\u4e3a Steamworks \u5408\u4f5c\u4f19\u4f34\u7ec4\u7684\u6210\u5458\uff0c\u53ef\u4ee5\u901a\u8fc7 Developer Comp \u7a0b\u5e8f\u5305\u8bbf\u95ee\u5e94\u7528\u7a0b\u5e8f\uff0c\u5e76\u88ab\u6388\u4e88\u8be5\u7ec4\u4e2d\u4efb\u4f55\u5e94\u7528\u7a0b\u5e8f Steam \u793e\u533a\u7684\u201c\u7248\u4e3b\u201d\u6743\u9650\u3002 |\n\n**\u7f16\u8f91\u5e94\u7528\u5143\u6570\u636e** |  \u6388\u4e88\u4e0a\u4f20 depot\uff0c\u6d4b\u8bd5 Steamworks \u529f\u80fd\uff0c\u5b9a\u4e49\u7a0b\u5e8f\u5305\u3001\u6210\u5c31\u3001\u6392\u884c\u699c\uff0c\u53d1\u5e03\u96c6\u6362\u5f0f\u5361\u724c\u7b49\u6743\u9650\u3002 \u540c\u65f6\u6388\u4e88\u7ec4\u5185\u4efb\u4f55\u5e94\u7528\u7a0b\u5e8f Steam \u793e\u533a\u7684\u7ba1\u7406\u5458\u8bbf\u95ee\u6743\u9650\u548c\u8eab\u4efd\u3002 |\n\n**\u7f16\u8f91\u5e94\u7528\u7684\u8425\u9500\u6570\u636e** |  \u6388\u4e88\u7f16\u8f91\u548c\u53d1\u5e03\u5546\u5e97\u9875\u9762\u6570\u636e\uff08\u4f8b\u5982\u6e38\u620f\u63cf\u8ff0\u3001\u54c1\u724c\u56fe\u7247\u548c\u89c6\u9891\uff09\u7684\u6743\u9650\uff0c \u8fd8\u5305\u62ec\u5bf9\u8425\u9500\u5de5\u5177\uff08\u5982\u66dd\u5149\u8f6e\u6b21\uff09\u7684\u8bbf\u95ee\u6743\u9650\u3002 |\n\n**\u7f16\u8f91\u5546\u5e97\u672c\u5730\u5316\u6570\u636e** |  \u6388\u4e88\u5728\u5305\u542b\u4e00\u4e2a\u6216\u591a\u4e2a\u53ef\u672c\u5730\u5316\u5b57\u6bb5\u7684\u5546\u5e97\u8bbe\u7f6e\u9009\u9879\u5361\uff08\u5982\u4ea7\u54c1\u63cf\u8ff0\u548c\u56fe\u50cf\u8d44\u4ea7\uff09\u4e2d\u4fee\u6539\u4efb\u4f55\u6570\u636e\u7684\u6743\u9650\u3002 \u4e0d\u6388\u4e88\u53d1\u5e03\u7684\u6743\u9650\u6216\u8bbf\u95ee\u66dd\u5149\u8f6e\u6b21\u7b49\u8425\u9500\u5de5\u5177\u7684\u6743\u9650\u3002 **\u6ce8\u610f\uff1a\u8fd9\u662f\u201c\u7f16\u8f91\u5e94\u7528\u7684\u8425\u9500\u6570\u636e\u201d\u529f\u80fd\u7684\u4e00\u4e2a\u5b50\u96c6\u3002** |\n\n**\u67e5\u770b\u5e02\u573a\u8425\u9500\u6d41\u91cf\u6570\u636e** |  \u6388\u4e88\u5728\u5e94\u7528\u767b\u9646\u9875\u7684\u201c\u8425\u9500\u4e0e\u66dd\u5149\u201d\u680f\u76ee\u4e2d\u67e5\u770b\u6d41\u91cf\u6570\u636e\u7684\u6743\u9650\u3002 \u53ef\u4ee5\u5728\u8be5\u680f\u76ee\u4e2d\u67e5\u770b\u5185\u90e8 Steam \u5546\u5e97\u6d41\u91cf\u6570\u636e\u3001\u5916\u90e8\u5546\u5e97\u6d41\u91cf\u6570\u636e\u3001\u53d1\u884c\u53ca\u66f4\u65b0\u66dd\u5149\u8f6e\u6b21\u6570\u636e\u548c UTM \u5206\u6790\u6570\u636e\u3002 \u8fd9\u4e9b\u680f\u76ee\u7684\u67d0\u4e9b\u6570\u636e\u8fd8\u53ef\u4ee5\u4e0b\u8f7d\u4e3a csv \u6587\u4ef6\u3002 |\n\n**\u5728 Steam \u4e0a\u53d1\u5e03\u5e94\u7528\u66f4\u6539** |  \u83b7\u5f97\u6388\u6743\u540e\uff0c\u60a8\u53ef\u4ee5\u53d1\u5e03\u5728 Steamworks \u5f00\u53d1\u8005\u7ad9\u70b9\u7684\u201c\u6280\u672f\u5de5\u5177\u201d>\u201c\u7f16\u8f91 Steamworks \u8bbe\u7f6e\u201d\u680f\u76ee\u4e2d\u4e3a\u6e38\u620f\u6240\u505a\u7684\u66f4\u6539\u3002 |\n\n**\u67e5\u770b\u9519\u8bef\u6570\u636e** |  \u6388\u4e88\u67e5\u770b\u60a8\u4ea7\u54c1\u9519\u8bef\u62a5\u544a\u7684\u6743\u9650\uff08\u524d\u63d0\u662f\u4ea7\u54c1\u5df2\u7ecf\u4e0e Steamworks \u7684\u9519\u8bef\u62a5\u544a\u7cfb\u7edf\u6574\u5408\uff09\u3002 |\n\n**\u751f\u6210\u5e8f\u5217\u53f7** |  \u53ef\u4ee5\u4e3a\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u7533\u8bf7\u6279\u91cf\u5e8f\u5217\u53f7\u6216\u4e0a\u4f20\u7b2c\u4e09\u65b9\u5e8f\u5217\u53f7\u3002 [\u5728\u6b64\u5904\u4e86\u89e3\u4ea7\u54c1\u5e8f\u5217\u53f7\u7684\u66f4\u591a\u76f8\u5173\u4fe1\u606f\u3002](https://partner.steamgames.com/doc/features/keys) |\n\n**\u67e5\u770b\u8d22\u52a1\u4fe1\u606f** |  \u53ef\u4ee5\u67e5\u770b\u60a8\u5e94\u7528\u7a0b\u5e8f\u548c\u7a0b\u5e8f\u5305\u7684\u9500\u552e\u4e0e\u4e0b\u8f7d\u6570\u636e\u3002 |\n\n**\u7ba1\u7406\u7b7e\u540d** |  \u53ef\u4ee5\u4e3a\u60a8\u7684\u4ea7\u54c1\u7ba1\u7406\u6570\u5b57\u7b7e\u540d\u3002 \u8fd9\u5c06\u5141\u8bb8\u7528\u6237\u7ba1\u7406\u5e94\u7528\u7a0b\u5e8f\u7684[\u53cd\u4f5c\u5f0a](https://partner.steamgames.com/doc/features/anticheat)\u4e0e [SDK \u9a8c\u8bc1](https://partner.steamgames.com/doc/features/auth#encryptedapptickets)\u8bbe\u7f6e\u3002 |\n\n**\u7ecf\u6d4e\u4f53/\u521b\u610f\u5de5\u574a\u5ba2\u670d** |  \u5141\u8bb8\u7528\u6237\u5728\u5408\u4f5c\u4f19\u4f34\u7ad9\u70b9\u7ecf\u6d4e\u4f53\u5ba2\u670d\u5de5\u5177\u4e2d\u67e5\u770b/\u6388\u4e88\u7ecf\u6d4e\u4f53\u7269\u54c1\u3002 |\n\n**\u7ecf\u6d4e\u4f53/\u521b\u610f\u5de5\u574a\u4e3b\u7ba1** |  \u5f53\u524d\u5177\u6709\u4e0e\u4e0a\u8ff0\u201c\u5ba2\u670d\u201d\u540c\u6837\u7684\u529f\u80fd\u3002 |\n\n**\u7ba1\u7406\u5b9a\u4ef7\u4e0e\u6298\u6263** |  \u5141\u8bb8\u7528\u6237\u63d0\u51fa\u5b9a\u4ef7\u53d8\u66f4\u5efa\u8bae\u5e76\u9009\u62e9\u52a0\u5165\u6298\u6263\u4e0e\u4fc3\u9500\u6d3b\u52a8\u3002 \u53c2\u89c1[\u5b9a\u4ef7](https://partner.steamgames.com/doc/store/pricing)\u6587\u6863\uff0c\u4e86\u89e3\u66f4\u591a\u4fe1\u606f\u3002 **\u6ce8\u610f**\uff1a\u5fc5\u987b\u6709\u6b64\u6743\u9650\u624d\u80fd\u5b8c\u6210\u53d1\u884c\u6d41\u7a0b\uff0c\u624d\u80fd\u53d1\u5e03\u5373\u5c06\u63a8\u51fa\u9875\u9762\u6216\u53d1\u884c\u4ea7\u54c1\u3002 |\n\n**\u5b9e\u51b5\u76f4\u64ad** |  \u5141\u8bb8\u7528\u6237\u4e3a\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u8fdb\u884c\u5b98\u65b9\u5b9e\u51b5\u76f4\u64ad\u3002 |\n"}</script><script>/**

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      if (node.parentElement.closest("button,a,script,style")) continue;
      const value = node.textContent;
      pattern.lastIndex = 0;
      if (!pattern.test(value)) continue;
      pattern.lastIndex = 0;
      const fragment = document.createDocumentFragment();
      let last = 0;
      for (const match of value.matchAll(pattern)) {
        fragment.append(document.createTextNode(value.slice(last, match.index)));
        const button = document.createElement("button");
        button.type = "button";
        button.className = "term";
        button.dataset.term = match[0];
        button.title = "查看名词解释";
        button.textContent = match[0];
        fragment.append(button);
        last = match.index + match[0].length;
      }
      fragment.append(document.createTextNode(value.slice(last)));
      node.replaceWith(fragment);
    }
  }

  for (const section of host.querySelectorAll(".flow")) {
    const note = document.createElement("div");
    note.className = "audit-note";
    const label = document.createElement("strong");
    label.textContent = "Steam 对齐提示：";
    note.append(label, document.createTextNode(audit[section.id] || ""));
    section.insertBefore(note, section.querySelector(".lane-head"));
    underlineTerms(section);
  }

  function renderMarkdown(markdown) {
    const parsed = new DOMParser().parseFromString(marked.parse(markdown), "text/html");
    const allowed = new Set(["H1","H2","H3","H4","H5","H6","P","UL","OL","LI","STRONG","EM","CODE","PRE","BLOCKQUOTE","TABLE","THEAD","TBODY","TR","TH","TD","A","IMG","HR","BR","DEL"]);
    function clean(parent) {
      for (const child of [...parent.children]) {
        if (!allowed.has(child.tagName)) {
          child.replaceWith(document.createTextNode(child.textContent || ""));
          continue;
        }
        for (const attr of [...child.attributes]) {
          const safeLink = attr.name === "href" && child.tagName === "A" && /^https?:/i.test(attr.value);
          const safeImage = attr.name === "src" && child.tagName === "IMG" && /^https?:/i.test(attr.value);
          if (!safeLink && !safeImage) child.removeAttribute(attr.name);
        }
        if (child.tagName === "A") {
          child.target = "_blank";
          child.rel = "noopener noreferrer";
        }
        clean(child);
      }
    }
    clean(parsed.body);
    return parsed.body.innerHTML;
  }

  function open(name, markdown) {
    title.textContent = name;
    body.innerHTML = renderMarkdown(markdown);
    dialog.showModal();
    body.scrollTop = 0;
  }
  host.addEventListener("click", event => {
    const target = event.target.closest("[data-term],.sources a");
    if (!target) return;
    if (target.dataset.term) {
      const term = target.dataset.term;
      const [chinese, example, source] = termDetails[term] || [term, "以页面中的具体操作为例。", "本原型术语说明"];
      const link = /^https?:\/\//.test(source) ? "[" + source + "](" + source + ")" : source;
      open("名词解释 · " + chinese + "（" + term + "）", "## 含义\n\n" + glossary[term] + "\n\n## 示例\n\n" + example + "\n\n## 来源\n\n" + link);
    } else {
      event.preventDefault();
      const name = target.textContent.trim();
      open(name, docs[name] || "未找到本地文档。");
    }
  });
  document.getElementById("closeInfo").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", event => {
    if (event.target === dialog) dialog.close();
  });
})();
</script></body></html>
