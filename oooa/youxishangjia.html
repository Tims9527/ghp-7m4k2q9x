fa\u547d\u4ee4\u8bed\u6cd5\u3002\nSteam>find build_installer ConVars: Commands: build_installer : <project file> <target folder> <beta key> <beta pwd>\n", "\u7a0b\u5e8f\u5305": "# \u7a0b\u5e8f\u5305\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/store/application/packages\n\n## \u6982\u89c8\n\n\u7a0b\u5e8f\u5305\u662f\u4e00\u4e2a\u6216\u591a\u4e2a\u5e94\u7528\u7a0b\u5e8f\u548c Depot \u7684\u96c6\u5408\uff0c\u53ef\u901a\u8fc7 Steam \u9500\u552e\uff0c\u4e5f\u53ef\u901a\u8fc7\u6fc0\u6d3b Steam \u5e8f\u5217\u53f7\u7684\u65b9\u5f0f\u6388\u4e88\u7528\u6237\u3002 \u5b83\u53ef\u89c6\u4e3a\u4e00\u9879 SKU \u6216\u8bb8\u53ef\u3002\n\n\u7528\u6237\u8d2d\u4e70\u6216\u6fc0\u6d3b\u7a0b\u5e8f\u5305\u540e\uff0c\u8be5\u7a0b\u5e8f\u5305\u7684\u5185\u5bb9\u51b3\u5b9a\u7528\u6237\u62e5\u6709\u54ea\u4e9b\u5e94\u7528\u7a0b\u5e8f\u6216 depot \u5185\u5bb9\u7684\u4e0b\u8f7d\u548c\u542f\u52a8\u6743\u9650\u3002\n\n## \u7a0b\u5e8f\u5305\u7c7b\u578b\n\nSteamworks \u7cfb\u7edf\u4e2d\u521b\u5efa\u7684\u4efb\u4f55\u65b0\u5e94\u7528\u7a0b\u5e8f\u9ed8\u8ba4\u90fd\u4f1a\u88ab\u7eb3\u5165\u4e00\u4e2a\u65b0\u7a0b\u5e8f\u5305\u4e2d\u3002\u901a\u8fc7\u8fd9\u4e00\u7a0b\u5e8f\u5305\uff0c\u8be5\u5e94\u7528\u7a0b\u5e8f\u5c31\u53ef\u4ee5\u5728 Steam \u4e0a\u9500\u552e\uff0c\u8fd8\u53ef\u4ee5\u751f\u6210\u76f8\u5e94\u7684\u5e8f\u5217\u53f7\u3002\n\n- **\u5546\u5e97 + \u5e8f\u5217\u53f7\u7a0b\u5e8f\u5305\uff08\u9ed8\u8ba4\uff09**\uff1aSteamworks \u7cfb\u7edf\u4e2d\u7684\u6240\u6709\u65b0\u5e94\u7528\u7a0b\u5e8f\u90fd\u9ed8\u8ba4\u4f7f\u7528\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u3002 \u8fd9\u6837\uff0c\u60a8\u53ef\u4ee5\u5728 Steam \u5546\u5e97\u5185\u51fa\u552e\u60a8\u7684\u5e94\u7528\uff0c\u5e76\u4e14\u80fd\u6309\u9700\u8981\u751f\u6210\u89e3\u9501\u76f8\u540c\u5185\u5bb9\u7684\u5e8f\u5217\u53f7\u3002\n\n- **\u5546\u5e97\u7a0b\u5e8f\u5305**\uff1a\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u4ec5\u80fd\u5728 Steam \u5546\u5e97\u4e2d\u9500\u552e\u3002\n\n- **\u5e8f\u5217\u53f7\u7a0b\u5e8f\u5305**\uff1a\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u53ea\u80fd\u751f\u6210\u5e8f\u5217\u53f7\u3002\n\n- **\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u201c\u6d4b\u8bd5\u7248\u201d\u7a0b\u5e8f\u5305**\uff1a\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u4f34\u968f\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u81ea\u52a8\u521b\u5efa\u3002 \u5148\u51b3\u66ff\u4ee3\u7a0b\u5e8f\u5305\u7684\u5185\u5bb9\u7279\u522b\u6807\u8bb0\u4e3a\u5ffd\u7565\u5e94\u7528\u7a0b\u5e8f\u7684\u5f53\u524d\u53d1\u5e03\u72b6\u6001\uff0c\u5e76\u4f7f\u6e38\u620f\u53ef\u7acb\u5373\u8fd0\u884c\u3002 \u5bf9\u4e8e\u6d4b\u8bd5\u4eba\u5458\u3001\u5a92\u4f53\u6216\u5176\u4ed6\u9700\u8981\u5728\u6e38\u620f\u6b63\u5f0f\u516c\u5f00\u53d1\u5e03\u4e4b\u524d\u8fd0\u884c\u6e38\u620f\u7684\u7fa4\u4f53\u6765\u8bf4\uff0c\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u975e\u5e38\u6709\u7528\u3002\n\n- **Developer Comp**\uff1a\u8fd9\u7c7b\u7a0b\u5e8f\u5305\u4e0e\u201c\u6d4b\u8bd5\u7248\u201d\u7a0b\u5e8f\u5305\u7c7b\u4f3c\uff0c\u4f46\u662f\u4ec5\u4f9b\u5f00\u53d1\u8005\u5e10\u6237\u4f7f\u7528\u3002 \u60a8\u4e0d\u5e94\u516c\u5f00\u5206\u53d1 Developer Comp \u5e8f\u5217\u53f7\u3002 \u6b64\u7c7b\u7a0b\u5e8f\u5305\u81ea\u52a8\u6388\u4e88\u60a8\u7684 Steamworks \u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u4e2d\u201c\u6240\u6709\u4eba\u201d\u7ec4\u5185\u7684\u5e10\u6237\uff0c\u4e14\u7c7b\u4f3c\u4e8e\u201c\u6d4b\u8bd5\u7248\u201d\u7a0b\u5e8f\u5305\uff0c\u4e0d\u53d7\u53d1\u884c\u72b6\u6001\u7684\u5f71\u54cd\uff0c\u5176\u5185\u5bb9\u53ef\u7acb\u5373\u8fd0\u884c\u3002 Developer Comp \u4e5f\u53ef\u4f9b\u4e0d\u5c5e\u4e8e\u60a8 Steamworks \u5408\u4f5c\u4f19\u4f34\u7ec4\u7684\u5e10\u6237\u8fdb\u884c\u6d4b\u8bd5\uff0c\u6216\u7528\u4e8e\u6d4b\u8bd5\u5df2\u53d1\u884c\u4ea7\u54c1\u7684\u65b0 depot \u5185\u5bb9\u3002\n\n**\u6ce8\u610f\uff1a**\u65e0\u6cd5\u521b\u5efa\u63d0\u4f9b\u5355\u4e2a\u5e94\u7528\u7a0b\u5e8f\u7684\u591a\u4e2a\u526f\u672c\u7684\u7a0b\u5e8f\u5305\uff08\u5982\u201c4 \u4efd\u88c5\u201d\uff09\u3002 \u867d\u7136 Steam \u4e0a\u6709\u8fd9\u65b9\u9762\u7684\u9057\u7559\u6848\u4f8b\uff0c\u4f46\u6211\u4eec\u5df2\u4e0d\u518d\u521b\u5efa\u8fd9\u6837\u7684\u7a0b\u5e8f\u5305\u3002\n\u53c2\u89c1 [Steam \u5e8f\u5217\u53f7](https://partner.steamgames.com/doc/features/keys)\uff0c\u8fdb\u4e00\u6b65\u4e86\u89e3\u5982\u4f55\u7533\u8bf7\u5e8f\u5217\u53f7\u3002\n\n## \u7f16\u8f91\u7a0b\u5e8f\u5305\n\n\u6709\u6743\u4e3a\u7a0b\u5e8f\u5305\u4e2d\u6bcf\u4e2a\u5e94\u7528\u7f16\u8f91 Steamworks \u5143\u6570\u636e\u7684\u7528\u6237\u53ef\u4ee5\u8bbf\u95ee\u5e76\u7f16\u8f91\u7a0b\u5e8f\u5305\u3002 \u5728 Steamworks \u5408\u4f5c\u4f19\u4f34\u5e10\u6237\u4e2d\u664b\u5347\u4e3a\u201c\u7ba1\u7406\u5458\u201d\u8eab\u4efd\u7684\u7528\u6237\u4e5f\u5c06\u62e5\u6709\u7f16\u8f91\u8fd9\u4e9b\u7a0b\u5e8f\u5305\u7684\u6743\u9650\u3002\n\n## \u7f16\u8f91\u65b9\u6cd5\n\n- \u5728\u60a8\u7684 [Steamworks \u4e3b\u9875](https://partner.steamgames.com/)\u4e0a\uff0c\u6216[\u6240\u6709\u5e94\u7528\u7a0b\u5e8f](https://partner.steamgames.com/apps/)\u5217\u8868\u4e2d\u9009\u62e9\u4e00\u4e2a\u5e94\u7528\u7a0b\u5e8f\uff0c\u53ef\u8f6c\u81f3\u8be5\u5e94\u7528\u7a0b\u5e8f\u7684\u767b\u9646\u9875\u3002\n\n- \u5728\u8be5\u5e94\u7528\u7a0b\u5e8f\u7684\u767b\u9646\u9875\u4e0a\uff0c\u5355\u51fb\u201c\u6240\u6709\u5173\u8054\u7a0b\u5e8f\u5305\u3001DLC\u3001\u8bd5\u7528\u7248\u53ca\u5de5\u5177\u201d\u4e00\u9879\u3002\n\n- \u73b0\u5728\u60a8\u4f1a\u8fdb\u5165\u4e00\u4e2a\u9875\u9762\uff0c\u5728\u5176\u4e2d\u53ef\u4ee5\u770b\u5230\u6240\u6709\u5305\u542b\u60a8\u5e94\u7528\u7a0b\u5e8f\u7684\u7a0b\u5e8f\u5305\u3002\n\n- \u7136\u540e\uff0c\u70b9\u51fb\uff08\u201c\u5546\u5e97\u7a0b\u5e8f\u5305\u201d\u680f\u548c\u201c\u4fc3\u9500\u6216\u7279\u6b8a\u7528\u9014\u7a0b\u5e8f\u5305\u201d\u4e2d\u7684\uff09\u5404\u7a0b\u5e8f\u5305\uff0c\u8f6c\u81f3\u5404\u7a0b\u5e8f\u5305\u7684\u767b\u9646\u9875\u3002\n\n- \u5728\u8be5\u767b\u9646\u9875\u4e0a\uff0c\u60a8\u5c06\u4f1a\u770b\u5230\u4e00\u4e2a\u53eb\u505a\u201c\u5df2\u5305\u542b\u5e94\u7528\u201d\u7684\u680f\u76ee\u3002 \u60a8\u53ef\u4ee5\u70b9\u51fb\u201c\u6dfb\u52a0\u5e94\u7528\u7a0b\u5e8f\u201d\uff0c\u7136\u540e\u9009\u62e9\u8981\u6dfb\u52a0\u7684\u4e00\u4e2a\u6216\u591a\u4e2a\u5e94\u7528\u7a0b\u5e8f\u3002\n\n- \u4e4b\u540e\u4f1a\u7acb\u5373\u51fa\u73b0\u53e6\u4e00\u4e2a\u5bf9\u8bdd\u6846\uff0c\u8981\u6c42\u786e\u8ba4\u6dfb\u52a0\u5173\u8054\u7684 depot\u3002\n\n- \u60a8\u4ea6\u53ef\u968f\u65f6\u5728\u6b64\u767b\u9646\u9875\u66f4\u6539\u7a0b\u5e8f\u5305\u7684\u540d\u79f0\u3002\n\n## \u7f16\u8f91\u672a\u53d1\u884c\u7684\u7a0b\u5e8f\u5305\n\n\u5bf9\u4e8e\u5c1a\u672a\u53d1\u884c\u7684\u7a0b\u5e8f\u5305\uff0c\u5177\u6709\u4e0a\u8ff0\u6743\u9650\u7684\u7528\u6237\u80fd\u591f\u5728\u8be5\u7a0b\u5e8f\u5305\u4e2d\u6dfb\u52a0\u6216\u5220\u9664\u5e94\u7528\u7a0b\u5e8f\u548c depot\u3002 \u5f53\u7528\u6237\u6700\u7ec8\u8d2d\u4e70\u6216\u6fc0\u6d3b\u5e8f\u5217\u53f7\u4ee5\u89e3\u9501\u8be5\u7a0b\u5e8f\u5305\u65f6\uff0c\u6b64\u64cd\u4f5c\u5c06\u4f1a\u5f71\u54cd\u5230\u7528\u6237\u88ab\u6388\u4e88\u54ea\u4e9b\u4ea7\u54c1\uff0c\u56e0\u6b64\u8bf7\u8c28\u614e\u64cd\u4f5c\u3002 \u7531\u4e8e\u5bf9\u7a0b\u5e8f\u5305\u8bbf\u95ee\u6743\u9650\u7684\u63a7\u5236\u662f\u4ee5\u7a0b\u5e8f\u5305\u7684\u5185\u5bb9\u4e3a\u57fa\u7840\u7684\uff0c\u56e0\u6b64\u7a0b\u5e8f\u5305\u4e2d\u7684\u6700\u540e\u4e00\u4e2a\u5e94\u7528\u7a0b\u5e8f\u4e0d\u53ef\u5220\u9664\u3002**\u6ce8\u610f\uff1a**\u5982\u679c\u60a8\u4ece\u7a0b\u5e8f\u5305\u4e2d\u79fb\u9664\u4e00\u4e2a App ID\uff0c\u4f46\u672a\u79fb\u9664\u6240\u6709\u4e0e\u8be5 App ID \u5173\u8054\u7684 depot\uff0c\u5219 depot ID \u5c06\u5217\u4e3a\u201c\u672a\u77e5 Depot\u201d\u3002 \u5728\u7a0b\u5e8f\u5305\u4e2d\u7559\u4e0b\u201c\u672a\u77e5 Depot\u201d\u53ef\u80fd\u5bfc\u81f4\u7a0b\u5e8f\u5305\u4e0d\u5339\u914d\uff0c\u6216\u6388\u4e88\u60a8\u53ef\u80fd\u65e0\u610f\u6388\u4e88\u7684\u5185\u5bb9\u3002\n\n## \u7f16\u8f91\u5df2\u53d1\u884c\u7684\u7a0b\u5e8f\u5305\n\n\u5bf9\u4e8e\u5df2\u7ecf\u53d1\u884c\u7684\u7a0b\u5e8f\u5305\uff08\u5df2\u4e0a\u67b6\u9500\u552e\u6216\u8005\u5df2\u751f\u6210\u5e8f\u5217\u53f7\uff09\uff0c\u60a8\u5c06\u65e0\u6cd5\u5220\u9664\u5176\u5e94\u7528\u7a0b\u5e8f\u3002 \u4f46\u662f\uff0c\u62e5\u6709\u4e0a\u8ff0\u6743\u9650\u7684\u7528\u6237\u53ef\u5728\u4efb\u4f55\u65f6\u5019\u968f\u610f\u6dfb\u52a0\u6216\u5220\u9664 depot\uff0c\u4e5f\u53ef\u6dfb\u52a0\u5e94\u7528\u7a0b\u5e8f\u3002\u8fd9\u6837\uff0c\u60a8\u5e94\u80fd\u968f\u65f6\u4e3a\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u6dfb\u52a0\u989d\u5916\u8bed\u8a00\u3001\u5e73\u53f0\u6216\u6a21\u7ec4\u5de5\u5177\u3002 \u8bf7\u6ce8\u610f\uff0c\u4efb\u4f55\u6dfb\u52a0\u5230\u6709\u6548\u7a0b\u5e8f\u5305\u7684 depot \u90fd\u4f1a\u88ab\u7acb\u5373\u6388\u4e88\u62e5\u6709\u8be5\u7a0b\u5e8f\u5305\u7684\u6240\u6709\u7528\u6237\u3002 \u540c\u7406\uff0c\u5982\u679c\u4e00\u4e9b depot \u662f\u8fd0\u884c\u7a0b\u5e8f\u5305\u5185\u4ea7\u54c1\u6240\u5fc5\u9700\u7684\uff0c\u90a3\u4e48\u79fb\u9664\u8fd9\u4e9b depot \u53ef\u80fd\u4f1a\u635f\u574f\u5e94\u7528\u7a0b\u5e8f\u3002\n\n## \u8d60\u9001\u7a0b\u5e8f\u5305\n\nSteam \u5141\u8bb8\u60a8\u5728\u5168\u7403\u8303\u56f4\u5185\u4ee5\u4e0d\u540c\u5e01\u79cd\u548c\u4ef7\u683c\u70b9\u6765\u9500\u552e\u4ea7\u54c1\u3002 \u4e3a\u4e86\u5411\u987e\u5ba2\u4eec\u63d0\u4f9b\u6700\u5408\u7406\u7684\u4ef7\u683c\uff0c\u6211\u4eec\u7684\u5efa\u8bae\u5b9a\u4ef7\u5728\u5404\u5730\u533a\u4e4b\u95f4\u5b58\u5728\u7ec6\u5fae\u5dee\u5f02\u3002 \u56e0\u6b64\uff0c\u6211\u4eec\u4e0d\u5141\u8bb8\u4ece\u4f4e\u4ef7\u5730\u533a\uff08\u4f8b\u5982\u4e1c\u5357\u4e9a\uff09\u5411\u9ad8\u4ef7\u5730\u533a\uff08\u4f8b\u5982\u5317\u7f8e\uff09\u8d60\u9001\u793c\u7269\u3002\n", "\u5b9a\u4ef7": "# \u5b9a\u4ef7\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/store/pricing\n\n![](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/Pricing.gif)\n\n##### \u7b80\u8ff0\n\nSteam \u6240\u652f\u6301\u7684\u5b9a\u4ef7\u5e01\u79cd\u6709 37 \u4e2a\uff0c\u65e2\u786e\u4fdd\u73a9\u5bb6\u6e05\u695a\u81ea\u5df1\u652f\u4ed8\u7684\u91d1\u989d\uff0c\u4e5f\u652f\u6301\u6570\u767e\u79cd\u672c\u5730\u652f\u4ed8\u65b9\u5f0f\u3002\n\n##### \u96c6\u6210\u7a0b\u5ea6\n\nSteam \u4e0a\u7684\u5408\u4f5c\u4f19\u4f34\u8d1f\u8d23\u9009\u62e9\u548c\u7ba1\u7406\u5176\u4ea7\u54c1\u7684\u5b9a\u4ef7\uff0c\u800c Steam \u5219\u63d0\u4f9b\u5e2e\u52a9\u7ba1\u7406\u7684\u5de5\u5177\u3002\n\n## \u6982\u89c8\n\nSteam \u5408\u4f5c\u4f19\u4f34\u8d1f\u8d23\u4e3a\u81ea\u5df1\u7684\u4ea7\u54c1\u8bbe\u7f6e\u5e76\u7ba1\u7406\u5b9a\u4ef7\u3002 Steamworks \u5f00\u53d1\u8005\u7f51\u7ad9\u63d0\u4f9b\u4e86\u5728 Steam \u652f\u6301\u7684\u6240\u6709\u5e01\u79cd\u4e0b\u914d\u7f6e\u5b9a\u4ef7\u4e0e\u6298\u6263\u7684\u5de5\u5177\u3002 \u521d\u59cb\u5b9a\u4ef7\u4ee5\u53ca\u63d0\u8bae\u7684\u5b9a\u4ef7\u8c03\u6574\u9700\u8981\u7531 Valve \u5ba1\u6838\uff0c\u4e14\u901a\u5e38\u5728\u4e00\u81f3\u4e8c\u4e2a\u5de5\u4f5c\u65e5\u5185\u5f97\u5230\u5904\u7406\u3002 \u5728\u5ba1\u6838\u8fc7\u7a0b\u4e2d\uff0c\u6211\u4eec\u5c06\u68c0\u67e5\u60a8\u7684\u4ef7\u683c\u662f\u5426\u8f93\u9519\uff0c\u4f46\u662f\u6211\u4eec\u4e0d\u4fdd\u8bc1\u80fd\u591f\u53d1\u73b0\u6240\u6709\u9519\u8bef\uff0c\u56e0\u6b64\uff0c\u8bf7\u5728\u63d0\u4ea4\u4e4b\u524d\u4ed4\u7ec6\u68c0\u67e5\u60a8\u7684\u4ef7\u683c\u3002\n\n## \u5b9a\u4ef7\u7c7b\u578b\n\nSteam \u652f\u6301\u6e38\u620f\u7528\u6765\u4e3a\u5185\u5bb9\u5b9a\u4ef7\u7684\u591a\u79cd\u5546\u4e1a\u6a21\u5f0f\uff0c\u4e0d\u7ba1\u662f\u5355\u6b21\u8d2d\u4e70\u5b8c\u6574\u6e38\u620f\u3001DLC\u3001\u6e38\u620f\u5185\u5c0f\u989d\u4ea4\u6613\uff0c\u8fd8\u662f\u5468\u671f\u8ba2\u9605\u3002 \u672c\u6587\u4e3b\u8981\u5173\u6ce8\u7a0b\u5e8f\u5305\u5b9a\u4ef7\uff0c\u4e5f\u5373\u5728\u6e38\u620f\u7684 Steam \u5546\u5e97\u9875\u9762\u5411\u987e\u5ba2\u663e\u793a\u7684\u8d2d\u4e70\u9009\u9879\u3002\n\n\u5176\u4ed6\u5b9a\u4ef7\u5305\u62ec\u6e38\u620f\u5185\u5c0f\u989d\u4ea4\u6613\u548c\u5468\u671f\u8ba2\u9605\u3002 \u66f4\u591a\u5173\u4e8e\u5b9e\u73b0\u8fd9\u4e9b\u5b9a\u4ef7\u7c7b\u578b\u7684\u4fe1\u606f\u53ef\u5728\u6b64\u5904\u627e\u5230\uff1a\n\n- [\u5c0f\u989d\u4ea4\u6613](https://partner.steamgames.com/doc/features/microtransactions)\u7684\u6700\u4f73\u5b9e\u8df5\n\n- [\u5c0f\u989d\u4ea4\u6613\u5b9e\u73b0\u6307\u5357](https://partner.steamgames.com/doc/features/microtransactions/implementation)\n\n- [\u5468\u671f\u8ba2\u9605](https://partner.steamgames.com/doc/store/pricing/subscriptions)\n\n## \u7f16\u8f91\u5b9a\u4ef7\u6240\u9700\u6743\u9650\n\n\u53ea\u6709\u7279\u5b9a\u7684\u53d1\u884c\u5546\u5e10\u6237\u624d\u5177\u5907\u5728 Steam \u4e0a\u4e3a\u60a8\u7684\u4ea7\u54c1\u8f93\u5165\u6216\u8c03\u6574\u5b9a\u4ef7\uff0c\u6216\u914d\u7f6e\u6298\u6263\u6240\u9700\u7684\u6743\u9650\u3002 \u5bf9\u4e8e\u65b0\u7684 Steamworks \u5408\u4f5c\u4f19\u4f34\u800c\u8a00\uff0c\u9ed8\u8ba4\u5e10\u6237\u662f\u5b8c\u6210\u300aSteam \u5206\u9500\u534f\u8bae\u300b\u6570\u5b57\u6587\u4e66\u7684 Steam \u5e10\u6237\u3002 \u4e0d\u8fc7\uff0c\u60a8\u673a\u6784\u4e2d\u76f8\u5e94\u7684\u8d1f\u8d23\u4eba\u5458\u53ef\u80fd\u6709\u6240\u4e0d\u540c\u3002\n\n\u5982\u679c\u60a8\u6ca1\u6709\u4e0b\u9762\u8be6\u8ff0\u7684\u5fc5\u8981\u6743\u9650\uff0c\u4e5f\u8bb8\u6700\u597d\u7684\u529e\u6cd5\u662f\u8054\u7cfb\u60a8\u7684 Steamworks \u7ba1\u7406\u5458\u3002\u4ed6\u4eec\u662f\u60a8\u7684\u673a\u6784\u4e2d\u6709\u8d44\u683c\u7ed9\u4e88\u6743\u9650\u7684\u4eba\u3002 \u60a8\u7684 Steamworks \u4e3b\u9875\u53f3\u680f\u4e2d\u5217\u51fa\u4e86\u60a8\u7684 Steamworks \u7ba1\u7406\u5458\u540d\u5355\uff08\u9664\u975e\u60a8\u81ea\u5df1\u662f\u7ba1\u7406\u5458\uff09\u3002\n\n\u4e3a\u4e86\u8bbe\u7f6e\u6216\u8c03\u6574\u4ea7\u54c1\u5b9a\u4ef7\uff0c\u4e00\u4e2a\u7279\u5b9a\u5e10\u6237\u9700\u8981\u4ee5\u4e0b\u6743\u9650\uff1a\n\n- \u60a8\u6240\u5c5e\u7684 Steamworks \u5408\u4f5c\u4f19\u4f34\u5fc5\u987b\u662f\u6536\u53d6\u8be5\u4ea7\u54c1\u7684\u9500\u552e\u6536\u5165\u7684\u5408\u4f5c\u4f19\u4f34\u3002 \u4f8b\u5982\uff0c\u5982\u679c\u60a8\u4e0e\u53e6\u4e00\u95f4\u5de5\u4f5c\u5ba4\u5408\u4f5c\u5f00\u53d1\u6e38\u620f\uff0c\u8be5\u5de5\u4f5c\u5ba4\u88ab\u6807\u8bb0\u4e3a\u63a5\u6536\u8be5\u6e38\u620f\u9500\u552e\u6536\u5165\u7684\u5b9e\u4f53\uff0c\u90a3\u4e48\uff0c\u53ea\u6709\u8be5\u5de5\u4f5c\u5ba4\u7684\u6210\u5458\u624d\u80fd\u4fee\u6539\u4ef7\u683c\u3002\n\n- \u60a8\u7684\u5e10\u6237\u5fc5\u987b\u6709\u8be5\u4ea7\u54c1\u7684\u201c\u7ba1\u7406\u5b9a\u4ef7\u4e0e\u6298\u6263\u201d\u6743\u9650\u3002 \u53c2\u89c1[\u7ba1\u7406\u7528\u6237\u548c\u6743\u9650](https://partner.steamgames.com/doc/gettingstarted/managing_users#permissions)\uff0c\u4e86\u89e3\u66f4\u591a\u8be6\u60c5\u3002\n\n## \u5b9a\u4ef7\u6700\u4f73\u5b9e\u8df5\n\n\u60a8\u5728\u4e3a\u60a8\u7684\u6e38\u620f\u5236\u5b9a\u9996\u53d1\u4ef7\u683c\u65f6\uff0c\u53ef\u4ee5\u5c06\u51e0\u4e2a\u4e0d\u540c\u56e0\u7d20\u7eb3\u5165\u8003\u91cf\u3002\n\n- \u987e\u5ba2\u901a\u73a9\u60a8\u7684\u6e38\u620f\u9700\u8981\u591a\u4e45\uff1f\n\n- \u6e38\u620f\u662f\u5426\u975e\u5e38\u503c\u5f97\u91cd\u590d\u73a9\uff1f\n\n- \u662f\u5426\u53ef\u4ee5\u591a\u4eba\u4e00\u8d77\u73a9\uff1f\n\n- \u662f\u5426\u4ee5\u62a2\u5148\u4f53\u9a8c\u5f62\u5f0f\u53d1\u884c\uff1f\n\n- \u7c7b\u4f3c\u6027\u8d28\u7684\u6e38\u620f\u662f\u600e\u6837\u5b9a\u4ef7\u7684\uff1f\n\n- \u60a8\u5b9a\u4ef7\u65f6\u6709\u6ca1\u6709\u8003\u8651\u5230\u672a\u6765\u4fc3\u9500\u7684\u95ee\u9898\uff1f\n\n\u5982\u679c\u60a8\u5bf9\u9500\u552e\u60a8\u7684\u6e38\u620f\u975e\u5e38\u91cd\u89c6\uff0c\u5219\u5e94\u8be5\u50cf\u8fdb\u884c\u5176\u4ed6\u5546\u4e1a\u6d3b\u52a8\u4e00\u6837\uff0c\u505a\u4e00\u4e9b\u5e02\u573a\u8c03\u7814\u3002 \u8d2d\u4e70\u5176\u4ed6\u7c7b\u4f3c\u7684\u6e38\u620f\u6765\u73a9\u4e00\u4e0b\u3002 \u9605\u8bfb\u7528\u6237\u8bc4\u6d4b\u4e0e\u987e\u5ba2\u53cd\u9988\uff0c\u5bf9\u987e\u5ba2\u83b7\u5f97\u7684\u4ef7\u503c\u6709\u4e2a\u6982\u5ff5\uff0c\u5e76\u5229\u7528\u8fd9\u4e9b\u6570\u636e\u5bf9\u60a8\u81ea\u5df1\u7684\u4ea7\u54c1\u5b9a\u4ef7\u3002 \u8fd9\u5e76\u4e0d\u662f\u8bf4\u60a8\u8981\u538b\u4ef7\u7ade\u4e89\uff0c \u800c\u662f\u8bf4\u8981\u81f4\u529b\u4e8e\u7406\u89e3\u5e02\u573a\u5e76\u786e\u4fdd\u987e\u5ba2\u4f53\u9a8c\u5230\u7269\u6709\u6240\u503c\u3002\n\n## \u5173\u4e8e\u5730\u533a\u5b9a\u4ef7\n\nSteam \u4e0a\u6bcf\u6b3e\u4ea7\u54c1\u7684\u4ef7\u683c\u5747\u4f7f\u7528 37 \u4e2a\u5e01\u79cd\u548c 4 \u4e2a\u5730\u533a\u7ec4\u6807\u660e\u548c\u663e\u793a\u3002 \u548c\u4ee5\u5f80\u4e00\u6837\uff0c\u5982\u4f55\u4e3a\u6e38\u620f\u5b9a\u4ef7\u5168\u7531\u5404\u4f4d\u81ea\u884c\u51b3\u5b9a\u3002 Steam \u63d0\u4f9b\u591a\u79cd\u5de5\u5177\uff0c\u5e2e\u52a9\u60a8\u6839\u636e\u5404\u4e2a\u5e02\u573a\u7684\u60c5\u51b5\u76f8\u5e94\u8bbe\u7f6e\u548c\u7ba1\u7406\u6e38\u620f\u4ef7\u683c\u3002\n\n\u8bf7\u89c2\u770b\u6b64\u89c6\u9891\uff0c\u5feb\u901f\u4e86\u89e3\u76f8\u5173\u4fe1\u606f\uff1a\n ![](https://img.youtube.com/vi/bKiuS0Iysdo/0.jpg)  YouTube\u2122 \u89c6\u9891: Updated Pricing Tools and Regional Pricing Methods   \u89c2\u770b\uff1a9,432 \u6b21   In this video, we walk you through updates to the tools you use to enter your pricing on Steam and introduce regional pricing methods.\n\n## \u53ef\u9009\u7684\u8f6c\u6362\u5de5\u5177\n\nSteamworks \u5185\u7f6e\u4e86\u4e09\u79cd\u8f6c\u6362\u65b9\u5f0f\uff0c\u5e2e\u52a9\u60a8\u5728\u6240\u6709\u53ef\u7528\u5e01\u79cd\u548c\u5730\u533a\u7ec4\u4e2d\u4e3a\u81ea\u5df1\u7684\u6e38\u620f\u5b9a\u4ef7\u3002 \u8bf7\u53c2\u89c1[\u5173\u4e8e\u5730\u533a\u5b9a\u4ef7](https://partner.steamgames.com/pricing/explorer)\u9875\u9762\uff0c\u5176\u4e2d\u7684\u4ea4\u4e92\u5f0f\u5de5\u5177\u5c55\u793a\u4e86\u6bcf\u79cd\u65b9\u5f0f\u5982\u4f55\u5c06\u6bcf\u4e2a\u4e3b\u8981\u7f8e\u5143\u4ef7\u4f4d\u8f6c\u6362\u4e3a\u6240\u6709\u652f\u6301\u7684\u5e01\u79cd\u7684\u4ef7\u683c\u3002\n\n\u8fd9\u4e9b\u8f6c\u6362\u65b9\u5f0f\u5404\u4e0d\u76f8\u540c\uff0c\u6839\u636e\u60a8\u9009\u62e9\u7684\u7f8e\u5143\u4ef7\u4f4d\u4e3a\u6bcf\u4e2a\u652f\u6301\u7684\u5e01\u79cd\u751f\u6210\u4ef7\u683c\uff1a\n\n- **\u4ec5\u6309\u6c47\u7387\u8f6c\u6362** - \u6b64\u65b9\u6cd5\u91c7\u7528\u4e86\u6307\u5b9a\u65f6\u95f4\u7684\u7b80\u5355\u6c47\u7387\u3002\n\n- **\u4ec5\u6309\u8d2d\u4e70\u529b\u8f6c\u6362** - \u6b64\u65b9\u5f0f\u91c7\u7528\u4e86\u5173\u4e8e\u7ed9\u5b9a\u56fd\u5bb6/\u5730\u533a\u5185\u987e\u5ba2\u5e73\u5747\u8d2d\u4e70\u529b\u7684\u516c\u5f00\u6570\u636e\u3002\n\n- **\u591a\u53d8\u91cf\u8f6c\u6362** - \u6b64\u65b9\u5f0f\u4e3a\u6bcf\u4e2a\u5e01\u79cd\u91c7\u7528\u4e86\u591a\u4e2a\u6765\u6e90\u7684\u6570\u636e\uff0c\u5305\u62ec\u5f53\u5730\u8d2d\u4e70\u529b\u3001\u76f8\u4f3c\u5a31\u4e50\u5546\u54c1\u7684\u9884\u671f\u82b1\u8d39\u548c\u6c47\u7387\u3002\n\n## \u51b3\u5b9a\u5408\u9002\u7684\u5730\u533a\u5b9a\u4ef7\u65f6\u9700\u8981\u8003\u8651\u7684\u56e0\u7d20\n\n\u60f3\u5fc5\u60a8\u5728\u51b3\u5b9a\u6e38\u620f\u552e\u4ef7\u65f6\u82b1\u4e86\u5f88\u591a\u5fc3\u601d\uff0c\u7efc\u5408\u8003\u91cf\u4e86\u6e38\u620f\u4f53\u9a8c\u7684\u4ef7\u503c\u3001\u7c7b\u4f3c\u4ea7\u54c1\u7684\u4ef7\u683c\u4ee5\u53ca\u4ec0\u4e48\u6837\u7684\u4ef7\u683c\u7b26\u5408\u987e\u5ba2\u7684\u671f\u671b\u3002\n\n\u5728\u51b3\u5b9a\u5982\u4f55\u5c06\u8be5\u552e\u4ef7\u8f6c\u6362\u4e3a\u5404\u4e2a\u5e01\u79cd\u4e2d\u7684\u4ef7\u683c\uff0c\u5e76\u6839\u636e\u987e\u5ba2\u6240\u5728\u5730\u4f1a\u5bf9\u5176\u9020\u6210\u5f71\u54cd\u7684\u7ecf\u6d4e\u72b6\u51b5\u8c03\u6574\u76f8\u5e94\u5e01\u79cd\u4ef7\u683c\u65f6\uff0c\u4e5f\u5e94\u8be5\u82b1\u4e0a\u540c\u7b49\u7684\u5fc3\u601d\u3002\n\nSteam \u63d0\u4f9b\u4e86\u4e0a\u8ff0\u8f6c\u6362\u5de5\u5177\uff0c\u4f46\u60a8\u6700\u597d\u8fdb\u884c\u72ec\u7acb\u8c03\u7814\uff0c\u627e\u5230 Steam \u652f\u6301\u7684\u4efb\u4f55\u6216\u6240\u6709\u5e01\u79cd\u53ca\u5730\u533a\u7ec4\u4e2d\u7684\u5408\u9002\u4ef7\u683c\u3002\n\n\u8bb8\u591a\u5f00\u53d1\u8005\u9009\u62e9\u81ea\u884c\u51b3\u5b9a\u6bcf\u4e2a\u5e01\u79cd\u7684\u5b9a\u4ef7\uff0c\u8fd9\u6ca1\u6709\u95ee\u9898\u3002 \u4f46\u6211\u4eec\u5e0c\u671b\u8fd9\u4e9b\u8f6c\u6362\u65b9\u5f0f\u5bf9\u4e8e\u6ca1\u6709\u65f6\u95f4\u6216\u5174\u8da3\u81ea\u5df1\u7814\u7a76\u6bcf\u4e2a\u5e01\u79cd\u5b9a\u4ef7\u7684\u5f00\u53d1\u8005\u6765\u8bf4\uff0c\u4f1a\u662f\u6709\u7528\u7684\u6570\u636e\u70b9\u3002\n\n## \u6700\u4f4e\u4ef7\u683c\u95e8\u69db\n\nSteam \u4e0a\u6709\u4e24\u4e2a\u6700\u4f4e\u4ef7\u683c\u95e8\u69db\uff1a\n\n- **\u6700\u4f4e\u57fa\u7840\u4ef7\u683c**\uff1a\u53ef\u4ee5\u4e3a Steam \u4e0a\u7684\u4efb\u4f55\u4ea7\u54c1\u8f93\u5165\u6b64\u4ef7\u683c\uff0c\u5fc5\u987b\u81f3\u5c11\u7b49\u540c\u4e8e Steam \u9488\u5bf9 0.99 \u7f8e\u5143\u4ef7\u683c\u6863\u4f4d\u4f7f\u7528\u591a\u53d8\u91cf\u8f6c\u6362\u65b9\u5f0f\u5f97\u51fa\u7684\u4ef7\u683c\u3002 \u82e5\u60f3\u4e86\u89e3\u5177\u4f53\u7ec6\u8282\uff0c\u53ef\u67e5\u770b[\u6bcf\u79cd\u8d27\u5e01\u7684\u6700\u4f4e\u4ef7\u683c\u95e8\u69db](https://partner.steamgames.com/pricing/minimums)\u3002\n\n- **\u6700\u4f4e\u53ef\u80fd\u4ea4\u6613\u4ef7\u683c\uff1a** \u662f\u6700\u4f4e\u57fa\u7840\u4ef7\u683c\u7684 50%\uff0c\u8ba9\u6700\u4f4e\u4ef7\u683c\u6709\u4e00\u5b9a\u7684\u6298\u6263\u7a7a\u95f4\u3002 \u6700\u4f4e\u4ea4\u6613\u4ef7\u683c\u5927\u7ea6\u4e3a 0.49 \u7f8e\u5143\u3002\n\n- \u5b9a\u4ef7\u4e3a 0.99 \u7f8e\u5143\u6863\u7684\u4ea7\u54c1\u6700\u591a\u53ef\u63d0\u4f9b 50% \u7684\u6298\u6263\n\n  - \u5b9a\u4ef7\u4e3a 1.99 \u7f8e\u5143\u6863\u7684\u4ea7\u54c1\u6700\u591a\u53ef\u63d0\u4f9b 75% \u7684\u6298\u6263\n\n  - \u5b9a\u4ef7\u4e3a 4.99 \u7f8e\u5143\u6863\u7684\u4ea7\u54c1\u6700\u591a\u53ef\u63d0\u4f9b 90% \u7684\u6298\u6263\n\n\u5982\u679c\u60a8\u4e00\u6b3e\u6216\u591a\u6b3e\u4ea7\u54c1\u7684\u5b9a\u4ef7\u6216\u6298\u6263\u4ef7\u4f4e\u4e8e\u65b0\u7684\u6700\u4f4e\u4ef7\u683c\uff0c\u5219\u4f1a\u5bfc\u81f4\u4ee5\u4e0b\u95ee\u9898\u4e4b\u4e00\uff1a\n\n- \u5982\u679c\u60a8\u4ea7\u54c1\u7684\u57fa\u7840\u4ef7\u683c\u4f4e\u4e8e Steam \u5728\u67d0\u4e00\u5e01\u79cd\u4e2d\u7684\u6700\u4f4e\u53ef\u80fd\u4ea4\u6613\u4ef7\u683c\uff0c\u5219\u5c06\u65e0\u6cd5\u7ee7\u7eed\u5728\u4f7f\u7528\u8be5\u5e01\u79cd\u7684\u56fd\u5bb6/\u5730\u533a\u8d2d\u4e70\u3002\n\n- \u5982\u679c\u60a8\u5df2\u5b89\u6392\u7684\u6298\u6263\u4f1a\u5bfc\u81f4\u60a8\u7684\u6700\u7ec8\u4ef7\u683c\u4f4e\u4e8e Steam \u6700\u4f4e\u53ef\u80fd\u4ea4\u6613\u4ef7\u683c\uff0c\u5219\u5728\u6700\u7ec8\u4ef7\u683c\u4f4e\u4e8e\u6700\u4f4e\u5141\u8bb8\u4ef7\u683c\u7684\u56fd\u5bb6/\u5730\u533a\uff0c\u987e\u5ba2\u5c06\u65e0\u6cd5\u8d2d\u4e70\u8be5\u4ea7\u54c1\u3002\n\n- \u5982\u679c\u60a8\u5728\u4efb\u4f55\u5e01\u79cd\u4e2d\u7684\u57fa\u7840\u4ef7\u683c\u4f4e\u4e8e Steam \u7684\u6700\u4f4e\u53ef\u80fd\u4ea4\u6613\u4ef7\u683c\uff0c\u60a8\u5c06\u65e0\u6cd5\u5b89\u6392\u65b0\u7684\u6298\u6263\u3002\n\n- \u5982\u679c\u60a8\u5728\u4efb\u4f55\u5e01\u79cd\u4e2d\u7684\u57fa\u7840\u4ef7\u683c\u63a5\u8fd1 Steam \u7684\u6700\u4f4e\u53ef\u80fd\u4ea4\u6613\u4ef7\u683c\uff0c\u60a8\u53ef\u8f93\u5165\u7684\u6298\u6263\u53ef\u80fd\u53d7\u9650\uff0c\u4ee5\u786e\u4fdd\u6298\u540e\u4ef7\u683c\u4e0d\u4f1a\u4f4e\u4e8e\u6700\u4f4e\u5141\u8bb8\u4ef7\u683c\u3002\n\n\u8981\u4e86\u89e3\u66f4\u591a\u8be6\u60c5\uff0c\u8bf7\u53c2\u89c1\u6211\u4eec 8 \u6708 15 \u65e5\u7684\u535a\u5ba2\u6587\u7ae0\uff1a[Steam \u6700\u4f4e\u4ef7\u683c\u95e8\u69db\u7684\u66f4\u65b0](https://steamcommunity.com/groups/steamworks/announcements/detail/3700310527377680732)\u3002\n\n## \u5e38\u89c1\u95ee\u9898\n\n**\u95ee\uff1a\u6211\u7684\u6e38\u620f\u5b9a\u4ef7\u7f3a\u5931 Steam \u652f\u6301\u7684\u51e0\u79cd\u5f53\u5730\u8d27\u5e01\uff0c\u6709\u5173\u7cfb\u5417\uff1f**\n\u7b54\uff1a\u53ea\u8981\u67d0\u8d27\u5e01\u7684\u4ef7\u683c\u7f3a\u5931\uff0c\u4f7f\u7528\u8be5\u8d27\u5e01\u7684\u7528\u6237\u5c31\u65e0\u6cd5\u8d2d\u4e70\u60a8\u7684\u6e38\u620f\u3002 \u6bd4\u5982\uff0c\u5982\u679c\u60a8\u6ca1\u6709\u4e3a\u65e5\u5143\u8f93\u5165\u4ef7\u683c\uff0c\u4f4d\u4e8e\u65e5\u672c\u7684\u7528\u6237\u5c31\u65e0\u6cd5\u8d2d\u4e70\u60a8\u7684\u6e38\u620f\u3002\n\n**\u95ee\uff1a\u6211\u6e38\u620f\u7684\u7a0b\u5e8f\u5305\u7f3a\u5931\uff0c\u6211\u8be5\u600e\u4e48\u63d0\u4ea4\u5b9a\u4ef7\uff1f**\n\u7b54\uff1a\u6211\u4eec\u65f6\u4e0d\u65f6\u4f1a\u9047\u5230\u8fd9\u6837\u7684\u9519\u8bef\uff1a\u5148\u521b\u5efa\u4e86 App ID\uff0c\u5374\u6ca1\u6709\u521b\u5efa\u8be5 App ID \u7684\u6807\u51c6\u7a0b\u5e8f\u5305\u3002 \u60a8\u53ef\u4ee5\u524d\u5f80\u201c\u6240\u6709\u5173\u8054\u7a0b\u5e8f\u5305\u3001DLC\u3001\u8bd5\u7528\u7248\u53ca\u5de5\u5177\u201d\u9875\u9762\uff0c\u5e76\u70b9\u51fb\u4e0a\u65b9\u7eff\u8272\u7684\u201c\u521b\u5efa\u6807\u51c6\u7a0b\u5e8f\u5305\u201d\u6309\u94ae\uff0c\u4ee5\u521b\u5efa\u76f8\u5173\u7a0b\u5e8f\u5305\u3002 \u60a8\u4e5f\u53ef\u4ee5\u968f\u65f6\u901a\u8fc7\u672c\u9875\u9876\u90e8\u7684\u201c\u5ba2\u670d\u201d\u6309\u94ae\u5411\u6211\u4eec\u53d1\u9001\u4fe1\u606f\u4ee5\u83b7\u53d6\u5e2e\u52a9\u3002\n\n**\u95ee\uff1aSteam \u652f\u6301\u54ea\u4e9b\u5e01\u79cd\uff1f**\n\u7b54\uff1a\u60a8\u53ef\u4ee5\u5728[\u652f\u6301\u5e01\u79cd](https://partner.steamgames.com/doc/store/pricing/currencies)\u9875\u9762\u4e2d\u67e5\u770b\u5b8c\u6574\u7684\u5e01\u79cd\u5217\u8868\uff0c\u8be5\u9875\u9762\u4e5f\u4ecb\u7ecd\u4e86\u54ea\u4e9b\u5e01\u79cd\u652f\u6301\u4ee5\u975e\u6574\u6570\u5355\u4f4d\u7684\u6570\u989d\u5b9a\u4ef7\u4e0e\u8d2d\u4e70\u3001\u5b83\u4eec\u5c06\u5982\u4f55\u88ab\u8ba1\u5165\u62a5\u544a\u4ee5\u53ca\u91c7\u7528\u4f55\u79cd\u589e\u91cf\u3002\n\n**\u95ee\uff1a\u6211\u53ef\u4ee5\u591a\u9891\u7e41\u5730\u66f4\u6539\u4ea7\u54c1\u4ef7\u683c\uff1f**\n\u7b54\uff1a\u4e3a\u4e86\u5c0a\u91cd\u7528\u6237\u5bf9\u65b0\u53d1\u884c\u6e38\u620f\u7684\u4ef7\u683c\u9884\u671f\uff0c\u6211\u4eec\u8981\u6c42\u5728\u53d1\u884c 30 \u5929\u540e\u518d\u6539\u52a8\u4ef7\u683c\u3002 \u5982\u679c\u60a8\u4e0d\u5c0f\u5fc3\u5728\u53d1\u884c\u65f6\u63d0\u4ea4\u4e86\u4e00\u4e2a\u91cd\u5927\u7684\u9519\u8bef\u5b9a\u4ef7\u5e76\u9700\u8981\u5c3d\u5feb\u7ea0\u6b63\uff0c\u6211\u4eec\u53ef\u4ee5\u6ee1\u8db3\u60a8\u7684\u8981\u6c42\u3002 \u5982\u679c\u60f3\u8981\u7ea0\u6b63\u8fd9\u79cd\u5b9a\u4ef7\u9519\u8bef\uff0c\u8bf7[\u5728\u6b64\u5904\u8054\u7cfb\u6211\u4eec](https://help.steampowered.com/zh-cn/wizard/HelpWithPublishing?issueid=939)\u3002 \u5728\u89c4\u5b9a\u65f6\u95f4\u95f4\u9694\u8fc7\u540e\uff0c\u60a8\u53ef\u4ee5\u968f\u65f6\u914c\u60c5\u66f4\u6539\u4ef7\u683c\uff0c\u4f46\u8bf7\u8bb0\u4f4f\uff0c\u5728\u4e00\u4e2a\u6216\u591a\u4e2a\u5e01\u79cd\u4e2d\u8c03\u9ad8\u4ef7\u683c\u5c06\u4f1a\u4ea7\u751f 30 \u5929\u7684\u51b7\u5374\u671f\uff0c\u5728\u6b64\u671f\u95f4\u4e0d\u53ef\u63d0\u4ea4\u6298\u6263\u3002 \u8bf7\u67e5\u770b[\u6298\u6263\u6587\u6863](https://partner.steamgames.com/doc/marketing/discounts)\uff0c\u4e86\u89e3\u6709\u5173\u6298\u6263\u7684\u66f4\u591a\u8be6\u7ec6\u4fe1\u606f\u3002\n\n**\u95ee\uff1a\u6211\u53ef\u4ee5\u5b89\u6392\u4ef7\u683c\u66f4\u65b0\u65f6\u95f4\uff0c\u4ee4\u5176\u81ea\u52a8\u66f4\u65b0\u5417\uff1f**\n\u7b54\uff1a\u4e0d\u53ef\u4ee5\u3002\u4ef7\u683c\u53d8\u66f4\u4e0d\u53ef\u4ee5\u5b89\u6392\u4e3a\u81ea\u52a8\u53d1\u751f\uff0c\u4f46\u662f\u5728 Valve \u5ba1\u6838\u66f4\u6539\u540e\uff0c\u60a8\u53ef\u4ee5\u6309\u7167\u81ea\u5df1\u7684\u65e5\u7a0b\u8868\u6765\u53d1\u5e03\u4ef7\u683c\u53d8\u66f4\uff0c\u6216\u662f\u8ba9 Valve \u5728\u5ba1\u6838\u540e\u7acb\u5373\u53d1\u5e03\u53d8\u66f4\u3002\n\n\u5982\u679c\u60a8\u9009\u62e9\u81ea\u5df1\u53d1\u5e03\u4ef7\u683c\u53d8\u66f4\uff0c\u5728 Valve \u5ba1\u6838\u5b8c\u66f4\u6539\u7684\u4ef7\u683c\u540e\u60a8\u5c06\u4f1a\u6536\u5230\u7535\u5b50\u90ae\u4ef6\u901a\u77e5\u3002 \u63a5\u4e0b\u6765\uff0c\u60a8\u5c31\u53ef\u4ee5\u9009\u62e9\u5728\u9002\u5408\u81ea\u5df1\u7684\u65f6\u95f4\u53d1\u5e03\u672a\u6765\u4ef7\u683c\u53d8\u66f4\u4e86\u3002 \u60a8\u53d1\u5e03\u53d8\u66f4\u540e\uff0c\u987e\u5ba2\u4fbf\u4f1a\u7acb\u5373\u770b\u5230\u3002\n\n\u6b64\u9009\u9879\u53ef\u4ee5\u5728\u7a0b\u5e8f\u5305\u767b\u9646\u9875\u9762\u7684\u201c\u5efa\u8bae\u5b9a\u4ef7\u201d\u680f\u76ee\u4e0b\u627e\u5230\u3002\n\n![pricechangeschedule.JPG](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/pricechangeschedule.JPG)\n\n**\u95ee\uff1a\u6211\u7684\u4ea7\u54c1\u4ece\u62a2\u5148\u4f53\u9a8c\u8f6c\u4e3a\u5b8c\u6574\u53d1\u884c\u65f6\uff0c\u53ef\u4ee5\u6da8\u4ef7\u5417\uff1f**\n\u7b54\uff1a\u53ef\u4ee5\u3002 \u60a8\u9700\u8981\u5728\u62a2\u5148\u4f53\u9a8c\u8f6c\u4e3a\u5b8c\u6574\u53d1\u884c\u524d\uff0c\u63d0\u524d\u51e0\u5929\u7533\u8bf7\u6539\u4ef7\uff0c\u4ee5\u786e\u4fdd\u5728\u8f6c\u4e3a\u5b8c\u6574\u53d1\u884c\u4e4b\u524d\u60a8\u7684\u4ef7\u683c\u4f1a\u5f97\u5230\u6279\u51c6\u3002\n\n\u6ce8\u610f\uff1a\u5728\u6da8\u4ef7\u540e 30 \u5929\u5185\uff0c\u4e0d\u80fd\u518d\u4e3a\u4ea7\u54c1\u6253\u6298\u3002 \u5982\u679c\u60a8\u5728\u4ece\u62a2\u5148\u4f53\u9a8c\u8f6c\u5230\u5b8c\u6574\u53d1\u884c\u524d\u7684 30 \u5929\u4e4b\u5185\u6da8\u4ef7\uff0c\u60a8\u7684\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u5c06\u4e0d\u80fd\u4f7f\u7528\u3002\n\n\u5982\u679c\u60a8\u8ba1\u5212\u5728\u4ece\u62a2\u5148\u4f53\u9a8c\u8f6c\u4e3a\u5b8c\u6574\u53d1\u884c\u4e4b\u65f6\u6216\u524d\u540e\u6da8\u4ef7\uff0c\u5e76\u5e0c\u671b\u7528\u6253\u6298\u7684\u65b9\u5f0f\u5e86\u795d\u60a8\u7684 1.0 \u7248\u53d1\u884c\uff0c\u60a8\u4e5f\u8bb8\u53ef\u4ee5\u8003\u8651\u91c7\u53d6\u4ee5\u4e0b\u65b9\u5f0f\uff1a\n\n- \u60a8\u53ef\u4ee5\u4fdd\u6301\u4ef7\u683c\u4e0d\u53d8\uff0c\u5728\u7ed3\u675f\u62a2\u5148\u4f53\u9a8c\u5e76\u53d1\u884c 1.0 \u7248\u65f6\u63d0\u4f9b\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\uff0c\u5728 30 \u65e5**\u4e4b\u540e**\u518d\u6da8\u4ef7\u3002\n\n- \u60a8\u53ef\u4ee5\u5728\u544a\u522b\u62a2\u5148\u4f53\u9a8c\u4e4b\u540e\u6da8\u4ef7\uff0c\u4e0d\u6253\u6298\u3002\n\n- \u60a8\u4e5f\u53ef\u4ee5\u5728\u7ed3\u675f\u62a2\u5148\u4f53\u9a8c\u7684 30 \u5929\u524d\u6da8\u4ef7\uff0c\u4e4b\u540e\u518d\u5728 1.0 \u7248\u53d1\u552e\u65f6\u63d0\u4f9b\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u3002\n\n**\u95ee\uff1a\u5982\u679c\u6211\u7684\u4ea7\u54c1\u6700\u8fd1\u624d\u53d1\u884c\uff0c\u53ef\u4ee5\u53c2\u52a0\u7279\u5356\u6d3b\u52a8\u5417\uff1f**\n\u7b54\uff1a\u4e00\u822c\u800c\u8a00\uff0c\u60a8\u4e0d\u80fd\u5728\u4ea7\u54c1\u53d1\u884c\u540e\u7684 30 \u5929\u5185\u6216\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u7ed3\u675f\u540e\u7684 30 \u5929\u5185\u63d0\u4ea4\u6298\u6263\u3002 \u4f46\u662f\uff0c\u60a8\u53ef\u4ee5\u63d0\u4ea4\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\uff0c\u5b83\u4f1a\u5728\u6e38\u620f\u9996\u6b21\u53d1\u884c\u65f6\u751f\u6548\u3002 \u60a8\u7684\u6e38\u620f\u603b\u4f1a\u6709\u673a\u4f1a\u8fdb\u884c\u6253\u6298\uff0c\u6240\u4ee5\u60a8\u4e0d\u5fc5\u4e3a\u4e86\u8d76\u4e0a\u67d0\u4e2a\u5b63\u8282\u6027\u7279\u5356\u6d3b\u52a8\u800c\u53d8\u52a8\u60a8\u7684\u53d1\u884c\u65e5\u671f\u3002\n\n**\u95ee\uff1a\u5982\u679c\u6211\u60f3\u5c06\u81ea\u5df1\u7684\u6e38\u620f\u4ece\u514d\u8d39\u6539\u4e3a\u6536\u8d39\uff0c\u8be5\u600e\u4e48\u529e\uff1f**\n\u7b54\uff1a\u60a8\u5c3d\u53ef\u5c06\u81ea\u5df1\u7684\u6e38\u620f\u4ece\u514d\u8d39\u6539\u4e3a\u6536\u8d39\uff0c\u8bf7\u4f7f\u7528[\u6b64\u5904\u7684\u5ba2\u670d\u6848\u4ef6](https://help.steampowered.com/wizard/HelpWithPublishing?issueid=915)\u8054\u7cfb\u6211\u4eec\uff0c\u5c06\u514d\u8d39\u6e38\u620f\u66f4\u6539\u4e3a\u6536\u8d39\u7a0b\u5e8f\u5305\u3002 \u6211\u4eec\u6700\u91cd\u89c6\u7684\u662f\u516c\u5e73\u5bf9\u5f85\u987e\u5ba2\uff0c\u56e0\u6b64\u6211\u4eec\u8981\u6c42\u60a8\u5728\u79fb\u9664\u4efb\u4f55\u6e38\u620f\u5185\u8d2d\u4e70\uff08\u5982\u9002\u7528\uff09\u5e76\u5c06\u5e94\u7528\u4ece\u514d\u8d39\u8f6c\u4e3a\u4ed8\u8d39\u524d\uff0c\u81f3\u5c11\u63d0\u524d\u4e00\u5468\u901a\u8fc7[\u65b0\u95fb\u6d3b\u52a8](https://partner.steamgames.com/doc/marketing/event_tools)\u5411\u987e\u5ba2\u53d1\u51fa\u901a\u77e5\u3002 \u8fd9\u53ef\u4ee5\u8ba9\u987e\u5ba2\u5f97\u5230\u4e00\u6bb5\u5408\u7406\u7684\u7f13\u51b2\u671f\u6765\u9886\u53d6\u514d\u8d39\u8bb8\u53ef\uff0c\u5e76/\u6216\u5728\u5546\u4e1a\u6a21\u5f0f\u6539\u53d8\u524d\u7528\u5b8c\u5269\u4f59\u7684\u6e38\u620f\u5185\u8d27\u5e01\u6216\u7269\u54c1\u3002 \u5728\u6e38\u620f\u7531\u514d\u8d39\u8f6c\u4e3a\u4ed8\u8d39\u540e\uff0c\u5e10\u6237\u4e2d\u62e5\u6709\u60a8\u6e38\u620f\u514d\u8d39\u8bb8\u53ef\u7684\u7528\u6237\u4ecd\u5c06\u7ee7\u7eed\u62e5\u6709\u6e38\u620f\uff0c\u4e5f\u53ef\u4ee5\u7ee7\u7eed\u73a9\u6e38\u620f\u3002\n\n**\u95ee\uff1a\u5982\u679c\u6211\u60f3\u5c06\u81ea\u5df1\u7684\u6e38\u620f\u4ece\u6536\u8d39\u6539\u4e3a\u514d\u8d39\uff0c\u8be5\u600e\u4e48\u529e\uff1f**\n\u7b54\uff1a\u4e0e\u5c06\u6e38\u620f\u4ece \u6298\u6263": "# \u6298\u6263\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/marketing/discounts\n\n## \u6982\u89c8\n\n\u6298\u6263\u662f\u4e00\u79cd\u975e\u5e38\u6709\u4ef7\u503c\u7684\u5de5\u5177\uff0c\u80fd\u591f\u5e2e\u52a9\u60a8\u6269\u5927\u53d7\u4f17\u7fa4\u4f53\uff0c\u5e76\u5ef6\u957f\u4ea7\u54c1\u5728 Steam \u4e0a\u7684\u751f\u547d\u5468\u671f\u3002 \u60a8\u53ef\u4ee5\u53c2\u52a0\u5b98\u65b9\u7279\u5356\u6d3b\u52a8\uff0c\u5e76\u5229\u7528\u6298\u6263\u5de5\u5177\u6765\u63a8\u51fa\u81ea\u5df1\u7684\u81ea\u5b9a\u4e49\u6298\u6263\u3002\n\n\u603b\u4f53\u6765\u770b\uff0c\u6211\u4eec\u53d1\u73b0\u51e0\u4e4e\u6bcf\u4e00\u4e2a\u4ef7\u683c\u533a\u95f4\u90fd\u80fd\u5438\u5f15\u5230\u76f8\u5e94\u7684\u987e\u5ba2\uff0c\u800c\u4e00\u4e2a\u6709\u6548\u7684\u6298\u6263\u7b56\u7565\uff0c\u5f80\u5f80\u80fd\u4e3a\u4ea7\u54c1\u5728 Steam \u4e0a\u7684\u957f\u671f\u6210\u529f\u505a\u51fa\u8d21\u732e\u3002\n\n\u5982\u5f80\u5e38\u4e00\u6837\uff0c\u8fd9\u4e9b\u5efa\u8bae\u662f\u9488\u5bf9\u5404\u79cd\u4e0d\u540c\u7684\u4ea7\u54c1\u3001\u5f00\u53d1\u8005\u548c\u987e\u5ba2\u7684\u4e00\u822c\u6027\u6982\u62ec\uff0c\u56e0\u6b64\u5728\u505a\u51b3\u7b56\u65f6\uff0c\u8bf7\u7ed3\u5408\u81ea\u8eab\u4ea7\u54c1\u548c\u793e\u533a\u7684\u5177\u4f53\u60c5\u51b5\u6765\u8003\u8651\u3002\n\n## \u914d\u7f6e\u6298\u6263\n\n## \u6240\u9700\u6743\u9650\n\n\u6298\u6263\u5236\u5b9a\u9700\u8981\u76f8\u5173\u4ea7\u54c1\u7684\u201c\u7ba1\u7406\u5b9a\u4ef7\u4e0e\u6298\u6263\u201d\u6743\u9650\u3002 \u6b64\u5916\uff0c\u60a8\u8fd8\u5fc5\u987b\u662f\u8d1f\u8d23\u63a5\u6536\u8be5\u6253\u6298\u4ea7\u54c1\u9500\u552e\u6536\u5165\u7684 Steamworks \u5408\u4f5c\u4f19\u4f34\u7684\u6210\u5458\u3002\n\n## \u914d\u7f6e\u6b65\u9aa4\n\n- \u8bf7\u5bfc\u822a\u81f3\u5168\u65b0\u7684\u6298\u6263\u4e3b\u9762\u677f\uff1a[https://partner.steamgames.com/promotion/discounts/dashboard/](https://partner.steamgames.com/promotion/discounts/dashboard/) \uff08\u6216\u8005\u9009\u62e9\u201c\u5e94\u7528\u4e0e\u7a0b\u5e8f\u5305\u2 6298\u6263\uff0c\u6211\u4eec\u4f1a\u4e0e\u60a8\u8054\u7cfb\uff0c\u901a\u77e5\u60a8\u8be6\u60c5\u3002 \u8fd9\u4e9b\u4fc3\u9500\u680f\u4f4d\u65e2\u4e0d\u63a5\u53d7\u534f\u5546\uff0c\u4e5f\u4e0d\u5bf9\u5916\u51fa\u552e\uff0c\u800c\u662f\u5b8c\u5168\u57fa\u4e8e\u73a9\u5bb6\u6570\u636e\u6765\u5b89\u6392\u3002 \u5982\u679c\u60a8\u7684\u6e38\u620f\u62e5\u6709\u5927\u91cf\u6ee1\u610f\u7684\u987e\u5ba2\uff0c\u5e76\u4e14\u5728\u8fc7\u53bb\u51e0\u4e2a\u6708\u91cc\u53d6\u5f97\u4e86\u6570\u5341\u4e07\u7f8e\u5143\u7ea7\u522b\u7684\u8425\u6536\uff0c\u8bf7[\u968f\u65f6\u8054\u7cfb\u6211\u4eec](https://help.steampowered.com/wizard/HelpWithPublishing)\uff0c\u8ba8\u8bba\u4fc3\u9500\u9009\u9879\u3002\n\n\u4ea7\u54c1\u9274\u9009\u4fc3\u9500\u680f\u4f4d\u6709\u4e09\u79cd\u4e3b\u8981\u7c7b\u578b\u3002 \u8fd9\u4e09\u79cd\u4fc3\u9500\u680f\u4f4d\u7684\u9ed8\u8ba4\u6298\u6263\u6301\u7eed\u65f6\u95f4\u5747\u4e3a\u4e00\u5468\uff0c\u4f46\u6211\u4eec\u4e5f\u5f88\u4e50\u610f\u5728\u73b0\u6709\u6298\u6263\u653f\u7b56\u8303\u56f4\u5185\u7075\u6d3b\u7f29\u77ed\u6216\u5ef6\u957f\u6298\u6263\u6301\u7eed\u65f6\u95f4\u3002 \u9274\u9009\u4fc3\u9500\u680f\u4f4d\u901a\u5e38\u9650\u5236\u4e3a\u6bcf\u4e2a\u81ea\u7136\u5e74\u4e00\u6b21\uff0c\u4e14\u4e24\u6b21\u4fc3\u9500\u4e4b\u95f4\u81f3\u5c11\u95f4\u9694\u4e09\u4e2a\u6708\u3002\n\n## \u6bcf\u65e5\u7279\u60e0\n\n\u6bcf\u65e5\u7279\u60e0\u4ea7\u54c1\u663e\u793a\u5728 Steam \u4e3b\u9875\u4e0a\uff0c\u65f6\u957f\u4e3a 24 \u5c0f\u65f6\uff0c\u5e76\u4e8e\u6bcf\u5929\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u66f4\u6362\u3002 \u6bcf\u5929\u4f1a\u6709\u4e24\u4e2a\u6216\u66f4\u591a\u6bcf\u65e5\u7279\u60e0\u680f\u4f4d\u3002 \u6bcf\u65e5\u7279\u60e0\u4f7f\u7528\u7684\u662f\u6807\u51c6\u7684\u201c\u5f62\u8c61\u56fe\u7247\u201d\uff0c\u5c3a\u5bf8\u4e3a 460px x 215px\uff0c\u5e76\u4f1a\u81ea\u52a8\u4ece\u5173\u8054\u7684\u6e38\u620f\u6216\u6346\u7ed1\u5305\u4e2d\u5bfc\u5165\u3002 \u5176\u6298\u6263\u6301\u7eed 7 \u81f3 14 \u5929\u3002 [\u5728\u6b64\u5904\u4e86\u89e3\u66f4\u591a\u4fe1\u606f](https://partner.steamgames.com/doc/marketing/discounts/dailydeal)\u3002\n\n## \u5468\u95f4\u7279\u60e0\n\n\u5468\u95f4\u7279\u60e0\u5c06\u5728 Steam \u4e3b\u9875\u4e0a\u663e\u793a\uff0c\u65f6\u957f 72 \u5c0f\u65f6\uff0c\u4ece\u5468\u4e00\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u5f00\u59cb\u5230\u5468\u56db\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u7ed3\u675f\u3002 \u6bcf\u5468\u6700\u591a\u6709\u516d\u4e2a\u5468\u95f4\u7279\u60e0\u680f\u4f4d\u3002 \u6240\u4f7f\u7528\u7684\u827a\u672f\u4f5c\u54c1\u8981\u6c42\u4f7f\u7528[\u8fd9\u91cc](https://partner.steamgames.com/doc/store/assets/promos)\u8be6\u7ec6\u5217\u51fa\u7684\u81ea\u5b9a\u4e49\u8d44\u4ea7\u5c3a\u5bf8\uff0c\u5e76\u7531 Valve \u8fdb\u884c\u672c\u5730\u5316\u3002 \u5468\u95f4\u7279\u60e0\u6298\u6263\u9ed8\u8ba4\u4e3a\u671f\u4e00\u5468\uff0c\u4f46\u6839\u636e\u53d1\u884c\u5546\u8bf7\u6c42\u53ef\u8c03\u6574\u4e3a 3 \u81f3 14 \u5929\u4e0d\u7b49\u3002\n\n## \u5468\u672b\u7279\u60e0\n\n\u5468\u672b\u7279\u60e0\u5c06\u5728 Steam \u4e3b\u9875\u4e0a\u663e\u793a\uff0c\u65f6\u957f 96 \u5c0f\u65f6\uff0c\u4ece\u5468\u56db\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u5f00\u59cb\u5230\u5468\u4e00\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u7ed3\u675f\u3002 \u6bcf\u5468\u6700\u591a\u6709\u516d\u4e2a\u5468\u672b\u7279\u60e0\u680f\u4f4d\u3002 \u4e14\u4e0e\u5468\u95f4\u7279\u60e0\u76f8\u4f3c\uff0c\u8981\u6c42\u4f7f\u7528[\u8fd9\u91cc](https://partner.steamgames.com/doc/store/assets/promos)\u8be6\u7ec6\u5217\u51fa\u7684\u81ea\u5b9a\u4e49\u8d44\u4ea7\u5c3a\u5bf8\uff0c\u5e76\u7531 Valve \u8fdb\u884c\u672c\u5730\u5316\u3002 \u5468\u672b\u7279\u60e0\u9ed8\u8ba4\u4e3a\u671f\u4e00\u5468\uff0c\u4f46\u6839\u636e\u53d1\u884c\u5546\u8bf7\u6c42\u53ef\u8c03\u6574\u4e3a 4 \u81f3 14 \u5929\u4e0d\u7b49\u3002\n\n## \u9274\u9009\u7279\u60e0\u89c6\u89c9\u6548\u679c\u793a\u4f8b\n\n\u4ee5\u4e0b\u662f Steam \u4e3b\u9875\u4e0a\u201c\u6298\u6263\u4e0e\u6d3b\u52a8\u201d\u8f6e\u64ad\u533a\u7684\u5c55\u793a\u6837\u4f8b\u3002 \u5468\u95f4\u7279\u60e0\u53ca\u5468\u672b\u7279\u60e0\u7684\u7126\u70b9\u56fe\u5360\u636e\u4e86\u5de6\u4fa7\u8f83\u5927\u7684\u7a7a\u95f4\uff1b \u6bcf\u65e5\u7279\u60e0\u5219\u4f4d\u4e8e\u53f3\u4fa7\u3002 \u7528\u6237\u53ef\u4ee5\u7ffb\u9875\u6d4f\u89c8\u8fd9\u4e2a\u8f6e\u64ad\u533a\uff0c\u5728\u5176\u4e2d\u770b\u5230\u591a\u4e2a\u6765\u81ea\u9274\u9009\u7279\u5356\u7684\u7126\u70b9\u5c55\u793a\u4ea7\u54c1\uff0c\u4ee5\u53ca\u5176\u4ed6\u57fa\u4e8e\u5f53\u524d\u73a9\u5bb6\u70ed\u5ea6\u800c\u81ea\u7136\u63a8\u8350\u7684\u6298\u6263\u4ea7\u54c1\u3002\n\n##\n\n![specialoffersvisualexample.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/specialoffersvisualexample.png)\n\n## \u514d\u8d39\u5468\u672b\n\n\u514d\u8d39\u5468\u672b\u662f\u4e00\u79cd\u53ef\u8ba9\u987e\u5ba2\u6682\u65f6\u8bbf\u95ee\u60a8\u6e38\u620f\u7684\u4fc3\u9500\u3002 \u7528\u6237\u53ef\u4ee5\u514d\u8d39\u8bd5\u73a9\u6e38\u620f\uff0c\u4f46\u5728\u8be5\u65f6\u95f4\u6bb5\u7ed3\u675f\u540e\u5c31\u4f1a\u5931\u53bb\u5bf9\u8be5\u6e38\u620f\u7684\u8bbf\u95ee\u6743\u9650\u3002 \u8fd9\u7c7b\u6d3b\u52a8\u4f1a\u88ab\u7b56\u7565\u6027\u5730\u7528\u4e8e\u67d0\u4e9b\u7c7b\u578b\u7684\u6e38\u620f\u6216\u7279\u5b9a\u60c5\u5f62\uff0c\u5e76\u4e14\u4e00\u822c\u4f1a\u642d\u914d\u6298\u6263\uff0c\u4ee5\u5e2e\u52a9\u5c06\u8bd5\u73a9\u73a9\u5bb6\u8f6c\u5316\u4e3a\u4ed8\u8d39\u987e\u5ba2\u3002 [\u5728\u6b64\u5904\u4e86\u89e3\u66f4\u591a](https://partner.steamgames.com/doc/marketing/discounts/freeweekends)\u3002\n\n## \u6298\u6263\u89c4\u5219\n\nSteam \u9f13\u52b1\u5408\u4f5c\u4f19\u4f34\u4ee5\u6700\u7b26\u5408\u5176\u8425\u9500\u8ba1\u5212\u548c\u4ea7\u54c1\u7b56\u7565\u7684\u65b9\u5f0f\u8bbe\u7f6e\u6298\u6263\uff0c\u4f46\u4ecd\u9700\u7262\u8bb0\u4e00\u4e9b\u5177\u4f53\u7684\u6298\u6263\u89c4\u5219\u3002\n\n\u5236\u5b9a\u8fd9\u4e9b\u89c4\u5219\u7684\u4e3b\u8981\u51fa\u53d1\u70b9\u662f\u4e3a\u987e\u5ba2\u63d0\u4f9b\u66f4\u597d\u7684\u5b9a\u4ef7\u900f\u660e\u5ea6\u3002 \u4e00\u822c\u800c\u8a00\uff0c\u4e3a\u4e86\u8ba9\u987e\u5ba2\u80fd\u66f4\u597d\u5730\u4e86\u89e3\u6298\u6263\u7684\u60c5\u51b5\uff0c\u6211\u4eec\u5728 Steam \u4e0a\u53d1\u5e03\u6298\u6263\u65f6\uff0c\u5176\u53c2\u8003\u4ef7\u683c\u8981\u4e48\u662f\u5df2\u7ecf\u5b9e\u65bd\u4e86\u81f3\u5c11 30 \u5929\u7684\u57fa\u7840\u4ef7\u683c\uff0c\u8981\u4e48\u662f**\u5c06\u4f1a**\u5728\u7279\u522b\u9996\u53d1\u4f18\u60e0\u7ed3\u675f\u540e\u751f\u6548\u7684\u771f\u5b9e\u9996\u53d1\u4ef7\u683c\u3002\n\nSteam \u7684\u5177\u4f53\u6298\u6263\u89c4\u5219\u5982\u4e0b\uff1a\n\n## 30 \u5929\u53d1\u884c\u51b7\u5374\u65f6\u95f4\n\n\u4ea7\u54c1\u5728\u53d1\u884c**\u540e**\u7684 30 \u5929\u5185\u4e0d\u80fd\u6253\u6298\uff0c\u5305\u62ec\u62a2\u5148\u4f53\u9a8c\u53d1\u884c\uff08\u5982\u9002\u7528\uff09\u548c\u5b8c\u6574\u53d1\u884c\u3002 \u4f46\u8fd9\u6761\u89c4\u5219\u6709\u4e00\u4e2a\u4f8b\u5916\uff1a\n\n- **\u9996\u53d1\u964d\u4ef7\u4f18\u60e0**\u662f\u4e00\u9879\u53ef\u9009\u7684\u9996\u53d1\u4f18\u60e0\uff0c\u5141\u8bb8\u4ea7\u54c1\u5728\u53d1\u884c\u65f6\u6253\u6298\u3002 \u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u53ea\u80fd\u5728\u4ea7\u54c1\u7684\u53d1\u884c\u65e5\u4e4b\u524d\u8bbe\u7f6e\uff0c\u800c\u4e0d\u662f\u4e4b\u540e\u3002\n\n## 30 \u5929\u6da8\u4ef7\u51b7\u5374\u65f6\u95f4\n\n\u4ea7\u54c1\u5728**\u4efb\u610f**\u5e01\u79cd\u4ef7\u683c\u4e0a\u8c03\u540e\u7684 30 \u5929\u5185\uff0c\u4e0d\u5f97\u6253\u6298\u3002 \u8fd9\u6761\u89c4\u5219\u65e0\u4efb\u4f55\u4f8b\u5916\uff0c\u4f46\u8bf7\u6ce8\u610f\u5b83\u4ec5\u9002\u7528\u4e8e\u57fa\u7840\u4ef7\u683c**\u4e0a\u6da8**\u7684\u60c5\u51b5\u3002 \u4e0b\u8c03\u4ea7\u54c1\u7684\u57fa\u7840\u4ef7\u683c\u4e0d\u4f1a\u89e6\u53d1\u672a\u6765\u7279\u5356\u7684 30 \u5929\u51b7\u5374\u3002 \u8bf7\u53c2\u89c1[\u5b9a\u4ef7](https://partner.steamgames.com/doc//store/pricing)\uff0c\u4e86\u89e3\u8bbe\u7f6e\u57fa\u7840\u4ef7\u683c\u7684\u66f4\u591a\u8be6\u60c5\u548c\u6700\u4f73\u5b9e\u8df5\u3002\n\n## 30 \u5929\u6298\u6263\u51b7\u5374\u65f6\u95f4\n\n\u4ea7\u54c1\u5728\u6253\u6298\u540e\u7684 30 \u5929\u5185\u4e0d\u80fd\u518d\u6253\u6298\u3002 \u4f46\u8fd9\u6761\u89c4\u5219\u6709\u4e00\u4e2a\u4f8b\u5916\uff1a\n\n- **\u5b63\u8282\u6027\u7279\u5356**\u662f\u5168 Steam \u8303\u56f4\u5185\u7684\u7279\u5356\u6d3b\u52a8\uff0c\u4f8b\u5982\u590f\u65e5\u7279\u5356\u3001\u79cb\u5b63\u7279\u5356\u3001\u51ac\u5b63\u7279\u5356\u548c\u6625\u5b63\u7279\u5356\u3002 \u4e0e\u5176\u4ed6\u6298\u6263\u4e0d\u540c\uff0c\u8fd9\u4e9b\u6d3b\u52a8\u4e0d\u4ea7\u751f 30 \u5929\u7684\u6298\u6263\u51b7\u5374\u65f6\u95f4\uff0c**\u4e14**\u4e0d\u53d7\u5176\u4ed6\u6298\u6263\u7684 30 \u5929\u6298\u6263\u51b7\u5374\u65f6\u95f4\u9650\u5236\u3002 \u8fd9\u610f\u5473\u7740\uff0c\u4ea7\u54c1\u5373\u4f7f\u5728\u67d0\u4e2a\u5b63\u8282\u6027\u7279\u5356\u524d\u540e 30 \u5929\u5185\u5b89\u6392\u4e86\u5176\u4ed6\u6298\u6263\uff0c\u4ecd\u7136\u53ef\u4ee5\u53c2\u52a0\u8be5\u5b63\u8282\u6027\u7279\u5356\u3002 \u5173\u4e8e\u6b64\u4f8b\u5916\u6709\u4e00\u4e9b\u6ce8\u610f\u4e8b\u9879\u5982\u4e0b\uff1a\n\n- \u5b63\u8282\u6027\u7279\u5356\u53ea\u514d\u9664 30 \u5929\u6298\u6263\u51b7\u5374\u65f6\u95f4\u8fd9\u4e00\u9879\u9650\u5236\u3002 \u4f46\u5904\u4e8e\u201c30 \u5929\u53d1\u884c\u51b7\u5374\u65f6\u95f4\u201d\u6216\u201c30 \u5929\u6da8\u4ef7\u51b7\u5374\u65f6\u95f4\u201d\u5185\u7684\u4ea7\u54c1\uff0c\u4ecd\u4e0d\u53ef\u53c2\u4e0e\u5b63\u8282\u6027\u7279\u5356\u3002\n\n  - \u6b64\u4f8b\u5916\u4ec5\u9002\u7528\u4e8e\u4e13\u95e8\u4e3a\u5b63\u8282\u6027\u7279\u5356\u521b\u5efa\u7684\u6298\u6263\uff1b\u8fd9\u4e9b\u6298\u6263\u4f1a\u5728\u6bcf\u6b21\u7279\u5356\u5f00\u59cb\u524d\u51fa\u73b0\u5728[\u6298\u6263\u7ba1\u7406\u4e3b\u9762\u677f](https://partner.steamgames.com/promotion/discounts/dashboard)\u4e2d \u5982\u679c\u60a8\u5728\u4e0e\u5b63\u8282\u6027\u7279\u5356\u5dee\u4e0d\u591a\u7684\u65e5\u671f\u81ea\u884c\u521b\u5efa\u6298\u6263\uff0c\u4e5f\u6ca1\u6709\u95ee\u9898\uff0c\u4f46\u8be5\u6298\u6263\u4e0d\u4f1a\u4eab\u53d7\u8fd9\u4e9b\u4f8b\u5916\u89c4\u5219\u3002\n\n  - \u8bf7\u53c2\u89c1[\u5b63\u8282\u6027\u7279\u5356](https://partner.steamgames.com/doc//marketing/discounts/seasonalsales)\uff0c\u4e86\u89e3\u8be6\u60c5\u548c\u6d3b\u52a8\u65f6\u95f4\u3002\n\n## \u6298\u6263\u95e8\u69db\u548c\u6301\u7eed\u65f6\u95f4\n\n\u6298\u6263\u7684\u8bbe\u7f6e\u9002\u7528\u4ee5\u4e0b\u51c6\u5219\uff1a\n\n- \u5728\u6298\u6263\u8fdb\u884c\u671f\u95f4\uff0c\u6216\u5df2\u5b89\u6392\u4e86\u5728\u672a\u6765\u6253\u6298\u7684\u60c5\u51b5\u4e0b\uff0c\u65e0\u6cd5\u5bf9\u4ea7\u54c1\u7684\u57fa\u7840\u4ef7\u683c\u6da8\u4ef7\u6216\u964d\u4ef7\u3002 \u8bf7\u53c2\u89c1[\u5b9a\u4ef7](https://partner.steamgames.com/doc//store/pricing)\uff0c\u4e86\u89e3\u8bbe\u7f6e\u57fa\u7840\u4ef7\u683c\u7684\u66f4\u591a\u8be6\u60c5\u548c\u6700\u4f73\u5b9e\u8df5\u3002\n\n- \u6298\u6263\u5e45\u5ea6\u4e0d\u80fd\u4f4e\u4e8e 10%\uff0c\u4e5f\u4e0d\u80fd\u9ad8\u4e8e 95%\u3002 \u5c24\u5176\u662f\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\uff0c\u5176\u6298\u6263\u5e45\u5ea6\u4e0d\u5f97\u8d85\u8fc7 40%\u3002\n\n- \u65e0\u6cd5\u4e3a\u4ea7\u54c1\u521b\u5efa\u4f1a\u5bfc\u81f4\u5176\u5728\u4efb\u4e00\u5e01\u79cd\u4e0b\u7684\u4ef7\u683c\u4f4e\u4e8e Steam [\u6700\u4f4e\u4ef7\u683c\u95e8\u69db](https://steamcommunity.com/groups/steamworks/announcements/detail/3700310527377680732)\u7684\u6298\u6263\u3002 \u5982\u679c\u60a8\u5e0c\u671b\u4ee5\u4f4e\u4e8e\u8fd9\u4e9b\u9650\u5236\u7684\u4ef7\u683c\u9500\u552e\u8fd9\u4e9b\u5185\u5bb9\uff0c\u6b22\u8fce\u4f7f\u7528 [Steam \u5e93\u5b58\u670d\u52a1](https://partner.steamgames.com/doc/features/inventory)\u5728\u6e38\u620f\u5185\u9500\u552e\u7269\u54c1\u3002\n\n- \u6298\u6263\u6301\u7eed\u65f6\u95f4\u4e0d\u5f97\u77ed\u4e8e 1 \u5929\u6216\u957f\u4e8e 14 \u5929\u3002 \u5c24\u5176\u662f\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\uff0c\u6301\u7eed\u65f6\u95f4\u4e0d\u5f97\u77ed\u4e8e 7 \u5929\u6216\u957f\u4e8e 14 \u5929\u3002\n\n- \u5982\u679c\u60a8\u7684\u4ea7\u54c1\u5305\u542b\u5728\u4efb\u610f\u6346\u7ed1\u5305\u4e2d\uff0c\u5219\u6346\u7ed1\u5305\u6298\u6263\u5c06\u5e94\u7528\u4e8e\u6346\u7ed1\u5305\u5185\u4ea7\u54c1\u6240\u5404\u81ea\ scounts/seasonalsales)\uff0c\u4e86\u89e3\u6d3b\u52a8\u65f6\u95f4\u3002 |\n\n## \u6298\u6263\u5236\u5b9a\u6700\u4f73\u5b9e\u8df5\n\n## \u8003\u8651\u4ea7\u54c1\u7684\u9500\u552e\u8870\u51cf\u66f2\u7ebf\u548c\u6240\u63d0\u4f9b\u7684\u5185\u5bb9\n\nSteam \u7684[\u9500\u552e\u4e0e\u6fc0\u6d3b\u62a5\u544a](https://partner.steampowered.com/)\u63d0\u4f9b\u4e86\u8bb8\u591a\u6570\u636e\u3001\u4e3b\u9762\u677f\u53ca\u53ef\u4e0b\u8f7d\u7684 .csv \u6587\u4ef6\uff0c\u5e2e\u52a9\u60a8\u4e86\u89e3\u73a9\u5bb6\u3001\u9500\u91cf\u548c\u8425\u6536\u662f\u5982\u4f55\u968f\u65f6\u95f4\u53d8\u5316\u7684\u3002 \u8fd9\u4e5f\u6709\u52a9\u4e8e\u5f15\u5bfc\u60a8\u5236\u5b9a\u6298\u6263\u7b56\u7565\u3002 \u4f8b\u5982\uff0c\u60a8\u53ef\u80fd\u4f1a\u60f3\u5728\u4f5c\u54c1\u53d1\u5e03\u4e0d\u4e45\u540e\uff0c\u63d0\u4f9b\u8f83\u5c0f\u529b\u5ea6\u7684\u6298\u6263\uff0c\u4ee5\u767b\u4e0a\u70ed\u9500\u5546\u54c1\u6392\u884c\u699c\u6216\u83b7\u5f97\u66f4\u591a\u7684\u66dd\u5149\uff1b\u4f46\u5728\u8f93\u5165\u6298\u6263\u4e4b\u524d\uff0c\u8bf7\u5148\u8ba4\u771f\u4e86\u89e3\u4e00\u4e0b\u6709\u591a\u5c11\u987e\u5ba2\u4ee5\u5168\u4ef7\u8d2d\u4e70\u4e86\u60a8\u7684\u4ea7\u54c1\u3002 \u8ba9\u987e\u5ba2\u89c9\u5f97\u81ea\u5df1\u7684\u8d2d\u4e70\u7269\u6709\u6240\u503c\u5f88\u91cd\u8981\uff0c\u56e0\u6b64\uff0c\u6700\u597d\u7b49\u60a8\u7684\u4ea7\u54c1\u8fdb\u5165\u9500\u552e\u66f2\u7ebf\u7684\u5c3e\u90e8\u9636\u6bb5\u540e\uff0c\u518d\u5f00\u59cb\u4f7f\u7528\u6298\u6263\u3002 \u76f8\u53cd\uff0c\u5982\u679c\u662f\u5904\u4e8e\u751f\u547d\u5468\u671f\u201c\u957f\u5c3e\u201d\u9636\u6bb5\u7684\u8001\u6e38\u620f\uff0c\u4f46\u6709\u7740\u826f\u597d\u7684\u7559\u5b58\u7387\u548c\u4e30\u5bcc\u7684 DLC \u76ee\u5f55\uff0c\u5219\u53ef\u4ee5\u8003\u8651\u5bf9\u57fa\u7840\u6e38\u620f\u63d0\u4f9b\u66f4\u5927\u7684\u6298\u6263\uff0c\u4ee5\u671f\u4e3a\u6240\u63d0\u4f9b\u7684 DLC \u6253\u9020\u66f4\u591a\u6f5c\u5728\u7684\u53d7\u4f17\u3002\n\n## \u9636\u68af\u5f0f\u6298\u6263\n\n\u901a\u5e38\u6700\u4f73\u505a\u6cd5\u662f\u9010\u6b65\u6253\u6298\uff0c\u5e76\u968f\u7740\u65f6\u95f4\u7684\u63a8\u79fb\u63d0\u9ad8\u6298\u6263\u767e\u5206\u6bd4\u3002 \u4f8b\u5982\uff0c\u4e00\u4e2a\u4ea7\u54c1\u53ef\u80fd\u4f1a\u5728\u4e00\u5e74\u751a\u81f3\u66f4\u957f\u65f6\u95f4\u91cc\uff0c\u9010\u6b65\u628a\u6298\u6263\u4ece 33% \u63d0\u9ad8\u5230 50%\uff0c\u518d\u5230 66%\u300175%\uff0c\u751a\u81f3\u66f4\u9ad8\u3002 \u5728\u53d1\u884c\u540e\u51e0\u5468\u5185\u4fbf\u6025\u4e8e\u5c06\u6298\u6263\u7387\u63d0\u9ad8\u81f3 50% \u6216 75%\uff0c\u6216\u8005\u53d1\u884c\u4ea7\u54c1\u65f6\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u529b\u5ea6\u8fc7\u5927\uff0c\u5c06\u4f1a\u5411\u90a3\u4e9b\u4ee5\u5168\u4ef7\u8d2d\u4e70\u60a8\u4ea7\u54c1\u7684\u987e\u5ba2\u4f20\u8fbe\u8d1f\u9762\u4fe1\u606f\uff0c\u4ece\u800c\u7834\u574f\u60a8\u4ea7\u54c1\u7684\u4ef7\u503c\u3002\n\n## \u914d\u5408\u5185\u5bb9\u66f4\u65b0\u8fdb\u884c\u6298\u6263\n\n\u5728\u5236\u5b9a\u6298\u6263\u8ba1\u5212\u65f6\uff0c\u5c3d\u91cf\u628a\u6bcf\u6b21\u6d3b\u52a8\u505a\u51fa\u58f0\u52bf\uff0c\u6700\u597d\u8fd8\u80fd\u628a\u6298\u6263\u548c\u5185\u5bb9\u66f4\u65b0\u7ed3\u5408\u5728\u4e00\u8d77\u63a8\u51fa\u3002 \u867d\u7136\u6298\u6263\u53ef\u4ee5\u5438\u5f15\u5173\u6ce8\uff0c\u4f46\u66f4\u7406\u60f3\u7684\u662f\u901a\u8fc7\u5185\u5bb9\u66f4\u65b0\u6765\u6539\u8fdb\u4ea7\u54c1\uff0c\u8ba9\u73a9\u5bb6\u770b\u5230\u60a8\u5bf9\u793e\u533a\u7684\u6301\u7eed\u6295\u5165\u3002\n\n## \u540c\u65f6\u5bf9\u6240\u6709\u5173\u8054\u7a0b\u5e8f\u5305\uff08DLC\u3001\u8c6a\u534e\u7248\uff09\u6253\u6298\n\n\u5982\u679c\u60a8\u7684\u4ea7\u54c1\u6709\u591a\u4e2a\u7248\u672c\u6216 DLC\uff0c\u8bf7\u5728\u540c\u4e00\u65f6\u95f4\u4e00\u8d77\u6253\u6298\u3002 \u5982\u679c\u60a8\u53ea\u7ed9\u90e8\u5206\u4ea7\u54c1\u6253\u6298\uff0c\u6216\u8005\u8fd9\u5468\u57fa\u7840\u7248\u6253\u6298\u3001\u4e0b\u5468\u8c6a\u534e\u7248\u518d\u6253\u6298\uff0c\u5c31\u4f1a\u5206\u6563\u66dd\u5149\u6548\u679c\uff0c\u4e5f\u4f1a\u8ba9\u60a8\u9519\u5931 Steam \u4e0a\u56e0\u66f4\u591a\u7528\u6237\u540c\u65f6\u5bf9\u60a8\u7684\u4ea7\u54c1\u4ea7\u751f\u5174\u8da3\u800c\u5e26\u6765\u7684\u5404\u79cd\u7f51\u7edc\u6548\u5e94\u3002 \u60a8\u6ca1\u6709\u5fc5\u8981\u5728\u5404\u4e2a\u7a0b\u5e8f\u5305\u4e0a\u4f7f\u7528\u76f8\u540c\u7684\u6298\u6263\u3002 \u4f8b\u5982\uff0c\u5982\u679c\u4e00\u4e2a DLC \u5df2\u7ecf\u63a8\u51fa\u4e86\u4e00\u5e74\uff0c\u800c\u53e6\u4e00\u4e2a\u624d\u521a\u521a\u4e0a\u7ebf\uff0c\u90a3\u4e48\u4e3a\u5b83\u4eec\u8bbe\u7f6e\u4e0d\u540c\u7684\u6298\u6263\u529b\u5ea6\u6216\u8bb8\u662f\u5408\u7406\u7684\u3002\n\n**\u6298\u6263\u53e0\u52a0\uff1a**\u8bf7\u6ce8\u610f\uff0c\u6346\u7ed1\u5305\u6298\u6263\u4f1a\u53e0\u52a0\u5728\u6346\u7ed1\u5305\u5185\u5404\u7a0b\u5e8f\u5305\u5df2\u6709\u7684\u6298\u6263**\u4e4b\u4e0a**\u3002\n\n## \u6298\u6263\u793a\u4f8b\n\n\u4ee5\u4e0b\u662f\u4e0a\u8ff0\u6298\u6263\u89c4\u5219\u5b9e\u9645\u8fd0\u7528\u7684\u4e00\u4e9b\u5e38\u89c1\u793a\u4f8b\u3002 \u5728\u8fd9\u4e9b\u793a\u4f8b\u4e2d\uff0c\u6211\u4eec\u5c06\u4f7f\u7528\u4e00\u6b3e\u540d\u4e3a Bass Ain't Bitin' 2 \u7684\u865a\u6784\u9493\u9c7c\u6e38\u620f\uff0c\u5e76\u4e00\u8def\u5c55\u793a\u8be5\u6e38\u620f\u4ece\u62a2\u5148\u4f53\u9a8c\u7b2c\u4e00\u5e74\u5230 1.0 \u7248\u672c\u53d1\u884c\u7684\u8fc7\u7a0b\u3002\n\n\u8fd9\u4e9b\u793a\u4f8b\u5e76\u4e0d\u662f\u8981\u89c4\u5b9a\u60a8\u5fc5\u987b\u600e\u4e48\u505a\u3002 \u4e0e\u5f80\u5e38\u4e00\u6837\uff0c\u4ef7\u683c\u548c\u6298\u6263\u90fd\u7531\u5408\u4f5c\u4f19\u4f34\u81ea\u884c\u8bbe\u5b9a\uff0c\u6211\u4eec\u4e5f\u9f13\u52b1\u5927\u5bb6\u5728\u4e0a\u8ff0\u51c6\u5219\u8303\u56f4\u5185\u4e0d\u65ad\u6253\u78e8\u81ea\u5df1\u7684\u6298\u6263\u7b56\u7565\u3002 \u8fd9\u4e9b\u793a\u4f8b\u65e8\u5728\u8bf4\u660e\u5404\u79cd\u6298\u6263\u89c4\u5219\u662f\u5982\u4f55\u5f7c\u6b64\u914d\u5408\u3001\u76f8\u4e92\u5f71\u54cd\u7684\uff0c\u4ee5\u53ca\u60a8\u5728\u89c4\u5212\u4ef7\u683c\u8c03\u6574\u548c\u6298\u6263\u65f6\u9700\u8981\u5982\u4f55\u628a\u8fd9\u4e9b\u76f8\u4e92\u4f5c\u7528\u8003\u8651\u8fdb\u53bb\u3002\n\n## \u793a\u4f8b 1\uff1a\u5f00\u542f\u62a2\u5148\u4f53\u9a8c\n\nBass Ain't Bitin' 2 \u5e0c\u671b\u5728 11 \u6708 15 \u65e5\u5f00\u542f\u62a2\u5148\u4f53\u9a8c\u3002 \u8fd9\u6b3e\u6e38\u620f\u5e0c\u671b\u5728\u62a2\u5148\u4f53\u9a8c\u53d1\u884c\u65f6\u63a8\u51fa\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\uff0c\u540c\u65f6\u8fd8\u60f3\u53c2\u52a0\u5f53\u5e74\u7a0d\u665a\u4e00\u4e9b\u3001\u4e8e 12 \u6708 17 \u65e5\u5f00\u59cb\u7684 Steam \u51ac\u5b63\u7279\u5356\u3002 \u4e3a\u4e86\u540c\u65f6\u63d0\u4f9b\u8fd9\u4e24\u9879\u6298\u6263\uff0c\u6e38\u620f\u51b3\u5b9a\u8bbe\u7f6e\u4ece 11 \u6708 15 \u65e5\u81f3 22 \u65e5\u4e3a\u671f 7 \u5929\u7684\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u3002 11 \u6708\u6709 30 \u5929\uff0c\u56e0\u6b64\uff0c11 \u6708 15 \u65e5\u62a2\u5148\u4f53\u9a8c\u53d1\u884c\u6240\u89e6\u53d1\u7684\u201c30 \u5929\u53d1\u884c\u51b7\u5374\u65f6\u95f4\u201d\u4f1a\u5728 12 \u6708 15 \u65e5\u7ed3\u675f\uff0c\u4ece\u800c\u4f7f\u8be5\u6e38\u620f\u80fd\u591f\u53c2\u52a0 12 \u6708 17 \u65e5\u5f00\u59cb\u7684\u51ac\u5b63\u7279\u5356\u3002 \u8bf7\u6ce8\u610f\uff1a\u5b63\u8282\u6027\u7279\u5356\u4e0d\u53d7\u5176\u4ed6\u6298\u6263\u6240\u4ea7\u751f\u7684\u6298\u6263\u51b7\u5374\u65f6\u95f4\u9650\u5236\uff0c\u56e0\u6b64\uff0c11 \u6708 15 \u65e5\u81f3 22 \u65e5\u7684\u9996\u53d1\u6298\u6263\u5373\u4fbf\u4e0e 12 \u6708 17 \u65e5\u7684\u51ac\u5b63\u7279\u5356\u76f8\u9694\u4e0d\u8db3 30 \u5929\uff0c\u4e5f\u4e0d\u4f1a\u5f71\u54cd\u8be5\u6e38\u620f\u53c2\u52a0\u51ac\u5b63\u7279\u5356\u3002\n\n## \u793a\u4f8b 2\uff1a\u4ee5\u4e00\u6b21\u6298\u6263\u53c2\u52a0\u591a\u4e2a\u7cbe\u9009\u6d3b\u52a8\n\n\u7b2c\u4e8c\u5e74\u6625\u672b\uff0c\u4e00\u5207\u8fdb\u5c55\u987a\u5229\uff0cBass Ain't Bitin' 2 \u88ab\u9080\u8bf7\u53c2\u52a0 6 \u6708\u7684\u4e09\u573a\u7cbe\u9009\u6d3b\u52a8\uff01 \u8fd9\u4e9b\u6d3b\u52a8\u5305\u62ec 6 \u6708 10 \u65e5\u81f3 14 \u65e5\u7684\u9493\u9c7c\u6e38\u620f\u8282\u30016 \u6708 18 \u65e5\u81f3 20 \u65e5\u7684\u72ec\u7acb\u6e38\u620f\u5956\u5c55\u793a\u6d3b\u52a8\u4ee5\u53ca 6 \u6708 12 \u65e5\u7684\u6bcf\u65e5\u7279\u60e0\u3002 \u4e3a\u6b64\uff0cBass Ain't Bitin' \u8bbe\u7f6e\u4e86\u4e00\u4e2a\u81ea\u5b9a\u4e49\u6298\u6263\uff0c\u7528\u6765\u8986\u76d6\u8fd9\u4e09\u573a\u6d3b\u52a8\u7684\u6574\u4e2a\u65f6\u95f4\u8303\u56f4\u3002 \u5b83\u9009\u62e9\u4ece 6 \u6708 10 \u65e5\u81f3 20 \u65e5\u6253\u6298 20\uff05\u3002 \u8fd9\u610f\u5473\u7740\uff0c\u8be5\u6e38\u620f\u4f1a\u5728\u8fd9\u4e09\u573a\u7cbe\u9009\u6d3b\u52a8\u4e2d\u90fd\u4ee5 20% \u7684\u6298\u6263\u4eae\u76f8\uff0c\u800c\u8fd9\u4e00\u9879\u6298\u6263\u53ea\u4f1a\u4ea7\u751f\u4e00\u6b21 30 \u5929\u7684\u6298\u6263\u51b7\u5374\u65f6\u95f4\u3002 \u8fd9\u4e2a\u6298\u6263\u51b7\u5374\u671f\u5c06\u4ece 6 \u6708 20 \u65e5\u4e0a\u5348 10 \u65f6\uff08PT\uff09\u6298\u6263\u7ed3\u675f\u65f6\u5f00\u59cb\uff0c\u81f3 7 \u6708 20 \u65e5\u5f53\u5929\u7684\u540c\u4e00\u65f6\u95f4\u7ed3\u675f\u3002\n\n- \u5047\u8bbe\u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0c\u590f\u65e5\u7279\u5356\u4ece 6 \u6708 27 \u65e5\u5f00\u59cb\u3002 \u5982\u679c Bass Ain't Bitin' 2 \u613f\u610f\u7684\u8bdd\uff0c\u4e5f\u53ef\u4ee5\u52a0\u5165\u590f\u65e5\u7279\u5356\u6298\u6263\u6d3b\u52a8\uff0c\u56e0\u4e3a\u590f\u65e5\u7279\u5356\u4e0d\u53d7\u81ea\u5b9a\u4e49\u6298\u6263\u4ea7\u751f\u7684 30 \u5929\u51b7\u5374\u671f\u7684\u5f71\u54cd\u3002\n\n  - \u7cdf\u7cd5\uff01 \u5047\u8bbe\u9493\u9c7c\u6e38\u620f\u8282\u9700\u8981\u7d27\u6025\u6539\u671f\u4e3a 6 \u6708 1 \u65e5\u81f3 4 \u65e5\u3002 \u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0cBass Ain't Bitin' 2 \u5c31\u5fc5\u987b\u505a\u51fa\u9009\u62e9\uff1a\u662f\u4e3a\u9493\u9c7c\u6e38\u620f\u8282\u6253\u6298\uff0c\u8fd8\u662f\u4e3a\u72ec\u7acb\u6e38\u620f\u5956\u5c55\u793a\u6d3b\u52a8\u6253\u6298\u3002 \u5b83\u4e0d\u80fd\u6253\u6298\u53c2\u52a0\u4e24\u9879\u6d3b\u52a8\uff0c\u56e0\u4e3a\u8fd9\u4e24\u4e2a\u7cbe\u9009\u6d3b\u52a8\u76f8\u9694\u5c06\u8d85\u8fc7 14 \u5929\uff0c\u800c\u81ea\u5b9a\u4e49\u6298\u6263\u7684\u6700\u957f\u6301\u7eed\u65f6\u95f4\u5c31\u662f 14 \u5929\u3002 \u4e0d\u8fc7\uff0c\u65e0\u8bba\u5b83\u9009\u62e9\u4e3a\u54ea\u4e00\u573a\u6d3b\u52a8\u63d0\u4f9b\u6298\u6263\uff0c\u5b83\u4ecd\u7136\u53ef\u4ee5\u5728\u53e6\u4e00\u573a\u6d3b\u52a8\u4e2d\u4ee5\u5e38\u89c4\uff08\u975e\u6298\u6263\uff09\u57fa\u7840\u4ef7\u683c\u83b7\u5f97\u5c55\u793a\uff0c\u540c\u65f6\u4e5f\u4f9d\u7136\u53ef\u4ee5\u53c2\u52a0 6 \u6708 27 \u65e5\u7684\u590f\u65e5\u7279\u5356\u6298\u6263\u3002\n\n**\u7cbe\u9009\u4e0e\u6298\u6263\uff1a**\u6709\u4e00\u70b9\u4e0d\u592a\u4e3a\u4eba\u719f\u77e5\uff0c\u90a3\u5c31\u662f\u5728\u67d0\u4e9b\u7cbe\u9009\u5546\u5e97\u9875\u9762\u4e2d\uff0c\u4f8b\u5982\u5728\u4e3b\u9898\u6e38\u620f\u8282\u6216\u5c55\u793a\u6d3b\u52a8\u9875\u9762\u4e2d\uff0c\u6e38\u620f\u65e0\u8bba\u662f\u63d0\u4f9b\u4f55\u79cd\u6298\u6263\uff0c\u751a\u81f3\u5b8c\u5168\u4e0d\u6253\u6298\uff0c\u4e5f\u90fd\u53ef\u4ee5\u83b7\u5f97\u5c55\u793a\u3002 \u5982\u679c\u67d0\u6b3e\u6e38\u620f\u5728\u83b7\u5f97\u5c55\u793a\u65f6\u6ca1\u6709\u6298\u6263\uff0c\u4e5f\u6ca1\u6709\u5173\u7cfb\uff0c\u5b83\u4f1a\u6309\u5e38\u89c4\u57fa\u7840\u4ef7\u683c\u8fdb\u884c\u5c55\u793a\u3002\n\n\u4e0d\u8fc7\u8bf7\u8bb0\u4f4f\uff0c\u5728\u90a3\u4e9b\u4e13\u95e8\u7528\u4e8e\u5c55\u793a\u6298\u6263\u4ea7\u54c1\u7684\u7248\u4f4d\u4e2d\uff0c\u4f8b\u5982\u5468\u672b\u7279\u60e0\u6216\u5b63\u8282\u6027\u7279\u5356\uff0c\u6e38\u620f\u4e0d\u80fd\u4ee5\u5e38\u89c4\u4ef7\u683c\uff08\u5168\u4ef7\uff09\u83b7\u5f97\u5c55\u793a\u3002\n\n## \u793a\u4f8b 3\uff1a\u5728\u53d1\u884c 1.0 \u7248\u65f6\u6da8\u4ef7\n\nBass Ain't Bitin' 2 \u5728\u62a2\u5148\u4f53\u9a8c\u7684\u7b2c\u4e00\u5e74\u91cc\u7ecf\u5386\u4e86\u591a\u6b21\u5927\u578b\u66f4\u65b0\uff0c\u73b0\u5728\u8ba4\u4e3a\uff0c\u8003\u8651\u5230\u57fa\u7840\u6e38\u620f\u65b0\u589e\u4e86\u8fd9\u4e48\u591a\u5185\u5bb9\uff0c\u5df2\u7ecf\u5230\u4e86\u9002\u5408\u6da8\u4ef7\u7684\u65f6\u5019\u3002 \u5b83\u7684 1.0 \u7248\u53d1\u884c\u65e5\u671f\uff08\u4e5f\u5373\u7ed3\u675f\u62a2\u5148\u4f53\u9a8c\u7684\u65e5\u671f\uff09\u5373\u5c06\u5728 10 \u6708 15 \u65e5\u5230\u6765\uff0c\u4f46\u5b83\u5e0c\u671b\u5728\u62a2\u5148\u4f53\u9a8c\u7ed3\u675f\u524d\u8fdb\u884c\u6700\u540e\u4e00\u6b21\u81ea\u5b9a\u4e49\u6298\u6263\uff0c**\u5e76\u4e14**\u8fd8\u5e0c\u671b\u4e3a 1.0 \u7248\u53d1\u884c\u8fdb\u884c\u53e6\u4e00\u6b21\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u3002 \u8003\u8651\u5230\u8fd9\u4e9b\u51b7\u5374\u65f6\u95f4\u7684\u9650\u5236\uff0c\u5b83\u8be5\u5982\u4f55\u5b89\u6392\u6da8\u4ef7\u3001\u81ea\u5b9a\u4e49\u6298\u6263\u30011.0 \u7248\u53d1\u884c\u548c\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u5462\uff1f \u53ef\u80fd\u7684\u89e3\u51b3\u65b9\u6cd5\u5982\u4e0b\uff1a\n\n- 9 \u6708 1 \u65e5\uff0cBass Ain't Bitin' 2 \u4ee5\u5f53\u65f6\u7684\u62a2\u5148\u4f53\u9a8c\u4ef7\u683c\u4e3a\u57fa\u7840\u8bbe\u7f6e\u4e86\u4e00\u4e2a\u4e3a\u671f 14 \u5929\u7684\u6298\u6263\u3002 \u4e0e\u6b64\u540c\u65f6\uff0c\u5b83\u8fd8\u5ba3\u5e03\u8981\u5728\u6b64\u6b21\u7279\u5356\u7ed3\u675f\u540e\u6da8\u4ef7\u3002 \u6700\u597d\u80fd\u63d0\u524d\u5ba3\u5e03\u6da8\u4ef7\uff0c\u4ee5\u4fbf\u8ba9\u793e\u533a\u6709\u65f6\u95f4\u505a\u597d\u51c6\u5907\u3002\n\n  - \u6b64\u6b21\u6298\u6263\u4e8e 9 \u6708 14 \u65e5\u7ed3\u675f\uff0c\u7136\u540e\u6e38\u620f\u7acb\u5373\u6da8\u4ef7\uff0c\u4e3a\u5373\u5c06\u5230\u6765\u7684 1.0 \u7248\u53d1\u884c\u505a\u51c6\u5907\u3002 \u8fd9\u610f\u5473\u7740\u81ea\u5b9a\u4e49\u6298\u6263\u5e26\u6765\u7684 30 \u5929\u6298\u6263\u51b7\u5374\u671f\u4e0e\u6da8\u4ef7\u5e26\u6765\u7684 30 \u5929\u51b7\u5374\u671f\u91cd\u5408\u3002 \u5b9e\u9645\u4e0a\uff0c\u4e24\u4e2a 30 \u5929\u51b7\u5374\u540c\u65f6\u8fdb\u884c\u3002\n\n  - \u63a5\u7740\uff0c30 \u5929\u8fc7\u540e\u7684 10 \u6708 14 \u65e5\uff0c\u4e24\u4e2a\u51b7\u5374\u671f\u7ed3\u675f\u3002 \u7b2c\u4e8c\u5929\uff0c\u4e5f\u5c31\u662f 10 \u6708 15 \u65e5\uff0c\u6e38\u620f\u6b63\u5f0f\u53d1\u884c 1.0 \u7248\u672c\uff0c\u5e76\u63a8\u51fa\u9996\u53d1\u964d\u4ef7\u4f18\u60e0\u3002\n\n  - \u6216\u8005\uff0cBass Ain't Bitin' 2 \u4e5f\u5b8c\u5168\u53ef\u4ee5\u9009\u62e9\u5728\u9996\u53d1\u6298\u6263\u7ed3\u675f \u8d77\u4fee\u3002\n5. **\u201c\u5b8c\u5168\u7b49\u540c Steam\u201d\u4e0d\u80fd\u53ea\u770b\u8fd9\u51e0\u9875\u6587\u6863\u3002** \u672c\u53f0\u8d26\u4ec5\u8986\u76d6\u672c\u6b21\u4e89\u8bae\uff1bBuild\u3001Branch\u3001\u4e0a\u4f20\u3001\u53d1\u5e03\u3001Key\u3001SDK \u7b49\u5168\u94fe\u8def\u5c1a\u672a\u5b8c\u6210\u9010\u6761\u5bf9\u7167\uff0c\u4e0d\u5e94\u628a\u5c40\u90e8\u4fee\u8ba2\u7a3f\u6807\u4e3a\u5168\u7ad9 1:1 \u5b8c\u6210\u3002\n", "\u5185\u5bb9\u8c03\u67e5": "# \u5185\u5bb9\u8c03\u67e5\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/gettingstarted/contentsurvey\n\n## \u6982\u89c8\n\n\u5728\u63d0\u4ea4\u5546\u5e97\u9875\u9762\u548c\u4ea7\u54c1\u751f\u6210\u7248\u672c\u4f9b\u5ba1\u6838\u4e4b\u524d\uff0c\u60a8\u9700\u8981\u5148\u5b8c\u6210\u4e00\u4efd\u5185\u5bb9\u8c03\u67e5\u3002 \u5404\u4f4d\u5728\u8c03\u67e5\u4e2d\u7684\u56de\u7b54\u6709\u52a9\u4e8e\u6211\u4eec\u5728\u4ea7\u54c1\u53d1\u884c\u524d\u5bf9\u5176\u8fdb\u884c\u5ba1\u6838\uff0c\u540c\u65f6\u4e5f\u4f1a\u5e2e\u52a9\u987e\u5ba2\u4e86\u89e3\u4ea7\u54c1\u5185\u5bb9\u662f\u5426\u7b26\u5408\u81ea\u5df1\u7684\u9884\u671f\u53ca\u5e10\u6237\u504f\u597d\u3002\n\n\u5728\u5b8c\u6210\u5185\u5bb9\u8c03\u67e5\u5e76\u63d0\u4ea4\u4ea7\u54c1\u4f9b\u6211\u4eec\u5ba1\u6838\u540e\uff0c\u6211\u4eec\u7684\u56e2\u961f\u4f1a\u5c06\u60a8\u7684\u56de\u7b54\u4e0e\u751f\u6210\u7248\u672c\u53ca\u5546\u5e97\u9875\u9762\u4e2d\u7684\u5185\u5bb9\u8fdb\u884c\u6bd4\u8f83\u3002\n\n## \u5185\u5bb9\u8c03\u67e5\u7684\u6784\u6210\n\n\u5185\u5bb9\u8c03\u67e5\u5305\u542b\u4e09\u5927\u90e8\u5206\uff0c\u5747\u987b\u5728\u63d0\u4ea4\u6e38\u620f\u4ee5\u542f\u52a8[\u5ba1\u6838\u6d41\u7a0b](https://partner.steamgames.com/doc/store/review_process)\u4e4b\u524d\u5b8c\u6210\u3002\n\n## 1\uff09\u4e00\u822c\u5185\u5bb9\n\n\u5185\u5bb9\u8c03\u67e5\u7b2c\u4e00\u90e8\u5206\u5305\u62ec\u4e00\u7cfb\u5217\u53ef\u80fd\u5728\u60a8\u7684\u6e38\u620f\u4e2d\u5448\u73b0\u7684\u4e3b\u9898\u3002\n\n\u5b8c\u6210\u8fd9\u4e00\u90e8\u5206\u7684\u8c03\u67e5\u540e\uff0c\u5c06\u4f1a\u751f\u6210\u51e0\u4e2a\u533a\u57df\u6027\u5206\u7ea7\u59d4\u5458\u4f1a\u7684\u5185\u5bb9\u5206\u7ea7\uff0c\u8fd9\u4e9b\u5206\u7ea7\u4f1a\u5728\u6e38\u620f\u53d1\u884c\u540e\u5728\u60a8\u7684\u5546\u5e97\u9875\u9762\u5c55\u793a\u3002 \u8fd9\u4e9b\u6570\u636e\u4eca\u540e\u4e5f\u53ef\u7528\u4e8e\u751f\u6210\u5176\u4ed6\u7684\u533a\u57df\u6027\u5206\u7ea7\u3002\n\n\u5982\u679c\u60a8\u5df2\u7ecf\u62e5\u6709\u5b98\u65b9\u5206\u7ea7\u673a\u6784\u76f4\u63a5\u4e3a\u60a8\u6e38\u620f\u63d0\u4f9b\u7684\u5206\u7ea7\uff0c\u60a8\u53ef\u4ee5\u5728\u6e38\u620f\u7684\u5206\u7ea7\u680f\u76ee\u4e2d\u8f93\u5165\u8fd9\u4e9b\u5206\u7ea7\u3002\n\n## 2\uff09\u6210\u4eba\u5185\u5bb9\n\n\u5728\u8c03\u67e5\u7684\u7b2c\u4e8c\u90e8\u5206\u4e2d\uff0c\u60a8\u5fc5\u987b\u62ab\u9732\u73a9\u5bb6\u53ef\u80fd\u9047\u5230\u7684\u6240\u6709\u6210\u4eba\u5185\u5bb9\u3002\n\n\u60a8\u5728\u672c\u90e8\u5206\u63d0\u4f9b\u7684\u4fe1\u606f\uff0c\u5c06\u51b3\u5b9a\u60a8\u7684\u6e38\u620f\u5982\u4f55\u6839\u636e\u6bcf\u4f4d\u987e\u5ba2\u7684\u504f\u597d\u8fdb\u884c\u5c55\u793a\u3002 \u7531\u4e8e\u66b4\u529b\u4e0e\u6027\u63cf\u5199\u7b49\u6210\u4eba\u5185\u5bb9\u5728\u672c\u8d28\u4e0a\u53ef\u80fd\u5c5e\u4e8e\u654f\u611f\u9898\u6750\uff0c\u56e0\u6b64\u5982\u5b9e\u3001\u51c6\u786e\u5730\u62ab\u9732\u4fe1\u606f\u81f3\u5173\u91cd\u8981\u3002\n\n\u60a8\u5fc5\u987b\u62ab\u9732\u60a8\u751f\u6210\u7248\u672c\u5185\u4e0a\u4f20\u7684\u6240\u6709\u6210\u4eba\u5185\u5bb9\uff0c\u5373\u4f7f\u8fd9\u4e9b\u5185\u5bb9\u65e0\u6cd5\u88ab\u73a9\u5bb6\u8bbf\u95ee\u5230\uff0c\u6216\u5e76\u672a\u5728\u60a8\u7684\u4ea7\u54c1\u4e2d\u76f4\u63a5\u5c55\u793a\u3002\n\n## 3\uff09\u751f\u6210\u5f0f AI \u5185\u5bb9\n\n\u8c03\u67e5\u7684\u7b2c\u4e09\u90e8\u5206\u662f\u5173\u4e8e\u6e38\u620f\u5f00\u53d1\u6216\u8fd0\u884c\u8fc7\u7a0b\u4e2d\u5bf9\u751f\u6210\u5f0f AI \u7684\u4f7f\u7528\u3002\n\n\u6211\u4eec\u77e5\u9053\uff0c\u8bb8\u591a\u73b0\u4ee3\u7684\u6e38\u620f\u5f00\u53d1\u73af\u5883\u90fd\u5185\u7f6e\u4e86\u7531 AI \u9a71\u52a8\u7684\u5de5\u5177\u3002 \u901a\u8fc7\u4f7f\u7528\u8fd9\u4e9b\u5de5\u5177\u63d0\u9ad8\u6548\u7387\u5e76\u975e\u672c\u8282\u7684\u91cd\u70b9\u3002 \u672c\u8282\u5173\u6ce8\u7684\u662f\u4f7f\u7528 AI \u521b\u5efa\u5305\u542b\u5728\u6e38\u620f\u4e2d\u4f9b\u73a9\u5bb6\u6d88\u8d39\u7684\u5185\u5bb9\u3002 \u8fd9\u5176\u4e2d\u5305\u62ec\u4e86\u827a\u672f\u4f5c\u54c1\u3001\u97f3\u6548\u3001\u53d9\u4e8b\u3001\u672c\u5730\u5316\u7b49\u7b49\u5185\u5bb9\u3002\n\n\u5982\u679c\u60a8\u7684\u6e38\u620f\u5728\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u4f7f\u7528\u4e86 AI \u670d\u52a1\uff0c\u6216 AI \u670d\u52a1\u5c5e\u4e8e\u4ea7\u54c1\u7684\u7ec4\u6210\u90e8\u5206\uff0c\u60a8\u9700\u8981\u5728\u8fd9\u90e8\u5206\u8be6\u7ec6\u63cf\u8ff0\u8fd9\u662f\u5982\u4f55\u5b9e\u73b0\u7684\uff1a\n\n- **\u9884\u751f\u6210\u5185\u5bb9\uff1a**\u4efb\u4f55\u5305\u542b\u5728\u6e38\u620f\u4e2d\u4f9b\u73a9\u5bb6\u6d88\u8d39\u3001\u4e14\u5728\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u501f\u52a9 AI \u5de5\u5177\u521b\u5efa\u7684\u5185\u5bb9\u3002 \u5728\u300aSteam \u5206\u9500\u534f\u8bae\u300b\u4e2d\uff0c\u5404\u4f4d\u66fe\u5411 Valve \u627f\u8bfa\u81ea\u5df1\u7684\u6e38\u620f\u4e0d\u4f1a\u5305\u542b\u975e\u6cd5\u6216\u4fb5\u6743\u5185\u5bb9\uff0c\u4e14\u6e38\u620f\u5c06\u4e0e\u8425\u9500\u6750\u6599\u4fdd\u6301\u4e00\u81f4\u3002 \u6211\u4eec\u5728\u53d1\u884c\u524d\u7684\u5ba1\u6838\u8fc7\u7a0b\u4e2d\uff0c\u4f1a\u4ee5\u4e0e\u975e AI \u5185\u5bb9\u5b8c\u5168\u76f8\u540c\u7684\u6807\u51c6\u6765\u8bc4\u4f30\u6e38\u620f\u4e2d\u7684 AI \u751f\u6210\u5185\u5bb9\u2014\u2014\u5176\u4e2d\u5c31\u5305\u62ec\u68c0\u67e5\u60a8\u7684\u6e38\u620f\u662f\u5426\u7b26\u5408\u4e0a\u8ff0\u627f\u8bfa\u3002\n\n- **\u5b9e\u65f6\u751f\u6210\u5185\u5bb9\uff1a**\u5728\u6e38\u620f\u8fd0\u884c\u8fc7\u7a0b\u4e2d\u501f\u52a9 AI \u5de5\u5177\u751f\u6210\u7684\u5185\u5bb9\u3002 \u9664\u4e86\u987b\u9075\u5faa\u4e0e\u9884\u751f\u6210\u5185\u5bb9\u4e00\u6837\u7684\u89c4\u5219\u5916\uff0c\u6b64\u7c7b\u5185\u5bb9\u8fd8\u987b\u6ee1\u8db3\u4e00\u9879\u989d\u5916\u6761\u4ef6\u2014\u2014\u5728\u5185\u5bb9\u8c03\u67e5\u4e2d\uff0c\u5404\u4f4d\u9700\u8981\u544a\u77e5\u6211\u4eec\u60a8\u5bf9 AI \u8bbe\u7f6e\u4e86\u54ea\u4e9b\u5b89\u5168\u62a4\u680f\uff0c\u4ee5\u786e\u4fdd\u5176\u4e0d\u4f1a\u751f\u6210\u975e\u6cd5\u5185\u5bb9\u3002\n\n\u987a\u4fbf\u4e00\u63d0\uff0c\u6e38\u620f\u4e2d\u7684 AI \u6b63\u5728\u98de\u901f\u53d1\u5c55\uff0c\u6211\u4eec\u5e0c\u671b\u80fd\u5728\u7ba1\u63a7 AI \u65f6\u505a\u5230\u6070\u5982\u5176\u5206\u3002 \u8bb8\u591a\u827a\u672f\u5bb6\u548c\u521b\u4f5c\u8005\u5bf9\u4fb5\u6743\u4f7f\u7528\u548c\u8bef\u7528\u8868\u8fbe\u4e86\u5408\u7406\u7684\u62c5\u5fe7\u3002 \u4f46\u6211\u4eec\u4e5f\u8ba4\u8bc6\u5230\uff0c\u6280\u672f\u548c\u5de5\u5177\u5728\u672a\u6765\u6570\u5e74\u5fc5\u5c06\u53d1\u751f\u5de8\u53d8\uff0c\u540c\u65f6\u4e5f\u6709\u8bb8\u591a\u5bcc\u6709\u521b\u610f\u7684\u6e38\u620f\u5f00\u53d1\u8005\u6b63\u63a2\u7d22\u5982\u4f55\u4ee5\u5408\u4e4e\u9053\u5fb7\u7684\u65b9\u5f0f\u8fd0\u7528 AI \u6765\u6253\u9020\u51fa\u8272\u7684\u5a31\u4e50\u4f53\u9a8c\u3002 \u5982\u679c\u60a8\u8ba1\u5212\u5728 Steam \u4e0a\u53d1\u884c\u4ea7\u54c1\uff0c\u4e14\u8ba4\u4e3a\u6211\u4eec\u5ffd\u89c6\u4e86\u5173\u4e8e AI \u7684\u4e00\u4e9b\u91cd\u8981\u4e8b\u9879\uff0c[\u6211\u4eec\u975e\u5e38\u4e50\u610f\u542c\u53d6\u60a8\u7684\u53cd\u9988](https://help.steampowered.com/wizard/HelpWithPublishing?issueid=902)\u3002\n\n## \u5e38\u89c1\u95ee\u9898\n\n**\u95ee\uff1a \u53ea\u8981\u6211\u5b8c\u6210\u8fd9\u4e9b\u8c03\u67e5\uff0c\u5c31\u53ef\u4ee5\u53d1\u5e03\u4efb\u4f55\u6211\u60f3\u8981\u7684\u5185\u5bb9\u5417\uff1f**\n\u7b54\uff1a\u4e0d\u662f\u7684\u3002 \u4e0d\u8bba\u4ea7\u54c1\u5185\u5bb9\u662f\u5426\u5728\u8c03\u67e5\u4e2d\u5f97\u5230\u62ab\u9732\uff0cSteam \u4e0a\u7684\u4ea7\u54c1\u90fd\u5fc5\u987b\u9075\u5b88[\u5185\u5bb9\u53d1\u5e03\u89c4\u5219\u53ca\u6307\u5f15](https://partner.steamgames.com/doc/gettingstarted/onboarding#5)\u3002 \u8fd9\u4e9b\u8c03\u67e5\u5c06\u5e2e\u52a9\u6211\u4eec\u5224\u65ad\u60a8\u7684\u4ea7\u54c1\u662f\u5426\u9700\u8981\u66f4\u65b0\u3002\n\n**\u95ee\uff1a \u6211\u5df2\u7ecf\u66f4\u65b0\u4e86\u6e38\u620f\u5185\u5bb9\uff0c\u4f46\u65e0\u6cd5\u66f4\u65b0\u5185\u5bb9\u8c03\u67e5\u4e2d\u7684\u67d0\u4e9b\u7ed3\u679c\uff0c\u8be5\u600e\u4e48\u529e\uff1f**\n\u7b54\uff1a\u5728\u751f\u6210\u7248\u672c\u548c\u5546\u5e97\u9875\u9762\u83b7\u6279\u53d1\u5e03\u540e\uff0c\u987b\u5148\u8054\u7cfb [Steam \u5ba2\u670d](https://help.steampowered.com/wizard/HelpWithPublishing?issueid=901)\uff0c\u624d\u80fd\u4fee\u6539\u5185\u5bb9\u8c03\u67e5\u4e2d\u67d0\u4e9b\u95ee\u9898\u7684\u56de\u7b54\u3002 \u60a8\u9700\u8981\u8054\u7cfb\u6211\u4eec\uff0c\u5e76\u7b80\u8981\u5730\u63cf\u8ff0\u6e38\u620f\u5185\u5bb9\u6709\u54ea\u4e9b\u6539\u52a8\uff0c\u4ee5\u53ca\u54ea\u9879\u8c03\u67e5\u7ed3\u679c\u53d7\u5230\u4e86\u5f71\u54cd\u3002 \u540c\u65f6\uff0c\u8bf7\u8bf4\u660e\u6d4b\u8bd5\u8005\u5e94\u5982\u4f55\u8bbf\u95ee\u76f8\u5e94\u7684\u5185\u5bb9\u3002\n\n**\u95ee\uff1a \u6211\u7684\u7248\u6743\u6216\u5546\u6807\u53d7\u5230\u4e86\u4fb5\u72af\u3002 \u6211\u8be5\u600e\u4e48\u505a\uff1f**\n\u7b54\uff1aValve \u5c0a\u91cd\u4ed6\u4eba\u7684\u77e5\u8bc6\u4ea7\u6743\uff0c\u4e5f\u8bf7\u6bcf\u4e2a Steam \u7528\u6237\u91c7\u53d6\u540c\u6837\u7684\u505a\u6cd5\u3002\n\n- \u5982\u679c\u60a8\u60f3\u4e3e\u62a5\u7248\u6743\u4fb5\u6743\u95ee\u9898\uff0c\u5e76\u4e14\u662f\u7248\u6743\u6240\u6709\u8005\uff0c\u8bf7\u5728[\u6b64\u5904](https://steamcommunity.com/dmca/create/)\u586b\u5199\u6211\u4eec\u7684 DMCA \u7248\u6743\u4fb5\u6743\u901a\u77e5\u8868\u683c\u3002\n\n- \u5982\u679c\u60a8\u60f3\u63d0\u4ea4\u5546\u6807\u4fb5\u6743\u6295\u8bc9\uff0c\u8bf7\u5728[\u6b64\u5904](https://steamcommunity.com/trademark/createtrademarkcomplaint/)\u586b\u5199\u8868\u683c\u3002\n\n**\u95ee\uff1a \u6211\u7684\u6e38\u620f\u8fde\u63a5\u5230\u4e86\u5b9e\u65f6\u751f\u6210 AI \u670d\u52a1\uff0c\u6bcf\u6b21\u8f93\u5165/\u8f93\u51fa\u90fd\u4f1a\u4ea7\u751f\u8d39\u7528\u3002 \u6211\u5e94\u8be5\u600e\u4e48\u505a\uff1f**\n\u7b54\uff1a\u5982\u679c\u60a8\u5e0c\u671b\u5c06\u6b64\u7c7b\u5916\u90e8\u670d\u52a1\u96c6\u6210\u5230\u60a8\u7684\u6e38\u620f\u4e2d\uff0c\u60a8\u9700\u8981\u4ee3\u8868\u60a8\u7684\u73a9\u5bb6\u7ba1\u7406\u5bf9\u8be5\u5916\u90e8\u670d\u52a1\u7684\u8bbf\u95ee\uff0c\u5e76\u4f7f\u7528 Steam \u652f\u6301\u7684\u4ed8\u6b3e\u65b9\u5f0f\u5411\u73a9\u5bb6\u6536\u53d6\u6b3e\u9879\u3002 \u6700\u7ec8\u5982\u4f55\u5c06\u5176\u7eb3\u5165\u60a8\u7684\u53d8\u73b0\u65b9\u6848\u53d6\u51b3\u4e8e\u60a8\uff0c\u4f46\u4ee5\u4e0b\u662f\u60a8\u53ef\u4ee5\u7528\u4e8e\u6536\u53d6\u6b3e\u9879\u7684\u65b9\u5f0f\uff1a\n\n- \u60a8\u53ef\u4ee5\u8003\u8651\u5c06\u8be5\u6210\u672c\u7eb3\u5165\u6e38\u620f\u7684\u4e3b\u8981\u4ef7\u683c\u4e2d\uff0c\u4e0d\u6536\u53d6\u4efb\u4f55\u989d\u5916\u8d39\u7528\u3002\n\n- \u53ef\u4ee5\u8ba9\u6e38\u620f\u5c06\u548c AI \u670d\u52a1\u5b9e\u65f6\u4e92\u52a8\u4ea7\u751f\u7684\u96f6\u788e\u8d39\u7528\u4f5c\u4e3a[\u5c0f\u989d\u4ea4\u6613](https://partner.steamgames.com/doc/features/microtransactions)\u6765\u7ba1\u7406\u3002\n\n- \u60a8\u53ef\u4ee5\u63d0\u4f9b[\u8ba2\u9605](https://partner.steamgames.com/doc/store/pricing/subscriptions)\uff0c\u4ee5\u6388\u4e88\u5bf9\u8be5\u670d\u52a1\u6301\u7eed\u4e14\u65e0\u9650\u5236\u7684\u8bbf\u95ee\u6743\u9650\u3002\n\n- \u53ef\u4ee5\u8ba9\u73a9\u5bb6\u901a\u8fc7\u5355\u6b21\u8d2d\u4e70 [DLC](https://partner.steamgames.com/doc/store/application/dlc) \u6765\u89e3\u9501\u548c\u5b9e\u65f6\u751f\u6210 AI \u670d\u52a1\u7684\u65e0\u9650\u5236\u4e92\u52a8\u3002\n\n**\u95ee\uff1a \u4e3a\u4ec0\u4e48\u542b\u4ec5\u9650\u6210\u4eba\u7684\u8272\u60c5\u5185\u5bb9\u7684\u6e38\u620f\u5728\u4f7f\u7528\u5b9e\u65f6\u751f\u6210 AI \u65f6\uff0c\u4f1a\u5f97\u5230\u4e0d\u540c\u7684\u5904\u7406\u65b9\u5f0f\uff1f**\n\u7b54\uff1a\u901a\u8fc7\u5185\u5bb9\u8c03\u67e5\u548c\u6211\u4eec\u81ea\u5df1\u7684\u53d1\u884c\u524d\u5ba1\u6838\uff0cValve \u5c1d\u8bd5\u5728\u4ec5\u9650\u6210\u4eba\u7684\u8272\u60c5\u5185\u5bb9\u65b9\u9762\u8fbe\u6210\u4e09\u4e2a\u76ee\u6807\uff1a\u6267\u884c\u6cd5\u5f8b\u9650\u5236\u3001\u5c0a\u91cd\u6e38\u620f\u5236\u4f5c\u8005\u7684\u521b\u4f5c\u81ea\u7531\uff0c\u4ee5\u53ca\u6ee1\u8db3\u987e\u5ba2\u7684\u671f\u671b\u3002 \u5728\u6e38\u620f\u8fc7\u7a0b\u4e2d\u5305\u542b\u7531 AI \u5b9e\u65f6\u751f\u6210\u7684\u4ec5\u9650\u6210\u4eba\u7684\u8272\u60c5\u5185\u5bb9\uff0c\u53ef\u80fd\u4f1a\u5f71\u54cd\u6211\u4eec\u5b9e\u73b0\u8fd9\u4e9b\u76ee\u6807\u7684\u80fd\u529b\u3002 \u76f8\u5173\u6cd5\u5f8b\u5c42\u9762\u548c\u5ba2\u6237\u5c42\u9762\u7684\u98ce\u9669\u90fd\u975e\u5e38\u5927\uff0c\u56e0\u6b64\u6211\u4eec\u76ee\u524d\u4e0d\u5e0c\u671b\u53d1\u884c\u7531 AI \u5b9e\u65f6\u751f\u6210\u7684\u4ec5\u9650\u6210\u4eba\u7684\u8272\u60c5\u5185\u5bb9\u3002\n", "\u5728 Steam \u4e0a\u8fdb\u884c\u6d4b\u8bd5": "# \u5728 Steam \u4e0a\u8fdb\u884c\u6d4b\u8bd5\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/store/testing\n\n## \u6982\u89c8\n\n\u8981\u6b63\u786e\u5730\u5728 Steam \u4e0a\u6d4b\u8bd5\u60a8\u7684\u4ea7\u54c1\uff0c\u60a8\u9700\u8981\u5148\u4e86\u89e3 Steam \u662f\u5982\u4f55\u5c06\u6587\u4ef6\u53d1\u9001\u7ed9\u7528\u6237\u7684\u3002\n\n\u5728\u5f00\u59cb\u4e4b\u524d\uff0c\u8bf7\u5148\u4e86\u89e3\u6bcf\u4e00\u9879\u5728[\u5e94\u7528\u7a0b\u5e8f](https://partner.steamgames.com/doc/store/application)\u6587\u6863\u4e2d\u5217\u51fa\u7684\u6982\u5ff5\u3002\n\n## \u5185\u90e8\u6d4b\u8bd5\u9009\u9879\n\n\u663e\u7136\uff0c\u60a8\u9700\u8981\u5728\u6b63\u5f0f\u53d1\u884c\u4ee5\u524d\u81ea\u5df1\u6d4b\u8bd5\u5e94\u7528\u7a0b\u5e8f\uff1b\u60a8\u4e5f\u53ef\u7ed9\u4e88\u5176\u4ed6\u5458\u5de5\u8bbf\u95ee\u6743\u9650\uff0c\u8ba9\u5176\u5e2e\u5fd9\u6d4b\u8bd5\u3002 \u8ba9\u8fd9\u4e9b\u5458\u5de5\u53c2\u4e0e\u6d4b\u8bd5\u7684\u6700\u597d\u65b9\u5f0f\uff0c\u662f\u5c06\u4ed6\u4eec\u52a0\u5165\u60a8\u7684 Steamworks \u5e10\u6237\u4e2d\u3002 \u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0cSteamworks \u5e10\u6237\u4e2d\u521b\u5efa\u7684\u9996\u4e2a\u7528\u6237\uff0c\u5c06\u62e5\u6709\u7ba1\u7406\u6743\u9650\u548c\u8bbf\u95ee\u6b63\u5728\u5904\u7406\u4e2d\u7684\u9ed8\u8ba4\u5e94\u7528\u7a0b\u5e8f\u7684\u6743\u9650\u3002 \u8be5\u7528\u6237\u5219\u53ef\u4ee5\u6dfb\u52a0\u66f4\u591a\u7528\u6237\uff0c\u4ee5\u5e2e\u52a9\u5f00\u53d1\u6216\u6d4b\u8bd5\u3002 \u8bf7\u53c2\u9605[\u7ba1\u7406\u60a8\u7684 Steamworks \u5e10\u6237](https://partner.steamgames.com/doc/gettingstarted/managing_users)\u6587\u6863\uff0c\u4e86\u89e3\u6709\u5173\u65b0\u589e\u7528\u6237\u7684\u66f4\u591a\u4fe1\u606f\u3002\n\n\u53e6\u5916\uff0c\u60a8\u4e5f\u53ef\u4ee5\u7533\u8bf7\u7a0b\u5e8f\u5305\u5e8f\u5217\u53f7\uff0c\u901a\u8fc7\u5e8f\u5217\u53f7\u53ef\u7acb\u5373\u6388\u4e88\u5e94\u7528\u7a0b\u5e8f\u7684\u8bbf\u95ee\u6743\u9650\u3002 \u8bf7\u53c2\u9605[\u7a0b\u5e8f\u5305](https://partner.steamgames.com/doc/store/application/packages)\u6587\u6863\uff0c\u4e86\u89e3\u6709\u5173\u7a0b\u5e8f\u5305\u7c7b\u578b\u548c\u7533\u8bf7\u5e8f\u5217\u53f7\u7684\u66f4\u591a\u4fe1\u606f\u3002\n\n## Dev Comp \u7a0b\u5e8f\u5305 - \u91cd\u8981\u914d\u7f6e\u6ce8\u610f\u4e8b\u9879\n\n\u4f5c\u4e3a Steamworks \u5f00\u53d1\u8005\uff0c\u5728\u60a8\u7684\u53d1\u884c\u5546\u7ec4\u4e2d\u4f1a\u9644\u5e26\u4e00\u4e2a\u7279\u6b8a\u79cd\u7c7b\u7684\u7a0b\u5e8f\u5305\u3002 \u6b64\u7a0b\u5e8f\u5305\u53eb\u505a Dev Comp \u7a0b\u5e8f\u5305\uff0c\u63a7\u5236\u7740\u60a8\u7684\u5f00\u53d1\u8005\u5e10\u6237\u767b\u5f55 Steam \u65f6\u5c06\u81ea\u52a8\u62e5\u6709\u7684 appID \u548c depotID\u3002 \u5c06\u65b0\u7684 depot \u52a0\u5165\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u6216\u751f\u6210\u7248\u672c\uff0c\u5e76\u4e0d\u4ee3\u8868\u60a8\u53ef\u5bf9\u5176\u8fdb\u884c\u6d4b\u8bd5\u3002 \u60a8\u5fc5\u987b\u786e\u4fdd\u65b0\u7684 depotID \u88ab\u5217\u5728\u60a8\u7684 Dev Comp \u7a0b\u5e8f\u5305\u6216\u7528\u6765\u6d4b\u8bd5\u6e38\u620f\u7684\u7a0b\u5e8f\u5305\u4e4b\u4e2d\u3002 \u8981\u67e5\u770b Dev Comp \u7a0b\u5e8f\u5305\u4e2d\u7684\u5185\u5bb9\uff0c\u60a8\u53ef\u4ece Steamworks \u4e3b\u9875\u9009\u62e9\u5e94\u7528\u7a0b\u5e8f\uff0c\u70b9\u51fb\u201c\u6240\u6709\u5173\u8054\u7a0b\u5e8f\u5305\u3001DLC\u3001\u8bd5\u7528\u7248\u53ca\u5de5\u5177\u201d\u94fe\u63a5\uff0c\u7136\u540e\u9009\u62e9\u60a8\u5e0c\u671b\u67e5\u770b\u5176\u5185\u5bb9\u7684\u7a0b\u5e8f\u5305\u3002\n\n\u5982\u679c\u60a8\u5728 Steam \u4e0a\u65e0\u6cd5\u4e0b\u8f7d\u60a8\u7684\u6587\u4ef6\uff0c\u542f\u52a8\u201cSteam.exe -dev\u201d\uff0c\u524d\u5f80\u201c\u63a7\u5236\u53f0\u201d\u9009\u9879\u5361\uff0c\u8f93\u5165 `licenses_for_app <appID>` \u547d\u4ee4\uff0c\u8fd9\u91cc\u7684 <appID> \u662f\u60a8\u60f3\u8981\u6d4b\u8bd5\u7684 appID\u3002 \u8fd9\u5c06\u663e\u793a\u8be5 packageID\uff0c\u7528\u4e8e\u5224\u65ad\u60a8\u62e5\u6709\u54ea\u4e9b appID \u4e2d\u7684\u5185\u5bb9\uff0c\u4e5f\u5c06\u663e\u793a\u7a0b\u5e8f\u5305\u4e2d\u6709\u54ea\u4e9b depotID\u3002 \u5982\u679c\u6709\u7f3a\u5931\u7684 depotID\uff0c\u5219\u5fc5\u987b\u7f16\u8f91\u7a0b\u5e8f\u5305\u4ee5\u6dfb\u52a0 depotID\u3002 \u8bf7\u53c2\u89c1[\u7a0b\u5e8f\u5305](https://partner.steamgames.com/doc/store/application/packages)\u6587\u6863\uff0c\u4e86\u89e3\u66f4\u591a\u6709\u5173\u7f16\u8f91\u7a0b\u5e8f\u5305\u7684\u4fe1\u606f\u3002\n\n## \u5916\u90e8\u6d4b\u8bd5\u9009\u9879 - \u8bbe\u7f6e\u5c01\u95ed\u6216\u5f00\u653e\u6d4b\u8bd5\n\n\u5728 Steam \u4e0a\u8bbe\u7f6e\u9884\u53d1\u884c\u6d4b\u8bd5\u7b80\u5355\u4e14\u514d\u8d39\uff0c\u5e76\u53ef\u4ee5\u5c06\u6d4b\u8bd5\u914d\u7f6e\u4e3a\u5c0f\u578b\u79c1\u5bc6\u6d4b\u8bd5\u6216\u5927\u578b\u516c\u5f00\u6d4b\u8bd5\uff0c\u6216\u662f\u4e8c\u8005\u7684\u4efb\u610f\u7ec4\u5408\u3002 \u8fd9\u662f\u4e00\u4e2a\u901a\u8fc7 Steam \u83b7\u5f97\u53cd\u9988\u3001\u6d4b\u8bd5\u7528\u6237\u4f53\u9a8c\u7684\u6781\u4f73\u65b9\u5f0f\uff0c\u4e14\u4e0d\u9700\u8981\u60a8\u5c06\u6e38\u620f\u53d1\u884c\u4e3a\u62a2\u5148\u4f53\u9a8c\u6216\u7ed9\u6d4b\u8bd5\u4eba\u5458\u63d0\u4f9b\u6c38\u4e45\u514d\u8d39\u8bbf\u95ee\u6743\u9650\u3002 \u4ee5\u4e0b\u8bf4\u660e\u5c06\u6307\u5bfc\u60a8\u5411\u793e\u533a\u63d0\u4f9b\u5185\u6d4b\u8bbf\u95ee\u6743\u9650\uff0c\u5e76\u5728\u51c6\u5907\u5c31\u7eea\u540e\u7ed3\u675f\u6d4b\u8bd5\u3002 \u5982\u679c\u60a8\u60f3\u4e3a\u60a8\u7684\u6e38\u620f\u53d1\u884c\u6240\u6709\u987e\u5ba2\u5747\u53ef\u8d2d\u4e70\u7684\u6d4b\u8bd5\u7248\uff0c\u8bf7\u53c2\u89c1[\u62a2\u5148\u4f53\u9a8c](https://partner.steamgames.com/doc/store/earlyaccess)\u3002\n\n\u82e5\u8981\u4e3a\u5916\u90e8\u53d7\u4f17\u8bbe\u7f6e\u6d4b\u8bd5\uff0c\u6709\u4e24\u79cd\u5e38\u89c1\u65b9\u6cd5\uff1a\n\n- \u4f7f\u7528 Steam \u6e38\u620f\u6d4b\u8bd5\u529f\u80fd\u3002\n\n- \u4f7f\u7528\u4e3b\u6e38\u620f\u7684 App ID \u548c\u5176\u53d1\u884c\u5148\u51b3\u66ff\u4ee3\u5e8f\u5217\u53f7\u3002\n\n## Steam \u6e38\u620f\u6d4b\u8bd5\n\n[Steam \u6e38\u620f\u6d4b\u8bd5](https://partner.steamgames.com/doc/features/playtest)\u662f\u4e00\u4e2a\u514d\u8d39\u4e14\u4f4e\u98ce\u9669\u7684\u89e3\u51b3\u65b9\u6848\uff0c\u5728\u6536\u96c6\u6e38\u620f\u6d4b\u8bd5\u6570\u636e\u7684\u540c\u65f6\uff0c\u6ca1\u6709\u7ba1\u7406\u7535\u5b50\u90ae\u4ef6\u5217\u8868\u548c Steam \u5e8f\u5217\u53f7\u7684\u538b\u529b\uff0c\u4e5f\u65e0\u9700\u62c5\u5fc3\u7528\u6237\u8bc4\u6d4b\u6216\u613f\u671b\u5355\u3002 \u901a\u8fc7\u4f7f\u7528\u4e0e\u60a8\u7684\u4e3b\u6e38\u620f\u76f8\u5173\u4f46\u53c8\u72ec\u7acb\u7684\u7279\u5b9a\u5173\u8054 appID\uff0c\u60a8\u53ef\u4ee5\u5728\u4e0d\u5e72\u6270\u4e3b\u6e38\u620f\u7684\u60c5\u51b5\u4e0b\u8fdb\u884c\u60a8\u9700\u8981\u7684\u6e38\u620f\u6d4b\u8bd5\u3002\n\nSteam \u6e38\u620f\u6d4b\u8bd5\u8ba9\u60a8\u53ef\u4ee5\u8f7b\u677e\u9650\u5236\u6e38\u620f\u6d4b\u8bd5\u7684\u8bbf\u95ee\u6743\u9650\u3002 \u60a8\u53ef\u4ee5\u6309\u9700\u5141\u8bb8\u4efb\u610f\u6570\u91cf\u7684\u73a9\u5bb6\u52a0\u5165\uff0c\u5e76\u53ef\u5728\u9700\u8981\u65f6\u505c\u7528\u6e38\u620f\u6d4b\u8bd5\u5e94\u7528\u3002\n\nSteam \u6e38\u620f\u6d4b\u8bd5 appID \u6240\u80fd\u8bbf\u95ee\u7684 Steamworks \u6280\u672f\u529f\u80fd\u4e0e\u60a8\u7684\u4e3b\u6e38\u620f\u76f8\u540c\uff0c\u4f46\u51cf\u5c11\u4e86\u5546\u5e97\u548c\u793e\u533a\u8bbe\u7f6e\u3002 \u60a8\u7684 Steam \u6e38\u620f\u6d4b\u8bd5\u5e76\u6ca1\u6709\u7528\u4ee5\u6c
