:2px solid #a7b7d0;border-radius:50%;font-weight:800;color:#365574;margin-top:7px}.box{padding:13px 16px;border-radius:12px;border:1px solid #b8d2f4;background:#fff;box-shadow:0 5px 15px #2339580b;min-height:80px;grid-column:2}.step.ops .box{grid-column:3;border-color:#ebc695;background:#fffbf5}.step.sys .box{grid-column:4;border-color:#9edbc6;background:#f5fffb}.step.gate .box{grid-column:2/5;border-color:#c4b5e5;background:#faf7ff}.step.end .box{grid-column:2/5;border-color:#92cdb7;background:#eefbf4}.box strong{font-size:15px;display:block;line-height:1.4}.box small{display:block;color:#53627a;font-size:12px;line-height:1.55;margin-top:6px}.box .req{color:#ae3737;font-weight:700}.box .opt{color:#527092}.box .next{color:#1d5bb8;font-weight:700}.step.ops .num{border-color:#d7a04a;background:#fff0da}.step.sys .num{border-color:#60bca0;background:#e1f8f0}.step.gate .num{border-color:#9b7dc9;background:#efe8fc}.step.end .num{border-color:#49ac7c;background:#def6e8}.sources{margin:20px 0 0;border-top:1px dashed #b5c5dc;padding-top:14px;font-size:11px;color:#65728a}.sources a{color:#3962a0;margin-right:13px}footer{padding:24px 4vw;color:#70809c;font-size:12px}.all .flow[hidden]{display:block}.all .flow{page-break-after:always}@media(max-width:700px){.lane-head{display:none}.step{grid-template-columns:48px 1fr;gap:5px}.num{width:38px;height:38px}.step{--axis:19px}.box,.step.ops .box,.step.sys .box,.step.gate .box,.step.end .box{grid-column:2}.flow{padding:0 12px}.bar{padding:8px}}@media print{.bar{display:none}.flow[hidden]{display:block}.flow{page-break-after:always}.box{box-shadow:none}body{background:white}}

</style></head><body><header><h1>游戏上架全场景操作流程图</h1><div class="sub">开发者平台 → 运营后台 → 状态结果｜红字为必填，灰字为可选｜前 8 个场景对应原型入口；09 开发者自测／运营 QA 已同步原型入口；差异见审查报告</div></header><nav class="bar" id="nav"></nav><div class="legend"><span><i class="dot dev"></i>开发者操作</span><span><i class="dot ops"></i>运营审核／QA</span><span><i class="dot sys"></i>系统自动处理</span><span><i class="dot gate"></i>条件判断／退回分支</span></div><main id="flows"></main><footer>本图的前 8 个场景基于现有 Demo 入口修订，非 USD 最低成交价须接入官方规则表；09 开发者自测／运营 QA 已接入原型。游戏资料每次提交审核是本平台额外规则；Build 仅首次例行人工审核。</footer><script>
const F=[
{id:'new',name:'01 新游上线',sub:'先准备商店资料与拟议价格；首次商店审核先于首次 Build 审核',sources:['发行流程','审核流程','内容调查','上传至 Steam','程序包','定价'],steps:[
['dev','平台开发者控制台 → 游戏管理 → 创建游戏','必填：游戏名称、开发商、短简介、游戏介绍、Windows／macOS／Linux 系统要求；选择支持语言、销售地区。可选：标签、素材草稿。点击「创建游戏项目」。'],
['sys','生成 Game ID、本体 AppID 与默认 Package 草稿','Steam 在新 App 创建时会生成默认 Package；此时尚未上架，也未取得任何 Build。'],
['dev','版本发布 → 游戏资料及内容调查','必填：商店介绍、真实游戏画面、支持功能、内容调查（含成人内容与适用分级）；展示内容须与准备发行的游戏一致。'],
['dev','价格销售 → 售价设置 → 拟议首发价格','付费商店销售时配置销售 Package 与各销售币种价格，并提交拟议价格；免费或仅测试授权按对应类型配置，不强制填 USD 售价。'],
['dev','版本发布 →「提交首次商店资料审核」','在商店资料、内容调查和拟议价格准备好后提交；不要求先完成 Depot 上传或 Build。'],
['ops','运营后台 → Package定价审核（与商店页审核可并行）','付费商品审核拟议价格；拒绝后开发者回到售价设置修正并重提。审核价格不等于立即开始销售。'],
['ops','运营后台 → 游戏／DLC审核 → 通过／拒绝通过','核对商店资料、内容调查与宣传内容；拒绝需填写原因。商店页提交审核必须早于首个 Build 提交审核。'],
['gate','商店资料是否通过？','否 → 返回资料页修改并重提；是 → 发布 Coming Soon 页面并记录开始日期。Depot 配置与上传也可在商店审核期间准备，不必等待此节点。'],
['dev','游戏包管理 → Depot管理 → 创建Depot','必填：Depot名称、内容类型、语言、操作系统、架构。普通本体选「游戏本体」；可按 Windows／macOS、语言拆多个 Depot。点击「保存并提交」。'],
['dev','游戏包管理 → 版本设置 → 创建上传任务','必填：目标 App、至少一个 Depot、版本号、构建说明。点击「保存并创建上传任务」。'],
['dev','版本设置 → 上传任务 → CLI 上传／「模拟完成上传」','上传各 Depot 文件；全部完成后生成对应 Manifest，Build 从「待上传」变「已完成」。'],
['dev','测试分支 → 指定待审 Build 并进行内部 QA','按 App + Branch + Build ID 固定测试对象；检查启动、系统兼容、商店承诺功能、内容调查和年龄提示。失败则重传新 Build。详见「09 QA／测试」。'],
['ops','运营后台 → 提包审核 → 通过／拒绝通过','仅首个可发布 Build 进入人工审核。必须对照商店页面、内容调查和实际可玩的 Build；发现成人内容与申报不符则拒绝并要求更正。'],
['gate','首发条件是否全部满足？','商店页与首个 Build 审核通过；Coming Soon 已展示满两周；付费销售价格审核通过且相关 Package 可销售。任一不满足则不得正式发行。'],
['dev','发布管理与记录 →「提交发布申请」','必填：审核通过的完整 App Build、公开 Branch、发布说明；立即或定时发行。Steam 原流程由开发者最终点击发行，原型按钮名称可不同。'],
['sys','切换 Production Active Build','立即发布直接生效；定时发布进入运营后台「发布任务管理」，到时执行。玩家按授权 Package + 当前 Branch Build + Depot 挂载条件下载。'],
['end','新游上线完成','游戏、价格、文件和 Production Active Build 均已生效。']]},
{id:'game-update',name:'02 更新游戏资料',sub:'每次资料修改提交运营审核；上传文件的内容风险另按 03／09 处理',sources:['审核流程','发行流程','内容调查'],steps:[
['dev','进入游戏 → 版本发布 → 游戏资料','修改名称、介绍、截图、素材或发行信息；字段校验按页面要求。点击「保存草稿」或「提交资料」。'],
['ops','运营后台 → 游戏／DLC审核','每次提交资料变更都审核；通过／拒绝通过。拒绝需填写原因，开发者修改后重提。此为本平台追加规则，Steam 普通资料更新不要求逐次重审。资料审核只覆盖本次申报与展示内容，不能代替实际 Build 检查。'],
['gate','本次资料审核是否通过？','否 → 保持当前已发布资料，返回修改；是 → 发布已通过的资料版本。'],
['sys','更新商店资料','资料版本与 Depot／Build／Package 分别记录；仅改文字素材不会自动替换 Active Build。'],
['end','资料更新完成','若同时改游戏文件 → 进入「03 更新版本」。']]},
{id:'version-update',name:'03 更新版本',sub:'已有上线 App 的文件更新与 Branch 切换',sources:['更新游戏生成版本','审核流程','上传至 Steam'],steps:[
['dev','游戏包管理 → Depot管理','若增加语言／系统／DLC 文件分组，先「创建Depot」；已有 Depot 可直接复用。新 Depot 若需发放给旧持有人，还要检查相关 Package 是否包含它。'],
['dev','版本设置 →「创建上传任务」','必填：目标 App、该 App 下至少一个 Depot、版本号、构建说明。点击「保存并创建上传任务」。'],
['dev','CLI 上传／「模拟完成上传」','上传变更文件，生成新 Manifest；完整 Build 中其他 Depot 可继承既有 Manifest。'],
['dev','测试分支 → 验证本次 Build','开发者将此 Build 放到受限测试 Branch，内部或外部测试人员按授权下载并反馈。运营可按风险抽检；详见「09 QA／测试」。'],
['gate','该 App 是否已通过首次 Build 人工审核？','否 → 运营后台「提包审核」对首个可发布 Build 人工审核；是 → 后续 Build 无例行人工审核。若自动检查、举报或抽检发现高风险内容，进入例外复核，不直接切公开分支。'],
['dev','发布管理与记录 →「提交发布申请」','必填：完整 Build、Production／Internal 分支、立即／定时、发布说明；定时需未来计划时间。'],
['sys','立即切换或进入待执行任务','立即发布 → 当前 Branch Active Build 切新版本；定时 → 运营后台「发布任务管理」点击「立即执行」或到时执行。'],
['end','版本更新完成','历史 Build 与 Manifest 保留，可在「线上版本与回滚」选择历史完整 Build 回滚。']]},
{id:'price',name:'04 定价／改价',sub:'Package 内容授权与全球区域价格',sources:['程序包','定价'],steps:[
['dev','价格销售 → 售价设置 →「创建Package」或「编辑内容/价格」','必填：Package 名称、用途及至少一个 App；核对需要授权的 Depot。只有付费商店销售才填写拟议价格；每个目标销售币种应有适用价格。销售结束时间并非所有 Package 的通用必填项；DLC 默认 Package 在此配价。'],
['gate','Package 是否曾销售或生成 Key？','是 → 不可移除已有 App，可新增 App／Depot；否 → 可调整未生效授权内容。'],
['dev','点击「保存并提交」','新建或修改价格形成待通过定价提案；待通过可撤回，撤回后可重提。'],
['ops','运营后台 → Package定价审核','通过／拒绝通过；拒绝须写原因。'],
['gate','价格审核是否通过？','否 → 开发者在「售价设置」修改并重新提交；是 → 设置销售时间或点击「立即上架」。'],
['sys','各销售币种价格生效','按已审核的币种价格生效；USD 只是一个币种。地区建议价可由工具辅助生成，但开发者须确认，不得把 USD 改动自动视为所有币种都已重新定价。'],
['end','定价流程完成','Package 状态「销售中」后，才可作为普通折扣和 Bundle 的成员。']]},
{id:'discount',name:'05 创建折扣',sub:'Package 自助折扣；按每个销售币种的实际价格计算',sources:['折扣','定价'],steps:[
['gate','前置：目标 Package 是否「销售中」？','否 → 先完成「04 定价／改价」；是 → 进入促销。'],
['dev','价格销售 → 促销活动 →「创建促销」','必填：促销 Package、折扣百分比、开始日期、结束日期；可选：活动说明。点击「设置促销」。'],
['sys','即时规则校验','校验折扣比例、时长、冷却期与最低成交价。例：同一 Package 同时卖 USD 与 CNY，就分别检查美元折后价和人民币折后价是否低于各自最低门槛；不是只验 USD 后换算。当前 Demo 已按各销售币种实际定价试算；USD 最低价有演示校验，其他币种的官方最低价表仍需接入正式校验。'],
['gate','是否通过规则校验？','否 → 调整折扣或日期后再次点击「设置促销」；是 → 生成待开始活动。'],
['ops','运营后台 → 促销活动监控','查看活动、Package、折扣和状态；普通自助折扣无逐次人工审核。'],
['sys','开始日期生效 → 结束日期自动恢复','未开始前可编辑或删除；成员 Package 折扣会影响 Bundle 的动态结算基数。'],
['end','折扣流程完成','活动状态：待开始 → 进行中 → 已结束。']]},
{id:'bundle',name:'06 创建捆绑包',sub:'同一游戏中的多个销售中 Package',sources:['Bundle 官方证据台账','定价'],steps:[
['gate','前置：是否有至少两个销售中的 Package？','否 → 先完成 Package 定价审核与上架；是 → 可创建 Bundle。'],
['dev','价格销售 → 捆绑组合 →「创建捆绑组合」','必填：组合名称、展示标题、至少两个 Package、Bundle 类型、整数折扣 1%～95%；可选：展示正文、封面图。点击「保存 Bundle 草稿」。'],
['dev','选择类型并检查结算预览','Complete The Set：只计未拥有成员；Must Purchase Together：已拥有任一成员则不可购买。按当前销售币种的成员实际价格计算，先应用成员促销，再应用 Bundle 折扣。原型「结算预览」可切地区和模拟已拥有内容；正式结算应读取账号实际权益。'],
['sys','创建状态「未上架」','Bundle 无固定 USD 总价；不生成 Bundle Key。'],
['dev','列表 →「发布资料并 Set Live」→「确认立即上架」','前置：成员 Package 均「销售中」；成功后状态「已上架」。'],
['ops','运营后台 → 捆绑组合管理','仅监控和查看详情，无逐个 Bundle 人工审核。'],
['end','捆绑包可购买','购买按成员发放 Package 内容；下架不删除历史权益与订单。']]},
{id:'cross-bundle',name:'07 跨 App 捆绑包',sub:'本期仅支持同一发行方名下不同 App 的 Package',sources:['Bundle 官方证据台账','定价'],steps:[
['gate','前置：两个 App 是否同属一个发行方，且 Package 均「销售中」？','任一不满足 → 不可创建；本期不开放不同发行方协作捆绑。'],
['dev','进入其中一个游戏 → 价格销售 → 捆绑组合 →「创建捆绑组合」','在成员列表勾选当前 App Package + 标注「跨 App」的另一游戏 Package；至少两个。演示样例：星海远征 + 银河拼图。'],
['dev','填写 Bundle 表单并保存','必填：组合名称、展示标题、Bundle 类型、折扣百分比；可选：正文、封面图。点击「保存 Bundle 草稿」。'],
['sys','校验同一发行方及跨 App 成员价格','拒绝不同发行方的 Package；对同一发行方下不同 App 的成员，按地区价格、玩家拥有内容及成员促销动态计算。'],
['dev','「结算预览」→「发布资料并 Set Live」','检查地区与已拥有成员模拟结果；确认上线。'],
['ops','运营后台 → 捆绑组合管理','只读监控跨 App 成员与上线状态；无逐个 Bundle 审核。'],
['end','跨 App 组合可购买','玩家取得所购买成员 Package 的权益；既有成员按 Complete The Set 规则补齐。']]},
{id:'dlc',name:'08 新建 DLC',sub:'先建 DLC 商品身份和权益，再准备文件；无新文件时可跳过 Depot 上传',sources:['审核流程','发行流程','程序包','内容调查'],steps:[
['dev','单游戏工作台 →「新建DLC」','必填：名称、内容卖点、内容介绍、商品图、开始／结束时间、是否预购；点击「保存并提交」后仅创建 DLC AppID 与默认 Package 草稿。'],
['dev','价格销售 → 售价设置 → 默认 DLC Package','必填：收费方式／USD 基础价／地区价格／销售时间；点击「保存并提交」形成拟议价格。'],
['dev','新建DLC 列表 →「提交首次审核」','此按钮才把 DLC 商店资料送审。'],
['ops','运营后台 → 游戏／DLC审核','审核首次 DLC 资料；通过／拒绝通过。拒绝时填写原因，开发者修改重提。'],
['gate','该 DLC 是否提供独立文件？','否 → 只按 DLC 权益解锁本体 Build 已含内容，无需额外 Depot；是 → 创建 DLC Depot 并上传文件。'],
['dev','Depot管理 → 创建 DLC 文件 Depot（有新文件时）','默认可由本体 AppID 管理；仅开启“分别管理 DLC Depot”时归 DLC AppID。再填语言、系统、架构及 DLC 权益 App。'],
['dev','版本设置 → 上传包含 DLC 文件的完整 Build（有新文件时）','按 Depot 实际归属选本体 App 或 DLC App；上传后生成 Manifest。在测试 Branch 验证 DLC 拥有和未拥有两种账号的下载与解锁结果。'],
['ops','运营后台 → DLC 资料与首次包体审核','DLC 商店资料首次审核；新增可执行内容的首次 Build 人工审核。后续更新无例行人工提包审核，但高风险内容可触发复核。'],
['gate','DLC 资料／默认 Package／需要的 Build 均就绪？','无独立文件时无需 DLC Depot／Build；有新文件时需上传并验证。价格、商店资料与权益仍须满足上线条件。'],
['dev','发布管理与记录 → 提交发布申请','选 DLC 对应完整 Build、Branch、发布方式和说明；按默认 Package 销售与 DLC 上架时间展示。'],
['end','DLC 上线完成','用户需具备本体及 DLC 权益；客户端按授权与 Depot 条件选择文件。']]},
{id:'qa-testing',name:'09 开发者自测／运营 QA',sub:'仅覆盖开发者内部自测和运营 QA；按 App + Branch + Build ID 固定测试对象',sources:['在 Steam 上进行测试','管理您的 Steamworks 帐户','更新游戏生成版本','审核流程','内容调查'],steps:[
['dev','版本设置 → 完成某个 Build 的 Depot 上传','必填：目标 App、Depot 和版本说明；上传完成取得 Build ID、各 Depot Manifest。未完成上传的任务不可作为测试对象。'],
['dev','Steamworks「添加/管理用户」→ 邀请内部测试账号','由合作伙伴管理员填写同事邮箱并发送邀请；同事接受后管理员确认，再授予对应游戏组的访问权限。本平台 Demo「版本设置」已提供「管理内部测试账号」演示入口；真实账号邀请及授权仍须在正式系统实现。'],
['dev','确认内部账号的 Dev Comp／测试 Package 授权','该 Package 必须包含目标 AppID 与需要下载的 DepotID；仅创建 Depot 或上传 Build 不会自动赋予测试下载权限。'],
['dev','测试分支 → 将指定 Build 分配给 Internal Branch','记录 AppID、Branch、Build ID、Manifest 集合；不要把「最新上传」当成测试目标。公开分支仍指向原 Build。测试分支可加密码。'],
['dev','开发者测试账号 → 选择 Internal Branch → 下载自测','核对实际 Build ID；检查启动、系统／语言／架构、DLC 有无权益、商店承诺功能、年龄与内容调查；上传自测结论和问题复现信息。'],
['gate','开发者自测是否通过？','否 → 修复并上传新 Build，再重新自测；是 → 固定 Build ID 后提交运营 QA。失败 Build 不覆盖原测试记录。'],
['ops','运营后台 → 包体测试 → 领取指定 Build 的 QA 任务','当前 Demo 的「版本设置」可记录内部账号及 App／Depot 范围、自测结果；运营「包体测试」只对自测通过的 Build 开放 QA。正式系统还须记录 AppID、Branch、Build ID 和测试账号。'],
['ops','运营 QA → 下载实机测试并记录结论','检查安装启动、文件完整性、宣传功能、年龄声明与实际可玩内容；记录通过／不通过、截图或录像、复现步骤。首个可发布 Build 还须与商店页及内容调查比对。'],
['gate','运营 QA 是否通过？','否 → 退回开发者，修复后上传新 Build、重新自测与 QA；是 → 测试通过。QA 测试记录和 Valve 式首次发行审核是两个不同状态。'],
['end','内部测试完成','保留账号授权、App／Branch／Build／Manifest 与自测及 QA 证据；是否切公开分支由 01 首发或 03 更新流程决定，测试通过不自动上线。']]}
];

\u751f\u6210\u7248\u672c\u4e0e\u914d\u7f6e\u7684\u6838\u5bf9\u6e05\u5355\u3002 \u60a8\u53ef\u4ee5\u5728\u5e94\u7528\u767b\u9646\u9875\u9762\u7684\u53f3\u4fa7\u627e\u5230\u6838\u5bf9\u6e05\u5355\u3002\n\n\u5b8c\u6210\u6838\u5bf9\u6e05\u5355\u540e\uff0c\u8bf7\u70b9\u51fb\u201c\u6807\u8bb0\u4e3a\u5c31\u7eea\u5f85\u5ba1\u201d\uff0c\u8ba9 Valve \u77e5\u9053\u60a8\u5df2\u5b8c\u6210\u5404\u9879\u5de5\u4f5c\u3001\u5efa\u597d\u5546\u5e97\u9875\u9762\u5e76\u63d0\u51fa\u5efa\u8bae\u5b9a\u4ef7\uff0c\u51c6\u5907\u63a5\u53d7\u5ba1\u6838\u3002 \u53e6\u5916\u8bf7\u6ce8\u610f\u60a8\u5fc5\u987b\u5148\u63d0\u4ea4\u5546\u5e97\u9875\u9762\u8fdb\u884c\u5ba1\u6838\uff0c\u968f\u540e\u624d\u80fd\u63d0\u4ea4\u751f\u6210\u7248\u672c\u8fdb\u884c\u5ba1\u6838\u3002 \u4e24\u4e2a\u6838\u5bf9\u6e05\u5355\u90fd\u5fc5\u987b\u5b8c\u6210\uff0c\u5e76\u4e14\u901a\u8fc7\u5ba1\u6838\u83b7\u5f97\u6279\u51c6\u540e\uff0c\u4ea7\u54c1\u624d\u80fd\u591f\u53d1\u884c\u3002 \u8bf7\u53c2\u89c1[\u5ba1\u6838\u6d41\u7a0b](https://partner.steamgames.com/doc/store/review_process)\u6587\u6863\uff0c\u4e86\u89e3\u66f4\u591a\u8be6\u60c5\u3002\n\n## \u5546\u5e97\u72b6\u6001\n\n\u5546\u5e97\u72b6\u6001\u6838\u5bf9\u6e05\u5355\u5305\u542b\u4e86\u5728\u60a8\u5c06\u5546\u5e97\u9875\u9762\u5217\u4e3a[\u5373\u5c06\u63a8\u51fa](https://partner.steamgames.com/doc/store/coming_soon)\u5e76\u7b49\u5f85\u53d1\u5e03\u4e4b\u524d\u5fc5\u987b\u5b8c\u6210\u7684\u4e8b\u9879\u3002 \u5b8c\u6210\u4e86\u6838\u5bf9\u6e05\u5355\u4e0a\u6240\u6709\u4e8b\u9879\u540e\uff0c\u70b9\u51fb\u201c\u6807\u8bb0\u4e3a\u5c31\u7eea\u5f85\u5ba1\u201d\u5373\u53ef\u63d0\u4ea4\u5546\u5e97\u72b6\u6001\u4ee5\u5907\u5ba1\u6838\u3002 \u6211\u4eec\u5bf9\u60a8\u5546\u5e97\u72b6\u6001\u7684\u5ba1\u6838\u901a\u5e38\u9700\u8981 3-5 \u4e2a\u5de5\u4f5c\u65e5\u624d\u80fd\u5b8c\u6210\uff0c\u4f46\u8003\u8651\u5230\u53ef\u80fd\u9700\u8981\u8fdb\u884c\u7684\u53d8\u66f4\uff0c\u60a8\u6700\u597d\u5728\u5546\u5e97\u9875\u9762\u8ba1\u5212\u7684\u4e0a\u7ebf\u65e5\u671f\u524d\u81f3\u5c11 7 \u5929\u63d0\u4ea4\u9875\u9762\u4ee5\u4f9b\u5ba1\u6838\u3002 \u5fc5\u8981\u65f6\uff0c\u6211\u4eec\u7ed9\u60a8\u63d0\u4f9b\u610f\u89c1\u53cd\u9988\uff1b\u5982\u65e0\u5fc5\u8981\uff0c\u6211\u4eec\u4f1a\u628a\u60a8\u7684\u5546\u5e97\u9875\u9762\u6807\u4e3a\u201c\u5c31\u7eea\u5f85\u53d1\u884c\u201d\u3002\n\n## \u6e38\u620f\u751f\u6210\u7248\u672c\n\n\u6e38\u620f\u751f\u6210\u7248\u672c\u7684\u6838\u5bf9\u6e05\u5355\u5217\u51fa\u4e86\u8981\u5728 Steam \u4e0a\u53d1\u884c\u5e94\u7528\u7a0b\u5e8f\u6240\u9700\u8981\u51c6\u5907\u7684\u4e8b\u9879\u3002 \u4e0a\u4f20\u6700\u63a5\u8fd1\u7ec8\u7248\u7684\u751f\u6210\u7248\u672c\u7684\u9ed8\u8ba4\u5206\u652f\uff08\u8be5\u751f\u6210\u7248\u672c\u5e94\u5305\u542b\u5546\u5e97\u9875\u9762\u63cf\u8ff0\u7684\u6240\u6709\u529f\u80fd\uff0c\u4f46\u65e0\u987b\u662f\u7ec8\u7248\u3002 \u60a8\u53ef\u4ee5\u5728\u5ba1\u6838\u6d41\u7a0b\u671f\u95f4\u53ca\u5ba1\u6838\u6d41\u7a0b\u4e4b\u540e\u7ee7\u7eed\u66f4\u65b0\u751f\u6210\u7248\u672c\u3002\uff09 \u60a8\u5b8c\u6210\u6838\u5bf9\u6e05\u5355\uff0c\u8ba4\u4e3a\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u5df2\u51c6\u5907\u5c31\u7eea\u540e\uff0c\u60a8\u53ef\u4ee5\u70b9\u51fb\u201c\u6807\u8bb0\u4e3a\u5c31\u7eea\u5f85\u5ba1\u201d\uff0c\u8ba9 Valve \u77e5\u9053\u60a8\u5df2\u51c6\u5907\u597d\u4ea7\u54c1\u751f\u6210\u7248\u672c\uff0c\u51c6\u5907\u63a5\u53d7\u5ba1\u6838\u3002 \u53e6\u5916\u8bf7\u6ce8\u610f\u60a8\u5fc5\u987b\u5148\u63d0\u4ea4\u5546\u5e97\u72b6\u6001\u8fdb\u884c\u5ba1\u6838\uff0c\u968f\u540e\u624d\u80fd\u63d0\u4ea4\u751f\u6210\u7248\u672c\u8fdb\u884c\u5ba1\u6838\u3002\n\n![MarkAsReady_2.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/MarkAsReady_2.png)\n\n## \u51c6\u5907\u5c31\u7eea\u5373\u53ef\u81ea\u884c\u53d1\u884c\n\n\u5728\u60a8\u7684\u5546\u5e97\u9875\u9762\u5f97\u5230\u6279\u51c6\u3001\u5176\u72b6\u6001\u88ab\u8bbe\u4e3a\u201c\u5373\u5c06\u63a8\u51fa\u201d\u6ee1\u4e24\u5468\u4e14\u751f\u6210\u7248\u672c\u5df2\u5f97\u5230\u5ba1\u6838\u540e\uff0c\u60a8\u5c31\u80fd\u591f\u53d1\u884c\u6e38\u620f\u4e86\u3002 \u60f3\u8981\u53d1\u884c\u6e38\u620f\u65f6\uff0c\u8bf7\u70b9\u51fb Steamworks \u4ea7\u54c1\u767b\u9646\u9875\u4e0a\u65b9\u7684\u7eff\u8272\u201c\u53d1\u884c\u5e94\u7528\u201d\u6309\u94ae\u3002\n\n\u901a\u8fc7\u5ba1\u6838\u7684\u4ea7\u54c1\u4e0d\u4f1a\u81ea\u52a8\u53d1\u884c\u3002\u60a8\u9700\u8981\u81ea\u884c\u5728\u60a8\u5e0c\u671b\u7684\u53d1\u884c\u65f6\u95f4\u8fdb\u884c\u64cd\u4f5c\u3002 \u8bf7\u53c2\u89c1[\u53d1\u884c\u9009\u9879](https://partner.steamgames.com/doc/store/types)\u6587\u6863\uff0c\u5bf9\u6211\u4eec\u652f\u6301\u7684\u53d1\u884c\u7c7b\u578b\u4e86\u89e3\u66f4\u591a\u3002\n\n![ReleaseOptions_2.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/ReleaseOptions_2.png)\n\n\u5728\u60a8\u70b9\u51fb\u201c\u53d1\u884c\u5e94\u7528\u201d\u540e\uff0c\u60a8\u4f1a\u770b\u5230\u5c06\u8981\u8fdb\u884c\u7684\u53d1\u884c\u6d41\u7a0b\u5c0f\u7ed3\uff0c\u5305\u62ec\u53d1\u5e03\u5546\u5e97\u7a0b\u5e8f\u5305\u3001\u5c06\u9996\u53d1\u6298\u6263\u8bbe\u7f6e\u4e0a\u7ebf\uff08\u5982\u679c\u60a8\u9009\u62e9\u63d0\u4f9b\uff09\u3001\u5c06\u6e38\u620f\u8bbe\u7f6e\u4e3a\u53ef\u73a9\u548c\u5df2\u53d1\u884c\uff0c\u4ee5\u53ca\u5e94\u7528\u201c\u73b0\u5728\u201d\u53d1\u884c\u65f6\u95f4\u6233\u3002\n\n\u63a5\u4e0b\u6765\u60a8\u9700\u8981\u70b9\u51fb\u201c\u7acb\u5373\u53d1\u5e03\u201d\uff0c\u7136\u540e\u5c31\u4f1a\u8df3\u51fa\u786e\u8ba4\u5bf9\u8bdd\u6846\u3002 \u4e00\u65e6\u70b9\u51fb\u4e86\u201c\u73b0\u5728\u53d1\u884c\u201d\uff0c\u53d1\u884c\u6d41\u7a0b\u5c31\u4f1a\u5f00\u59cb\u3002\n", "\u5ba1\u6838\u6d41\u7a0b": "# \u5ba1\u6838\u6d41\u7a0b\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/store/review_process\n\n## \u6982\u89c8\n\n\u5728\u60a8\u4e8e Steam \u4e0a\u53d1\u884c\u6e38\u620f\u4e4b\u524d\uff0c\u6e38\u620f\u7684\u5546\u5e97\u72b6\u6001\u548c\u751f\u6210\u7248\u672c\u9700\u7531 Valve \u7684\u5ba1\u6838\u56e2\u961f\u5ba1\u6838\u3002 \u8bf7\u70b9\u51fb\u201c\u6807\u8bb0\u4e3a\u5c31\u7eea\u5f85\u5ba1\u201d\uff0c\u8ba9 Valve \u77e5\u9053\u60a8\u5df2\u5b8c\u6210\u53d1\u884c\u6838\u5bf9\u6e05\u5355\u4e0a\u7684\u5404\u4e2a\u5fc5\u5907\u4e8b\u9879\uff0c\u51c6\u5907\u63a5\u53d7\u5ba1\u6838\u3002\n\n\u8bf7\u53c2\u89c1[\u53d1\u884c\u9009\u9879](https://partner.steamgames.com/doc/store/types)\u6587\u6863\uff0c\u4e86\u89e3\u5173\u4e8e\u5728 Steam \u4e0a\u53d1\u884c\u4ea7\u54c1\u7684\u66f4\u591a\u4fe1\u606f\u3002\n\n## \u53ea\u9700\u5ba1\u6838\u4e00\u6b21\uff0c\u5373\u53ef\u968f\u65f6\u66f4\u65b0\n\n\u60a8\u7684\u6e38\u620f\u7ecf\u8fc7\u5ba1\u6838\u5e76\u83b7\u5f97\u6279\u51c6\u540e\uff0c\u5c31\u65e0\u9700\u518d\u6b21\u8fdb\u884c\u5ba1\u6838\u3002 \u60a8\u53ef\u4ee5\u968f\u65f6\u6309\u9700\u66f4\u65b0\u6e38\u620f\u3002\n\n## \u5546\u5e97\u72b6\u6001\u5ba1\u6838\n\n\u6211\u4eec\u5bf9\u60a8\u5546\u5e97\u72b6\u6001\u7684\u5ba1\u6838\u901a\u5e38\u9700\u8981 3-5 \u4e2a\u5de5\u4f5c\u65e5\u624d\u80fd\u5b8c\u6210\uff0c\u4f46\u8003\u8651\u5230\u53ef\u80fd\u9700\u8981\u8fdb\u884c\u7684\u53d8\u66f4\uff0c\u60a8\u6700\u597d\u5728\u5546\u5e97\u9875\u9762\u8ba1\u5212\u7684\u4e0a\u7ebf\u65e5\u671f\u524d\u81f3\u5c11 7 \u4e2a\u5de5\u4f5c\u65e5\u63d0\u4ea4\u9875\u9762\u4ee5\u4f9b\u5ba1\u6838\u3002 \u5fc5\u8981\u65f6\uff0c\u6211\u4eec\u7ed9\u60a8\u63d0\u4f9b\u610f\u89c1\u53cd\u9988\uff1b\u5982\u65e0\u5fc5\u8981\uff0c\u6211\u4eec\u4f1a\u628a\u60a8\u7684\u5546\u5e97\u9875\u9762\u6807\u4e3a\u201c\u5c31\u7eea\u5f85\u53d1\u884c\u201d\u3002\n\n\u4ee5\u4e0b\u4e3a\u6211\u4eec\u5bf9\u5546\u5e97\u72b6\u6001\u7684\u5ba1\u6838\u9879\u76ee\uff1a\n\n- **\u5546\u5e97\u9875\u9762\u53ea\u80fd\u5305\u542b\u4ea7\u54c1\u5728\u53d1\u884c\u65f6\u53ef\u7528\u7684\u529f\u80fd\u4e0e\u5185\u5bb9\u3002**\n\u542b\u6709\u4efb\u4f55\u672a\u5b8c\u6210\u6216\u9884\u8ba1\u672a\u6765\u63a8\u51fa\u7684\u5185\u5bb9\u7684\u622a\u56fe\u3001\u5ba3\u4f20\u7247\u3001\u529f\u80fd\uff0c\u90fd\u5e94\u8be5\u5220\u9664\u3002 \u5982\u679c\u60a8\u5728\u63cf\u8ff0\u680f\u5305\u542b\u8ba1\u5212\u672a\u6765\u63a8\u51fa\u7684\u5185\u5bb9\uff0c\u8bf7\u660e\u786e\u6ce8\u660e\u8be5\u529f\u80fd\u76ee\u524d\u5c1a\u672a\u63a8\u51fa\u3002\n\n- **\u5ba3\u4f20\u56fe\u5305\u542b\u53ef\u6e05\u695a\u8bc6\u522b\u7684\u4ea7\u54c1\u540d\u79f0\u6216\u5fbd\u6807\u3002**\n\u8bf7\u53c2\u89c1[\u56fe\u50cf\u8d44\u4ea7 - \u6982\u89c8](https://partner.steamgames.com/doc/store/assets)\u6587\u6863\uff0c\u5bf9\u6211\u4eec\u7684\u6307\u5357\u4e86\u89e3\u66f4\u591a\u3002\n\n- **\u5c4f\u5e55\u622a\u56fe\u4ec5\u5305\u542b\u6e38\u620f\u753b\u9762\u3002**\u4e5f\u5c31\u662f\u8bf4\uff0c\u8bf7\u907f\u514d\u4f7f\u7528\u6982\u5ff5\u56fe\u3001\u9884\u6e32\u67d3\u9759\u6001\u573a\u666f\uff0c\u6216\u8005\u542b\u6709\u5956\u9879\u3001\u8425\u9500\u6587\u6848\u6216\u4ea7\u54c1\u6587\u5b57\u63cf\u8ff0\u7684\u5185\u5bb9\u3002\n\n- **\u63cf\u8ff0\u5e94\u8be6\u7ec6\u4e14\u6761\u7406\u6e05\u6670\u3002**\n\u8ba9\u987e\u5ba2\u5728\u8d2d\u4e70\u524d\u6709\u5408\u7406\u671f\u5f85\u975e\u5e38\u91cd\u8981\u3002 \u53e6\u5916\uff0c\u8bf7\u52ff\u5728\u6b64\u680f\u4e2d\u5305\u542b\u5176\u4ed6\u7f51\u7ad9\u7684\u94fe\u63a5\u3002\n\n## \u62a2\u5148\u4f53\u9a8c\u5546\u5e97\u9875\u9762\u5ba1\u6838\n\n\u5982\u679c\u60a8\u5c06\u4ee5\u62a2\u5148\u4f53\u9a8c\u6a21\u5f0f\u53d1\u884c\u4ea7\u54c1\uff0c\u8bf7\u56de\u7b54\u62a2\u5148\u4f53\u9a8c\u680f\u4e2d\u7684\u6240\u6709\u95ee\u9898\u3002 \u5728\u6b64\u680f\u4e2d\uff0c\u8bf7\u8ba9\u987e\u5ba2\u5bf9\u60a8\u7684\u6e38\u620f\u7684\u76ee\u524d\u7248\u672c\u4e0e\u6e38\u620f\u5b8c\u6210\u524d\u4ecd\u9700\u6dfb\u52a0\u7684\u529f\u80fd\u4e0e\u5185\u5bb9\u6709\u6e05\u695a\u7684\u8ba4\u8bc6\u3002 \u8bf7\u53c2\u89c1[\u62a2\u5148\u4f53\u9a8c](https://partner.steamgames.com/doc/store/earlyaccess)\u7684\u6587\u6863\uff0c\u4e86\u89e3\u66f4\u591a\u4fe1\u606f\u3002\n\n## \u5ba1\u6838\u6210\u4eba\u5185\u5bb9\u5546\u5e97\u9875\u9762\n\n\u5bf9\u4e8e\u90a3\u4e9b\u5728\u6210\u4eba\u5185\u5bb9\u8c03\u67e5\u4e2d\u52fe\u9009\u4e86\u201c\u4ec5\u9650\u6210\u4eba\u7684\u8272\u60c5\u5185\u5bb9\u201d\u7684\u4f5c\u54c1\u800c\u8a00\uff0c\u5fc5\u987b\u5148\u5b8c\u6210\u5546\u5e97\u9875\u9762\u548c\u4ea7\u54c1\u751f\u6210\u7248\u672c\u5e76\u5c06\u5176\u63d0\u4ea4\uff0c\u624d\u80fd\u8ba9\u5546\u5e97\u9875\u9762\u5f97\u5230\u5ba1\u6838\u5e76\u8bbe\u4e3a\u201c\u5c31\u7eea\u5f85\u53d1\u884c\u201d\u3002 \u5ba1\u6838\u5177\u6709\u6210\u4eba\u5185\u5bb9\u7684\u5546\u5e97\u9875\u9762\u548c\u751f\u6210\u7248\u672c\u53ef\u80fd\u9700\u8981\u6bd4\u901a\u5e38\u7684 3-5 \u4e2a\u5de5\u4f5c\u65e5\u66f4\u957f\u7684\u65f6\u95f4\u3002\n\n## \u4ea7\u54c1\u751f\u6210\u7248\u672c\u5ba1\u6838\n\n\u5728\u60a8\u53d1\u884c\u524d\uff0c\u6211\u4eec\u5bf9\u60a8\u7684\u6e38\u620f\u6216\u8f6f\u4ef6\u751f\u6210\u7248\u672c\u7684\u5ba1\u6838\u901a\u5e38\u9700\u8981 3 \u81f3 5 \u4e2a\u5de5\u4f5c\u65e5\u624d\u80fd\u5b8c\u6210\uff0c\u4f46\u6211\u4eec\u8981\u6c42\u60a8\u9884\u7559\u81f3\u5c11 7 \u4e2a\u5de5\u4f5c\u65e5\uff0c\u786e\u4fdd\u6211\u4eec\u80fd\u53ca\u65f6\u8fdb\u884c\u5ba1\u6838\u6279\u51c6\u4ee5\u4f9b\u53d1\u884c\uff0c\u540c\u65f6\u4e3a\u4efb\u4f55\u610f\u5916\u60c5\u51b5\u9884\u7559\u65f6\u95f4\u3002 \u5fc5\u8981\u65f6\uff0c\u6211\u4eec\u4f1a\u7ed9\u60a8\u63d0\u4f9b\u610f\u89c1\u53cd\u9988\uff1b\u5982\u65e0\u5fc5\u8981\uff0c\u6211\u4eec\u5c06\u4f1a\u628a\u60a8\u7684\u4ea7\u54c1\u6807\u4e3a\u201c\u5c31\u7eea\u5f85\u53d1\u884c\u201d\u3002\n\n\u4ee5\u4e0b\u4e3a\u6211\u4eec\u7684\u5ba1\u6838\u9879\u76ee\uff1a\n\n- **\u4ea7\u54c1\u5fc5\u987b\u80fd\u6b63\u5e38\u542f\u52a8\u3002**\n\u5728\u5546\u5e97\u9875\u9762\u4e2d\u5217\u51fa\u7684\u6240\u6709\u652f\u6301\u7684\u64cd\u4f5c\u7cfb\u7edf\u4e2d\uff0c\u60a8\u7684\u4ea7\u54c1\u5fc5\u987b\u5747\u80fd\u6b63\u5e38\u542f\u52a8\u3002\n\n- **\u6240\u6709\u5546\u5e97\u9875\u9762\u4e2d\u5217\u51fa\u7684\u652f\u6301\u529f\u80fd\u90fd\u5fc5\u987b\u5b58\u5728\u4e8e\u76ee\u524d\u7684\u751f\u6210\u7248\u672c\u5f53\u4e2d\u3002**\n\u5982\u679c\u60a8\u6253\u7b97\u672a\u6765\u65b0\u589e\u529f\u80fd\uff0c\u5728\u8be5\u529f\u80fd\u5b9e\u73b0\u5e76\u53d1\u5e03\u4e4b\u524d\uff0c\u8bf7\u5728\u201c\u57fa\u672c\u4fe1\u606f\u201d\u9009\u9879\u5361\u4e2d\u79fb\u9664\u6240\u9009\u529f\u80fd\u3002\n\n- **\u4ea7\u54c1\u7684\u6e38\u620f\u5185\u4ea4\u6613\u5fc5\u987b\u4f7f\u7528 Steam \u94b1\u5305\u3002**\n\u4ea7\u54c1\u4e0d\u80fd\u94fe\u63a5\u81f3\u5176\u4ed6\u4e0d\u63d0\u4f9b Steam \u94b1\u5305\u7684\u5546\u5e97\u9875\u9762\u3002\n\n\u60a8\u53ef\u4ee5\u5728\u901a\u8fc7\u5ba1\u6838\u5e76\u83b7\u5f97\u6279\u51c6\u540e\u7ee7\u7eed\u5bf9\u751f\u6210\u7248\u672c\u8fdb\u884c\u66f4\u65b0\u548c\u53d8\u66f4\uff0c\u4f46\u4ecd\u5e94\u63d0\u4ea4\u4e00\u4efd\u8fd1\u4e4e\u7ec8\u7a3f\u7684\u751f\u6210\u7248\u672c\u4f9b\u5ba1\u6838\u3002\n\n## \u96c6\u6362\u5f0f\u5361\u724c\u5ba1\u6838\n\n\u96c6\u6362\u5f0f\u5361\u724c\u7684\u5ba1\u6838\u901a\u5e38\u9700\u8981 3-5 \u4e2a\u5de5\u4f5c\u65e5\u7684\u65f6\u95f4\u3002 \u5fc5\u8981\u65f6\uff0c\u6211\u4eec\u5c06\u4f1a\u901a\u8fc7\u5de5\u5177\u5c06\u610f\u89c1\u53cd\u9988\u63d0\u4f9b\u7ed9\u60a8\u3002 \u4e0a\u4f20\u6240\u6709\u7684\u96c6\u6362\u5f0f\u5361\u724c\u8d44\u4ea7\u540e\uff0c\u8bf7\u70b9\u51fb\u4f4d\u4e8e\u201c\u53d1\u884c\u72b6\u6001\u201d\u4e0b\u65b9\u7684\u7f16\u8f91\u94fe\u63a5\uff0c\u8fdb\u884c\u5361\u724c\u6389\u843d\u914d\u7f6e\uff0c\u5e76\u5c06\u60a8\u7684\u8d44\u4ea7\u6807\u4e3a\u5c31\u7eea\u5f85\u5ba1\u3002 \u4e00\u65e6\u6807\u4e3a\u5c31\u7eea\u5f85\u5ba1\uff0c\u60a8\u7684\u5361\u724c\u4fbf\u4f1a\u81ea\u52a8\u51fa\u73b0\u5728\u6211\u4eec\u7684\u961f\u5217\u4e2d\uff0c\u4f9b Valve \u8bbe\u8ba1\u5e08\u5ba1\u6838\u3002\n\n\u8d44\u4ea7\u88ab\u6279\u51c6\u540e\uff0c\u60a8\u5c06\u5728 Steamworks \u4e3b\u9875\u4e0a\u770b\u5230\u72b6\u6001\u66f4\u65b0\uff0c \u7136\u540e\uff0c\u60a8\u5c31\u53ef\u4ee5\u5c06\u53d1\u884c\u72b6\u6001\u8bbe\u4e3a\u201c\u5df2\u53d1\u884c\u201d\u5e76\u53d1\u5e03\u7269\u54c1\u3002 \u8bf7\u53c2\u89c1 [Steam \u96c6\u6362\u5f0f\u5361\u724c](https://partner.steamgames.com/doc/marketing/tradingcards)\u6587\u6863\uff0c\u4e86\u89e3\u66f4\u591a\u4fe1\u606f\u3002\n", "\u4e0a\u4f20\u81f3 Steam": "# \u4e0a\u4f20\u81f3 Steam\n\n\u6765\u6e90\uff1ahttps://partner.steamgames.com/doc/sdk/uploading\n\nSteamPipe \u662f Valve \u7684\u5de5\u5177\uff0c\u7528\u4e8e\u5411 Steam \u4ea4\u4ed8\u5185\u5bb9\uff0c\u4ee5\u4e0b\u662f\u5176\u4f7f\u7528\u6307\u5357\u3002 \u82e5\u60f3\u66f4\u6df1\u5165\u5730\u4e86\u89e3\u66f4\u65b0\u6e38\u620f\u7684\u6700\u4f73\u5b9e\u8df5\uff0c\u8bf7\u53c2\u89c1[\u66f4\u65b0\u60a8\u7684\u6e38\u620f\u2014\u2014\u6700\u4f73\u5b9e\u8df5](https://partner.steamgames.com/doc/store/updates)\u3002\n\n## SteamPipe \u5185\u5bb9\u7cfb\u7edf\u7b80\u4ecb\n\nSteamPipe \u662f\u9a71\u52a8 Steam \u7684\u6e38\u620f/\u5e94\u7528\u7a0b\u5e8f\u5185\u5bb9\u7cfb\u7edf\u3002 SteamPipe \u5305\u62ec\u4ee5\u4e0b\u529f\u80fd\uff1a\n\n- \u5185\u5bb9\u4ea4\u4ed8\u9ad8\u6548\u5feb\u6377\u3002\n\n- \u63d0\u4f9b\u516c\u5f00\u53ca\u79c1\u5bc6\u7684\u201c\u6d4b\u8bd5\u7248\u201d\u5206\u652f\uff0c\u5141\u8bb8\u6d4b\u8bd5\u591a\u4e2a\u751f\u6210\u7248\u672c\u3002\n\n- \u4ee5\u7f51\u9875\u4e3a\u57fa\u7840\u7684\u751f\u6210\u7248\u672c\u7ba1\u7406\u7b80\u5355\u6613\u7528\u2014\u2014\u53ea\u9700\u70b9\u51fb\u51e0\u6b21\uff0c\u5373\u53ef\u63a8\u51fa\u65b0\u7684\u751f\u6210\u7248\u672c\u6216\u56de\u6eda\u81f3\u65e7\u7684\u751f\u6210\u7248\u672c\u3002\n\n- \u5c06\u751f\u6210\u7248\u672c\u8bbe\u7f6e\u4e0a\u7ebf\u524d\u80fd\u591f\u770b\u5230\u5176\u66f4\u65b0\u5927\u5c0f\u3002\n\n- \u80fd\u591f\u5728\u591a\u4e2a\u5e94\u7528\u7a0b\u5e8f\u4e4b\u95f4\u5206\u4eab\u5185\u5bb9\u3002\n\n- \u80fd\u591f\u4ece\u516c\u5f00\u6216\u6d4b\u8bd5\u7248\u5185\u5bb9[\u751f\u6210\u5b89\u88c5\u5149\u76d8](https://partner.steamgames.com/doc/sdk/uploading#Building_Retail_Install_Discs)\u3002\n\n- \u5373\u4f7f\u66f4\u65b0\u4e0b\u8f7d\u5df2\u7ecf\u5f00\u59cb\uff0c\u6e38\u620f/\u5e94\u7528\u4e5f\u53ef\u79bb\u7ebf\u4f7f\u7528\u3002\n\n- \u6240\u6709\u5185\u5bb9\u6c38\u8fdc\u52a0\u5bc6\uff0c\u4e14\u672a\u6fc0\u6d3b\u7248\u672c\u4e0d\u4f1a\u5bf9\u987e\u5ba2\u53ef\u89c1\u3002\n\n- \u63d0\u4f9b\u53ef\u5728\u5f00\u53d1\u8fc7\u7a0b\u4e2d\u4f7f\u7528\u7684 [SteamPipe \u672c\u5730\u5185\u5bb9\u670d\u52a1\u5668](https://partner.steamgames.com/doc/sdk/uploading/local_content_server)\u3002\n\n**\u6ce8\u610f\uff1a**\u6709\u6570\u4e2a\u6982\u5ff5\u548c SteamPipe \u662f\u4e0d\u53ef\u5206\u5272\u7684\uff0c\u5728\u5f00\u59cb\u4e4b\u524d\uff0c\u60a8\u5e94\u5f53\u719f\u6089\u4e00\u4e0b[\u5e94\u7528\u7a0b\u5e8f](https://partner.steamgames.com/doc/store/application)\u6587\u6863\u4e2d\u63cf\u8ff0\u7684\u6240\u6709\u6982\u5ff5\u3002 \u54ea\u6015\u53ea\u662f\u5bf9\u8fd9\u4e9b\u90e8\u5206\u5982\u4f55\u534f\u540c\u8fd0\u4f5c\u6709\u4e00\u4e2a\u57fa\u7840\u7684\u4e86\u89e3\uff0c\u5728\u60a8\u5c06\u4ea7\u54c1\u4e0a\u4f20\u81f3 Steam \u65f6\u4e5f\u4f1a\u975e\u5e38\u6709\u5e2e\u52a9\u3002\n\n## \u6e38\u620f\u5185\u5bb9\u7ed3\u6784 - \u6700\u4f73\u5b9e\u8df5\n\nSteamPipe \u662f\u4e3a\u9ad8\u6548\u4e0b\u8f7d\u521d\u59cb\u6e38\u620f\u5b89\u88c5\u6587\u4ef6\u548c\u9ad8\u6548\u4fee\u8865\u66f4\u65b0\u800c\u8bbe\u8ba1\u7684\u3002 \u603b\u4f53\u800c\u8a00\uff0c\u5b83\u5728\u591a\u79cd\u6e38\u620f\u5185\u5bb9\u7ed3\u6784\u4e0a\u90fd\u8fd0\u884c\u826f\u597d\u3002 \u7136\u800c\uff0c\u5728\u4f18\u5316\u548c\u907f\u514d\u53ef\u80fd\u5bfc\u81f4\u4f4e\u6548\u95ee\u9898\u7684\u60c5\u51b5\u65b9\u9762\uff0c\u6709\u4e00\u4e9b\u91cd\u8981\u4e8b\u9879\u8981\u4e86\u89e3\u3002\n\n**\u6ce8\u610f\uff1a** \u5982\u679c\u60a8\u7684\u6e38\u620f\u4f7f\u7528**\u865a\u5e7b\u5f15\u64ce**\uff0c\u8bf7\u67e5\u770b\u672c\u8282\u672b\u5c3e\u9488\u5bf9\u5305\u6587\u4ef6\u7684\u6ce8\u610f\u4e8b\u9879\u3002\n\nSteamPipe \u6700\u521d\u4f1a\u628a\u6bcf\u4e2a\u6587\u4ef6\u5212\u5206\u4e3a\u5927\u7ea6 1 \u5146\uff08MB\uff09\u7684\u533a\u5757\u3002 \u968f\u540e\u6bcf\u4e2a\u533a\u5757\u88ab\u538b\u7f29\u5e76\u52a0\u5bc6\uff0c\u518d\u4e0a\u4f20\u81f3 Steam \u5185\u5bb9\u4ea4\u4ed8\u7cfb\u7edf\u3002 \u5b83\u4eec\u4f1a\u4fdd\u6301\u538b\u7f29\u548c\u52a0\u5bc6\u72b6\u6001\uff0c\u76f4\u5230\u88ab\u5ba2\u6237\u7aef\u4e0b\u8f7d\u3001\u89e3\u5bc6\u3001\u6269\u5c55\u5e76\u653e\u7f6e\u5230\u5fc5\u8981\u7684\u6587\u4ef6\u4f4d\u7f6e\u3002\n\nSteamPipe \u5728\u5904\u7406\u73b0\u6709\u6e38\u620f\u7684\u66f4\u65b0\u65f6\uff0c\u4f1a\u901a\u8fc7\u641c\u7d22\u6765\u627e\u5230\u4e0e\u8be5\u6e38\u620f\u4e4b\u524d\u7684\u751f\u6210\u7248\u672c\u5339\u914d\u7684\u6b64\u7c7b\u533a\u5757\u3002 \u8fd9\u6837\uff0c\u5728\u7406\u60f3\u60c5\u51b5\u4e0b\uff0c\u4efb\u4f55\u6587\u4ef6\u4e2d\u53ea\u6709\u65b0\u7684\u6216\u4fee\u6539\u8fc7\u7684\u90e8\u5206\u624d\u4f1a\u8f6c\u6362\u6210\u201c\u65b0\u201d\u533a\u5757\uff0c\u800c\u5ba2\u6237\u7aef\u53ea\u9700\u4e0b\u8f7d\u8fd9\u4e9b\u65b0\u533a\u5757\u5373\u53ef\u66f4\u65b0\u6e38\u620f\u3002\n\n\u8bb8\u591a\u6e38\u620f\u5f15\u64ce\u4f7f\u7528\u201c\u5305\u201d\u6587\u4ef6\u6765\u5408\u5e76\u6e38\u620f\u8d44\u4ea7\uff0c\u5e76\u901a\u8fc7\u66f4\u9ad8\u6548\u7684\u78c1\u76d8\u8bbf\u95ee\u6765\u6539\u5584\u52a0\u8f7d\u65f6\u95f4\u3002 \u603b\u4f53\u800c\u8a00\uff0c\u6b64\u65b9\u6cd5\u5728 SteamPipe \u4e0a\u8fd0\u884c\u826f\u597d\u3002 \u7136\u800c\uff0c\u90e8\u5206\u5305\u6587\u4ef6\u7cfb\u7edf\u4f1a\u91c7\u7528\u6216\u5141\u8bb8\u91c7\u7528\u67d0\u4e9b\u53ef\u80fd\u4f1a\u5f15\u53d1\u95ee\u9898\u7684\u884c\u4e3a\u3002 \u8fd9\u4e9b\u95ee\u9898\u51e0\u4e4e\u603b\u662f\u4f1a\u5bfc\u81f4\u66f4\u65b0\u6587\u4ef6\u8fdc\u8d85\u51fa\u5fc5\u8981\u7684\u5927\u5c0f\u3002 \u8fd9\u4e9b\u95ee\u9898\u8fd8\u53ef\u80fd\u4f1a\u5f15\u8d77\u4e0b\u8f7d\u8fc5\u901f\u4f46\u66f4\u65b0\u8fc7\u7a0b\u7f13\u6162\u7684\u60c5\u51b5\uff0c\u8fd9\u662f\u56e0\u4e3a\u5176\u4e2d\u6240\u9700\u7684\u672c\u5730\u78c1\u76d8\u8bfb\u5199\u91cf\u5de8\u5927\u3002\n\n\u5982\u679c\u60a8\u7684\u6e38\u620f\u4f7f\u7528\u5305\u6587\u4ef6\uff0c\u4ee5\u4e0b\u662f\u4e00\u4e9b\u901a\u7528\u6307\u5357\uff1a\n\n- \u786e\u4fdd\u8d44\u4ea7\u53d8\u66f4\u5c3d\u91cf\u5728\u5305\u6587\u4ef6\u5185\u7684**\u539f\u59cb\u4f4d\u7f6e**\u8fdb\u884c\u3002\n\n- **\u907f\u514d\u66f4\u6539**\u5305\u6587\u4ef6\u4e2d\u7684\u8d44\u4ea7\u6392\u5217\u987a\u5e8f\u3002\n\n- **\u9650\u5236**\u5305\u6587\u4ef6\u5927\u5c0f\u3002\n\n- \u6309\u5173\u5361/\u533a\u57df/\u529f\u80fd\u5c06\u8d44\u4ea7**\u5206\u7ec4**\u5230\u5404\u81ea\u7684\u5305\u6587\u4ef6\u4e2d\uff0c\u5e76\u8003\u8651\u5728\u66f4\u65b0\u65f6\u6dfb\u52a0\u65b0\u7684\u5305\u6587\u4ef6\uff0c\u800c\u4e0d\u662f\u4fee\u6539\u73b0\u6709\u5305\u6587\u4ef6\u3002\n\n- **\u5207\u52ff**\u7eb3\u5165\u6bcf\u4e2a\u8d44\u4ea7\u7684\u4efb\u4f55\u539f\u59cb**\u6587\u4ef6\u540d\u6216\u6587\u4ef6/\u751f\u6210\u7248\u672c\u65f6\u95f4\u6233**\u3002\n\n\u4e0a\u8ff0\u7b2c\u4e00\u70b9\u6307\u7684\u662f\u5355\u4e00\u8d44\u4ea7\u88ab\u4fee\u6539\u65f6\u6587\u4ef6\u5185\u5b57\u8282\u53d8\u66f4\u7684\u8303\u56f4\u3002 \u5982\u679c\u8d44\u4ea7\u6570\u636e\u662f\u5728\u5305\u6587\u4ef6\u5185\u7684\u76f8\u540c\u4f4d\u7f6e\u5f97\u5230\u4fee\u6539\u548c/\u6216\u589e\u51cf\u7684\uff0c\u8fd9\u5c06\u662f\u6700\u7406\u60f3\u7684\u60c5\u51b5\u3002 SteamPipe \u53ea\u4f1a\u4e3a\u6587\u4ef6\u4e2d\u5305\u542b\u8d44\u4ea7\u6570\u636e\u7684\u90e8\u5206\u521b\u5efa\u65b0\u7684\u533a\u5757\u3002 \u4f46\u662f\uff0c\u6240\u6709\u7684\u5305\u6587\u4ef6\u4e5f\u90fd\u9700\u8981\u67d0\u79cd\u7c7b\u578b\u7684\u76ee\u5f55\uff08TOC\uff09\uff0c\u4ee5\u4fbf\u5f15\u64ce\u53ef\u4ee5\u5bf9\u8d44\u4ea7\u6570\u636e\u8fdb\u884c\u5b9a\u4f4d\u3002 \u8fd9\u4e2a TOC \u7684\u7ed3\u6784\u5bf9 SteamPipe \u4fee\u8865\u7684\u6548\u7387\u5f71\u54cd\u6781\u5927\u3002 \u7406\u60f3\u60c5\u51b5\u4e0b\uff0c\u5728\u6587\u4ef6\u8d77\u59cb\u6216\u672b\u5c3e\u9644\u8fd1\u6709\u4e00\u4e2a TOC \u6216 TOC \u6811\u3002 \u7531\u4e8e\u5176\u4ed6\u8d44\u4ea7\u5728\u6587\u4ef6\u4e2d\u7684\u5b57\u8282\u4f4d\u7f6e\u53ef\u80fd\u4f1a\u53d1\u751f\u79fb\u52a8\uff0c\u56e0\u6b64\u5b83\u4eec\u7684 TOC \u6761\u76ee\u4e5f\u4f1a\u968f\u4e4b\u6539\u53d8\u3002 \u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0cSteamPipe \u4f1a\u4e3a\u4fee\u6539\u540e\u7684\u8d44\u4ea7\u6570\u636e\u53ca TOC \u90e8\u5206\u521b\u5efa\u65b0\u7684\u533a\u5757\u3002\n\n\u4f46\u662f\uff0c\u6211\u4eec\u5728\u4e00\u4e9b\u6e38\u620f\u5f15\u64ce\u4e2d\u770b\u5230\u7684\u60c5\u51b5\u662f\uff0c TOC \u4fe1\u606f\u4f1a\u5206\u5e03\u5728\u6574\u4e2a\u6587\u4ef6\u4e2d\u3002 \u66f4\u7cdf\u7cd5\u7684\u662f\uff0c\u5b83\u4eec\u4f7f\u7528\u7684\u662f\u5b57\u8282\u504f\u79fb\u91cf\u7684\u7edd\u5bf9\u503c\u3002 \u56e0\u6b64\uff0c\u5982\u679c\u4f4d\u4e8e\u7b2c 3450 \u5b57\u8282\u5904\u7684\u8d44\u4ea7\u5927\u5c0f\u589e\u52a0\u4e86 8 \u4e2a\u5b57\u8282\uff0c\u90a3\u4e48\u6587\u4ef6\u4e2d\u4f4d\u4e8e\u8be5\u8d44\u4ea7\u4e4b\u540e\u7684\u6240\u6709\u8d44\u4ea7\u7684\u504f\u79fb\u503c\u90fd\u4f1a\u53d1\u751f\u6539\u53d8\u3002 \u5373\u4fbf\u6bcf\u4e2a\u504f\u79fb\u503c\u4ec5\u4e3a 4 \u6216 8 \u4e2a\u5b57\u8282\u5927\u5c0f\uff0c8 \u5b57\u8282\u6570\u5b57\u7684\u53d8\u5316\u4e5f\u4f1a\u5bfc\u81f4 SteamPipe \u521b\u5efa 1MB \u7684\u65b0\u533a\u5757\u3002 \u8fd9\u5c06\u4f1a\u5e26\u6765\u707e\u96be\u6027\u7684\u540e\u679c\uff1a\u53ea\u8981\u4fee\u6539\u5305\u6587\u4ef6\u4e2d\u51e0\u4e2a\u5f88\u5c0f\u7684\u8d44\u4ea7\uff0c\u5c31\u4f1a\u5bfc\u81f4\u5ba2\u6237\u7aef\u9700\u8981\u4e0b\u8f7d\u4e00\u534a\u4ee5\u4e0a\u7684\u6587\u4ef6\u4ee5\u8fdb\u884c\u66f4\u65b0\u3002 \u5982\u679c\u60a8\u77e5\u9053\u6216\u6000\u7591\u81ea\u5df1\u7684\u5305\u6587\u4ef6\u7ed3\u6784\u4f1a\u5bfc\u81f4\u6b64\u95ee\u9898\uff0c\u8bf7\u5c3d\u5feb\u8054\u7cfb\u60a8\u7684 Valve \u4ee3\u8868\u3002 \u6211\u4eec\u6709\u66ff\u7528\u7684\u751f\u6210\u7248\u672c\u7b97\u6cd5\u53ef\u4ee5\u5e2e\u52a9\u51cf\u8f7b\u8fd9\u4e2a\u95ee\u9898\uff0c\u867d\u7136\u4e5f\u4f1a\u6709\u4e00\u5b9a\u7684\u5f0a\u7aef\u3002\n\n\u6b64\u5916\uff0cSteamPipe \u5e76\u4e0d\u77e5\u9053\u5305\u6587\u4ef6\u5185\u8d44\u4ea7\u7684\u8fb9\u754c\u3002 \u5982\u679c\u5927\u5c0f\u4e0d\u5230 1 \u5146\u5b57\u8282\u7684\u8d44\u4ea7\u88ab\u91cd\u65b0\u6392\u5e8f\uff0c\u8fd9\u79cd\u91cd\u65b0\u6392\u5e8f\u6781\u6709\u53ef\u80fd\u4e0d\u4f1a\u88ab\u68c0\u6d4b\u5230\uff0c\u56e0\u4e3a\u4e4b\u524d\u786e\u5b9a\u7684 1MB \u533a\u5757\u5c06\u4e0d\u4f1a\u518d\u5b58\u5728\u4e8e\u6587\u4ef6\u4e2d\u3002 \u56e0\u6b64\uff0c\u5728\u521b\u5efa\u6e38\u620f\u66f4\u65b0\u7684\u8fc7\u7a0b\u4e2d\uff0c\u5982\u679c\u60a8\u60f3\u901a\u8fc7\u628a\u5305\u6587\u4ef6\u5185\u7684\u8d44\u4ea7\u91cd\u65b0\u6392\u5e8f\u6765\u4f18\u5316\u52a0\u8f7d\u65f6\u95f4\uff0c\u8bf7\u6ce8\u610f\u8fd9\u53ef\u80fd\u5bfc\u81f4\u66f4\u65b0\u7684\u4e0b\u8f7d\u91cf\u975e\u5e38\u5927\u3002 \u6211\u4eec\u5efa\u8bae\u4ec5\u5728\u80fd\u663e\u8457\u63d0\u9ad8\u6027\u80fd\u65f6\u624d\u8fd9\u6837\u505a\u3002\n\n\u4e0b\u4e00\u6b65 - \u8981\u5728\u5ba2\u6237\u7aef\u8bbe\u5907\u4e0a\u66f4\u65b0\u5305\u6587\u4ef6\uff0cSteamPipe \u4f1a\u5728\u65e7\u7248\u672c\u4ee5\u5916\u521b\u5efa\u65b0\u7248\u672c\u3002 \u521b\u5efa\u5b8c\u6240\u6709\u65b0\u6587\u4ef6\u540e\uff0cSteamPipe \u4f1a\u901a\u8fc7\u5220\u9664\u65e7\u6587\u4ef6\u5e76\u4ef6\u79fb\u5165\u65b0\u6587\u4ef6\u6765\u201c\u63d0\u4ea4\u201d\u66f4\u65b0\u3002 \u8fd9\u610f\u5473\u7740\uff0c\u8981\u66f4\u65b0\u4e00\u4e2a 25GB \u7684\u5305\u6587\u4ef6\uff0cSteamPipe \u6bcf\u6b21\u90fd\u4f1a\u521b\u5efa\u4e00\u4e2a 25GB \u7684\u65b0\u6587\u4ef6\u3002 \u5373\u4f7f\u66f4\u65b0\u53ea\u662f\u5bf9\u8be5\u6587\u4ef6\u8fdb\u884c\u4e86 10 \u5b57\u8282\u7684\u4fee\u6539\uff0cSteamPipe \u4e5f\u9700\u8981\u5c06\u51e0\u4e4e\u5168\u90e8 25GB \u7684\u6570\u636e\u4ece\u65e7\u6587\u4ef6\u590d\u5236\u5230\u65b0\u6587\u4ef6\u3002 \u89c6\u5ba2\u6237\u7aef\u6240\u4f7f\u7528\u7684\u5b58\u50a8\u786c\u4ef6\u4e0d\u540c\uff0c\u8fd9\u4e2a\u8fc7\u7a0b\u53ef\u80fd\u4f1a\u975e\u5e38\u7f13\u6162\u3002 \u56e0\u6b64\uff0c\u6211\u4eec\u505a\u51fa\u4ee5\u4e0b\u4e24\u4e2a\u5efa\u8bae\uff1a\n\n\u7b2c\u4e00\uff0c\u9650\u5236\u5305\u6587\u4ef6\u7684\u5927\u5c0f\u3002 1 \u5230 2 \u5343\u5146\u5b57\u8282\uff08GB\uff09\u6216\u8bb8\u5c31\u8db3\u591f\u5927\u4e86\u2014\u2014\u8981\u4fdd\u8bc1\u5728\u52a0\u8f7d\u6e38\u620f\u65f6\u5b9e\u73b0\u9ad8\u6548\u7684\u78c1\u76d8\u8bfb\u53d6\u5df2\u7ef0\u7ef0\u6709\u4f59\u3002\n\n\u7b2c\u4e8c\uff0c\u5c06\u5355\u4e00\u5305\u6587\u4ef6\u4e2d\u7684\u8d44\u4ea7\u4fdd\u6301\u5728\u8f83\u4e3a\u6709\u9650\u7684\u8303\u56f4\u5185\u3002 \u53ef\u4ee5\u5c06\u5176\u9650\u5236\u4e3a\u5355\u4e2a\u6e38\u620f\u5173\u5361\uff0c\u6216\u662f\u5355\u4e2a\u53ef\u89e3\u9501\u529f\u80fd\u3002 \u8fd9\u6837\u4e00\u6765\uff0c\u9488\u5bf9\u6e38\u620f\u7279\u5b9a\u90e8\u5206\u8fdb\u884c\u7684\u66f4\u65b0\uff0c\u5c31\u4e0d\u4f1a\u5bfc\u81f4\u5176\u4ed6\u90e8\u5206\u7684\u6570\u636e\u5728\u5ba2\u6237\u7aef\u7535\u8111\u4e0a\u88ab\u590d\u5236\u6765\u590d\u5236\u53bb\u3002 \u6b64\u5916\uff0c\u5728\u6dfb\u52a0\u65b0\u529f\u80fd/\u5173\u5361/\u5176\u4ed6\u5185\u5bb9\u65f6\uff0c\u8fd9\u4e9b\u5185\u5bb9\u53ef\u4ee5\uff0c\u800c\u4e14\u901a\u5e38\u4e5f\u5e94\u8be5\uff0c\u88ab\u653e\u5165\u5168\u65b0\u7684\u72ec\u7acb\u5305\u6587\u4ef6\u4e2d\u3002 \u4e0b\u8f7d\u66f4\u65b0\u7684\u5ba2\u6237\u7aef\u4ec5\u4f1a\u4e0b\u8f7d\u65b0\u6587\u4ef6\uff0c\u907f\u514d\u4e0a\u6587\u63d0\u5230\u7684\u5305\u6587\u4ef6\u4fee\u6539\u5e26\u6765\u7684\u4efb\u4f55\u95ee\u9898\u3002\n\n\u4e0d\u786e\u5b9a\u7684\u65f6\u5019\uff0c\u53ef\u4ee5\u7528\u7c7b\u4f3c Beyond Compare \u7684\u672c\u5730\u4e8c\u8fdb\u5236\u6bd4\u8f83\u5de5\u5177\u6765\u6bd4\u8f83\u5404\u7248\u672c\u7684\u5305\u6587\u4ef6\u3002 \u786e\u8ba4\u663e\u793a\u51fa\u6765\u7684\u5dee\u5f02\u5927\u5c0f\u662f\u5426\u7b26\u5408\u60a8\u5bf9\u8d44\u4ea7\u66f4\u6539\u7684\u9884\u671f\uff0c\u540c\u65f6\u4e5f\u8981\u786e\u8ba4\u6587\u4ef6\u4e2d\u4e0d\u4f1a\u51fa\u73b0\u51e0\u5341\u5904\u751a\u81f3\u4e0a\u767e\u5904\u96f6\u6563\u5206\u5e03\u7684\u5c0f\u6539\u52a8\u3002 \u5982\u679c\u60a8\u6240\u770b\u5230\u7684\u4e0d\u5728\u610f\u6599\u4e4b\u4e2d\uff0c\u68c0\u67e5\u60a8\u5305\u6587\u4ef6\u5de5\u5177\u7684\u8bbe\u7f6e\u3002\n\n**\u538b\u7f29\uff1a**\u56e0\u4e3a Steam \u4f1a\u4e3a\u4e86\u4e0a\u4f20/\u5b58\u50a8/\u4e0b\u8f7d\u800c\u538b\u7f29\u6240\u6709\u6570\u636e\uff0c\u6240\u4ee5\u6211\u4eec\u4e00\u822c\u4e0d\u5efa\u8bae\u5bf9\u5305\u6587\u4ef6\u8fdb\u884c\u6574\u4f53\u538b\u7f29\u3002 \u4f46\u662f\uff0c\u5982\u679c\u60a8\u62c5\u5fc3\u6e38\u620f\u5360\u7528\u78c1\u76d8\u7a7a\u95f4\u592a\u5927\uff0c\u53ef\u80fd\u8fd8\u662f\u9700\u8981\u8fdb\u884c\u5305\u6587\u4ef6\u538b\u7f29\u3002 \u53ea\u8981\u6ee1\u8db3\u4e0a\u65b9\u6240\u5217\u6761\u4ef6\uff0c\u538b\u7f29\u5bf9\u4e8e SteamPipe \u800c\u8a00\u662f\u53ef\u884c\u7684\u3002 \u5177\u4f53\u6765\u8bf4\uff0c\u60a8\u5e94\u8be5\u786e\u4fdd\u5c3d\u53ef\u80fd\u5730\u6309\u8d44\u4ea7\u8fdb\u884c\u538b\u7f29\u3002 \u4efb\u4f55\u8de8\u8d44\u4ea7\u8fb9\u754c\u8fdb\u884c\u7684\u538b\u7f29\u90fd\u4f1a\u4f7f\u53d8\u66f4\u5206\u6563\u5f00\u6765\uff0c\u5bfc\u81f4\u5ba2\u6237\u7aef\u4e0d\u5f97\u4e0d\u4e0b\u8f7d\u8fc7\u591a\u7684\u6570\u636e\u3002\n\n**\u52a0\u5bc6\uff1a**\u4e0e\u538b\u7f29\u7c7b\u4f3c\uff0c\u6781\u6709\u53ef\u80fd\u6ca1\u6709\u5fc5\u8981\uff0c\u4e5f\u4f1a\u5e26\u6765\u4e0a\u8ff0\u7684\u98ce\u9669\u3002\n\n\u5982\u679c\u60a8\u9075\u5faa\u8fd9\u4e9b\u89c4\u5219\uff0c\u5c31\u4f1a\u5c06\u8865\u4e01\u5927\u5c0f\u964d\u5230\u6700\u4f4e\uff0c\u4e14\u53ea\u9700\u4e0b\u8f7d\u65b0\u5185\u5bb9\u3002 \u60a8\u7684\u987e\u5ba2\u4f1a\u56e0\u6b64\u800c\u611f\u6fc0\u60a8\uff0c\u800c\u60a8\u4e5f\u5c06\u80fd\u591f\u589e\u52a0\u66f4\u65b0\u7684\u53d1\u5e03\u6b21\u6570\uff0c\u4ece\u800c\u63d0\u9ad8\u4ea7\u54c1\u8d28\u91cf\u3002\n\n\u5982\u679c\u60a8\u89c9\u5f97\u81ea\u5df1\u6e38\u620f\u7684\u6253\u5305\u4e0e SteamPipe \u66f4\u65b0\u6d41\u7a0b\u517c\u5bb9\u6027\u4e0d\u4f73\uff0c\u8bf7\u8054\u7cfb\u60a8\u7684 Valve \u4ee3\u8868\uff0c\u6211\u4eec\u53ef\u4ee5\u8003\u8651\u542f\u7528\u9ad8\u7ea7\u529f\u80fd\uff0c\u4ee5\u5e2e\u52a9\u89e3\u51b3\u8be5\u95ee\u9898\u3002\n\n**\u865a\u5e7b\u5f15\u64ce** - \u7279\u522b\u6ce8\u610f\u4e8b\u9879\n\n\u67d0\u4e9b\u7248\u672c\u7684\u865a\u5e7b\u5f15\u64ce\u4f1a\u5728\u5305\u6587\u4ef6\u4e2d\u4f7f\u7528\u8d44\u4ea7\u201c\u586b\u5145\u5bf9\u9f50\u201d\uff0c\u8fd9\u4f1a\u6781\u5927\u5730\u5f71\u54cd SteamPipe \u66f4\u65b0\u7684\u5927\u5c0f\u3002 \u8fd9\u79cd\u5bf9\u9f50\u4f1a\u5728\u521b\u5efa\u65b0\u7248\u672c\u65f6\u5bfc\u81f4\u7ea7\u8054\u8d44\u4ea7\u79fb\u52a8\uff0c\u7279\u522b\u662f\u542f\u7528\u4e86\u5305\u6587\u4ef6\u538b\u7f29\u7684\u60c5\u51b5\u4e0b\u3002 \u4f7f\u7528 1MB\uff081048576\uff09\u7684\u586b\u5145\u5bf9\u9f50\u503c\uff0c\u5c06\u6709\u52a9\u4e8e\u786e\u4fdd\u91cd\u65b0\u5bf9\u9f50\u65f6\u8d44\u4ea7\u7684\u4f4d\u79fb\u91cf\uff0c\u662f SteamPipe \u7528\u4e8e\u589e\u91cf\u8ba1\u7b97\u7684\u76f8\u540c\u5757\u5927\u5c0f\u7684\u500d\u6570\u3002\n\n\u4f8b\u5982\uff0c\u5982\u679c\u8981\u5728\u201c\u70d8\u7119\u201d\u6e38\u620f\u5305\u6587\u4ef6\u65f6\u66f4\u6539\u6216\u6307\u5b9a\u586b\u5145\u5bf9\u9f50\uff0c\u60a8\u9700\u8981\u66f4\u6539 `UnrealEngine/Engine/Source/Programs/AutomationTool/Win/WinPlatform.Automation.cs` \u6587\u4ef6\u4e2d\u7684\u4e00\u884c\u3002 \u8be5\u6587\u4ef6\u5305\u542b\u4e00\u4e2a `GetPlatformPakCommandLine` \u51fd\u6570\u2014\u2014\u5728\u8be5\u51fd\u6570\u4e2d\uff0c\u627e\u5230\u4e0b\u9762\u8fd9\u884c\uff1a\n\nstring PakParams = \" -patchpaddingalign=2048\";\n\u5c06\u5176\u6539\u4e3a\uff1a\n\nstring PakParams = \" -patchpaddingalign=1048576 -blocksize=1048576\";\n\u66f4\u6539\u540e\uff0c\u60a8\u5e94\u8be5\u53ef\u4ee5\u542f\u7528\u5305\u6587\u4ef6\u538b\u7f29\uff0c\u4e14\u4ecd\u7136\u53ef\u4ee5\u83b7\u5f97\u4f18\u5316\u540e\u7684 SteamPipe \u66f4\u65b0\u884c\u4e3a\u3002\n\n*\u865a\u5e7b\u5f15\u64ce\u662f Epic \u5728\u7f8e\u56fd\u53ca\u5176\u4ed6\u5730\u65b9\u7684\u5546\u6807\u6216\u6ce8\u518c\u5546\u6807\u3002*\n\n## Steamworks \u89c6\u9891\u6559\u7a0b\uff1a\u5728 SteamPipe \u4e2d\u521b\u5efa\u60a8\u7684\u6e38\u620f\n\n\u6b64\u6559\u7a0b\u5bf9 SteamPipe \u8fdb\u884c\u4e86\u4ecb\u7ecd\uff0c\u5e76\u9010\u6b65\u793a\u8303\u4e86\u901a\u8fc7 Steamworks \u5de5\u5177\u4e3a Steam \u521b\u5efa\u6837\u4f8b\u5e94\u7528\u7a0b\u5e8f\u7684\u8fc7\u7a0b\u3002\n ![](https://img.youtube.com/vi/SoNH-v6aU9Q/0.jpg)  YouTube\u2122 \u89c6\u9891: Steamworks Tutorial #1 - Building Your Content in Steampipe   \u89c2\u770b\uff1a292,213 \u6b21   A tutorial to help you build your content for Steam via the Steamworks tools. http://partner.steamgames.com Outline: - Introduction (00:00) - Configuration and Depots (01:37) - Prepping Your Files...\n\n## Steamworks \u89c6\u9891\u6559\u7a0b \u2013 \u6dfb\u52a0\u65b0\u5e73\u53f0\u4e0e\u8bed\u8a00\n\n\u6b64\u6559\u7a0b\u9010\u6b65\u793a\u8303\u4e86\u5982\u4f55\u901a\u8fc7\u5411\u5e94\u7528\u6dfb\u52a0 Depot \u6765\u4e3a\u6e38\u620f\u6dfb\u52a0\u65b0\u5e73\u53f0\u548c\u65b0\u8bed\u8a00\u3002\n ![](https://img.youtube.com/vi/PShS32hcing/0.jpg)  YouTube\u2122 \u89c6\u9891: Steamworks Tutorial #4 - Adding New Platforms and Languages   \u89c2\u770b\uff1a48,489 \u6b21   A tutorial to walk through how to use depots to add new platforms and languages to you Steam app via the Steamworks tools.\n\n#### SteamPipe \u6280\u672f\u8be6\u60c5\n\nSteamPipe \u4f7f\u7528 HTTP \u534f\u8bae\u8fdb\u884c\u5185\u5bb9\u4ea4\u4ed8\u3002 \u7531\u4e8e\u4e0b\u8f7d\u5c5e\u4e8e\u5e38\u89c4\u7684\u7f51\u9875\u6d41\u91cf\uff0c\u56e0\u6b64\u987e\u5ba2\u4e0e Steam \u670d\u52a1\u5668\u4e4b\u95f4\u7684\u4efb\u4f55\u7b2c\u4e09\u65b9 HTTP \u7f13\u5b58\u90fd\u4f1a\u63d0\u9ad8\u4e0b\u8f7d\u901f\u5ea6\u3002 \u5185\u5bb9\u53ef\u4ee5\u7531\u5916\u90e8 CDN \u63d0\u4f9b\u5546\u6258\u7ba1\uff0c\u800c CDN \u63d0\u4f9b\u5546\u53ef\u8f7b\u677e\u6dfb\u52a0\u81f3\u6211\u4eec\u7684\u5185\u5bb9\u7f51\u7edc\u3002 \u5927\u591a\u6570\u6d88\u8d39\u8005\u4f7f\u7528\u7684\u9632\u706b\u5899\u90fd\u5141\u8bb8 HTTP \u6d41\u91cf\uff0c\u4e0d\u4f1a\u963b\u6b62\u4e0b\u8f7d\u3002\n\nSteamPipe \u5177\u6709\u57fa\u4e8e\u4e8c\u8fdb\u5236\u589e\u91cf\u7684\u9ad8\u6548\u8865\u4e01\u7b97\u6cd5\uff0c\u4ec5\u66f4\u6539\u73b0\u6709\u5185\u5bb9\u6587\u4ef6\u7684\u4fee\u6539\u90e8\u5206\u3002 \u6b64\u5185\u5bb9\u66f4\u65b0\u65f6\uff0c\u53ea\u9700\u8981\u53d1\u9001\u8fd9\u4e9b\u589e\u91cf\u3002 \u8fd9\u610f\u5473\u7740\u5f00\u53d1\u4eba\u5458\u548c\u7528\u6237\u7684\u4f20\u8f93\u91cf\u90fd\u66f4\u5c0f\uff0c\u901f\u5ea6\u90fd\u66f4\u5feb\u3002 \u5927\u591a\u6570\u5408\u4f5c\u4f19\u4f34\u4f1a\u53d1\u73b0\u6ca1\u5fc5\u8981\u4f7f\u7528 [SteamPipe \u672c\u5730\u5185\u5bb9\u670d\u52a1\u5668](https://partner.steamgames.com/doc/sdk/uploading/local_content_server)\uff0c\u56e0\u4e3a\u4ed6\u4eec\u53ef\u4ee5\u9ad8\u6548\u5730\u5728\u79c1\u5bc6\u5206\u652f\u4e0a\u7ed9\u751f\u6210\u7248\u672c\u6253\u8865\u4e01\u3002\n\n## Steam \u751f\u6210\u7248\u672c\u5e10\u6237\n\n\u5728 Steam \u4e0a\u521b\u5efa\u4efb\u4f55\u751f\u6210\u7248\u672c\u4e4b\u524d\uff0c\u60a8\u7684 Steamworks \u5e10\u6237\u4e2d\u5fc5\u987b\u6709\u4e00\u4e2a\u62e5\u6709\u201c\u7f16\u8f91\u5e94\u7528\u5143\u6570\u636e\u201d\u548c\u201c\u5728 Steam \u4e0a\u53d1\u5e03\u5e94\u7528\u66f4\u6539\u201d\u6743\u9650\u7684 Steam \u5e10\u6237\u3002 \u51fa\u4e8e\u5b89\u5168\u8003\u8651\uff0c\u5efa\u8bae\u60a8\u6301\u6709\u4e00\u4e2a\u4ec5\u5177\u5907\u8fd9\u4e9b\u6743\u9650\u7684\u751f\u6210\u7248\u672c\u4e13\u7528\u5e10\u6237\u3002\u60a8\u53ef\u4ee5\u5728 [https://store.steampowered.com/join](https://store.steampowered.com/join) \u4e3a\u6b64\u521b\u5efa\u4e00\u4e2a\u65b0\u7684 Steam \u5e10\u6237\u3002\n\n\u60a8 Steamworks \u5e10\u6237\u7684\u4efb\u4f55\u7ba1\u7406\u5458\u90fd\u53ef\u4ee5\u6dfb\u52a0 Steam \u5e10\u6237\u5e76\u6388\u4e88\u5fc5\u8981\u7684\u6743\u9650\u3002 \u5173\u4e8e\u6b64\u6d41\u7a0b\u7684\u66f4\u591a\u4fe1\u606f\u53ef\u5728[\u7ba1\u7406\u60a8\u7684 Steamworks \u5e10\u6237](https://partner.steamgames.com/doc/gettingstarted/managing_users)\u6587\u6863\u4e2d\u627e\u5230\u3002 \u6b64\u5e10\u6237\u7684\u793a\u4f8b\u5982\u4e0b\uff1a\n\n![create_build_account.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/create_build_account.png)**\u6ce8\u610f\uff1a**\u5982\u679c Steam \u5e10\u6237\u9700\u8981\u4e3a\u5df2\u53d1\u5e03\u7684\u5e94\u7528\u5c06\u67d0\u4e2a\u751f\u6210\u7248\u672c\u8bbe\u7f6e\u4e3a\u4e0a\u7ebf\uff0c\u5219\u9700\u8981\u4e3a\u5e10\u6237\u7ed1\u5b9a\u4e00\u4e2a\u7535\u8bdd\u53f7\u7801\uff0c\u6216\u8005\u5c06 Steam \u624b\u673a\u5e94\u7528\u5173\u8054\u81f3\u5176\u5e10\u6237\u3002 \u8fd9\u4e9b\u65b9\u6cd5\u5c06\u7528\u4e8e\u786e\u8ba4\u4e3a\u5df2\u53d1\u5e03\u7684\u5e94\u7528\u5c06\u751f\u6210\u7248\u672c\u8bbe\u7f6e\u4e3a\u4e0a\u7ebf\u3002 \u6b64\u5916\uff0c\u5982\u679c Steam \u5e10\u6237\u6709\u4efb\u4f55\u5b89\u5168\u65b9\u9762\u7684\u66f4\u6539\uff08\u7535\u5b50\u90ae\u4ef6\u3001\u624b\u673a\u53f7\u7801\u7b49\uff09\uff0c\u5219\u9700\u8981\u7b49\u5f85 3 \u5929\u624d\u80fd\u4e3a\u5df2\u53d1\u5e03\u7684\u5e94\u7528\u5c06\u751f\u6210\u7248\u672c\u8bbe\u7f6e\u4e3a\u4e0a\u7ebf\u3002 \u8fd9\u662f\u4e3a\u4e86\u9632\u6b62\u88ab\u76d7\u5e10\u6237\u7ba1\u7406\u5e94\u7528\u7684\u5df2\u53d1\u5e03\u751f\u6210\u7248\u672c\u3002\n\n## \u65b0 SteamPipe \u5e94\u7528\u7684\u521d\u59cb\u8bbe\u7f6e\n\n\u8bf7\u6309\u7167\u4ee5\u4e0b\u6b65\u9aa4\u8bbe\u7f6e\u65b0\u7684 SteamPipe \u5e94\u7528\uff1a\n\n- \u627e\u5230\u60a8\u5e94\u7528\u7a0b\u5e8f\u7684 app ID\uff08\u53ef\u4ee5\u901a\u8fc7\u5728\u60a8\u7684 Steamworks \u4e3b\u9875\u4e0a\u9009\u62e9\u8be5\u5e94\u7528\u7a0b\u5e8f\u6765\u627e\u5230\uff09\u3002\n\n- \u524d\u5f80\u60a8\u5e94\u7528\u7684[\u901a\u7528\u5b89\u88c5\u8bbe\u7f6e](https://partner.steamgames.com/apps/config/)\u9875\u9762\u3002\n\n- \u5b9a\u4e49\u81f3\u5c11\u4e00\u4e2a\u542f\u52a8\u9009\u9879\uff0c\u5373\u8def\u5f84\u4ee5\u53ca\u542f\u52a8\u6e38\u620f\u6240\u9700\u7684\u4efb\u610f\u53c2\u6570\uff08\u53ef\u9009\uff09\u3002 \u5c06\u9f20\u6807\u60ac\u505c\u5728 (?) \u4e0a\u65b9\uff0c\u4e86\u89e3\u6bcf\u4e2a\u5b57\u6bb5\u7684\u8be6\u60c5\u3002\n\n \u4ee5\u4e0b\u793a\u4f8b\u663e\u793a\u4e86 5 \u4e2a\u542f\u52a8\u9009\u9879\uff0c\u5176\u4e2d 2 \u4e2a\u7528\u4e8e Windows\uff0c2 \u4e2a\u7528\u4e8e macOS\uff0c1 \u4e2a\u7528\u4e8e Linux \u3002\n \u53ea\u6709\u5728\u7528\u6237\u8fd8\u62e5\u6709\u5176\u4e2d\u6307\u5b9a\u7684 DLC \u7684\u60c5\u51b5\u4e0b\uff0c\u542f\u52a8\u9009\u9879 3 \u624d\u4f1a\u5728 Windows \u4e0a\u663e\u793a\u3002\n\n ![updatedlaunchoptions_3.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/updatedlaunchoptions_3.png)\n\n- \u524d\u5f80 [Depot](https://partner.steamgames.com/apps/depots/) \u9875\u9762\uff0c\u6839\u636e\u9700\u8981\u4e3a\u6b64\u5e94\u7528\u6dfb\u52a0 depot\u3002 \u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0c\u60a8\u7684\u5e94\u7528\u7a0b\u5e8f\u53ef\u80fd\u5df2\u7ecf\u914d\u7f6e\u4e86\u4e00\u4e2a Depot\u3002\n\n- \u70b9\u51fb\u9ed8\u8ba4 Depot\uff0c\u5c06\u5176\u540d\u79f0\u66f4\u6539\u4e3a\u5408\u9002\u4e14\u6613\u4e8e\u8bc6\u522b\u7684\u540d\u79f0\uff08\u4f8b\u5982\u201c\u57fa\u7840\u5185\u5bb9\u201d\u6216\u201cWindows \u5185\u5bb9\u201d\uff09\u3002\n\n  - \u9664\u975e\u8fd9\u662f\u9488\u5bf9\u7279\u5b9a\u8bed\u8a00\u7684 Depot\uff0c\u5426\u5219\u8bf7\u5728\u8bed\u8a00\u8bbe\u7f6e\u4e2d\u4fdd\u7559\u201c\u6240\u6709\u8bed\u8a00\u201d\u3002\n\n  - \u9664\u975e\u8fd9\u662f\u9488\u5bf9\u7279\u5b9a\u64cd\u4f5c\u7cfb\u7edf\u7684 Depot\uff0c\u5426\u5219\u8bf7\u5728\u64cd\u4f5c\u7cfb\u7edf\u8bbe\u7f6e\u4e2d\u4fdd\u7559\u201c\u6240\u6709\u64cd\u4f5c\u7cfb\u7edf\u201d\uff08\u5982\u679c\u5e94\u7528\u9002\u7528\u4e8e\u6240\u6709\u7cfb\u7edf\uff0c\u6216\u4ec5\u9002\u7528\u4e8e PC \u6216\u8005 Mac\uff0c\u5219\u5e94\u4fdd\u7559[\u6240\u6709\u64cd\u4f5c\u7cfb\u7edf]\u7684\u8bbe\u7f6e\uff09\u3002 \u5e94\u4ec5\u4e3a\u7279\u5b9a\u64cd\u4f5c\u7cfb\u7edf\u4e13\u7528\u7684\u6e38\u620f Depot \u9009\u62e9\u5177\u4f53\u64cd\u4f5c\u7cfb\u7edf\u3002\n\n  - \u70b9\u51fb**\u6dfb\u52a0\u65b0 Depot** \u4ee5\u521b\u5efa\u66f4\u591a Depot\u3002\n\n  - \u70b9\u51fb**\u4fdd\u5b58**\u4ee5\u4fdd\u5b58\u6240\u505a\u7684\u6240\u6709\u66f4\u6539\u3002\n\n- \u5b8c\u6210\u5bf9 Depot \u7684\u5b9a\u4e49\u540e\uff0c\u524d\u5f80[\u53d1\u5e03](https://partner.steamgames.com/apps/publishing)\u9875\u9762\u53d1\u5e03\u60a8\u6240\u505a\u7684\u66f4\u6539\u3002\n\n- \u60a8\u65b0\u5b9a\u4e49\u7684 Depot \u9700\u8981\u7eb3\u5165\u7a0b\u5e8f\u5305\u4e2d\uff0c\u8fd9\u6837\u624d\u80fd\u5411\u60a8\u6388\u4e88\u8fd9\u4e9b Depot \u7684\u6240\u6709\u6743\u3002 Steam \u4e0a\u7684\u6bcf\u6b3e\u6e38\u620f\u90fd\u5e94\u8be5\u6709\u4e00\u4e2a Developer Comp \u7a0b\u5e8f\u5305\uff0c\u4f1a\u81ea\u52a8\u6388\u4e88\u7ed9\u60a8\u53d1\u884c\u5546\u7ec4\u4e2d\u5217\u51fa\u7684\u5e10\u6237\u3002\n \u60a8\u53ef\u4ee5\u5728[\u5173\u8054\u7a0b\u5e8f\u5305\u4e0e DLC](https://partner.steamgames.com/apps/associated) \u9875\u9762\u5c06\u65b0\u7684 Depot \u6dfb\u52a0\u81f3\u8be5\u7a0b\u5e8f\u5305\uff08\u548c/\u6216\u5176\u4ed6\u5e94\u8be5\u6709\u8fd9\u4e9b Depot \u7684\u7a0b\u5e8f\u5305\uff09\u3002\n\n**\u6ce8\u610f\uff1a**\u5982\u679c\u53ef\u6267\u884c\u6587\u4ef6\u4f4d\u4e8e\u4e3b\u5b89\u88c5\u6587\u4ef6\u5939\u7684\u5b50\u6587\u4ef6\u5939\u4e2d\uff0c\u8bf7\u5728\u201c\u53ef\u6267\u884c\u6587\u4ef6\u201d\u5b57\u6bb5\u4e2d\u6dfb\u52a0\u5b50\u6587\u4ef6\u5939\u540d\u79f0\u3002 \u8bf7\u52ff\u4f7f\u7528\u524d\u5bfc\u659c\u6760\u6216\u70b9\u3002**\u5e73\u53f0\u5907\u6ce8\uff1a**\u5982\u4e0a\u6240\u793a\uff0cmacOS \u5e94\u7528\u7a0b\u5e8f\u53ef\u4ee5\u901a\u8fc7\u6307\u5b9a\u5e94\u7528 Bundle\uff08Game.app\uff09\u6216\u811a\u672c/\u4e8c\u8fdb\u5236\u6587\u4ef6\uff08Game.app/Contents/MacOS/Game\uff09\u6765\u542f\u52a8\u3002 \u4e00\u822c\u800c\u8a00\uff0c\u5e94\u5728\u53ef\u80fd\u7684\u60c5\u51b5\u4e0b\u9996\u9009\u5e94\u7528 Bundle \u683c\u5f0f\uff0c\u56e0\u4e3a\u8fd9\u5141\u8bb8 macOS \u6309\u7167\u5728 Steam \u4e4b\u5916\u624b\u52a8\u542f\u52a8\u7684\u65b9\u5f0f\uff0c\u66f4\u51c6\u786e\u5730\u5224\u5b9a\u542f\u52a8\u53c2\u6570\u3002\n\n\u8fd9\u65b9\u9762\u8981\u6ce8\u610f\u7684\u4e00\u4e2a\u5b9e\u4f8b\u5c31\u662f\uff0c\u5f53\u524d\uff0c\u5728\u642d\u8f7d Apple \u82af\u7247\u7684\u8bbe\u5907\u4e0a\u901a\u8fc7\u5e94\u7528 Bundle \u542f\u52a8\u7684\u5e94\u7528\u7a0b\u5e8f\u4f1a\u81ea\u52a8\u9009\u62e9\u8be5\u5e94\u7528\u4e2d\u53ef\u7528\u7684\u6700\u4f73\u67b6\u6784\uff1b\u800c\u5982\u679c\u76f4\u63a5\u542f\u52a8\u4e8c\u8fdb\u5236\u6587\u4ef6\uff0c\u5219\u4f1a\u4f7f\u7528\u4e0e Steam \u8fdb\u7a0b\u76f8\u540c\u7684\u67b6\u6784\uff08\u76ee\u524d\u662f x86_64\uff09\u3002\n\n## \u4e3a SteamPipe \u4e0a\u4f20\u8bbe\u7f6e SDK\n\n\u5728\u5c06\u8981\u4e0a\u4f20\u751f\u6210\u7248\u672c\u7684\u8ba1\u7b97\u673a\u4e0a\u4e0b\u8f7d\u5e76\u89e3\u538b\u7f29\u6700\u65b0\u7248\u672c\u7684 Steamworks SDK\u3002\n\n\u60a8\u53ef\u4ee5\u5728 SDK \u7684 `tools` \u6587\u4ef6\u5939\u4e2d\u627e\u5230 SteamPipe \u5de5\u5177\uff0c\u5176\u4e2d\u5305\u542b 2 \u4e2a\u76f8\u5173\u7684\u5b50\u76ee\u5f55\u3002\n\n`ContentBuilder` \u76ee\u5f55\u662f\u60a8\u7684\u6e38\u620f\u5185\u5bb9\u548c SteamPipe \u751f\u6210\u7248\u672c\u5de5\u5177\u6240\u5728\u7684\u76ee\u5f55\u3002 \u6b64\u76ee\u5f55\u5305\u542b\u4ee5\u4e0b\u5b50\u76ee\u5f55\uff1a\n\n- **builder** - \u6b64\u76ee\u5f55\u6700\u521d\u4ec5\u5305\u542b steamcmd.exe\uff0c\u5373 Steam \u7684\u547d\u4ee4\u884c\u7248\u3002\n\n- **builder_linux** - steamcmd \u7684 Linux \u7248\u3002\n\n- **builder_osx** - steamcmd \u7684 macOS \u7248\u3002\n\n- **content** - \u6b64\u76ee\u5f55\u5305\u542b\u6240\u6709\u5c06\u6dfb\u52a0\u5230 Depot \u4e2d\u7684\u6e38\u620f\u6587\u4ef6\u3002\n\n- **output** - \u6b64\u76ee\u5f55\u5c06\u662f\u751f\u6210\u7248\u672c\u65e5\u5fd7\u3001\u533a\u5757\u7f13\u5b58\u548c\u4e2d\u95f4\u8f93\u51fa\u6240\u5728\u7684\u4f4d\u7f6e\u3002 **\u6ce8\u610f\uff1a**\u6b64\u6587\u4ef6\u5939\u53ef\u4ee5\u968f\u65f6\u5220\u9664\u6216\u6e05\u7a7a\uff0c\u4f46\u662f\u5220\u9664\u540e\uff0c\u4e0b\u4e00\u6b21\u4e0a\u4f20\u5c06\u82b1\u8d39\u66f4\u957f\u7684\u65f6\u95f4\u3002\n\n- **scripts** - \u5728\u6b64\u76ee\u5f55\u4e2d\uff0c\u60a8\u5c06\u653e\u7f6e\u7528\u4e8e\u751f\u6210\u6e38\u620f Depot \u7684\u6240\u6709\u751f\u6210\u7248\u672c\u811a\u672c\u3002\n\n![steampipebuilddir.png](https://shared.akamai.steamstatic.com/community_assets/images/steamworks_docs/schinese/steampipebuilddir.png)\n\n\u5efa\u8bae\u60a8\u76f4\u63a5\u5728 builder \u6587\u4ef6\u5939\u4e2d\u4e3a\u60a8\u7684\u5e73\u53f0\u8fd0\u884c\u4e00\u6b21 steamcmd.exe\uff0c\u4ee5\u542f\u52a8\u60a8\u7684\u751f\u6210\u7248\u672c\u7cfb\u7edf\u3002 \u8fd9\u5e94\u80fd\u5728\u60a8\u7684 builder \u76ee\u5f55\u4e2d\u586b\u5145\u751f\u6210 Depot \u6240\u9700\u7684\u6240\u6709\u6587\u4ef6\u3002\n\n\u5982\u679c\u60a8\u9009\u62e9\u8fd0\u884c\u81ea\u5df1\u7684 [SteamPipe \u672c\u5730\u5185\u5bb9\u670d\u52a1\u5668](https://partner.steamgames.com/doc/sdk/uploading/local_content_server)\uff0c`ContentServer` \u76ee\u5f55\u4e2d\u5305\u542b\u6240\u9700\u7684\u5de5\u5177\u3002\n\n## macOS \u4e0a\u7684 SteamCmd\n\n\u8981\u5728 macOS \u4e0a\u542f\u7528 SteamCmd\uff0c\u60a8\u5fc5\u987b\u5b8c\u6210\u4ee5\u4e0b\u6b65\u9aa4\uff1a\n\n- \u5728\u7ec8\u7aef\u4e0a\uff0c\u627e\u5230 tools\\ContentBuilder\\builder_osx \u6587\u4ef6\u5939\u3002\n\n- \u8fd0\u884c chmod +x steamcmd\u3002\n\n- \u8f93\u5165 bash ./steamcmd.sh\u3002\n\n- \u7136\u540e\uff0cSteamCmd \u5c06\u8fd0\u884c\u5e76\u66f4\u65b0\u5230\u6700\u65b0\u7684\u751f\u6210\u7248\u672c\uff0c\u60a8\u5c06\u4f1a\u770b\u5230 SteamCmd \u63d0\u793a\u3002\n\n- \u8f93\u5165\u201cexit\u201d\u5e76\u6309\u4e0b\u56de\u8f66\u952e\u4ee5\u9000\u51fa\u63d0\u793a\u3002\n\n\u7136\u540e\uff0c\u60a8\u53ef\u4ee5\u9075\u7167\u6b64\u6587\u6863\u7684\u4f59\u4e0b\u90e8\u5206\uff08\u9002\u5f53\u5730\u66ff\u6362\u8def\u5f84\uff09\uff0c\u521b\u5efa\u7528\u4e8e\u5c06\u60a8\u7684\u5185\u5bb9\u4e0a\u4f20\u5230 Steam \u7684 Depot \u548c\u5e94\u7528\u914d\u7f6e\u6587\u4ef6\u3002\n\n## \u521b\u5efa SteamPipe \u751f\u6210\u7248\u672c\u914d\u7f6e\u6587\u4ef6\n\n\u8981\u4f7f\u7528 SteamPipe \u4e3a\u60a8\u7684\u5e94\u7528\u4e0a\u4f20\u6587\u4ef6\uff0c\u60a8\u5fc5\u987b\u521b\u5efa\u811a\u672c\u6765\u63cf\u8ff0\u60a8\u7684\u751f\u6210\u7248\u672c\u4ee5\u53ca\u5c06\u5305\u542b\u5728\u5176\u4e2d\u7684\u6bcf\u4e2a Depot\u3002 \u6b64\u5904\u663e\u793a\u7684\u793a\u4f8b\u811a\u672c\u4f4d\u4e8e Steamworks SDK \u7684 `Tools\\ContentBuilder\\scripts` \u6587\u4ef6\u5939\u4e2d\u3002\n\n## SteamPipe GUI \u5de5\u5177\n\n\u5982\u679c\u60a8\u662f\u5728 Windows \u4e0a\u8fd0\u884c\uff0c\u5e76\u4e14\u5e0c\u671b\u4f7f\u7528 GUI \u5de5\u5177\u6765\u5e2e\u52a9\u521b\u5efa\u8fd9\u4e9b\u914d\u7f6e\u6587\u4ef6\u5e76\u4e0a\u4f20\u751f\u6210\u7248\u672c\uff0c\u5219\u53ef\u4ee5\u4f7f\u7528 Steamworks SDK \u7684 tools \u6587\u4ef6\u5939\u4e2d\u7684 SteamPipeGUI\u3002 zip \u6587\u4ef6\u4e2d\u5305\u542b\u66f4\u591a\u5165\u95e8\u8bf4\u660e\u3002\n\n\u5373\u4f7f\u60a8\u9009\u62e9\u4f7f\u7528 GUI \u5de5\u5177\uff0c\u4ecd\u5efa\u8bae\u9605\u8bfb\u4ee5\u4e0b\u90e8\u5206\uff0c\u4ee5\u5e2e\u52a9\u60a8\u66f4\u52a0\u719f\u6089 SteamPipe \u7cfb\u7edf\u7684\u5de5\u4f5c\u65b9\u5f0f\u3002\n\n## \u7b80\u5355\u751f\u6210\u7248\u672c\u811a\u672c\n\n\u8ba9\u6211\u4eec\u4ece\u6700\u57fa\u7840\u7684\u751f\u6210\u7248\u672c\u811a\u672c\u5f00\u59cb\u3002 \u5728\u8fd9\u4e2a\u793a\u4f8b\u4e2d\uff0c\u6211\u4eec\u6709\u4e00\u4e2a\u6e38\u620f\uff08AppID 1000\uff09\uff0c\u8be5\u6e38\u620f\u5177\u6709\u4e00\u4e2a Depot\uff08DepotID 1001\uff09\uff0c\u4e14\u6211\u4eec\u5e0c\u671b\u4e0a\u4f20\u67d0\u4e2a\u5185\u5bb9\u6587\u4ef6\u5939\u53ca\u5176\u5b50\u6587\u4ef6\u5939\u4e2d\u7684\u6240\u6709\u6587\u4ef6\u3002 \u4e3a\u6b64\uff0c\u6211\u4eec\u53ea\u9700\u8981\u4e00\u4e2a\u751f\u6210\u7248\u672c\u811a\u672c\uff0c\u8bf7\u770b SDK \u4e2d\u5305\u542b\u7684`\u201csimple_app_build.vdf\u201d`\uff1a\n\n\"AppBuild\" { \"AppID\" \"1000\" // \u60a8\u7684 AppID \"Desc\" \"This is a simple build script\" // \u6b64\u751f\u6210\u7248\u672c\u7684\u5185\u90e8\u63cf\u8ff0 \"ContentRoot\" \"..\\content\\\" // \u76f8\u5bf9\u4e8e\u6b64\u6587\u4ef6\u4f4d\u7f6e\u7684\u6839\u5185\u5bb9\u6587\u4ef6\u5939 \"BuildOutput\" \"..\\output\\\" // \u751f\u6210\u7248\u672c\u65e5\u5fd7\u548c\u751f\u6210\u7248\u672c\u7f13\u5b58\u6587\u4ef6\u7684\u751f\u6210\u7248\u672c\u8f93\u51fa\u6587\u4ef6\u5939 \"Depots\" { \"1001\" // \u60a8\u7684 DepotID { \"FileMapping\" { \"LocalPath\" \"*\" // \u6765\u81ea\u5185\u5bb9\u6839\u6587\u4ef6\u5939\u7684\u6240\u6709\u6587\u4ef6 \"DepotPath\" \".\" // \u6620\u5c04\u5230 Depot \u7684\u6839\u76ee\u5f55 \"recursive\" \"1\" // \u5305\u542b\u6240\u6709\u5b50\u65 684\u5e10\u6237\u5e76\u4e0d\u62e5\u6709\u8be5 DLC \u7684\u60c5\u51b5\u4e0b\u63d0\u793a\u7528\u6237\u8f93\u5165\u5e8f\u5217\u53f7\u3002\n\n## \u5728\u5355\u5f20\u5149\u76d8/\u5355\u4e2a\u5b89\u88c5\u7a0b\u5e8f\u5305\u4e0a\u4e3a\u591a\u4e2a App ID \u521b\u5efa\u96f6\u552e\u5b89\u88c5\u7a0b\u5e8f\n\n\u8981\u521b\u5efa\u5305\u542b\u591a\u4e2a SteamPipe \u5e94\u7528\u7684 GM\uff0c \u5219\u5e94\u9010\u4e2a\u521b\u5efa\u5e94\u7528\u5b89\u88c5\u7a0b\u5e8f\uff0c\u4f46\u5c06\u5b83\u4eec\u90fd\u6307\u5411\u540c\u4e00\u4e2a\u8f93\u51fa\u6587\u4ef6\u5939\u3002 \u6bcf\u4e2a\u751f\u6210\u7248\u672c\u90fd\u5c06\u4e0e\u73b0\u6709\u7684\u5b89\u88c5\u6620\u50cf\u5408\u5e76\u5230\u4e00\u8d77\u3002\n\n## \u81ea\u5b9a\u4e49\u96f6\u552e\u5b89\u88c5\u78c1\u76d8\n\n\u6709\u5173\u81ea\u5b9a\u4e49\u96f6\u552e\u5b89\u88c5\u78c1\u76d8\u7684\u66f4\u591a\u8be6\u60c5\uff0c\u8bf7\u53c2\u89c1[\u521b\u5efa\u96f6\u552e\u53ca\u201cGold Master\u201d\u78c1\u76d8](https://partner.steamgames.com/doc/sdk/goldmaster)\u3002\n\n## \u53d1\u884c\u524d\u9884\u8f7d\u6e38\u620f\n\n\u9884\u8f7d\u529f\u80fd\u9002\u7528\u4e8e\u53ef\u4ee5\u5728\u53d1\u884c\u524d\u9884\u8d2d\u7684\u6e38\u620f\u4ee5\u53ca\u90e8\u5206\u514d\u8d39\u5f00\u73a9\u6e38\u620f\u3002 \u9884\u8f7d\u6a21\u5f0f\u4e0b\u7684\u6e38\u620f\u53ef\u4f9b\u987e\u5ba2\u4e0b\u8f7d\uff0c\u4f46\u5176\u5b58\u50a8\u5728\u7528\u6237\u78c1\u76d8\u4e0a\u7684\u5185\u5bb9\u5df2\u52a0\u5bc6\uff0c\u5728\u6e38\u620f\u53d1\u884c\u524d\u65e0\u6cd5\u6e38\u73a9\u3002 \u6e38\u620f\u6b63\u5f0f\u53d1\u884c\u540e\uff0cSteam \u4f1a\u5c06\u9884\u8f7d\u7684\u5185\u5bb9\u89e3\u5bc6\uff0c\u7528\u6237\u5219\u53ef\u4ee5\u5728\u89e3\u5bc6\u6d41\u7a0b\u7ed3\u675f\u540e\u7545\u73a9\u6e38\u620f\u3002\n\n\u6211\u4eec\u5efa\u8bae\u9488\u5bf9\u4ee5\u4e0b\u6e38\u620f\u542f\u7528\u9884\u8f7d\u529f\u80fd\uff1a\n\n- \u6587\u4ef6\u5927\u5c0f\u8f83\u5927\u7684\u6e38\u620f\uff1b\n\n- \u4e07\u4f17\u77a9\u76ee\u7684\u6e38\u620f\u3002\n\n\u5728\u542f\u7528\u9884\u8f7d\u529f\u80fd\u524d\uff0c\u8bf7\u786e\u4fdd\u60a8\u6700\u65b0\u7684\u751f\u6210\u7248\u672c\u5df2\u4e0a\u4f20\u81f3 Steam\u3002 \u5982\u6709\u5fc5\u8981\uff0c\u60a8**\u53ef\u4ee5**\u5728\u9884\u8f7d\u671f\u95f4\u6b63\u5e38\u66f4\u65b0\u6e38\u620f\u7684\u751f\u6210\u7248\u672c\u3002 \u9884\u8f7d\u66f4\u65b0\u4f1a\u4ee5 delta patch\uff08\u5dee\u5206\u8865\u4e01\uff09\u7684\u65b9\u5f0f\u4ea4\u4ed8\uff0c\u5176\u4e2d\u5305\u542b\u76f8\u5bf9\u4e8e\u524d\u4e00\u4e2a\u751f\u6210\u7248\u672c\u6240\u66f4\u65b0\u7684\u5185\u5bb9\uff0c\u4e0e\u53d1\u884c\u540e\u7684\u66f4\u65b0\u65b9\u5f0f\u76f8\u540c\u3002 \u4e0e\u53d1\u884c\u540e\u8fdb\u884c\u7684\u66f4\u65b0\u4e0d\u540c\u7684\u662f\uff0c\u9884\u8f7d\u66f4\u65b0\u8fdb\u884c\u4e86\u52a0\u5bc6\uff0c\u4e0d\u4f1a\u7acb\u5373\u5e94\u7528\uff0c\u800c\u662f\u4f1a\u5b58\u50a8\u5728\u73a9\u5bb6\u7cfb\u7edf\u4e2d\uff0c\u76f4\u81f3\u6e38\u620f\u53d1\u884c\u3002 \u8fd9\u610f\u5473\u7740\u591a\u6b21\u5927\u578b\u66f4\u65b0\u4f1a\u5360\u7528\u5927\u91cf\u7684\u78c1\u76d8\u7a7a\u95f4\uff0c \u56e0\u6b64\u8bf7\u4ed4\u7ec6\u8003\u8651\u9884\u8f7d\u671f\u95f4\u66f4\u65b0\u7684\u9891\u7387\u548c\u5927\u5c0f\u3002\n\n\u5982\u679c\u662f\u9884\u8d2d\u6e38\u620f\uff0c\u9884\u8f7d\u53ef\u4ee5\u81ea\u52a9\u8fdb\u884c\u3002 \u5982\u679c\u60a8\u7684\u6e38\u620f\u662f\u514d\u8d39\u5f00\u73a9\u6e38\u620f\uff0c\u6216\u8005\u8ba4\u4e3a\u81ea\u5df1\u7684\u6e38\u620f\u5e94\u8be5\u7b26\u5408\u9884\u8f7d\u6761\u4ef6\uff0c\u8bf7\u5411[Steam \u5ba2\u670d](https://help.steampowered.com/zh-cn/wizard/HelpWithPublishing)\u63d0\u4ea4\u5ba2\u670d\u6848\u4ef6\uff0c\u8be6\u7ec6\u8bf4\u660e\u60a8\u7684\u60c5\u51b5\u3002\n\n## \u521b\u5efa DLC\n\nDLC \u662f\u4f5c\u4e3a\u57fa\u7840\u6e38\u620f\u7684 Depot \u6784\u5efa\u7684\u3002 \u53c2\u89c1[\u53ef\u4e0b\u8f7d\u5185\u5bb9\uff08DLC\uff09](https://partner.steamgames.com/doc/store/application/dlc)\uff0c\u4e86\u89e3\u66f4\u591a\u4fe1\u606f\u3002\n\n## SteamPipe \u6545\u969c\u6392\u9664\n\n#### \u901a\u8fc7 steamcmd \u767b\u5f55\u65f6\u663e\u793a\u201cLogin Failure: Account Logon Denied Failed\u201d\n\n\u539f\u56e0\uff1a\u53ef\u80fd\u662f Steam \u4ee4\u724c\u963b\u6b62\u4e86\u767b\u5f55\u3002 \u89e3\u6c7a\u65b9\u6cd5\uff1a\n\n- \u68c0\u67e5\u4e0e\u60a8\u5c1d\u8bd5\u767b\u5f55\u65f6\u4f7f\u7528\u7684\u5e10\u6237\u5173\u8054\u7684\u7535\u5b50\u90ae\u4ef6\uff0c\u5e76\u67e5\u770b\u662f\u5426\u6709\u6765\u81ea Steam \u5ba2\u670d\u7684\u7535\u5b50\u90ae\u4ef6\u3002 \u590d\u5236\u8be5\u7535\u5b50\u90ae\u4ef6\u4e2d\u7684\u4ee3\u7801\u3002\n\n- \u8fd0\u884c\u4ee5\u4e0b steamcmd\uff1a`set_steam_guard_code <code>`\n\n- \u91cd\u65b0\u5c1d\u8bd5\u4ece steamcmd \u767b\u5f55\uff1a`Steam>logon <buildaccount> <password>`\n\n#### \u4e0b\u8f7d\u95ee\u9898\u4e00\u822c\u6545\u969c\u6392\u9664\n\n- \u91cd\u542f\u8ba1\u7b97\u673a\u3001\u8c03\u5236\u89e3\u8c03\u5668\u3001\u8def\u7531\u5668\u7b49\u3002\n\n- \u9a8c\u8bc1\u9632\u706b\u5899\u8bbe\u7f6e\u3002 \u65b0\u7cfb\u7edf\u9700\u8981[\u6b64\u5904](https://support.steampowered.com/kb_article.php?ref=8571-GLVN-8711)\u5217\u51fa\u7684 80 \u7aef\u53e3\uff08HTTP\uff09\u4ee5\u53ca\u6240\u6709\u5176\u4ed6 Steam \u7aef\u53e3\u3002\n\n- \u6682\u65f6\u7981\u7528\u672c\u5730\u6740\u6bd2\u6216\u5783\u573e\u90ae\u4ef6\u62e6\u622a\u7a0b\u5e8f\u3002\n\n- \u5728**\u8bbe\u7f6e**->**\u4e0b\u8f7d**\u4e2d\u68c0\u67e5 Steam \u4e0b\u8f7d\u5730\u533a\u3002 \u5b83\u5e94\u8be5\u4e0e\u60a8\u7684\u6240\u5728\u5730\u4e00\u81f4\u3002\n\n- \u505c\u6b62\u4e0b\u8f7d\uff0c\u7136\u540e\u5378\u8f7d\u5e76\u91cd\u88c5\u6e38\u620f\uff08\u6e05\u9664\u6e05\u5355\u7f13\u5b58\uff09\u3002\n\n- \u9000\u51fa Steam\uff0c\u5e76\u5220\u9664 Steam \u5b89\u88c5\u6587\u4ef6\u5939\u4e2d appcache \u548c depotcache \u8fd9\u4e24\u4e2a\u6587\u4ef6\u5939\u3002\n\n- \u5c1d\u8bd5\u5c06\u60a8\u7684 Steam \u4e0b\u8f7d\u5730\u533a\u8bbe\u7f6e\u5230\u8f83\u8fdc\u7684\u5176\u4ed6\u4f4d\u7f6e\u3002 \u5982\u679c\u60a8\u9644\u8fd1\u7684\u5185\u5bb9\u670d\u52a1\u5668\u5728\u63d0\u4f9b\u9519\u8bef\u7684\u6570\u636e\uff0c\u8fd9\u53ef\u80fd\u4f1a\u8d77\u4f5c\u7528\u3002\n\n#### \u6211\u7684 Mac \u548c/\u6216 Linux \u751f\u6210\u7248\u672c\u672a\u5b89\u88c5\u4efb\u4f55\u6587\u4ef6\u3002 \u4e3a\u4ec0\u4e48\uff1f\n\n\u5982\u679c\u60a8\u6b63\u5728\u901a\u8fc7 Steam \u6d4b\u8bd5\u60a8\u7684\u6e38\u620f\u6216\u5e94\u7528\u5728\u591a\u4e2a\u5e73\u53f0\u4e0a\u7684\u5b89\u88c5\u8fc7\u7a0b\uff0c\u53ef\u80fd\u4f1a\u9047\u5230\u8fd9\u6837\u4e00\u79cd\u60c5\u51b5\uff1a\u751f\u6210\u7248\u672c\u5728 Windows \u4e0a\u53ef\u4ee5\u6b63\u5e38\u90e8\u7f72\uff0c\u4f46\u5728 Mac \u6216 Linux \u4e0a\u5374\u5b8c\u5168\u6ca1\u6709\u90e8\u7f72\u4efb\u4f55\u6587\u4ef6\uff0c\u5c3d\u7ba1\u60a8\u7684 SteamPipe \u6d41\u7a0b\u5df2\u7ecf\u6b63\u786e\u8bbe\u7f6e\u4e3a\u4e0a\u4f20 Mac \u548c/\u6216 Linux Depot\u3002 \u8fd9\u901a\u5e38\u662f\u56e0\u4e3a\u9057\u6f0f\u4e86\u4e00\u4e2a\u6781\u6613\u88ab\u5ffd\u89c6\u7684\u6b65\u9aa4\u2014\u2014\u5c06\u60a8\u5176\u4ed6\u5e73\u53f0\u7684 Depot \u6dfb\u52a0\u81f3\u6b63\u5728\u90e8\u7f72\u7684\u7a0b\u5e8f\u5305\u4e2d\u3002 \u60a8\u53ef\u4ee5\u901a\u8fc7\u4ee5\u4e0b\u6b65\u9aa4\u68c0\u67e5\u7a0b\u5e8f\u5305\u4e2d\u5305\u542b\u54ea\u4e9b Depot\uff1a\n\n- \u5bfc\u822a\u81f3\u60a8\u7684**\u5e94\u7528\u7ba1\u7406\u5458**\u9875\u9762\u3002\n\n- \u5728\u201c\u67e5\u770b\u5173\u8054\u9879\u76ee\u201d\u680f\u76ee\uff0c\u70b9\u51fb**\u201c\u6240\u6709\u5173\u8054\u7a0b\u5e8f\u5305\u3001DLC\u3001\u8bd5\u7528\u7248\u53ca\u5de5\u5177 \u201d\u3002**\n\n- \u70b9\u51fb\u60a8\u5c1d\u8bd5\u4e0b\u8f7d\u7684\u7a0b\u5e8f\u5305\u7684\u540d\u79f0\u3002\n\n- \u67e5\u770b**\u5df2\u5305\u542b Depot** \u680f\u76ee\u3002\n\n- \u4f7f\u7528**\u6dfb\u52a0/\u79fb\u9664 Depot** \u4ee5\u786e\u4fdd\u5206\u914d\u5230\u8be5\u7a0b\u5e8f\u5305\u7684 Depot \u96c6\u662f\u6b63\u786e\u7684\u96c6\u3002\n\n\u8bb8\u591a\u5173\u4e8e\u6b64\u8bdd\u9898\u7684\u8ba8\u8bba\u4e32\u4e5f\u53ef\u80fd\u4f1a\u6709\u5e2e\u52a9\uff1a\n\n- [Empty folder after installing the game\uff08\u6e38\u620f\u5b89\u88c5\u540e\u6e05\u7a7a\u6587\u4ef6\u5939\uff09](http://steamcommunity.com/groups/steamworks/discussions/0/864972621123948611)\n\n- [Unity Builds for PC/Mac/Linux\uff08\u9002\u7528\u4e8e PC/Mac/Linux \u7684 Unity \u751f\u6210\u7248\u672c\uff09](http://steamcommunity.com/groups/steamworks/discussions/0/540742667593104506)\n\n- [Preparing Content for Mac Packaging\uff08\u4e3a Mac \u7a0b\u5e8f\u5305\u51c6\u5907\u5185\u5bb9\uff09](http://steamcommunity.com/groups/steamworks/discussions/0/540742667672176633)\n\n#### steamcmd.exe \u8fd0\u884c\u65f6\uff0c\u51fa\u73b0\u4ee5\u4e0b\u9519\u8bef\uff1a\u201cSteamUpdater: Error: Steam needs to be online to update\u3002 Please confirm your network connection and try again.\u201d\uff08Steam \u9700\u8981\u5728\u7ebf\u8fdb\u884c\u66f4\u65b0\u3002\u8bf7\u786e\u8ba4\u60a8\u7684\u7f51\u7edc\u8fde\u63a5\u6b63\u5e38\uff0c\u7136\u540e\u91cd\u8bd5\u3002\uff09\n\n\u89e3\u51b3\u65b9\u6cd5\uff1a\u524d\u5f80 **Internet \u9009\u9879**->**\u8fde\u63a5**->**\u5c40\u57df\u7f51\u8bbe\u7f6e**\uff0c\u7136\u540e\u52fe\u9009**\u81ea\u52a8\u68c0\u6d4b\u8bbe\u7f6e**\u3002\n\n#### \u8fd0\u884c\u5e94\u7528\u751f\u6210\u7248\u672c\u4f1a\u5bfc\u81f4\u4ee5\u4e0b\u9519\u8bef\uff1a\u201cERROR! Failed 'DepotBuild for scriptname.vdf' - status = 6.\u201d\uff08\u9519\u8bef\uff01DepotBuild for scriptname.vdf \u5931\u8d25\u3002- \u72b6\u6001 = 6\u3002\uff09\n\n\u53ef\u80fd\u539f\u56e0\uff1a\n\n- \u5e10\u6237\u6ca1\u6709\u8be5\u5e94\u7528\u7684\u6743\u9650\u3002\n\n- \u5728 app_build.vdf \u4e2d\u68c0\u67e5 app ID \u662f\u5426\u6b63\u786e\u3002\n\n  - \u68c0\u67e5\u751f\u6210\u7248\u672c\u5e10\u6237\u662f\u5426\u62e5\u6709\u8be5 app ID \u7684[\u9002\u5f53\u6743\u9650](https://partner.steamgames.com/doc/sdk/uploading#Build_Account) \u3002\n\n- Steamcmd \u627e\u4e0d\u5230 Depot \u5185\u5bb9\u3002\n\n- \u68c0\u67e5 app_build \u811a\u672c\u4e2d\u7684\u503c\u201ccontentroot\u201d\u662f\u5426\u662f\u76f8\u5bf9\u4e8e\u811a\u672c\u6587\u4ef6\u4f4d\u7f6e\u7684\u6709\u6548\u8def\u5f84\u3002\n\n  - \u68c0\u67e5 depot_build \u811a\u672c\u4e2d\u7684\u503c\u201
