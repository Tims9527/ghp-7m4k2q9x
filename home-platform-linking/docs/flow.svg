<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1118"/>
      <stop offset="1" stop-color="#151d27"/>
    </linearGradient>
    <linearGradient id="scope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f59"/>
      <stop offset="1" stop-color="#102c40"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fd2ff"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71808e"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#f4f8fb}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#8fa2b2}
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#edf7fc;text-anchor:middle;dominant-baseline:middle}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#aab9c7;text-anchor:middle;dominant-baseline:middle}
      .scope{fill:url(#scope);stroke:#7fd2ff;stroke-width:2}
      .decision{fill:#213548;stroke:#8ed9ff;stroke-width:2}
      .external{fill:#171b20;stroke:#71808e;stroke-width:2;stroke-dasharray:8 7}
      .line{fill:none;stroke:#7fd2ff;stroke-width:2.2;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#7fd2ff;stroke-width:2.2}
      .muted{fill:none;stroke:#71808e;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrowMuted)}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#8ed9ff}
      .noteMuted{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#8795a1}
    </style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" class="title">GameHub 首页“我的游戏平台”功能流程</text>
  <text x="60" y="96" class="subtitle">蓝色实线：本期新增区域内的展示与反馈　　灰色虚线：既有外部流程，仅承接跳转，不做改动</text>

  <rect x="90" y="145" width="220" height="64" rx="14" class="scope"/>
  <text x="200" y="177" class="label">进入首页</text>
  <path d="M310 177 H380" class="line"/>
  <rect x="380" y="135" width="290" height="84" rx="16" class="scope"/>
  <text x="525" y="168" class="label">加载“我的游戏平台”模块</text>
  <text x="525" y="195" class="small">平台状态、账号摘要、最近游戏</text>
  <path d="M670 177 H750" class="line"/>
  <polygon points="840,127 930,177 840,227 750,177" class="decision"/>
  <text x="840" y="177" class="label">平台已关联？</text>

  <path d="M840 227 V292" class="line"/>
  <text x="854" y="262" class="note">否</text>
  <rect x="690" y="292" width="300" height="82" rx="16" class="scope"/>
  <text x="840" y="323" class="label">展示未关联状态</text>
  <text x="840" y="349" class="small">关联价值、说明、关联按钮</text>
  <path d="M990 333 H1060" class="muted"/>
  <rect x="1060" y="292" width="300" height="82" rx="16" class="external"/>
  <text x="1210" y="323" class="label">既有平台登录 / 授权</text>
  <text x="1210" y="349" class="small">外部原有流程，不做改动</text>
  <path d="M1210 374 V430 H990" class="muted"/>
  <text x="1090" y="419" class="noteMuted">成功回调并触发首次同步</text>

  <path d="M930 177 H1010 V232 H1060" class="line"/>
  <text x="966" y="165" class="note">是</text>
  <rect x="1060" y="191" width="300" height="82" rx="16" class="scope"/>
  <text x="1210" y="222" class="label">展示已关联状态</text>
  <text x="1210" y="248" class="small">账号、操作、最多 4 款最近游戏</text>
  <path d="M1060 232 H1020 V470 H990" class="line"/>

  <rect x="690" y="430" width="300" height="82" rx="16" class="scope"/>
  <text x="840" y="461" class="label">模块内更新展示</text>
  <text x="840" y="487" class="small">关联状态 / 同步进度 / 最新数据</text>

  <path d="M840 512 V550 H200 M840 550 H1300" class="branch"/>
  <path d="M200 550 V580" class="line"/>
  <path d="M490 550 V580" class="line"/>
  <path d="M770 550 V580" class="line"/>
  <path d="M1050 550 V580" class="line"/>
  <path d="M1300 550 V580" class="line"/>
  <rect x="80" y="580" width="240" height="72" rx="15" class="scope"/>
  <text x="200" y="606" class="label">点击同步</text>
  <text x="200" y="632" class="small">模块内展示进度与结果</text>
  <path d="M200 652 V715" class="muted"/>
  <rect x="60" y="715" width="280" height="72" rx="15" class="external"/>
  <text x="200" y="741" class="label">既有平台同步能力</text>
  <text x="200" y="767" class="small">接口与业务逻辑不做改动</text>

  <rect x="380" y="580" width="220" height="72" rx="15" class="scope"/>
  <text x="490" y="606" class="label">点击管理账号</text>
  <text x="490" y="632" class="small">新增首页入口</text>
  <path d="M490 652 V715" class="muted"/>
  <rect x="360" y="715" width="260" height="72" rx="15" class="external"/>
  <text x="490" y="741" class="label">既有账号管理流程</text>
  <text x="490" y="767" class="small">切换 / 添加 / 解绑不做改动</text>

  <rect x="660" y="580" width="220" height="72" rx="15" class="scope"/>
  <text x="770" y="606" class="label">点击 Steam 好友</text>
  <text x="770" y="632" class="small">仅 Steam 展示入口</text>
  <path d="M770 652 V715" class="muted"/>
  <rect x="650" y="715" width="240" height="72" rx="15" class="external"/>
  <text x="770" y="741" class="label">既有 Steam 好友页</text>
  <text x="770" y="767" class="small">页面与操作不做改动</text>

  <rect x="940" y="580" width="220" height="72" rx="15" class="scope"/>
  <text x="1050" y="606" class="label">点击游戏 / 状态按钮</text>
  <text x="1050" y="632" class="small">详情、秒玩或获取入口</text>
  <path d="M1050 652 V715" class="muted"/>
  <rect x="930" y="715" width="240" height="72" rx="15" class="external"/>
  <text x="1050" y="741" class="label">既有详情 / 启动 / 获取</text>
  <text x="1050" y="767" class="small">外部流程不做改动</text>

  <rect x="1220" y="580" width="160" height="72" rx="15" class="scope"/>
  <text x="1300" y="606" class="label">查看全部</text>
  <text x="1300" y="632" class="small">新增首页入口</text>
  <path d="M1300 652 V715" class="muted"/>
  <rect x="1190" y="715" width="220" height="72" rx="15" class="external"/>
  <text x="1300" y="741" class="label">既有“我的游戏”页</text>
  <text x="1300" y="767" class="small">页面与账号栏不做改动</text>

  <rect x="60" y="842" width="22" height="22" rx="5" fill="#173f59" stroke="#7fd2ff" stroke-width="2"/>
  <text x="94" y="858" class="note">本期范围：仅首页新增模块内部</text>
  <rect x="390" y="842" width="22" height="22" rx="5" fill="#171b20" stroke="#71808e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="424" y="858" class="noteMuted">范围外：所有原有页面和业务流程</text>
</svg>
