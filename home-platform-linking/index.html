<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GameHub 首页账号关联交互走查 v5</title>
  <style>
    :root {
      --launcher-black: #0d0f12;
      --launcher-canvas: #17191d;
      --launcher-surface: #1d2025;
      --launcher-raised: #25282e;
      --launcher-inset: #14161a;
      --launcher-border: rgba(255,255,255,.09);
      --launcher-border-soft: rgba(255,255,255,.055);
      --launcher-text: rgba(248,250,252,.95);
      --launcher-text-2: rgba(229,233,239,.72);
      --launcher-text-3: rgba(210,216,225,.48);
      --cloud-blue: #39aee8;
      --cloud-blue-deep: #227fc3;
      --sync-green: #53d995;
      --review-cyan: #8ed9ff;
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--launcher-text);
      background: #090a0d;
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #090a0d; }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid #d8f3ff; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    .prototype-stage { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; padding: 14px; }
    .workspace-viewport { position: relative; }
    .review-workspace { position: absolute; inset: 0 auto auto 0; width: 1696px; height: 760px; display: grid; grid-template-columns: 1280px 400px; gap: 16px; transform-origin: top left; }

    .app-window { width: 1280px; height: 760px; display: grid; grid-template-columns: 72px 1fr; grid-template-rows: 34px 1fr; overflow: hidden; border-radius: 22px; background: var(--launcher-canvas); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 28px 76px rgba(0,0,0,.55); }
    .window-topbar { grid-column: 1 / -1; display: flex; align-items: center; padding: 0 13px; background: #12141a; border-bottom: 1px solid var(--launcher-border-soft); }
    .sidebar { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px 12px; background: var(--launcher-canvas); border-right: 1px solid var(--launcher-border-soft); }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 13px; background: var(--launcher-surface); border: 1px solid var(--launcher-border); color: var(--launcher-text-2); font-size: 12px; font-weight: 800; }
    .sidebar-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--launcher-text-3); font-size: 20px; cursor: pointer; transition: color .16s ease, background .16s ease; }
    .sidebar-icon:hover { color: var(--launcher-text); background: rgba(255,255,255,.04); }
    .sidebar-icon.is-active { color: #fff; background: #2c2f35; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
    .sidebar-glyph { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-profile { position: relative; width: 38px; height: 38px; display: grid; place-items: center; margin-top: 2px; padding: 0; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; color: #eef8ff; background: linear-gradient(145deg,#154767,#6336a5 58%,#ce4286); cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 18px rgba(0,0,0,.24); }
    .sidebar-profile span { font-size: 12px; font-weight: 850; }
    .sidebar-profile i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border: 2px solid var(--launcher-canvas); border-radius: 50%; background: var(--sync-green); }
    .sidebar-profile:hover { filter: brightness(1.12); }
    .sidebar-spacer { flex: 1; }

    .home-scroll { min-width: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #393d44 transparent; }
    .hero-reference { height: 472px; overflow: hidden; border-bottom: 1px solid var(--launcher-border-soft); position: relative; }
    .hero-reference__image { position: absolute; left: -54px; top: -4px; width: 1280px; height: auto; max-width: none; pointer-events: none; }
    .hero-reference::after { content: ""; position: absolute; z-index: 1; inset: auto 0 0; height: 62px; background: linear-gradient(to bottom, transparent, var(--launcher-canvas)); }
    .home-section { padding: 0 34px; }
    .account-module { height: 205px; margin-top: 15px; border-radius: 15px; background: var(--launcher-surface); border: 1px solid var(--launcher-border); transition: box-shadow .18s ease, border-color .18s ease; }
    .account-module__header { height: 55px; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--launcher-border-soft); }
    .module-heading { min-width: 170px; display: flex; flex-direction: column; gap: 3px; }
    .module-heading b { font-size: 15px; }
    .module-heading small { color: var(--launcher-text-3); font-size: 10px; }
    .platform-tabs { align-self: stretch; display: flex; gap: 2px; transition: box-shadow .18s ease; }
    .platform-tab { min-width: 135px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--launcher-text-3); cursor: pointer; }
    .platform-tab[aria-selected="true"] { color: var(--launcher-text); border-bottom-color: var(--platform-accent); }
    .platform-tab > span:nth-child(2) { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .platform-tab b { font-size: 12px; }
    .platform-tab small { font-size: 9px; color: var(--launcher-text-3); }
    .platform-mark { width: 25px; height: 25px; display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: #111318; border: 1px solid rgba(255,255,255,.15); color: #fff; font-size: 8px; font-weight: 850; }
    .platform-mark--epic { border-radius: 6px; font-size: 6px; }
    .platform-mark--gog { background: #f2f2f2; color: #181a1d; }
    .platform-mark--compact { width: 21px; height: 21px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5d6169; }
    .status-dot.is-connected { background: var(--sync-green); box-shadow: 0 0 0 3px rgba(83,217,149,.1); }
    .module-actions { margin-left: auto; display: flex; gap: 7px; }
    .module-actions button { height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--launcher-border); background: #22252a; color: var(--launcher-text-2); font-size: 10px; cursor: pointer; }
    .account-module__body { height: 149px; padding: 14px 16px 15px; }
    .connected-account-panel { height: 100%; display: grid; grid-template-columns: 205px minmax(0,1fr) 82px; gap: 15px; align-items: center; }
    .account-identity { min-width: 0; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
    .account-avatar { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: #14171b; border: 1px solid rgba(255,255,255,.12); color: var(--platform-accent, #8fc8df); font-weight: 850; }
    .account-identity > div:last-child { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .account-identity b { font-size: 14px; }
    .account-identity small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--launcher-text-3); font-size: 9px; }
    .account-identity span { color: var(--launcher-text-2); font-size: 9px; }
    .home-game-strip { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; }
    .home-game-card { min-width: 0; border-radius: 10px; transition: box-shadow .18s ease, transform .16s ease; }
    .home-game-card:hover { transform: translateY(-1px); }
    .home-game-card__cover { width: 100%; height: 76px; display: block; padding: 0; border: 0; border-radius: 9px; overflow: hidden; background: #2a2d32; cursor: pointer; }
    .game-art { width: 100%; height: 100%; display: block; background-size: 1512px 905px; background-repeat: no-repeat; filter: saturate(.9) brightness(.88); transition: filter .16s ease; }
    button:hover > .game-art { filter: saturate(1) brightness(1); }
    .home-game-card__footer { min-width: 0; height: 31px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 6px; }
    .home-game-card__footer > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--launcher-text-2); font-size: 9px; }
    .game-state-button { min-width: 74px; height: 30px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; border: 1px solid rgba(255,255,255,.11); border-radius: 16px; color: #fff; background: #2b2f35; cursor: pointer; transition: filter .16s ease, transform .16s ease; }
    .game-state-button.is-cloud { background: var(--cloud-blue-deep); box-shadow: inset 0 0 0 1px rgba(142,217,255,.28); }
    .game-state-button.is-acquire { background: #f4f5f6; color: #15171b; }
    .game-state-button.is-compact { min-width: 54px; height: 23px; padding: 0 7px; border-radius: 12px; font-size: 9px; }
    .game-state-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .game-state-button span { font-size: 9px; }
    .game-state-button b { white-space: nowrap; font-size: 10px; }
    .view-all-button { width: 82px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 11px; border: 1px solid var(--launcher-border); background: #22252a; color: var(--launcher-text-2); cursor: pointer; transition: box-shadow .18s ease; }
    .view-all-button b { font-size: 10px; }
    .view-all-button span { color: var(--launcher-text-3); font-size: 8px; }
    .unconnected-panel { height: 100%; display: grid; grid-template-columns: 1.02fr .98fr; gap: 24px; align-items: center; transition: box-shadow .18s ease; }
    .unconnected-copy { display: flex; flex-direction: column; gap: 7px; }
    .unconnected-copy > div:first-child { display: flex; align-items: center; gap: 9px; }
    .unconnected-copy h2 { margin: 0; font-size: 17px; }
    .unconnected-copy p { margin: 0; color: var(--launcher-text-2); font-size: 10px; line-height: 1.65; }
    .connect-actions { display: flex; gap: 8px; margin-top: 2px; }
    .primary-action, .secondary-action { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 10px; font-weight: 750; cursor: pointer; }
    .primary-action { border: 0; background: #f1f3f5; color: #121418; }
    .secondary-action { border: 1px solid var(--launcher-border); background: transparent; color: var(--launcher-text-2); }
    .connection-benefits { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
    .connection-benefits span { min-height: 67px; padding: 10px; display: flex; flex-direction: column; gap: 5px; border-radius: 10px; background: var(--launcher-inset); border: 1px solid var(--launcher-border-soft); }
    .connection-benefits b { font-size: 10px; }
    .connection-benefits small { color: var(--launcher-text-3); font-size: 8px; line-height: 1.5; }
    .editor-section { padding: 20px 34px 40px; }
    .editor-section > header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .editor-section h2 { margin: 0; font-size: 18px; }
    .editor-section header div { display: flex; gap: 6px; }
    .editor-section header button { width: 29px; height: 29px; border-radius: 50%; border: 1px solid var(--launcher-border); background: #22252a; color: var(--launcher-text-3); }
    .editor-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }
    .editor-grid article div { position: relative; height: 145px; overflow: hidden; border-radius: 12px; border: 1px solid var(--launcher-border-soft); }
    .editor-grid article img { position: absolute; width: 1512px; height: 905px; max-width: none; pointer-events: none; }
    .editor-grid p { margin: 7px 1px 0; color: var(--launcher-text-2); font-size: 10px; }

    .library-content { display: grid; grid-template-columns: minmax(0,1fr) 292px; min-width: 0; overflow: hidden; }
    .library-main { min-width: 0; display: grid; grid-template-rows: 66px 49px 1fr; padding: 0 26px 0 30px; border-right: 1px solid var(--launcher-border-soft); }
    .library-title { display: flex; align-items: baseline; gap: 12px; }
    .library-title h1 { margin: 0; font-size: 27px; letter-spacing: -.7px; }
    .library-title span { color: var(--launcher-text-3); font-size: 10px; }
    .library-toolbar { display: flex; align-items: center; gap: 8px; }
    .filter-buttons { display: flex; gap: 5px; }
    .filter-buttons button, .sort-button, .add-game-button { height: 31px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--launcher-border); background: #202328; color: var(--launcher-text-2); font-size: 10px; cursor: pointer; }
    .filter-buttons button.is-active { background: #32363d; color: var(--launcher-text); }
    .add-game-button { margin-right: auto; }
    .library-toolbar input { width: 177px; height: 31px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--launcher-border); background: #202328; color: var(--launcher-text); font-size: 10px; }
    .library-scroll { overflow-y: auto; padding: 2px 6px 36px 0; scrollbar-width: thin; scrollbar-color: #393d44 transparent; }
    .game-section { margin-bottom: 22px; }
    .game-section h2 { display: flex; align-items: center; gap: 6px; margin: 12px 0 11px; font-size: 15px; }
    .game-section h2::after { content: ""; height: 1px; flex: 1; margin-left: 6px; background: var(--launcher-border); }
    .game-section h2 span { color: var(--launcher-text-3); font-size: 10px; font-weight: 500; }
    .library-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px 11px; }
    .library-game-card { min-width: 0; padding: 7px; border-radius: 13px; transition: background .16s ease, box-shadow .18s ease; }
    .library-game-card:hover { background: rgba(255,255,255,.025); }
    .library-game-card__cover { width: 100%; height: 92px; display: block; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: #2a2d32; cursor: pointer; }
    .library-game-card__name { min-width: 0; margin-top: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .library-game-card__actions { min-height: 31px; display: flex; align-items: center; gap: 5px; margin-top: 7px; }
    .installed-launch-button { height: 30px; min-width: 74px; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 16px; border: 1px solid rgba(255,255,255,.11); background: #2c3036; color: #fff; cursor: pointer; }
    .installed-launch-button b { font-size: 10px; }
    .download-game-button { height: 30px; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 9px; border: 0; border-radius: 16px; background: #f5f6f7; color: #131519; cursor: pointer; }
    .download-game-button b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
    .library-empty { height: 220px; display: grid; place-items: center; color: var(--launcher-text-3); font-size: 12px; }
    .account-rail { overflow-y: auto; padding: 26px 18px; display: flex; flex-direction: column; gap: 13px; scrollbar-width: thin; transition: box-shadow .18s ease; }
    .platform-account-card { border-radius: 14px; background: var(--launcher-surface); border: 1px solid var(--launcher-border); overflow: hidden; }
    .platform-account-card > header { height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 13px; border-bottom: 1px solid var(--launcher-border-soft); }
    .platform-account-card > header b { font-size: 14px; }
    .bound-account { padding: 13px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
    .bound-account .account-avatar { width: 40px; height: 40px; }
    .bound-account > div:nth-child(2) { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .bound-account > div:nth-child(2) b { font-size: 12px; }
    .bound-account > div:nth-child(2) small { overflow: hidden; text-overflow: ellipsis; color: var(--launcher-text-3); font-size: 8px; }
    .bound-account dl { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 2px 0 0; }
    .bound-account dl div { padding: 8px; border-radius: 9px; background: var(--launcher-inset); }
    .bound-account dt { color: var(--launcher-text-3); font-size: 8px; }
    .bound-account dd { margin: 4px 0 0; font-size: 11px; font-weight: 750; }
    .platform-account-card > button { width: calc(100% - 24px); height: 31px; margin: 12px; border-radius: 9px; border: 1px solid var(--launcher-border); background: #26292f; color: var(--launcher-text-2); font-size: 10px; cursor: pointer; }

    .review-rail { width: 360px; height: 760px; display: flex; flex-direction: column; overflow: hidden; padding: 22px; border-radius: 22px; background: #15181d; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 28px 76px rgba(0,0,0,.46); }
    .review-rail > header { padding-bottom: 16px; border-bottom: 1px solid var(--launcher-border); }
    .review-rail > header > span { color: var(--review-cyan); font-size: 9px; font-weight: 800; letter-spacing: 1.2px; }
    .review-rail > header h1 { margin: 6px 0 5px; font-size: 20px; letter-spacing: -.4px; }
    .review-rail > header p { margin: 0; color: var(--launcher-text-3); font-size: 10px; }
    .review-legend { display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; color: var(--launcher-text-3); font-size: 9px; }
    .review-legend i { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--review-cyan); box-shadow: 0 0 0 4px rgba(142,217,255,.08); }
    .review-note-list { display: flex; flex-direction: column; gap: 5px; }
    .review-note-list > button { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 9px; border: 1px solid transparent; border-radius: 11px; text-align: left; background: transparent; color: var(--launcher-text); cursor: pointer; }
    .review-note-list > button:hover, .review-note-list > button.is-active { background: #20242a; border-color: var(--launcher-border); }
    .review-note-list > button > span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #2a2e35; color: var(--review-cyan); font-size: 9px; font-weight: 850; }
    .review-note-list > button > div { display: flex; flex-direction: column; gap: 3px; }
    .review-note-list b { font-size: 11px; }
    .review-note-list p { margin: 0; color: var(--launcher-text-3); font-size: 9px; line-height: 1.5; }
    .review-note-list small { color: rgba(142,217,255,.5); font-size: 7px; letter-spacing: .7px; }
    .review-spec, .scenario-control { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--launcher-border); }
    .review-spec h2, .scenario-control h2 { margin: 0 0 8px; color: var(--launcher-text-2); font-size: 10px; }
    .review-spec dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0; }
    .review-spec dl div { padding: 7px 8px; border-radius: 8px; background: #111419; }
    .review-spec dt { color: var(--launcher-text-3); font-size: 7px; }
    .review-spec dd { margin: 3px 0 0; font-size: 9px; font-weight: 700; }
    .scenario-control > div { display: flex; gap: 5px; }
    .scenario-control button { height: 26px; flex: 1; padding: 0 5px; border-radius: 7px; border: 1px solid var(--launcher-border); background: #20242a; color: var(--launcher-text-3); font-size: 8px; cursor: pointer; }
    .scenario-control button.is-active { color: var(--launcher-text); background: #343941; }
    .review-rail > footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--launcher-border); color: var(--launcher-text-3); font-size: 8px; }
    .is-review-highlight { border-color: rgba(142,217,255,.8) !important; box-shadow: 0 0 0 2px rgba(142,217,255,.22), 0 0 22px rgba(67,177,232,.13) !important; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 26px; background: rgba(0,0,0,.7); backdrop-filter: blur(9px); animation: fade-in .18s ease; }
    .guide-dialog { width: 450px; padding: 19px; border-radius: 17px; background: #202329; border: 1px solid rgba(255,255,255,.13); box-shadow: 0 28px 80px rgba(0,0,0,.58); }
    .guide-dialog header, .login-dialog > header { display: flex; align-items: center; gap: 10px; }
    .guide-dialog h2, .login-dialog h2 { margin: 0; font-size: 18px; }
    .guide-dialog header button, .login-dialog > header > button { margin-left: auto; width: 31px; height: 31px; border-radius: 9px; border: 0; background: #2b2f35; color: var(--launcher-text-2); cursor: pointer; }
    .guide-dialog p { color: var(--launcher-text-2); font-size: 11px; line-height: 1.65; }
    .guide-dialog ol { display: grid; gap: 7px; padding-left: 22px; color: var(--launcher-text-2); font-size: 11px; }
    .guide-dialog > small { color: var(--launcher-text-3); font-size: 9px; }
    .login-dialog { width: 760px; height: 620px; display: grid; grid-template-rows: 68px 1fr; overflow: hidden; border-radius: 23px; background: #111318; border: 1px solid rgba(255,255,255,.15); box-shadow: 0 30px 100px rgba(0,0,0,.65); }
    .login-dialog > header { padding: 0 23px; background: #212327; border-bottom: 1px solid var(--launcher-border); }
    .login-dialog > form { width: 480px; align-self: center; justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 28px 34px; border-radius: 17px; background: #17191e; border: 1px solid var(--launcher-border); }
    .login-dialog > form .platform-mark { width: 46px; height: 46px; }
    .login-dialog h3 { margin: 6px 0 12px; font-size: 24px; }
    .login-dialog label, .login-dialog input, .continue-button { width: 100%; }
    .login-dialog input { height: 48px; padding: 0 16px; border-radius: 9px; border: 1px solid rgba(255,255,255,.26); background: #25272c; color: var(--launcher-text); }
    .continue-button { height: 48px; border: 0; border-radius: 9px; background: #2eb4ef; color: #101317; font-weight: 800; cursor: pointer; }
    .login-dialog p { margin: 0; color: var(--launcher-text-3); font-size: 10px; }
    .login-dialog p button { border: 0; background: transparent; color: #2eb4ef; cursor: pointer; }
    .login-dialog hr { width: 100%; border: 0; border-top: 1px solid var(--launcher-border); }
    .login-dialog form > b { font-size: 12px; }

    .review-rail > header h1 { margin-top: 9px; color: #fff; font-size: 25px; letter-spacing: -.55px; }

    .review-legend { position: sticky; top: -24px; z-index: 4; margin: 0 -4px; padding: 13px 4px 10px; color: #b6c8d6; background: #101722; font-size: 11px; }
    .review-note-list { gap: 8px; }

    .managed-avatar { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; color: rgba(255,255,255,.9); font-size: 20px; font-weight: 850; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 7px 20px rgba(0,0,0,.25); }
    .managed-avatar--smallhao { background: radial-gradient(circle at 60% 70%, #ffae48 0 16%, transparent 17%), conic-gradient(from 20deg, #c76f24, #1d1010, #ff8a3d, #2a1114, #c76f24); }
    .managed-avatar--mello { background: radial-gradient(circle at 50% 55%, #16172f 0 28%, transparent 29%), conic-gradient(from 30deg, #18d6ff, #7136ff, #ff2bf2, #2d48ff, #18d6ff); }
    .add-managed-account { width: 100%; height: 78px; margin-top: 18px; border: 1px dashed rgba(255,255,255,.2); border-radius: 19px; color: rgba(244,246,249,.6); background: rgba(255,255,255,.018); font-size: 20px; cursor: pointer; }
