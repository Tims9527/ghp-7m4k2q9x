    if(type==='email'||labelText==='邮箱')return data.users.map(function(u){return {value:u.email,meta:u.id}});
    if(labelText.indexOf('Grant ID')>=0)return data.grants.map(function(g){return {value:g.id,meta:g.user+' · '+g.pkg}});
    if(labelText.indexOf('Source Parent')>=0)return data.grants.map(function(g){return {value:g.parent,meta:g.source}});

    if(labelText==='AppID')return uniqueSuggestions(data.grants.map(function(g){return {value:g.appId,meta:g.pkg}}).concat(data.whitelist.map(function(w){return {value:w.appId,meta:w.packageId}})));
    if(labelText.indexOf('Package ID')>=0)return Object.keys(data.packages).map(function(id){return {value:id,meta:data.packages[id].name}});
