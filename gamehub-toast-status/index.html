<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部游戏顺序检测</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    :root {
      color-scheme: dark;
      --canvas: #050607;
      --surface: #14181d;
      --surface-soft: #101419;
      --line: rgba(165, 188, 213, 0.18);
      --line-strong: rgba(165, 188, 213, 0.26);
      --text: #e4eefb;
      --text-soft: #acbbcb;
      --text-muted: #6f7d8d;
      --accent: #7ccaff;
      --accent-soft: #dbeeff;
      --success: #83d34a;
      --warning: #f0bf5b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    button:focus-visible,
    input:focus-visible + .toggle-track {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 45%, rgba(59, 88, 112, 0.08), transparent 34%),
        var(--canvas);
    }

    .demo {
      width: min(720px, 100%);
      display: grid;
      gap: 16px;
    }

    .detection-card {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(112deg, rgba(255, 255, 255, 0.02), transparent 58%),
        var(--surface);
      box-shadow: 0 24px 68px rgba(0, 0, 0, 0.44);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .detection-card[data-state="running"] {
      border-color: rgba(124, 202, 255, 0.28);
      box-shadow: 0 26px 76px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 202, 255, 0.04) inset;
    }

    .detection-card[data-state="paused"] { border-color: rgba(240, 191, 91, 0.34); }
    .detection-card[data-state="complete"] { border-color: rgba(131, 211, 74, 0.28); }

    .entry-row {
      min-height: 92px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
    }

    .entry-icon {
      color: var(--accent);
      font-size: 28px;
      line-height: 1;
    }

    .entry-copy {
      margin: 0;
      color: #cbd8e8;
      font-size: 16px;
      font-weight: 520;
      line-height: 1.6;
    }

    .primary-button,
    .secondary-button {
      min-width: 108px;
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 100ms ease, background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .primary-button {
      border: 1px solid rgba(190, 218, 245, 0.22);
      background: var(--accent-soft);
      color: #11171d;
    }

    .primary-button:hover { background: #eef7ff; }
    .primary-button:active,
    .secondary-button:active { transform: scale(0.98); }

    .primary-button:disabled {
      border-color: rgba(165, 188, 213, 0.1);
      background: rgba(165, 188, 213, 0.07);
      color: rgba(202, 219, 237, 0.42);
      cursor: not-allowed;
    }

    .secondary-button {
      min-width: 92px;
      height: 36px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: #afbecf;
      font-size: 13px;
    }

    .secondary-button:hover {
      border-color: rgba(165, 188, 213, 0.4);
      background: rgba(255, 255, 255, 0.035);
      color: #e7f0fb;
    }

    .inline-progress {
      padding: 18px 22px 22px;
      border-top: 1px solid rgba(165, 188, 213, 0.1);
      background: rgba(5, 8, 11, 0.2);
      animation: progress-in 220ms cubic-bezier(.2, .8, .2, 1);
    }

    .inline-progress[hidden] { display: none; }

    @keyframes progress-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }

    .current-step {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #dce8f6;
      font-size: 14px;
      font-weight: 560;
      line-height: 1.5;
    }

    .current-step i {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 18px;
    }

    .detection-card[data-state="running"] .current-step i { animation: spin 0.85s linear infinite; }
    .detection-card[data-state="paused"] .current-step i { color: var(--warning); }
    .detection-card[data-state="complete"] .current-step i { color: var(--success); }

    @keyframes spin { to { transform: rotate(360deg); } }

    .step-count {
      flex: 0 0 auto;
      color: #7d8b9b;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 171, 195, 0.13);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5aafe9, #9fddff);
      box-shadow: 0 0 16px rgba(124, 202, 255, 0.34);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1), background 180ms ease;
    }

    .detection-card[data-state="paused"] .progress-fill {
      background: var(--warning);
      box-shadow: 0 0 14px rgba(240, 191, 91, 0.28);
    }

    .detection-card[data-state="complete"] .progress-fill {
      background: var(--success);
      box-shadow: 0 0 14px rgba(131, 211, 74, 0.24);
    }

    .progress-footer {
      min-height: 36px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 10px;
    }

    .latest-result {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #738293;
      font-size: 12px;
      line-height: 1.5;
    }

    .latest-result i {
      flex: 0 0 auto;
      color: var(--success);
      font-size: 16px;
    }

    .latest-result[data-result="warning"] { color: #a99467; }
    .latest-result[data-result="warning"] i { color: var(--warning); }

    .interrupt-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .interrupt-actions[hidden] { display: none; }

    .demo-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #657282;
      font-size: 12px;
      user-select: none;
    }

    .toggle {
      position: relative;
      width: 34px;
      height: 20px;
      cursor: pointer;
    }

    .toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(165, 188, 213, 0.2);
      border-radius: 999px;
      background: #151a20;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #768494;
      transition: transform 150ms ease, background 150ms ease;
    }

    .toggle input:checked + .toggle-track {
      border-color: rgba(240, 191, 91, 0.42);
      background: rgba(240, 191, 91, 0.12);
    }

    .toggle input:checked + .toggle-track::after {
      background: var(--warning);
      transform: translateX(14px);
    }

    @media (max-width: 620px) {
      .stage { padding: 16px; }

      .entry-row {
        grid-template-columns: 28px minmax(0, 1fr);
        padding: 18px;
      }

      .entry-row .primary-button {
        grid-column: 2;
        width: fit-content;
      }

      .inline-progress { padding: 16px 18px 18px; }

      .progress-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="demo" aria-label="外部游戏文件检测原型">
      <article class="detection-card" id="detectionCard" data-state="idle">
        <div class="entry-row">
          <i class="ph ph-shield-check entry-icon" id="entryIcon" aria-hidden="true"></i>
          <p class="entry-copy" id="entryCopy">检测到外部导入的安装，建议先验证文件</p>
          <button class="primary-button" id="mainButton" type="button">一键检测</button>
        </div>

        <section class="inline-progress" id="progressArea" aria-label="顺序检测进度" hidden>
          <div class="progress-header">
            <div class="current-step">
              <i class="ph ph-spinner-gap" id="currentIcon" aria-hidden="true"></i>
              <span id="currentLabel">正在读取安装信息</span>
            </div>
            <span class="step-count" id="stepCount">步骤 1 / 5 · 8%</span>
          </div>

          <div class="progress-track" role="progressbar" aria-label="检测进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="progress-footer">
            <div class="latest-result" id="latestResult">
              <i class="ph ph-clock" aria-hidden="true"></i>
              <span>正在准备检测任务</span>
            </div>
            <div class="interrupt-actions" id="interruptActions" hidden>
              <button class="secondary-button" id="restartButton" type="button">重新检测</button>
            </div>
          </div>
        </section>
      </article>

      <div class="demo-control">
        <span>原型演示：任务中断</span>
        <label class="toggle" aria-label="模拟任务中断">
          <input id="interruptToggle" type="checkbox">
          <span class="toggle-track"></span>
        </label>
      </div>
    </section>
  </main>

  <script>
    const detectionCard = document.getElementById('detectionCard');
    const entryIcon = document.getElementById('entryIcon');
    const entryCopy = document.getElementById('entryCopy');
    const mainButton = document.getElementById('mainButton');
    const progressArea = document.getElementById('progressArea');
    const currentIcon = document.getElementById('currentIcon');
    const currentLabel = document.getElementById('currentLabel');
    const stepCount = document.getElementById('stepCount');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.querySelector('.progress-track');
    const latestResult = document.getElementById('latestResult');
    const resultIcon = latestResult.querySelector('i');
    const resultText = latestResult.querySelector('span');
    const interruptActions = document.getElementById('interruptActions');
    const restartButton = document.getElementById('restartButton');
    const interruptToggle = document.getElementById('interruptToggle');

    const steps = [
      {
        label: '正在读取安装信息',
        result: '安装信息读取完成',
        progress: 10,
        duration: 900,
        resultType: 'success'
      },
      {
        label: '正在核对本地文件清单',
        result: '本地文件清单正常',
        progress: 32,
        duration: 950,
        resultType: 'success'
      },
      {
        label: '正在检查游戏文件完整性',
        result: '发现 2 个异常文件，已进入自动修复',
        progress: 58,
        duration: 1100,
        resultType: 'warning'
      },
      {
        label: '发现异常，正在自动修复',
        result: '2 个异常文件已修复',
        progress: 82,
        duration: 1450,
        resultType: 'success',
        repairing: true
      },
      {
        label: '正在完成最终校验',
        result: '最终校验通过',
        progress: 96,
        duration: 1000,
        resultType: 'success'
      }
    ];

    let currentStepIndex = 0;
    let flowState = 'idle';
    let flowTimer;
    let interruptionConsumed = false;

    function setProgress(value) {
      progressFill.style.width = `${value}%`;
      progressTrack.setAttribute('aria-valuenow', String(value));
    }

    function setLatestResult(text, type) {
      latestResult.dataset.result = type;
      resultText.textContent = text;
      resultIcon.className = type === 'warning'
        ? 'ph-fill ph-warning-circle'
        : 'ph-fill ph-check-circle';
    }

    function resetFlow() {
      window.clearTimeout(flowTimer);
      currentStepIndex = 0;
      interruptionConsumed = false;
      progressFill.style.width = '0%';
      progressTrack.setAttribute('aria-valuenow', '0');
      interruptActions.hidden = true;
      latestResult.dataset.result = '';
      resultIcon.className = 'ph ph-clock';
      resultText.textContent = '正在准备检测任务';
      currentIcon.className = 'ph ph-spinner-gap';
      entryIcon.className = 'ph ph-shield-check entry-icon';
    }

    function beginDetection() {
      resetFlow();
      flowState = 'running';
      detectionCard.dataset.state = 'running';
      progressArea.hidden = false;
      entryCopy.textContent = '正在检测外部导入的安装';
      mainButton.textContent = '检测中';
      mainButton.disabled = true;
      runStep();
    }

    function runStep() {
      if (currentStepIndex >= steps.length) {
        completeDetection();
        return;
      }

      const step = steps[currentStepIndex];
      currentIcon.className = step.repairing ? 'ph ph-wrench' : 'ph ph-spinner-gap';
      currentLabel.textContent = step.label;
      stepCount.textContent = `步骤 ${currentStepIndex + 1} / ${steps.length} · ${step.progress}%`;
      setProgress(step.progress);

      flowTimer = window.setTimeout(() => {
        if (step.repairing && interruptToggle.checked && !interruptionConsumed) {
          pauseDetection();
          return;
        }

        setLatestResult(step.result, step.resultType);
        currentStepIndex += 1;
        runStep();
      }, step.duration);
    }

    function pauseDetection() {
      flowState = 'paused';
      interruptionConsumed = true;
      detectionCard.dataset.state = 'paused';
      currentIcon.className = 'ph-fill ph-warning-circle';
      currentLabel.textContent = '磁盘连接中断，检测任务已暂停';
      stepCount.textContent = `步骤 ${currentStepIndex + 1} / ${steps.length} · 82%`;
      setLatestResult('连接游戏库所在磁盘后可继续当前任务', 'warning');
      mainButton.textContent = '继续修复';
      mainButton.disabled = false;
      interruptActions.hidden = false;
    }

    function continueDetection() {
      flowState = 'running';
      detectionCard.dataset.state = 'running';
      mainButton.textContent = '修复中';
      mainButton.disabled = true;
      interruptActions.hidden = true;
      currentIcon.className = 'ph ph-wrench';
      currentLabel.textContent = '正在从中断位置继续修复';

      flowTimer = window.setTimeout(() => {
        setLatestResult(steps[currentStepIndex].result, 'success');
        currentStepIndex += 1;
        runStep();
      }, 1200);
    }

    function completeDetection() {
      flowState = 'complete';
      detectionCard.dataset.state = 'complete';
      setProgress(100);
      currentIcon.className = 'ph-fill ph-check-circle';
      currentLabel.textContent = '检测与修复已完成';
      stepCount.textContent = `步骤 ${steps.length} / ${steps.length} · 100%`;
      setLatestResult('游戏文件已完成验证，发现的问题已自动修复', 'success');
      entryIcon.className = 'ph-fill ph-check-circle entry-icon';
      entryCopy.textContent = '外部安装检测完成，游戏文件状态正常';
      mainButton.textContent = '关闭';
      mainButton.disabled = false;
      interruptActions.hidden = true;
    }

    function closeDetection() {
      window.clearTimeout(flowTimer);
      flowState = 'idle';
      detectionCard.dataset.state = 'idle';
      progressArea.hidden = true;
      entryIcon.className = 'ph ph-shield-check entry-icon';
      entryCopy.textContent = '检测到外部导入的安装，建议先验证文件';
      mainButton.textContent = '一键检测';
      mainButton.disabled = false;
      mainButton.focus();
    }

    mainButton.addEventListener('click', () => {
      if (flowState === 'idle') beginDetection();
      else if (flowState === 'paused') continueDetection();
      else if (flowState === 'complete') closeDetection();
    });

    restartButton.addEventListener('click', beginDetection);
  </script>
</body>
</html>
