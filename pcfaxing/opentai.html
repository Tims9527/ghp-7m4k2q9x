const pageInfo={games:{title:'我的游戏',intro:'开发者查看自己的游戏、平台资质及线上版本，进入上传与发布流程。'},builds:{title:'构建与上传',intro:'上传新构建、管理传输进度，查看自动检查、客户端测试和平台审核结果。'},releases:{title:'发布管理',intro:'对所属游戏提交发布计划，查看平台执行与运营处理结果。'},messages:{title:'消息中心',intro:'查看平台问题和通知，定位需要修复的包体或资料。'}};
function tag(value){const color=['审核通过','已上线','已上架','可发布','已通过','已完成','已发布','有效'].includes(value)?'green':['构建失败','测试不通过','审核退回','发布失败','平台下架','未通过','受限','上传失败'].includes(value)?'red':['待运营审核','上传中','待上架','待测试','测试中','待审核'].includes(value)?'blue':['构建中','校验中','上架中'].includes(value)?'amber':'gray';return `<span class="tag ${color}">${esc(value)}</span>`}
function button(label,action,id='',kind='ghost',disabled=false){return `<button type="button" class="${kind}" data-action="${action}" data-id="${esc(id)}" ${disabled?'disabled':''}>${label}</button>`}
function cell(v){return `<td>${esc(v??'—')}</td>`}
function kv(rows){return `<dl class="kv">${rows.map(([label,value])=>`<dt>${esc(label)}</dt><dd>${esc(value||'—')}</dd>`).join('')}</dl>`}
function block(key,content){return `<section class="block" data-note="${key}"><h4>${definitions[key].title}</h4>${content}</section>`}
function field(id,label,html,full=false){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label>${html}</div>`}
function input(id,value='',extra=''){return `<input class="input" id="${id}" value="${esc(value)}" ${extra}>`}
function options(values,value='',placeholder='请选择'){return (placeholder?`<option value="">${placeholder}</option>`:'')+values.map(v=>{const id=typeof v==='string'?v:v.id,label=typeof v==='string'?v:v.label;return `<option value="${esc(id)}" ${id===value?'selected':''}>${esc(label)}</option>`}).join('')}
function gameOptions(value='',all=false){return options(games.filter(g=>g.owner===account.id).map(g=>({id:g.id,label:g.name})),value,all?'全部游戏':'请选择游戏')}
function table(headers,rows,key){return `<section class="panel" data-note="${key}"><header class="panel-head"><h2>${definitions[key].title}</h2><span class="count">${rows.length} 条</span></header><div class="table-wrap" role="region" tabindex="0" aria-label="${definitions[key].title}，可横向滚动查看独立字段"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td class="empty" colspan="${headers.length}">没有符合条件的记录</td></tr>`}</tbody></table></div></section>`}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2500)}
function buildBy(id){return builds.find(b=>b.id===id&&game(b.app))}function releaseBy(id){return releases.find(r=>r.id===id&&game(r.app))}
function notify(type,title,body,app,ref={}){messages.unshift({id:newId('msg'),owner:findGame(app)?.owner||account.id,app,type,title,body,at:now(),read:false,...ref})}
function criteria(){const f=applied[currentPage]||{q:'',game:'',state:''};return !isOps()&&scopedDeveloperPage(currentPage)?{...f,game:selectedGame}:f}
function match(record,text,state){const f=criteria();return !!game(record.app)&&(!isOps()&&scopedDeveloperPage(currentPage)?record.app===selectedGame:true)&&(!f.game||f.game===record.app)&&(!f.q||text.toLowerCase().includes(f.q))&&(!f.state||state===f.state)}
function baseFilterPanel(){const f=drafts[currentPage]||{q:'',game:'',state:''},states=currentPage==='pricing'?['草稿','审核中','已通过','已退回']:currentPage==='builds'?[...uploadStates,...buildStates]:currentPage==='releases'?releaseStates:currentPage==='messages'?['未读','已读']:['正常','平台限制'];return `<section class="panel filters-panel" data-note="query"><div class="filter-grid">${field('queryText','关键词',`<div class="input-wrap">${input('queryText',f.q,'type="search" placeholder="游戏名称 / APPID / 记录 ID"')}<button class="clear" type="button" aria-label="清除关键词" ${f.q?'':'hidden'}>×</button></div>`)}${field('queryGame','游戏',`<select id="queryGame" class="input">${gameOptions(f.game,true)}</select>`)}${field('queryState',currentPage==='messages'?'阅读状态':'状态',`<select id="queryState" class="input">${options(states,f.state,'全部状态')}</select>`)}<div class="filter-actions">${button('重置','reset','','secondary')}${button('查询','query','','primary')}</div></div></section>`}
function renderContent(){

 const info=pageInfo[currentPage];document.title=(isOps()?'运营管理后台':'开发者开放平台')+' · '+info.title;$('#crumbRoot').textContent=isOps()?'PC发行业务':'开发者中心';$('#crumb').textContent=isOps()?'游戏包管理 / '+info.title:currentPage==='games'?'游戏管理':currentPage==='messages'?'消息中心':(activeGame()?.name||'')+'游戏管理 / '+info.title;

 }else if(currentPage==='releases'){

 }else{

 }
 $('#content').innerHTML=html;bindFilters();renderNotes();updateMessageBadge();$$('#content .table-wrap').forEach((e,i)=>e.scrollLeft=scrollPositions[i]||0);if(restore){const element=restore.id?document.getElementById(restore.id):[...$('#content').querySelectorAll('button[data-action]')].find(e=>e.dataset.action===restore.action&&e.dataset.id===restore.record);if(element){element.focus({preventScroll:true});if(restore.start!=null&&element.setSelectionRange)element.setSelectionRange(restore.start,restore.end)}}

function bindFilters(){const save=()=>{drafts[currentPage]={q:$('#queryText').value,game:$('#queryGame').value,state:$('#queryState').value,type:$('#queryType')?.value||''};$('.clear').hidden=!$('#queryText').value};['queryText','queryGame','queryState','queryType'].forEach(id=>$('#'+id)?.addEventListener('input',save));$('.clear').onclick=()=>{$('#queryText').value='';save();$('#queryText').focus()}}
function route(page,preset){
 if(!pageInfo[page])return;
 if(isOps()&&!page.startsWith('ops'))page='opsTests';
 if(!isOps()&&page.startsWith('ops'))page='games';
 if(!isOps()){
  if(page==='games')selectedGame='';
  else if(scopedDeveloperPage(page)){
   const app=preset||selectedGame;
   if(!game(app)){openGamePicker(page);return}
   if(selectedGame!==app){['pricing','builds','releases'].forEach(p=>{drafts[p]={q:'',game:app,state:''};applied[p]={...drafts[p]}})}
   selectedGame=app;drafts[page]={...(drafts[page]||{}),game:app};applied[page]={...(applied[page]||{}),game:app};
  }
 }
 closeModal(false);currentPage=page;lastSurfacePage[surface]=page;renderRoleMenu();
 $$('.nav-btn').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});renderContent();$('.workspace').scrollTop=0;$('#reviewPanel').scrollTop=0;$('#content h1').focus();
}

function buildActions(b,detail=true){let out=detail?button('详情','build-detail',b.id):'';if(b.uploadState==='上传中')out+=button('暂停','pause-upload',b.id);if(['已暂停','上传失败'].includes(b.uploadState))out+=button(b.uploadState==='已暂停'?'继续':'重试','resume-upload',b.id);if(['上传中','已暂停','上传失败'].includes(b.uploadState))out+=button('取消','cancel-upload',b.id);if(['构建失败','测试不通过','审核退回'].includes(b.state))out+=button('上传修复版本','fix-upload',b.id);if(b.state==='审核退回')out+=button('重新提交资料','resubmit',b.id);if(b.review==='已通过'&&!game(b.app).restriction)out+=button('创建发布','build-release',b.id);return out}
function releaseActions(r,detail=true){let out=detail?button('详情','release-detail',r.id):'';if(r.state==='上架中')out+=button('上架中','noop',r.id,'secondary',true);if(r.creator===account.id&&r.source==='开发者'){if(r.state==='待上架'||r.state==='待运营审核')out+=button(r.state==='待运营审核'?'撤回申请':'取消发布','cancel-release',r.id);if(r.state==='已上架')out+=button('下架','delist',r.id)}return out}
function renderNotes(){
 $('.annotation>small').textContent=isOps()?'产品标注 · 运营端':'产品标注 · 开发者端';
 $$('.pin').forEach(p=>p.remove());const root=modalContext?$('#modalBody'):$('#content');$('#noteTitle').textContent=modalContext?$('#modalTitle').textContent:pageInfo[currentPage].title;$('#noteIntro').textContent=modalContext?'按模块说明字段、状态与操作边界。关闭弹窗不提交变更。':pageInfo[currentPage].intro;
 const sections=[...root.querySelectorAll('[data-note]')];$('#notes').innerHTML=sections.map((section,i)=>{const key=section.dataset.note,d=definitions[key],n=i+1;const pin=document.createElement('button');pin.type='button';pin.className='pin';pin.textContent=n;pin.setAttribute('aria-label',`标注 ${n}：${d.title}`);pin.setAttribute('aria-pressed','false');pin.onclick=()=>{$$('.note-card').forEach(c=>c.classList.toggle('selected',c.id==='note-'+n));$$('.pin').forEach(p=>p.setAttribute('aria-pressed',String(p===pin)));$('#note-'+n).scrollIntoView({block:'start'});$('#note-'+n).focus({preventScroll:true})};(section.querySelector('h2,h4')||section).appendChild(pin);return `<section class="note-card" id="note-${n}" tabindex="-1"><h3>${String(n).padStart(2,'0')} ${d.title}</h3><p>${d.body}</p>${d.states?'<h4>状态与操作</h4><ul>'+d.states.map(s=>`<li>${s}</li>`).join('')+'</ul>':''}${d.fields?'<h4>字段说明</h4><dl>'+d.fields.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>':''}</section>`}).join('');

function openModal(title,body,footer='',context={type:'detail'}){const newContext=!modalContext||modalContext.type!==context.type||modalContext.id!==context.id;if(!modalContext)returnFocus=document.activeElement;modalContext=context;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFooter').innerHTML=footer;$('#modalMask').hidden=false;renderNotes();if(newContext){$('#modalBody').scrollTop=0;$('#reviewPanel').scrollTop=0}$('#modalMask .close-icon').focus()}

function linkedAction(action,id){
 if(action==='open-messages'){if(!isOps())route('messages');return true}
 if(action==='choose-context'){const page=modalContext?.page;if(!isOps()&&page&&game(id)){closeModal(false);route(page,id)}return true}
 if(['message-build','message-release','message-price'].includes(action)){if(!isOps())openMessageTarget(id,action.split('-')[1]);return true}
 if(action==='switch-developer'||action==='switch-operator'){switchSurface(action==='switch-operator'?'operator':'developer');return true}
 if(action==='back-games'){route('games');return true}
 if(action==='sdk'){viewSDK(id);return true}
 if(action==='copy-appid'||action==='copy-sdk'){copySDK(id,action==='copy-sdk');return true}
 if(action==='ops-tab'&&isOps()){opsReviewTab=id;drafts[currentPage]={q:'',game:!isOps()&&scopedDeveloperPage(currentPage)?selectedGame:'',state:''};applied[currentPage]={...drafts[currentPage]};renderContent();return true}
 if(action.startsWith('ops-')){if(!isOps())return true;if(action==='ops-build-detail')opsBuildDetail(id);else if(action==='ops-start-test')opsTestStart(id);else if(action==='ops-test-pass'||action==='ops-test-fail')opsTestResult(id,action==='ops-test-pass');else if(action==='ops-build-pass'||action==='ops-build-fail')opsBuildResult(id,action==='ops-build-pass');else if(action==='ops-price-detail')opsPriceDetail(id);else if(action==='ops-price-pass'||action==='ops-price-fail')opsPriceResult(id,action==='ops-price-pass');else if(action==='ops-release-detail')opsReleaseDetail(id);else if(action==='ops-release-pass'||action==='ops-release-fail')opsReleaseResult(id,action==='ops-release-pass');else if(action==='ops-release-cancel'||action==='ops-delist')opsReleaseControl(id,action==='ops-delist');else if(action==='ops-download'||action==='ops-unlock')opsGameControl(id,action==='ops-unlock');else if(action==='ops-rollback')opsRollback(id);return true}
 if(isOps()&&!['close','query','reset'].includes(action))return true;
 return false;
}

  if(opsReviewTab==='packages'){const rows=steamPackages.filter(p=>match({app:p.app},`${p.name} ${p.id}`,p.state)).map(p=>`<tr>${cell(findGame(p.app).name)}${cell(p.id)}${cell(p.name)}${cell(p.appIds.join(', '))}${cell(p.depotIds.join(', '))}${cell(`USD ${p.price||'—'}`)}<td>${tag(p.state)}</td><td>${button('详情','steam-package-detail',p.id)}${p.state==='待审核'?button('通过','steam-ops-package-pass',p.id)+button('退回','steam-ops-package-fail',p.id):''}</td></tr>`);return tabs+steamPanel('opsPackageReview','Package 与定价审核','',['游戏','Package ID','Package 名称','包含 AppID','包含 Depot','价格','状态','操作'],rows)}
  if(opsReviewTab==='bundles'){const rows=steamBundles.filter(b=>match({app:b.app},`${b.name} ${b.id}`,b.state)).map(b=>`<tr>${cell(findGame(b.app).name)}${cell(b.id)}${cell(b.name)}${cell(b.type)}${cell(b.packageIds.join(', '))}${cell(b.discount+'%')}<td>${tag(b.state)}</td><td>${button('详情','steam-bundle-detail',b.id)}${b.state==='待审核'?button('通过','steam-ops-bundle-pass',b.id)+button('退回','steam-ops-bundle-fail',b.id):''}</td></tr>`);return tabs+steamPanel('opsBundleReview','Bundle 组合审核','',['游戏','Bundle ID','名称','组合规则','包含 Package','折扣','状态','操作'],rows)}
  if(opsReviewTab==='builds'){const rows=builds.filter(b=>b.qa==='已通过'&&match(b,`${findGame(b.app).name} ${b.id} ${b.depotId}`,b.review)).map(b=>`<tr>${cell(findGame(b.app).name)}${cell(b.targetAppId)}${cell(b.depotId)}${cell(b.id)}${cell(b.version)}<td>${tag(b.qa)}</td><td>${tag(b.review)}</td><td>${button('详情','ops-build-detail',b.id)}${b.review==='待审核'?button('通过','ops-build-pass',b.id)+button('退回','ops-build-fail',b.id):''}</td></tr>`);return tabs+steamPanel('opsBuildReview','提包审核','',['游戏','目标 AppID','Depot ID','Build ID','版本号','QA','审核状态','操作'],rows)}
  return tabs+opsReleaseTable(true);
 }
 if(page==='opsReleases')return opsReleaseTable(false);
 return steamOriginalOpsPageBody(page)
};
opsReleaseTable=function(reviewOnly){return table(['游戏名称','Base AppID','Release ID','Build ID','Depot ID','Manifest ID','分支','发布方式','计划时间','审核结果','发布状态','操作'],releases.filter(r=>(!reviewOnly||['待运营审核','已退回'].includes(r.state))&&match(r,`${findGame(r.app).name} ${r.id} ${r.build}`,r.state)).map(r=>`<tr>${cell(findGame(r.app).name)}${cell(r.app)}${cell(r.id)}${cell(r.build)}${cell(buildBy(r.build)?.depotId)}${cell(buildBy(r.build)?.manifestId)}${cell(r.branch||'Production')}${cell(r.mode)}${cell(formatTime(r.planned))}<td>${tag(r.approval)}</td><td>${tag(r.state)}</td><td>${button('详情','ops-release-detail',r.id)}${r.state==='待运营审核'?button('审核通过','ops-release-pass',r.id)+button('退回','ops-release-fail',r.id):r.state==='待上架'?button('取消计划','ops-release-cancel',r.id):r.state==='已上架'?button('平台下架','ops-delist',r.id):''}</td></tr>`),reviewOnly?'opsReleaseReview':'opsReleaseRows')};
opsReleaseDetail=function(id){const r=releases.find(x=>x.id===id);if(!r)return;openModal('Build 发布审核详情',block('opsReleaseReview',kv([['游戏名称',findGame(r.app).name],['Base AppID',r.app],['Release ID',r.id],['Build ID',r.build],['Depot ID',buildBy(r.build)?.depotId],['Manifest ID',buildBy(r.build)?.manifestId],['版本号',r.version],['发布分支',r.branch||'Production'],['发布方式',r.mode],['计划时间',formatTime(r.planned)],['审核结果',r.approval],['发布状态',r.state],['发布说明',r.note]]))+block('audit',audit(r.logs)),r.state==='待运营审核'?button('审核通过','ops-release-pass',id,'primary')+button('退回','ops-release-fail',id,'danger'):'',{type:'ops-release-detail',id})};

function steamOpsReview(kind,id,pass){const record=kind==='app'?(games.find(g=>g.id===id)||steamDlcApps.find(a=>a.id===id)):kind==='package'?steamPackage(id):steamBundle(id);if(!record||record.state!=='待审核')return;const title=`${kind==='app'?'App / DLC':kind==='package'?'Package 与定价':'Bundle'}${pass?'审核通过':'审核退回'}`;openReason(title,block(kind==='app'?'opsAppReview':kind==='package'?'opsPackageReview':'opsBundleReview',kv([['记录 ID',id],['名称',record.name],['当前状态',record.state]])),reason=>{if(record.state!=='待审核')return '记录状态已经变化。';record.state=pass?'已通过':'已退回';record.reviewNote=reason;if(kind==='app'&&games.includes(record)){record.license=pass;record.product=pass}notify(kind==='app'?'审核结果':'定价审核',`${record.name} ${record.state}`,reason,record.app||record.id,kind==='package'?{sku:id}:{});return ''},'审核意见 *')}

const steamPreviousLinkedFilterPanel=linkedFilterPanel;
linkedFilterPanel=function(){if(isOps()&&currentPage==='opsReviews'){const f=drafts[currentPage]||{q:'',game:'',state:''},states=opsReviewTab==='apps'?['待审核','已通过','已退回']:opsReviewTab==='packages'?['待配置','待审核','已通过','已退回']:opsReviewTab==='bundles'?['待审核','已通过','已退回']:opsReviewTab==='builds'?['待审核','已通过','已退回']:['待运营审核','已退回'];return `<section class="panel filters-panel" data-note="query"><div class="filter-grid">${field('queryText','关键词',`<div class="input-wrap">${input('queryText',f.q,'type="search" placeholder="AppID / Package ID / Bundle ID / Build ID"')}<button class="clear" type="button" aria-label="清除关键词" ${f.q?'':'hidden'}>×</button></div>`)}${field('queryGame','游戏',`<select id="queryGame" class="input">${options(games.map(g=>({id:g.id,label:g.name})),f.game,'全部游戏')}</select>`)}${field('queryState','状态',`<select id="queryState" class="input">${options(states,f.state,'全部状态')}</select>`)}<div class="filter-actions">${button('重置','reset','','secondary')}${button('查询','query','','primary')}</div></div></section>`}return steamPreviousLinkedFilterPanel()};

const steamPreviousLinkedAction=linkedAction;
linkedAction=function(action,id){
 if(action==='steam-new-base'){openSteamBaseApp();return true}
 if(action==='steam-new-dlc'){openSteamDlc(id||selectedGame);return true}
 if(action==='steam-app-detail'){showSteamApp(id);return true}
 if(action==='steam-new-package'){openSteamPackage(id||selectedGame);return true}
 if(action==='steam-package-edit'){openSteamPackage('',id);return true}
 if(action==='steam-package-detail'){showSteamPackage(id);return true}
 if(action==='steam-new-bundle'){openSteamBundle(id||selectedGame);return true}
 if(action==='steam-bundle-edit'){openSteamBundle('',id);return true}
 if(action==='steam-bundle-detail'){showSteamBundle(id);return true}
 if(action==='steam-new-depot'){openSteamDepot(id||selectedGame);return true}
 if(action==='steam-ops-app-pass'||action==='steam-ops-app-fail'){steamOpsReview('app',id,action.endsWith('pass'));return true}
 if(action==='steam-ops-package-pass'||action==='steam-ops-package-fail'){steamOpsReview('package',id,action.endsWith('pass'));return true}
 if(action==='steam-ops-bundle-pass'||action==='steam-ops-bundle-fail'){steamOpsReview('bundle',id,action.endsWith('pass'));return true}
 return steamPreviousLinkedAction(action,id)
};
const steamPreviousPricingAction=pricingAction;
pricingAction=function(action,id){if(action==='new-upload'||action==='fix-upload'){openSteamBuild(selectedGame,action==='fix-upload'?id:'');return true}return steamPreviousPricingAction(action,id)};

function initSteamAlignedPrototype(){opsReviewTab='apps';renderRoleMenu();route('games')}
initSteamAlignedPrototype();

<style>
.nav-btn{display:flex;align-items:center;gap:6px}.nav-count{margin-left:auto;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;background:#e45858;color:#fff;font-size:10px;font-weight:700}.locked-card{opacity:.9}.gate-message{margin:10px 0;padding:9px 10px;background:#fff4dc;color:#815d1a;border-radius:7px;font-size:11px;line-height:1.55}.workflow-gate .error{margin:10px 16px 16px}.workflow-review-summary{grid-template-columns:repeat(6,minmax(0,1fr))}.review-metric{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:14px;cursor:pointer}.review-metric small,.review-metric span{display:block;color:var(--muted)}.review-metric strong{display:block;font-size:25px;margin:5px 0}@media(max-width:900px){.workflow-review-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
/* Workflow linkage V3: explicit review queues and state gates */
const workflowPending={
 apps:()=>games.filter(g=>g.appState==='待审核').length+steamDlcApps.filter(a=>a.state==='待审核').length,
 tests:()=>builds.filter(b=>b.qa==='待测试'||b.qa==='测试中').length,
 builds:()=>builds.filter(b=>b.qa==='已通过'&&b.review==='待审核').length,
 packages:()=>steamPackages.filter(p=>p.state==='待审核').length,
 bundles:()=>steamBundles.filter(b=>b.state==='待审核').length,
 releases:()=>releases.filter(r=>r.state==='待运营审核').length
};
const workflowAppApproved=id=>{const base=games.find(g=>g.id===id);if(base)return base.appState==='已通过';return steamDlcApps.find(a=>a.id===id)?.state==='已通过'};
const workflowCount=n=>n?`<span class="nav-count" aria-label="${n} 条待办">${n}</span>`:'';
Object.assign(definitions,{workflowGate:{title:'流程门槛',body:'Base App 资料审核通过后才能创建 DLC、Depot、Package 和 Build。DLC 审核通过后才能加入 Depot 或 Package。Build 需经过 QA 和提包审核，Package / Bundle 需经过商品审核，Release 需经过发布审核。'},opsReviewSummary:{title:'审核待办',body:'开发者提交后立即生成对应审核待办。每个审核队列独立处理，通过后解锁下游操作；退回后开发者看到原因并重新提交。'}});
pageInfo.opsReviews.title='审核中心';

function workflowOperatorMenu(){
 const items=[
  ['opsReviews','apps','游戏 / DLC 审核',workflowPending.apps()],
  ['opsTests','', '包体测试',workflowPending.tests()],
  ['opsReviews','builds','提包审核',workflowPending.builds()],
  ['opsReviews','packages','Package 定价审核',workflowPending.packages()],
  ['opsReviews','bundles','Bundle 审核',workflowPending.bundles()],
  ['opsReviews','releases','发布审核',workflowPending.releases()],
  ['opsReleases','','发布管理',0],['opsVersions','','版本管理',0]
 ];
 $('.sidebar').innerHTML=`<div class="surface-switch" aria-label="联动演示端切换"><button data-action="switch-developer" aria-pressed="false">开发者开放平台</button><button class="selected" data-action="switch-operator" aria-pressed="true">运营管理后台</button></div><div class="nav-label">PC发行业务</div><nav class="game-navigation" aria-label="运营审核与管理导航"><button id="menuToggle" class="nav-group-toggle" aria-expanded="true" aria-controls="menu">审核与发布管理<span aria-hidden="true">⌄</span></button><div class="nav-items" id="menu" role="group" aria-label="运营审核菜单">${items.map(([page,tab,label,count])=>`<button class="nav-btn ${currentPage===page&&(!tab||opsReviewTab===tab)?'active':''}" data-page="${page}" ${tab?`data-review-tab="${tab}"`:''}>${label}${workflowCount(count)}</button>`).join('')}</div></nav><div class="org">发行运营平台<br>运营账号：ops.lin</div>`;
 $$('.nav-btn').forEach(b=>b.onclick=()=>{if(b.dataset.reviewTab)opsReviewTab=b.dataset.reviewTab;route(b.dataset.page)});$('#menuToggle').onclick=()=>{const open=$('#menuToggle').getAttribute('aria-expanded')==='true';$('#menuToggle').setAttribute('aria-expanded',String(!open));$('#menu').hidden=open};
 const title=$('.platform-brand strong');if(title)title.textContent='PC发行运营后台';const sub=$('.platform-brand small');if(sub)sub.textContent='运营管理 · 联动演示';$('.platform-actions').innerHTML='<span class="operator-identity">OP · ops.lin</span>';
}
const workflowPreviousRenderRoleMenu=renderRoleMenu;
renderRoleMenu=function(){if(isOps())workflowOperatorMenu();else workflowPreviousRenderRoleMenu()};

function workflowFirstQueue(){if(workflowPending.apps())return 'apps';if(workflowPending.builds())return 'builds';if(workflowPending.packages())return 'packages';if(workflowPending.bundles())return 'bundles';if(workflowPending.releases())return 'releases';return 'apps'}
const workflowPreviousSwitchSurface=switchSurface;
switchSurface=function(next){if(next===surface)return;if(next==='operator'){lastSurfacePage[surface]=currentPage;closeModal(false);surface='operator';document.body.classList.add('is-ops');opsReviewTab=workflowFirstQueue();currentPage=workflowPending.apps()||workflowPending.builds()||workflowPending.packages()||workflowPending.bundles()||workflowPending.releases()?'opsReviews':'opsTests';lastSurfacePage.operator=currentPage;renderRoleMenu();route(currentPage);return}workflowPreviousSwitchSurface(next)};

function workflowReviewSummary(){const items=[['游戏 / DLC',workflowPending.apps(),'apps'],['待测试',workflowPending.tests(),''],['提包',workflowPending.builds(),'builds'],['Package 定价',workflowPending.packages(),'packages'],['Bundle',workflowPending.bundles(),'bundles'],['发布申请',workflowPending.releases(),'releases']];return `<div class="metrics workflow-review-summary" data-note="opsReviewSummary">${items.map(([name,count,tab])=>`<button class="metric review-metric" type="button" data-action="workflow-open-review" data-id="${tab}"><small>${name}</small><strong>${count}</strong><span>待处理</span></button>`).join('')}</div>`}
const workflowPreviousOpsPageBody=opsPageBody;
opsPageBody=function(page){const body=workflowPreviousOpsPageBody(page);return page==='opsReviews'?workflowReviewSummary()+body:body};

const workflowPreviousRenderContent=renderContent;
renderContent=function(){workflowPreviousRenderContent();if(isOps()&&currentPage==='opsReviews'){const names={apps:'游戏 / DLC 审核',builds:'提包审核',packages:'Package 定价审核',bundles:'Bundle 审核',releases:'发布审核'};const name=names[opsReviewTab]||'审核中心';const h=$('#content h1');if(h)h.textContent=name;$('#crumb').textContent='审核与发布管理 / '+name;document.title='运营管理后台 · '+name}if(isOps())renderRoleMenu()};

function workflowGatePanel(g){return `<section class="panel workflow-gate" data-note="workflowGate"><header class="panel-head"><h2>下一步操作门槛</h2></header><div class="check-list"><div class="check ${g.appState==='已通过'?'pass':'fail'}"><span>Base App 资料审核</span><b>${g.appState}</b></div><p class="error">${g.appState==='已退回'?esc(g.appReviewNote||'请修改资料后重新提交。'):'运营审核通过后，才可创建 DLC、Depot、Package 和 Build。'}</p></div></section>`}
const workflowPreviousPortalGameCards=portalGameCards;
portalGameCards=function(){const f=criteria(),visible=games.filter(g=>g.owner===account.id&&(!f.q||(g.name+' '+g.id).toLowerCase().includes(f.q)));return `<section class="panel portal-games" data-note="games"><header class="panel-head"><h2>游戏本体应用</h2><span class="count">${visible.length} 个 Base App</span>${button('创建游戏本体','steam-new-base','','primary')}</header><div class="game-card-grid">${visible.map((g,i)=>{const approved=g.appState==='已通过';const actions=approved?button('查看参数','sdk',g.id)+button('管理 DLC / 商品','game-pricing',g.id)+button('Depot 与构建','game-builds',g.id)+button('发布管理','game-releases',g.id):button('查看审核资料','steam-app-detail',g.id)+(g.appState==='已退回'?button('修改并重新提交','workflow-base-edit',g.id):'');return `<article class="game-card ${approved?'':'locked-card'}"><div class="game-cover cover-${i}"><small>BASE APP</small>${controllerIcon}</div><div class="game-card-content"><div class="game-card-title"><h2>${esc(g.name)}</h2>${tag(g.appState)}</div><dl class="card-fields"><div><dt>Base AppID</dt><dd>${g.id}</dd></div><div><dt>支持系统</dt><dd>${g.platform}</dd></div><div><dt>DLC 数量</dt><dd>${steamDlcApps.filter(a=>a.app===g.id).length}</dd></div><div><dt>Depot 数量</dt><dd>${steamDepots.filter(d=>d.app===g.id).length}</dd></div><div><dt>当前 Build</dt><dd>${g.activeBuild||'—'}</dd></div><div><dt>资料状态</dt><dd>${g.appState}</dd></div></dl>${approved?'':`<p class="gate-message">${g.appState==='已退回'?esc(g.appReviewNote||'资料被退回，请修改后重新提交。'):'正在等待运营审核，通过后开放后续功能。'}</p>`}<div class="game-card-actions">${actions}</div></div></article>`}).join('')}</div></section>`};

const workflowPreviousPricingContent=pricingContent;
pricingContent=function(){const g=findGame(selectedGame);if(!g)return '<p class="empty">请先选择游戏</p>';if(g.appState!=='已通过')return steamAppPanel(g.id)+workflowGatePanel(g);return workflowPreviousPricingContent()};
const workflowPreviousSteamAppPanel=steamAppPanel;
steamAppPanel=function(app){const rows=steamAppsFor(app).map(a=>{const edit=a.type==='DLC'&&a.state==='已退回'?button('修改并重新提交','workflow-dlc-edit',a.id):'';return `<tr>${cell(a.name)}${cell(a.type)}${cell(a.id)}${cell(a.type==='DLC'?app:'—')}${cell(a.delivery)}<td>${tag(a.state)}</td><td>${button('详情','steam-app-detail',a.id)}${edit}</td></tr>`});const canCreate=findGame(app)?.appState==='已通过';return steamPanel('steamApps','Base App 与 DLC App',canCreate?button('创建 DLC','steam-new-dlc',app,'secondary'):'',['应用名称','应用类型','AppID','所属 Base AppID','交付方式','资料状态','操作'],rows)};
const workflowPreviousSteamPackagePanel=steamPackagePanel;
steamPackagePanel=function(app){const list=steamPackages.filter(p=>p.app===app),rows=list.map(p=>{const ready=p.appIds.every(workflowAppApproved);const action=ready&&p.state!=='待审核'?button(p.state==='已通过'?'修改并提交':'配置并提交','steam-package-edit',p.id):'';return `<tr>${cell(p.name)}${cell(p.id)}${cell(p.kind)}${cell(p.appIds.map(steamAppName).join(' + '))}${cell(p.depotIds.join(', '))}${cell(`${p.currency} ${p.price||'—'}`)}${cell(p.scope)}<td>${tag(ready?p.state:'等待 App 审核')}</td>${cell(p.source)}<td>${button('详情','steam-package-detail',p.id)}${action}</td></tr>`});return steamPanel('steamPackages','Package 与 USD 定价',button('创建附加 Package','steam-new-package',app,'secondary'),['Package 名称','Package ID','类型','包含 App','包含 Depot','价格','销售范围','审核状态','创建来源','操作'],rows)};

// Package display: business type + activation channel, no technical creation-source field.
steamPackagePanel=function(app){const list=steamPackages.filter(p=>p.app===app),rows=list.map(p=>{const ready=p.appIds.every(workflowAppApproved),actions=button('详情','steam-package-detail',p.id)+(ready&&p.state!=='待审核'?button(p.state==='已通过'?'修改并提交':'配置并提交','steam-package-edit',p.id):'')+(p.state==='已通过'&&p.kind!=='测试 Package'?button('设置折扣','package-discount',p.id):'');return `<tr>${cell(p.name)}${cell(p.id)}${cell(packageKindLabel(p.kind))}${cell(packageChannelLabel(p))}${cell(p.appIds.map(steamAppName).join(' + '))}${cell(p.depotIds.join(', '))}${cell(`${p.currency} ${p.price||'—'}`)}${cell(p.scope)}<td>${tag(ready?p.state:'等待App审核')}</td>${cell(developerDisplay(p.app))}<td>${actions}</td></tr>`});return steamPanel('steamPackages','Package 与 USD 定价',button('创建附加Package','steam-new-package',app,'secondary'),['Package名称','Package ID','用途','激活渠道','包含App','包含Depot','基础价格','销售范围','审核状态','所属开发者','操作'],rows)};
showSteamPackage=function(id){const p=steamPackage(id);if(!p)return;const related=packageBuilds(p),relation=related.length?related.slice(0,6).map(b=>`${b.id}（${b.version} / ${b.depotId}）`).join('；'):'暂无通过Depot关联的Build',discounts=steamDiscounts.filter(d=>d.packageId===p.id);openModal('Package 详情',block('steamPackages',kv([['Package名称',p.name],['Package ID',p.id],['所属开发者',developerDisplay(p.app)],['配置人',p.configuredBy||findGame(p.app)?.owner],['配置时间',formatTime(p.configuredAt)],['用途',packageKindLabel(p.kind)],['激活渠道',packageChannelLabel(p)],['包含AppID',p.appIds.join(', ')],['包含应用',p.appIds.map(steamAppName).join(' + ')],['包含Depot',p.depotIds.join(', ')],['销售范围',p.scope],['基础价格',`${p.currency} ${p.price||'—'}`],['审核版本','V'+p.revision],['审核状态',p.state],['与Build关系','通过Depot ID关联，不直接保存Build ID'],['关联Build示例',relation],['促销活动',discounts.length?discounts.map(d=>`${d.percent}%（${d.state}）`).join('；'):'暂无'],['说明',p.note]]))+block('steamLicense',kv([['玩家购买后','系统向User ID授予此Package License'],['获得应用权限',p.appIds.map(id=>`${id} ${steamAppName(id)}`).join('；')],['获得Depot访问权',p.depotIds.join(', ')||'待配置']])),'',{type:'steam-package-detail',id})};

// Package type derives from the single selected App. CDKEY is a channel checkbox.
const v7OpenSteamPackage=openSteamPackage;
openSteamPackage=function(app,id=''){v7OpenSteamPackage(app,id);const form=$('#steamPackageForm');if(!form)return;const existing=id?steamPackage(id):null,kind=$('#steamPackageKind'),kindField=kind?.closest('.field');if(kind){kind.innerHTML='<option value="Store Package">游戏本体销售</option><option value="DLC Store Package">DLC销售</option>';kind.disabled=true}const boxes=$$('[name="steamPackageApp"]');boxes.forEach((box,index)=>{box.type='radio';if(box.checked&&boxes.some((b,i)=>i<index&&b.checked))box.checked=false});const updateKind=()=>{const selected=boxes.find(b=>b.checked),isDlc=selected&&steamDlcApps.some(d=>d.id===selected.value);if(kind)kind.value=isDlc?'DLC Store Package':'Store Package';const help=$('#packageTypeHelp');if(help)help.textContent=isDlc?'DLC销售：玩家单独购买此DLC，使用前仍需拥有游戏本体。':'游戏本体销售：用于标准版游戏本体；豪华版组合请使用Bundle。'};boxes.forEach(b=>b.addEventListener('change',updateKind));if(kindField){kindField.insertAdjacentHTML('beforeend',`<p class="inline-help" id="packageTypeHelp"></p><label class="channel-check"><input type="checkbox" id="packageAllowCdkey" ${existing?.allowCdkey?'checked':''}> 允许通过CDKEY激活同一个Package</label><p class="inline-help">CDKEY只是License发放渠道，不会创建新的Package或价格。</p>`)}updateKind();const oldSubmit=form.onsubmit;form.onsubmit=e=>{const name=$('#steamPackageName').value.trim(),allow=$('#packageAllowCdkey')?.checked||false;oldSubmit(e);if($('#modalMask').hidden){const saved=existing||steamPackages.find(p=>p.app===app&&p.name===name);if(saved){saved.allowCdkey=allow;saved.kind=kind.value;saved.configuredBy=account.id;saved.configuredAt=now()}renderContent()}}};

const bundleTypeLabel=type=>type==='Must Purchase Together'?'必须整组购买':'补齐未拥有内容';
bundleCheckboxes=function(app,selected=[]){const rows=steamPackages.filter(p=>p.app===app);return rows.map(p=>{const enabled=p.state==='已通过';return `<label class="${enabled?'':'disabled-choice'}"><input type="checkbox" name="steamBundlePackage" value="${p.id}" ${selected.includes(p.id)?'checked':''} ${enabled?'':'disabled'}><span><b>${esc(p.name)}</b><small>${p.id} · USD ${p.price||'—'} · ${p.state}</small></span></label>`}).join('')};
steamBundlePanel=function(app){const list=steamBundles.filter(b=>b.app===app),eligible=steamPackages.filter(p=>p.app===app&&p.state==='已通过'),rows=list.map(b=>`<tr>${cell(b.name)}${cell(b.id)}${cell(bundleTypeLabel(b.type))}${cell(b.packageIds.map(id=>steamPackage(id)?.name||id).join(' + '))}${cell(b.discount+'%')}<td>${tag(b.state)}</td><td>${button('详情','steam-bundle-detail',b.id)}${b.state!=='待审核'?button(b.state==='已通过'?'修改并提交':'编辑并提交','steam-bundle-edit',b.id):''}</td></tr>`),create=eligible.length>=2?button('创建Bundle','steam-new-bundle',app,'primary'):button(`创建Bundle（还需${2-eligible.length}个已通过Package）`,'steam-new-bundle',app,'secondary',true);return steamPanel('steamBundles','Bundle 组合版本',create,['Bundle名称','Bundle ID','购买规则','包含Package','折扣','审核状态','操作'],rows)};
openSteamBundle=function(app,id=''){const b=id?steamBundle(id):null;if(b)app=b.app;if(findGame(app)?.appState!=='已通过'){toast('请先完成游戏本体资料审核');return}const eligible=steamPackages.filter(p=>p.app===app&&p.state==='已通过');if(!b&&eligible.length<2){toast('创建Bundle前至少需要两个审核通过的Package');return}openModal(b?'编辑Bundle':'创建Bundle组合版本',`<form id="steamBundleForm" novalidate>${block('steamBundles',`<div class="form-grid">${field('steamBundleGame','所属游戏',fixedGameField('steamBundleGame',app))}${field('steamBundleName','Bundle名称 *',input('steamBundleName',b?.name||'','maxlength="80" placeholder="例如：豪华版"'))}${field('steamBundleType','购买规则',`<select class="input" id="steamBundleType">${options([{id:'Complete The Set',label:'补齐未拥有内容'},{id:'Must Purchase Together',label:'必须整组购买'}],b?.type||'Complete The Set','')}</select>`)}${field('steamBundleDiscount','组合折扣（%）*',input('steamBundleDiscount',String(b?.discount??10),'type="number" min="0" max="90"'))}</div><p class="composition-summary">请勾选至少两个Package。灰色选项尚未审核通过，暂时不能加入组合。</p><fieldset class="content-checks"><legend>选择Bundle包含的Package *</legend>${bundleCheckboxes(app,b?.packageIds||[])}</fieldset>${field('steamBundleNote','Bundle说明（可选）','<textarea class="input" id="steamBundleNote" maxlength="500" placeholder="例如：游戏本体＋剧情DLC 1"></textarea>',true)}`)}${errorBox}</form>`,button('取消','close','','secondary')+'<button type="submit" form="steamBundleForm" class="primary">保存并提交审核</button>',{type:'steam-bundle-editor',id,app});if(b)$('#steamBundleNote').value=b.note||'';$('#steamBundleForm').onsubmit=e=>{e.preventDefault();const name=$('#steamBundleName').value.trim(),type=$('#steamBundleType').value,discount=Number($('#steamBundleDiscount').value),note=$('#steamBundleNote').value.trim(),packageIds=$$('[name="steamBundlePackage"]:checked').map(x=>x.value);if(!name||packageIds.length<2||!Number.isFinite(discount)||discount<0||discount>90){error('请填写Bundle名称，勾选至少两个已通过Package，并填写0–90的折扣。');return}if(b)Object.assign(b,{name,type,discount,note:note||`${packageIds.length}个Package组合`,packageIds,state:'待审核',revision:b.revision+1});else steamBundles.push({id:`bundle_${Date.now().toString().slice(-7)}`,app,name,type,packageIds,discount,state:'待审核',revision:1,note:note||`${packageIds.length}个Package组合`});opsReviewTab='bundles';lastSurfacePage.operator='opsReviews';closeModal(false);route('pricing',app);toast('Bundle已提交运营审核')};};

function discountPanel(app){const rows=steamDiscounts.filter(d=>d.app===app).map(d=>{const p=steamPackage(d.packageId);return `<tr>${cell(d.id)}${cell(p?.name)}${cell(d.packageId)}${cell(`USD ${d.basePrice}`)}${cell(d.percent+'%')}${cell(`USD ${discountPrice(d)}`)}${cell(formatTime(d.startAt))}${cell(formatTime(d.endAt))}<td>${tag(d.state)}</td><td>${button('详情','discount-detail',d.id)}${d.state==='已退回'?button('修改并重新提交','discount-edit',d.id):''}</td></tr>`});return steamPanel('discounts','促销活动','',['促销ID','Package','Package ID','基础价格','折扣','促销价','开始时间','结束时间','审核状态','操作'],rows)}
const v7PricingContent=pricingContent;
pricingContent=function(){const html=v7PricingContent();return findGame(selectedGame)?.appState==='已通过'?html+discountPanel(selectedGame):html};
function openDiscount(packageId,discountId=''){const p=steamPackage(packageId),d=discountId?discountBy(discountId):null;if(!p||p.state!=='已通过')return;openModal(d?'修改促销活动':'设置Package折扣',`<form id="discountForm" novalidate>${block('discounts',`<div class="form-grid">${field('discountPackage','Package',`<div class="fixed-game"><span>${esc(p.name)}</span><small>${p.id} · 基础价格 USD ${p.price}</small></div>`)}${field('discountPercent','折扣比例（%）*',input('discountPercent',String(d?.percent||20),'type="number" min="1" max="90"'))}${field('discountStart','开始时间 *',input('discountStart',d?new Date(d.startAt).toISOString().slice(0,16):localFuture(1),'type="datetime-local"'))}${field('discountEnd','结束时间 *',input('discountEnd',d?new Date(d.endAt).toISOString().slice(0,16):localFuture(8),'type="datetime-local"'))}${field('discountReason','促销说明 *','<textarea class="input" id="discountReason" maxlength="300" placeholder="例如：秋季促销" required></textarea>',true)}</div><p class="composition-summary" id="discountPreview"></p>`)}${errorBox}</form>`,button('取消','close','','secondary')+'<button type="submit" form="discountForm" class="primary">提交促销审核</button>',{type:'discount-editor',id:discountId,packageId});if(d)$('#discountReason').value=d.note;const preview=()=>{$('#discountPreview').textContent=`基础价格 USD ${p.price}，折扣后 USD ${(Number(p.price)*(1-Number($('#discountPercent').value||0)/100)).toFixed(2)}。不创建新Package。`};$('#discountPercent').oninput=preview;preview();$('#discountForm').onsubmit=e=>{e.preventDefault();const percent=Number($('#discountPercent').value),startAt=new Date($('#discountStart').value).toISOString(),endAt=new Date($('#discountEnd').value).toISOString(),note=$('#discountReason').value.trim();if(!Number.isInteger(percent)||percent<1||percent>90||!note||Date.parse(endAt)<=Date.parse(startAt)){error('请填写1–90的整数折扣、促销说明，并确保结束时间晚于开始时间。');return}if(d)Object.assign(d,{percent,startAt,endAt,note,state:'待审核',reviewNote:''});else steamDiscounts.unshift({id:`promo_${Date.now().toString().slice(-7)}`,app:p.app,packageId:p.id,basePrice:p.price,percent,startAt,endAt,note,state:'待审核',reviewNote:''});opsReviewTab='packages';lastSurfacePage.operator='opsReviews';closeModal(false);route('pricing',p.app);toast('促销活动已提交运营审核')}};
function showDiscount(id){const d=discountBy(id),p=steamPackage(d?.packageId);if(!d||!p)return;openModal('促销活动详情',block('discounts',kv([['促销ID',d.id],['Package',p.name],['Package ID',p.id],['基础价格',`USD ${d.basePrice}`],['折扣比例',d.percent+'%'],['促销价格',`USD ${discountPrice(d)}`],['开始时间',formatTime(d.startAt)],['结束时间',formatTime(d.endAt)],['审核状态',d.state],['审核意见',d.reviewNote],['促销说明',d.note]])),'',{type:'discount-detail',id})}
function opsDiscountPanel(){const rows=steamDiscounts.map(d=>{const p=steamPackage(d.packageId);return `<tr>${cell(findGame(d.app)?.name)}${cell(d.id)}${cell(p?.name)}${cell(d.packageId)}${cell(`USD ${d.basePrice}`)}${cell(d.percent+'%')}${cell(`USD ${discountPrice(d)}`)}${cell(formatTime(d.startAt)+' → '+formatTime(d.endAt))}<td>${tag(d.state)}</td><td>${button('详情','discount-detail',d.id)}${d.state==='待审核'?button('通过','ops-discount-pass',d.id)+button('退回','ops-discount-fail',d.id):''}</td></tr>`});return steamPanel('opsDiscountReview','Package促销审核','',['游戏','促销ID','Package','Package ID','基础价格','折扣','促销价','活动时间','状态','操作'],rows)}
const v7FocusedOpsReviewBody=focusedOpsReviewBody;
focusedOpsReviewBody=function(){const html=v7FocusedOpsReviewBody();return opsReviewTab==='packages'?html+opsDiscountPanel():html};
workflowPending.packages=()=>steamPackages.filter(p=>p.state==='待审核').length+steamDiscounts.filter(d=>d.state==='待审核').length;
function reviewDiscount(id,pass){const d=discountBy(id),p=steamPackage(d?.packageId);if(!d||!p||d.state!=='待审核')return;openReason(pass?'促销审核通过':'促销审核退回',block('opsDiscountReview',kv([['促销ID',d.id],['Package',p.name],['折扣',d.percent+'%'],['促销价',`USD ${discountPrice(d)}`]])),reason=>{if(d.state!=='待审核')return '促销已被其他人处理。';d.state=pass?'已通过':'已退回';d.reviewNote=reason;notify('定价审核',`${p.name}促销${pass?'审核通过':'审核退回'}`,reason,d.app,{sku:p.id});return ''},'审核意见 *')}

// Guide users to create a Depot before opening the upload form.
const v7OpenSteamBuild=openSteamBuild;
openSteamBuild=function(app,fixId=''){if(!steamDepots.some(d=>d.app===app)){toast('当前游戏还没有Depot，请先创建Depot后再上传');openSteamDepot(app);return}v7OpenSteamBuild(app,fixId);const form=$('#steamBuildForm');if(!form)return;const field=$('#steamBuildDepot')?.closest('.field');if(field)field.insertAdjacentHTML('beforeend','<p class="inline-help" id="depotEmptyHelp">Depot决定文件属于游戏本体还是DLC，以及适用的操作系统。</p>');const update=()=>{const has=!!$('#steamBuildDepot').value,help=$('#depotEmptyHelp');if(help&&!has)help.textContent='当前目标App没有可用Depot。请关闭窗口，先点击“创建Depot”。';const submit=$('[form="steamBuildForm"]');if(submit)submit.disabled=!has};$('#steamBuildTarget').addEventListener('change',()=>setTimeout(update));$('#steamBuildDepot').addEventListener('change',update);update()};

const v7LinkedAction=linkedAction;
linkedAction=function(action,id){if(action==='package-discount'){openDiscount(id);return true}if(action==='discount-edit'){const d=discountBy(id);if(d)openDiscount(d.packageId,id);return true}if(action==='discount-detail'){showDiscount(id);return true}if(action==='ops-discount-pass'||action==='ops-discount-fail'){reviewDiscount(id,action.endsWith('pass'));return true}return v7LinkedAction(action,id)};

const v7RenderContent=renderContent;
renderContent=function(){v7RenderContent();if(!isOps()&&currentPage==='messages'){$('#content .filters-panel')?.remove();$$('#content .metrics').forEach(e=>e.remove());const panel=$('#content .panel[data-note="messages"]');if(panel)panel.outerHTML=simpleMessageTable();renderNotes();updateMessageBadge()}if(!isOps()&&currentPage==='builds'){const action=$('#content .page-head [data-action="new-upload"]');if(action&&!steamDepots.some(d=>d.app===selectedGame)){action.textContent='先创建Depot再上传';action.dataset.action='steam-new-depot';action.dataset.id=selectedGame}}};
renderContent();

</script>

<script>
/* Notification policy V8: submissions never create developer messages */
const v8Notify=notify;
notify=function(type,title,body,app,ref={}){if(/(已提交|重新提交|提交.*审核)/.test(title))return;v8Notify(type,title,body,app,ref)};
for(let i=messages.length-1;i>=0;i--){if(/(已提交|重新提交|提交.*审核)/.test(messages[i].title))messages.splice(i,1)}
renderContent();

</script>
